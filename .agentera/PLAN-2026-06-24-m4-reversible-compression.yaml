header:
  level: full
  created: "2026-06-24"
  status: complete
  title: M4 — Reversible compression (explicit-verb path)
what: "Land the reversible-compression public surface on ktx: `ktx compress <id>` writes a row in a new `compressed` table whose `output` is the result of the configured pipeline (identity when no ktx.toml), whose `source_id` references the original `tool_calls.id`, and whose `content_hash` is recomputed from the compressed output (D9 integrity rule); `ktx decompress <compressed-id>` resolves `source_id` and returns the source's original `output` bytes verbatim — the public-surface reversal that satisfies ROADMAP M4 acceptance. A pipeline runner enforces D14's three conservative-on-failure invariants (empty-output guard, stage-execution-error passthrough, unknown-stage skip) over linear ordered stages. Five built-in Go stages (strip-ansi, dedup-blank, head, truncate, normalize) exist but are OFF unless configured via a minimal `ktx.toml` `[pipeline.default]` array. The `ktx hook` bidirectional transform (D1) is deferred to M5; both paths already share the same compress/decompress + compressed-table mechanism. Compressed ids are addressable only via `ktx compress`/`ktx decompress` — `ktx read`/`ktx get` stay scoped to `tool_calls`/`sessions` (symmetry: each table has its own access verbs)."
why: "M4 is the first proof of the reversibility-before-aggression principle. ROADMAP M4 acceptance is 'a compressed output can be retrieved as the original bytes via the public surface' — strictly reversal, not ratio. The database already holds append-only, nanoid-addressable, never-deleted originals (`tool_calls`, D7+D3+D9), so the reversibility layer is almost tautological: a `compressed` table with a `source_id` reference is the minimal addition, and reversal is out-of-band by id (`ktx decompress <id>`). No CCR hash store, no in-band markers, no retrieve tool (D14 rejected all of these). Configuring at least one stage via ktx.toml proves compress(input) != input AND decompress(compress(input)) == input; no-config invocation is identity (D14's passthrough default). The runner enforces the conservative-on-failure contract at runtime, not as a stage-author convention (the lowfat failure mode is rejected)."
constraints: "All firm decisions D1–D14 are hard constraints; do not relitigate any D14 design rule. Go stdlib first, no new external deps; pure-Go SQLite (already pinned). ktx.toml parsing uses github.com/BurntSushi/toml (the one D5-approved dep, already needed for M5 anyway — or a hand-rolled minimal reader if adding the dep now is undesirable; see task 6). Built-in stages are bytes-in, bytes-out, error-or-nil (D14's per-stage contract; full stage interface — metadata, terminal-vs-continuable — is an M4 implementation detail, not a new deliberation). Source-tool-failure protection (headroom's protect_error_outputs) is deferred — D9 lacks exit_code/is_error (TODO:29, post-M4 resonera, architecture open item). Content-type detection, aggressiveness tiers, and the `ktx plugin` registry are M5+ scope (TODO:29/30/47). Pipeline shape is linear; content-type routing is dormant for M4 (single default profile). No ML deps in the core. The `compressed` table is separate from `tool_calls` — injecting zero-cost non-evidence rows would corrupt M3 bench cost aggregation. `ktx read`/`ktx get`/`ktx list` stay scoped to `tool_calls`/`sessions` — the `compressed` table is addressable only via `ktx compress`/`ktx decompress` (symmetrical access: each table has its own verbs)."
scope:
  included:
    - "`compressed` table on the same SQLite database (in-place CREATE TABLE IF NOT EXISTS inside `internal/db/open.go`, same idempotent pattern as M2/M3 migrations): id TEXT PRIMARY KEY (D3 nanoid), source_id TEXT NOT NULL REFERENCES tool_calls(id), output TEXT, content_hash TEXT, pipeline TEXT (JSON array of stage names that ran, per D14 — see task 1), timestamp TEXT. Index on source_id for `ktx decompress` lookups."
    - "`internal/db/compress.go` (new) — `Compressed` struct (JSON-tagged, mirrors the row), `InsertCompressed(*Compressed) error` transaction with the D14 source-not-found check, `GetCompressed(id string) (*Compressed, error)` returning `ErrNotFound` on miss, `GetSourceOutput(sourceID string) (string, error)` used by `ktx decompress` to return the original bytes verbatim (one query against `tool_calls.output`)."
    - "`internal/pipeline/` (new package) — `Stage` interface (`func(input []byte) ([]byte, error)`, bytes-in-bytes-out per D14), `Runner` (executes a linear ordered stage slice and enforces the three conservative-on-failure invariants at runtime), `Registry` (name → Stage, used by ktx.toml resolution), and the five built-in Go stages living in `internal/pipeline/stages/`: strip-ansi, dedup-blank, head, truncate, normalize. Each stage OFF by default (D14); configured by ktx.toml."
    - "`internal/config/` (new package) — minimal ktx.toml loader for M4: discovers ktx.toml at project root or `$XDG_CONFIG_HOME/ktx/config.toml` (D5), parses a `[pipeline.default]` array of stage-name strings, returns a `Config` struct with the ordered stage list. Empty/missing file → empty pipeline (identity). No content-type profiles, no shell macros — both deferred to M5."
    - "`ktx compress <id>` — new verb registered via `dispatch.Register` with NeedsDB=true, PassthroughStdout=true (I/O primitive — prints the new compressed id as raw JSON per D2/D8). Reads the source `tool_calls` row by id, runs the pipeline (identity when no ktx.toml), inserts a `compressed` row with source_id reference + recomputed content_hash + pipeline JSON, prints the compressed id. Exits 2 when source id not found; 4 on internal error."
    - "`ktx decompress <compressed-id>` — new verb, NeedsDB=true, PassthroughStdout=true. Reads the `compressed` row, resolves `source_id`, returns the source's original `output` bytes verbatim (no stage-inverse — D14: reversal via retained originals at the pipeline boundary, not per-stage). Prints raw JSON of the source's `output` field (matches `ktx read`'s raw-JSON contract). Exits 2 when compressed-id not found."
    - "Conservative-on-failure invariants enforced by the runner (D14, runtime-enforced — not stage-author convention): (1) empty-output guard — a stage producing empty output from non-empty input has its output discarded and the input passes through; (2) stage-execution-error passthrough — a stage returning a non-nil error (or a panic recovered by the runner) passes the input through unchanged to the next stage; (3) unknown-stage skip — an unrecognized stage name is skipped with a stderr warning, not a fatal error. Each invariant has a unit test in `internal/pipeline/runner_test.go`."
    - "M4 acceptance verification at `.agentera/verification/m4-acceptance.md` — manual verification log: (a) no ktx.toml → `ktx compress <id>` produces identity (compressed.output == source.output, compressed.source_id == source.id); (b) ktx.toml with one stage (head or strip-ansi) → compressed.output != source.output AND `ktx decompress <compressed-id>` returns source.output verbatim; (c) the three conservative-on-failure invariants; (d) M3 regression preserved (all M3 acceptance steps still pass on the M4 binary)."
  excluded:
    - "`ktx hook` bidirectional transform (D1's M4-phase framing) — deferred to M5. Both paths already share the compress/decompress mechanism; M5 wires the transform into agent runtimes (OpenCode plugin's tool.execute.before, Claude Code PreToolUse). ROADMAP M4 acceptance is satisfied by the explicit-verb path alone."
    - "External shell-macro pipeline stages (D5 shell macros) — deferred to M5 with the plugin registry deliberation (TODO:30). M4 ships built-in Go stages only; the runner's `Stage` interface is already process-agnostic so M5 shell macros slot in without a runner rewrite."
    - "Content-type detection (TODO:29 — M5 prerequisite) and per-content-type profile selection. Single `default` profile only for M4."
    - "Aggressiveness tiers (TODO:47 — post-M4). Each configured stage runs at its natural behavior."
    - "Source-tool-failure protection / headroom's protect_error_outputs (D14 explicit deferral — requires a D9 exit_code/is_error extension, which is a post-M4 D9 resonera)."
    - "`ktx plugin` registry namespace (TODO:30 — M5 prerequisite). The BurntSushi/toml config (or minimal reader) is the v1 extension surface for M4; `ktx plugin add/list/remove` is a separate deliberation, not an M4 blocker."
    - "Compression ratio measurement; compression-impact-on-bench integration with `ktx bench --replay` (D13 Tier 1). M4 proves reversal, not savings."
    - "`ktx read`/`ktx get`/`ktx list` extensions to resolve compressed ids — the `compressed` table is addressable only via `ktx compress`/`ktx decompress`. `GetRecord` stays scoped to `tool_calls`/`sessions` (no third lookup branch). Symmetrical access: each table has its own verbs. Post-M4 resonera may revisit if a use case emerges."
  deferred:
    - "`ktx hook` bidirectional transform (M5)."
    - "External shell-macro stages + `ktx plugin` registry (M5, TODO:30)."
    - "Content-type detection (M5, TODO:29)."
    - "Aggressiveness tiers (post-M4, TODO:47)."
    - "Source-tool-failure protection (post-M4 D9-extension resonera, TODO:29)."
    - "Compression ratio benchmarks / `ktx bench --replay` A/B baseline-vs-compressed (post-M4, D13)."
design: "Seven sequential tasks mirroring the M2/M3 migration-to-verb rhythm. Task 1 — schema: adds the `compressed` table via the same idempotent PRAGMA-table_info + ALTER pattern as M2/M3 (no new migration framework). The `pipeline` column is a JSON array of stage names that ran (e.g. [\"strip-ansi\",\"head\"]) rather than a hash of the ktx.toml profile — JSON is inspectable, trivially stored as TEXT, and answers the D14 requirement (\"a record of what stages ran\") concretely; a profile-hash would require readers to resolve the hash against a registry ktx does not yet have. Task 2 — db layer: `InsertCompressed` maps a missing source_id to `ErrNotFound` (the compressed row references a real tool_call), `GetSourceOutput` is the reversal primitive (one indexed read against tool_calls.output). Task 3 — pipeline package: the `Stage` interface is deliberately narrow (bytes-in, bytes-out, error-or-nil) so M5 shell-macro stages slot in unchanged; the runner owns panic recovery so a buggy built-in stage cannot crash the compress verb. Task 4 — built-in stages live in `internal/pipeline/stages/` as separate small files (one per stage) with table-driven tests; each stage is a pure function over bytes, no DB or I/O. Task 5 — config loader: minimal `[pipeline.default]` TOML array only; no profiles, no shell macros, no content-type mapping (all M5). Choosing BurntSushi/toml vs a hand-rolled reader is an implementation detail surfaced in task 5's acceptance rather than pre-committed. Task 6 — the two verbs follow the read/write dispatch pattern exactly: `Register(verb, opts, func)` with ≤10 LOC of glue, `PassthroughStdout=true` (raw JSON), `NeedsDB=true`, one test seam each (`runCompressWith`/`runDecompressWith`) preserved for direct test invocation. Task 7 — acceptance verification log mirrors M2/M3 structure (Build / M3 Regression / identity case / configured-stage case / conservative-on-failure invariants / ROADMAP M4 acceptance / FIXES APPLIED / VERIFICATION SUMMARY). The hook path deferral is recorded in the plan and surfaced in ARCHITECTURE.md's Decided-D14 subsection during documentation maintenance, not in the closing cycle."
tasks:
  - number: 1
    name: "Schema — compressed table migration"
    depends_on: []
    status: complete
    acceptance:
      - "GIVEN an M3-era database WHEN the M4 binary opens it THEN a new `compressed` table exists with columns: id TEXT PRIMARY KEY (16-char lowercase alpha nanoid, D3), source_id TEXT NOT NULL REFERENCES tool_calls(id), output TEXT, content_hash TEXT, pipeline TEXT (JSON array of stage names that ran), timestamp TEXT"
      - "GIVEN the migration WHEN applied THEN existing sessions, tool_calls, and bench_runs rows are unchanged; the M3 bench cost aggregation over tool_calls remains correct (no zero-cost non-evidence rows injected into tool_calls)"
      - "GIVEN a fresh database WHEN created THEN the schema includes `compressed` from the start (CREATE TABLE IF NOT EXISTS in schemaStatements, no ALTER needed)"
      - "GIVEN the migration WHEN run twice THEN the second run is a no-op (idempotent — PRAGMA table_info check skips an already-present `compressed` table)"
      - "GIVEN a database where `compressed` exists with a partial column set WHEN the M4 binary opens it THEN missing columns are added on the next migration run (forward-fix, same pattern as M2/M3 — compressedColumns slice drives both the CREATE and the ALTER loop)"
      - "GIVEN `compressed.source_id` WHEN a row is inserted THEN foreign_keys=1 (already enforced by Open's DSN) makes the FK meaningful: a compressed row cannot point at a non-existent tool_call"
      - "GIVEN `ktx doctor` (existing checks) WHEN invoked on a migrated DB THEN no new check is required for M4 (the compressed table is optional evidence, not a health invariant); doctor does not warn on a missing compressed table (M1–M3 databases legitimately have none)"
    test_approach: "`internal/db/open_test.go` extension — table-driven subtests covering: fresh-DB has compressed with all 6 columns; M3-DB gains compressed on next open; re-open is a no-op; partial-column forward-fix (hand-built *sql.DB via OpenWithoutMigration with only `id`+`source_id`, assert the other 4 columns are added); a row can be inserted with a valid source_id and rejected when source_id references a missing tool_call (FK enforcement). Snapshot assertions via PRAGMA table_info ordering."
  - number: 2
    name: "Persistence — internal/db/compress.go"
    depends_on: ["1"]
    status: complete
    acceptance:
      - "GIVEN a Compressed struct with a generated id, valid source_id, output bytes, recomputed content_hash, pipeline JSON array, and timestamp WHEN `InsertCompressed` is called THEN a row appears in `compressed` with all 6 columns populated"
      - "GIVEN a source_id that does not exist in tool_calls WHEN `InsertCompressed` is called THEN the SQLite FK constraint rejects the insert and ktx returns `ErrNotFound` mapped to exit code 2 — the compressed row references a real tool_call"
      - "GIVEN a compressed id WHEN `GetCompressed(id)` is called THEN the full Compressed struct is returned; on miss, `ErrNotFound` is returned (mapped to exit 2)"
      - "GIVEN a source tool_call id WHEN `GetSourceOutput(sourceID)` is called THEN the source's `output` bytes are returned verbatim (one indexed SELECT against tool_calls.output); on miss, `ErrNotFound` — this is the reversal primitive `ktx decompress` invokes"
      - "GIVEN content_hash on the Compressed struct WHEN computed by the caller via `db.ContentHash(compressedOutput)` THEN it is the SHA-256 of the compressed output (not the source output) — D14 + D9 integrity rule, recomputed from the artifact that was stored"
      - "GIVEN the JSON tags on Compressed WHEN marshalled THEN the output shape matches the row (id, source_id, output, content_hash, pipeline, timestamp) so direct struct inspection works without a separate encoder"
    test_approach: "`internal/db/compress_test.go` — uses `OpenMemory()` (existing seam) for an in-memory DB with the full schema migrated. Subtests: InsertCompressed happy path + column assertion; InsertCompressed with unknown source_id → ErrNotFound (FK enforced); GetCompressed hit + miss; GetSourceOutput hit + miss; content_hash round-trip (insert with hash of output B, read back, hash of stored output B equals the inserted hash)."
  - number: 3
    name: "Pipeline runner — internal/pipeline/"
    depends_on: []
    status: complete
    acceptance:
      - "GIVEN a Stage interface defined as `Apply(input []byte) ([]byte, error)` WHEN a built-in Go stage implements it THEN the runner accepts it via the Registry (name → Stage)"
      - "GIVEN a linear ordered slice of stages WHEN `Runner.Run(input)` is called THEN each stage receives the previous stage's output; the final byte slice is returned; a nil error means every stage ran without error invocation"
      - "GIVEN invariant (1) — empty-output guard — WHEN a stage returns non-empty input → empty output (length 0) with nil error THEN the runner discards the empty output and passes the stage's input through unchanged to the next stage; the original bytes survive"
      - "GIVEN invariant (1) edge: empty input → empty output WHEN a stage receives empty input and returns empty output THEN the empty output is preserved (the guard only fires when input was non-empty)"
      - "GIVEN invariant (2) — stage-execution-error passthrough — WHEN a stage returns a non-nil error THEN the runner passes the stage's input through unchanged to the next stage and continues; the error is not fatal to the pipeline"
      - "GIVEN invariant (2) panic case — WHEN a stage panics THEN the runner recovers the panic (defer/recover), passes the input through unchanged, and continues (panic is logged via stderr warning but the pipeline does not crash the compress verb)"
      - "GIVEN invariant (3) — unknown-stage skip — WHEN the Registry cannot resolve a stage name THEN the runner skips that stage with a stderr warning (`ktx: warning: unknown pipeline stage %q, skipped`) and continues; the pipeline is not a fatal error"
      - "GIVEN an empty pipeline (zero stages) WHEN `Runner.Run(input)` is called THEN the input is returned unchanged (identity) — this is the D14 no-ktx.toml default"
      - "GIVEN the runner's pipeline JSON field WHEN the pipeline completes THEN it records the list of stage names that *ran* (unknown-stage skips are recorded as skipped, e.g. via an out-param or by populating the caller's pipeline slice) so `compressed.pipeline` reflects what actually executed"
    test_approach: "`internal/pipeline/runner_test.go` — table-driven subtests with fake stages (closures capturing their input) for each invariant. A `func stage(name string, fn func([]byte)([]byte,error)) Stage` test helper builds controllable stages. Tests use `bytes.Equal` to assert pass-through semantics; no DB or filesystem. A panic-injecting stage proves the recover path. An unknown-name in the registry proves the skip path with a captured stderr buffer."
  - number: 4
    name: "Built-in Go stages — internal/pipeline/stages/"
    depends_on: ["3"]
    status: complete
    acceptance:
      - "GIVEN `strip-ansi` WHEN given a byte slice containing ANSI escape sequences (CSI ... m, etc.) THEN it returns the input with the escape sequences removed; transcripts from a real colored terminal become plain text"
      - "GIVEN `dedup-blank` WHEN given input with runs of 2+ consecutive blank lines THEN it collapses each run to a single blank line; single blank lines are preserved; non-blank content is byte-identical"
      - "GIVEN `head` WHEN given multi-line input THEN it returns the first N lines (default N configurable via the stage-name token, e.g. `head:100`); input shorter than N is returned unchanged; input with trailing newline preserved"
      - "GIVEN `truncate` WHEN given input longer than a byte limit (configurable via `truncate:4096`) THEN it returns the first N bytes followed by a marker line `[ktx: truncated N of M bytes]`; input shorter than N is returned unchanged"
      - "GIVEN `normalize` WHEN given input with mixed line endings (\\r\\n, \\r) and trailing whitespace THEN it normalizes to \\n line endings and trims trailing whitespace; leading whitespace is preserved"
      - "GIVEN each stage WHEN registered with the Registry THEN it is OFF by default — only stages named in a ktx.toml `[pipeline.default]` array run (D14); the Registry is populated at package init, not invoked by an always-on default"
      - "GIVEN M4 acceptance requirement WHEN at least one stage (head or strip-ansi) is configured via ktx.toml THEN compress(source) != source for an input where that stage is lossy (multi-line input for head, colored input for strip-ansi) AND decompress(compress(source)) == source verbatim"
    test_approach: "`internal/pipeline/stages/stages_test.go` — one test file, one subtest block per stage. Fixtures: a captured colored `ls --color` transcript for strip-ansi; a log dump with blank-line runs for dedup-blank; a 1000-line sample for head; a 10KB blob for truncate; three line-ending variants for normalize. Each subtest asserts both the positive transform and the empty-input edge (empty → empty preserves invariant (1))."
  - number: 5
    name: "Config loader — internal/config/"
    depends_on: []
    status: complete
    acceptance:
      - "GIVEN no ktx.toml at project root or `$XDG_CONFIG_HOME/ktx/config.toml` WHEN `Load()` is called THEN it returns a `Config` with an empty `Pipeline.Default` stage list (no error — missing config is the documented D14 default)"
      - "GIVEN a ktx.toml at project root with `[pipeline.default]\nstages = [\"strip-ansi\", \"head:100\"]` WHEN `Load()` is called THEN a `Config` is returned with the ordered stage list `[\"strip-ansi\", \"head:100\"]`"
      - "GIVEN a malformed ktx.toml (syntax error) WHEN `Load()` is called THEN ktx returns a usage error (exit 1) with a machine-parseable JSON envelope identifying the file and the parse error"
      - "GIVEN a ktx.toml with unknown stage names in the array WHEN `Load()` succeeds THEN the unknown names are returned in the stage list as-is (resolution to the Registry happens at runner invocation time, not at config load — the unknown-stage invariant (3) handles them at runtime)"
      - "GIVEN the precedence project-root > `$XDG_CONFIG_HOME/ktx/config.toml` WHEN both exist THEN project-root wins; when only the user-level exists it is used; when neither exists, identity (empty stage list)"
      - "GIVEN the loader WHEN invoked from `ktx compress` THEN it is called once per invocation, not cached across processes (no global state; M5 may revisit if config becomes hot)"
      - "GIVEN the dep choice WHEN task 5 lands THEN the choice between BurntSushi/toml (the D5-approved dep already required for M5) and a hand-rolled minimal TOML reader is made explicitly and documented in the package doc — both are acceptable for M4 as long as the `[pipeline.default].stages` array parses"
    test_approach: "`internal/config/config_test.go` — table-driven subtests with t.TempDir()-based fixtures: missing config → empty list + no error; project-root ktx.toml parses; user-level falls back; precedence conflict resolved; malformed TOML → usage error; unknown stage names preserved. XDG_CONFIG_HOME is set per-subtest via t.Setenv."
  - number: 6
    name: "ktx compress + ktx decompress verbs"
    depends_on: ["1", "2", "3", "4", "5"]
    status: complete
    acceptance:
      - "GIVEN a persisted tool_call with id S WHEN `ktx compress <S>` is invoked with no ktx.toml present THEN a new `compressed` row is inserted with source_id=S, output == source.output (identity), content_hash == SHA-256 of source.output, pipeline == [] (empty JSON array), timestamp set; the new compressed id is printed to stdout as raw JSON"
      - "GIVEN a ktx.toml with `[pipeline.default]\nstages = [\"head:5\"]` WHEN `ktx compress <S>` is invoked on a tool_call whose output is 20 lines THEN the compressed row's output is the first 5 lines AND output != source.output AND content_hash == SHA-256 of the truncated output AND pipeline == [\"head:5\"]"
      - "GIVEN the compressed id C from the previous step WHEN `ktx decompress <C>` is invoked THEN the source's original output (all 20 lines) is returned verbatim to stdout as raw JSON — decompress(compress(x)) == x holds despite the lossy truncation"
      - "GIVEN a source id S that does not exist WHEN `ktx compress <S>` is invoked THEN ktx exits with code 2 (not-found) and emits a machine-parseable JSON error to stderr"
      - "GIVEN a compressed id C that does not exist WHEN `ktx decompress <C>` is invoked THEN ktx exits with code 2 (not-found) with a JSON error envelope"
      - "GIVEN a pipeline where stage X errors (returns non-nil error) WHEN `ktx compress <S>` is invoked THEN invariant (2) fires: the stage's input passes through unchanged, the compressed.output may differ from source.output only via stages that succeeded; the pipeline JSON records which stages ran and which errored"
      - "GIVEN a pipeline containing an unknown stage name WHEN `ktx compress <S>` is invoked THEN invariant (3) fires: the unknown stage is skipped with a stderr warning, the pipeline continues, the compressed row is still written, exit 0"
      - "GIVEN the two new verbs WHEN registered via dispatch.Register THEN each is reachable through the registry with ≤10 LOC of glue (Description set, NeedsDB=true, PassthroughStdout=true, Help=printCompressHelp/printDecompressHelp); a `runCompressWith`/`runDecompressWith` test seam is preserved for direct unit-test invocation"
      - "GIVEN `ktx --help` WHEN invoked THEN the new verbs appear in the verb list with their Descriptions"
    test_approach: "`internal/cli/compress_test.go` + `internal/cli/decompress_test.go` — mirror `write_test.go`/`read_test.go` shape. Each subtest uses an in-memory or t.TempDir() DB seeded with one tool_call, invokes the test seam, asserts on stdout JSON + exit code. The conservative-on-failure paths are exercised via a test-only Registry injection (inject a stage that errors, inject a stage that panics, inject a missing name). End-to-end via `runWith(args)` proves the dispatch wiring."
  - number: 7
    name: "M4 acceptance verification"
    depends_on: ["1", "2", "3", "4", "5", "6"]
    status: complete
    acceptance:
      - "GIVEN a fresh M4 binary + a seeded tool_call with non-trivial output WHEN `ktx compress <S>` is invoked with no ktx.toml THEN compressed.output == source.output (identity) AND `ktx decompress <C>` returns source.output byte-for-byte"
      - "GIVEN a ktx.toml configuring one lossy stage (head:5 or strip-ansi) WHEN `ktx compress <S>` is invoked THEN compressed.output != source.output AND `ktx decompress <C>` returns source.output verbatim — the M4 acceptance contract 'a compressed output can be retrieved as the original bytes via the public surface' holds"
      - "GIVEN the three conservative-on-failure invariants WHEN each is exercised via a test-only Registry injection (empty-output-returning stage, error-returning stage, panicking stage, unknown stage name) THEN the runner's pass-through behavior is observed AND the compressed row is still written AND exit code is 0 (invariants are runtime guarantees, not fatal errors per D14)"
      - "GIVEN the M3 acceptance log (`.agentera/verification/m3-acceptance.md`) WHEN its steps are re-run against the M4 binary on a fresh DB THEN all M3 cases still pass (regression — M4 is additive: compressed table, two new verbs, no change to tool_calls/sessions/bench_runs shape or the cost-derivation path)"
      - "GIVEN a pre-M4 database (M3-era, no `compressed` table) WHEN the M4 binary opens it THEN the migration creates `compressed` with all 6 columns AND existing M1/M2/M3 records are intact AND `ktx doctor` reports no new warnings"
      - "GIVEN a new verification log at `.agentera/verification/m4-acceptance.md` WHEN written THEN it documents: identity case, configured-stage case, conservative-on-failure invariants (all three), M3 regression, pre-M4 migration, ROADMAP M4 acceptance statement, FIXES APPLIED, VERIFICATION SUMMARY"
      - "GIVEN ROADMAP.md M4 acceptance ('a compressed output can be retrieved as the original bytes via the public surface') WHEN the verification log is complete THEN the acceptance criterion is satisfied via `ktx decompress <id>` returning source.output exactly"
      - "GIVEN ARCHITECTURE.md's Decided-D14 subsection WHEN M4 closes THEN the Documentation maintenance step from AGENTS.md is performed: the D14 hook-path deferral is recorded (ktx hook transform deferred to M5; explicit-verb path satisfies M4), and the open-deliberation item 'Pipeline stage contract' advances (the runner contract is decided; per-stage terminal-vs-continuable remains deferred but not blocking), and ROADMAP.md gains a Verified stamp for M4"
    test_approach: "Manual verification log at `.agentera/verification/m4-acceptance.md` mirroring the M2/M3 log structure. Build: `go build -buildvcs=false -o /tmp/ktx-m4-acceptance ./cmd/ktx`. Vet: `go vet -buildvcs=false ./...`. Re-run M3 acceptance steps (build a fake opencode binary, run bench, assert headline reproducibility). Exercise both compress/decompress cases with a seeded fixture tool_call. Exercise the three invariants via direct pipeline.Runner unit tests (already covered in task 3) and document the result. End-to-end via the dispatch-based verbs proves the full path."
overall_acceptance: "GIVEN a tool_call persisted in the database WHEN `ktx compress <id>` is invoked THEN a new `compressed` row is persisted referencing the source by id, with output produced by the configured pipeline (identity when no ktx.toml). GIVEN a `compressed` id WHEN `ktx decompress <id>` is invoked THEN the source's original output bytes are returned verbatim — ROADMAP M4 acceptance ('a compressed output can be retrieved as the original bytes via the public surface'). GIVEN a configured stage in ktx.toml WHEN the pipeline runs THEN compressed.output may differ from source.output AND decompress(compress(x)) == x still holds (reversal via retained originals, not stage inversion). GIVEN a buggy, panicking, or unknown stage WHEN the runner encounters it THEN the three D14 conservative-on-failure invariants (empty-output guard, stage-error passthrough, unknown-stage skip) hold at runtime — never a stage-author convention. GIVEN the M3 evidence WHEN re-inspected via the M4 binary THEN every M3 record still loads and the headline remains reproducible (additive migration, no breakage). GIVEN a pre-M4 database WHEN the M4 binary opens it THEN the `compressed` table is created and existing records are intact."
progress: "Tasks 1–7 complete. go build/vet/test all green (120 tests). M4 acceptance log written at .agentera/verification/m4-acceptance.md. ROADMAP M4 acceptance satisfied. One fix applied during verification: db.DB() accessor for failure-mode tests (see FIXES APPLIED section in the acceptance log)."
surprises: "The DB() accessor required to expose the underlying *sql.DB for the cli package's D7-violation test. The original docstring for db.DB said the handle was deliberately unexported; the new accessor's docstring documents that production callers should still prefer typed methods, and the escape hatch exists for failure-mode tests needing raw SQL. This is a small surface-area change touching one internal package, not a deliberate decision that contradicts D14 — D14 is firm on the reversibility contract, not on the db.DB encapsulation boundary."
