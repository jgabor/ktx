header:
  level: full
  created: "2026-06-19"
  status: open
  reviewed: "2026-06-19"
  critic_issues: "13 found, 13 addressed, 0 dismissed"
  title: M2 — Cost publication
what: "Persist and surface per-call cost (tokens and dollars) so any record in
  the database can be inspected and its cost reconstructed from the stored data.
  M1 reserved the M2 fields in the Go ToolCall struct (D9) but did not add them
  to the SQL schema. M2 closes that gap and populates them from two ingress
  paths (wrapper, sidecar)."
why: "M2 is the cost contract's first proof. Without published cost, M3
  (benchmark) has no input and the M1 evidence is half-formed. M2 also closes
  the 'Measurement' loop in the conceptual system (observe → classify →
  transform → measure → persist → report)."
constraints: "All firm decisions D1–D10 are hard constraints. Go stdlib first;
  pure-Go SQLite (no CGO). M2 fields are part of the existing flat JSON payload
  (D9) — no payload-shape change. ktx read stays raw JSON (mechanical I/O, no
  --format). ktx get/ktx list JSON default, --format text for humans. No ktx
  bench (M3), no compression (M4), no config file (M5), no new external deps.
  SQLite ALTER TABLE for in-place migration; no custom migration framework."
scope:
  included:
    - "M2 column migration on tool_calls: tokens_in INTEGER, tokens_out INTEGER,
      cost REAL, latency_ms INTEGER, model TEXT, provider TEXT"
    - "ktx write persists M2 fields from the D9 flat JSON payload (NULL when
      absent)"
    - "ktx run extracts M2 fields from OpenCode --format json events when
      present (NULL when absent)"
    - "ktx get --format text renders an M2 section when fields are non-NULL"
    - "ktx list --format text adds TOKENS/COST/MODEL columns with per-session
      roll-up of non-NULL values"
    - "ktx doctor flags missing M2 columns on pre-M2 databases as a
      normal-severity warning (not hard error)"
    - "End-to-end M2 acceptance verification with regression check against M1"
  excluded:
    - "Benchmark aggregation (M3: ktx bench run/report/compare,
      cost-per-correct)"
    - "Compression/transform and ktx hook bidirectional protocol (M4)"
    - "ktx.toml config file and plugin registry (M5)"
    - "ktx db --prune (post-M1 housekeeping, not M2)"
    - "Automatic cost computation from tokens+model when caller does not supply
      cost — deferred to a post-M2 resonera"
  deferred:
    - "ktx bench commands (M3)"
    - "ktx compress/decompress (M4)"
    - "ktx.toml (M5)"
    - "ktx db --prune (post-M1)"
    - "Auto-compute cost from tokens+model when not supplied (post-M2 resonera)"
design: "Two-phase. Phase A: Resonera (task 1) resolves the open 'Cost
  measurement mechanics' deliberation — token counting source, dollar model,
  reconstructability requirement, which fields ktx auto-populates vs requires
  from the caller. Phase B: implementation. The M2 columns are added to
  tool_calls via in-place ALTER TABLE inside the idempotent schema migration
  that Open() runs on every call; M1 databases upgrade without manual steps. ktx
  write already accepts the M2 fields in the D9 flat payload; the change is to
  persist them rather than drop them on the floor, and to map Go zero values to
  SQL NULL when the JSON omits the field. ktx run parses OpenCode event payloads
  for token/model fields when present; absent fields stay NULL. ktx get --format
  text adds an M2 section below the existing fields when any M2 field is
  non-NULL; ktx list --format text adds TOKENS (sum of tokens_in + tokens_out),
  COST, and MODEL columns derived from per-call roll-up of non-NULL values only.
  ktx doctor confirms M2 columns are present in the schema, flags pre-M2
  databases as a normal-severity warning. Implementation risk: OpenCode --format
  json event shape for token/model is not yet verified for M2 fields; realisera
  must discover the schema empirically and map fields defensively (NULL when
  absent, never error on a missing M2 field). Implementation risk:
  distinguishing 'field absent' from 'field set to zero' in JSON output requires
  pointer types (*int64, *float64, *string) on the Go ToolCall struct — a
  struct-shape change that the M1 struct's omitempty semantics did not need.
  NULL preservation must survive the round-trip through ktx read (raw JSON) and
  ktx get (formatted). Critic issue #1 (addressed): task 4 originally assumed
  OpenCode --format json emits M2 fields in tool_use events. If empirical
  research shows it does not, task 4's success criterion cannot pass as written.
  Addressed by adding an acceptance branch: the empirical research finding IS
  the deliverable when the runtime does not emit M2 fields, and the M2 surface
  then relies on sidecar callers (task 3) for populated data. This is not a
  failure — it is a real-world finding the plan accommodates, and the rollup
  acceptance in task 5 is fulfilled by sidecar-populated sessions in either
  case."
tasks:
  - number: 1
    name: "Resonera — cost measurement mechanics"
    depends_on: []
    status: complete
    acceptance:
      - "GIVEN the open deliberation 'Cost measurement mechanics' WHEN a
        resonera session records the choice THEN a new decision entry in
        .agentera/decisions.yaml documents: (a) token counting source
        (provider-reported vs local tokenizer vs hybrid), (b) dollar model (list
        prices vs user overrides vs provider-agnostic units), (c)
        reconstructability requirement (which fields are required vs optional
        for cost to be reconstructable from stored data), (d) which fields ktx
        auto-populates vs requires from the caller"
      - "GIVEN the decision WHEN recorded THEN ARCHITECTURE.md 'Measurement and
        benchmark' open-deliberation items for 'Token counting source' and
        'Dollar model' move to Decided with a short paragraph each"
      - "GIVEN the decision WHEN recorded THEN tasks 2–5 can proceed without
        re-deliberation"
      - "GIVEN the decision WHEN recorded THEN the new entry has confidence:
        firm and a downstream_consequence_references list naming: schema
        migration, ktx write, ktx run, ktx get, ktx list, M3 benchmark
        methodology"
  - number: 2
    name: "Schema migration — M2 columns"
    depends_on: [ "1" ]
    status: complete
    acceptance:
      - "GIVEN an M1-era database at the default path WHEN the new binary opens
        it THEN the tool_calls table has new nullable columns: tokens_in
        INTEGER, tokens_out INTEGER, cost REAL, latency_ms INTEGER, model TEXT,
        provider TEXT"
      - "GIVEN the migration WHEN applied THEN existing tool_calls rows are
        unchanged (NULL for new columns) AND sessions schema is unchanged"
      - "GIVEN a fresh database WHEN created THEN the schema includes the M2
        columns from the start (no migration needed)"
      - "GIVEN ktx doctor WHEN invoked on a migrated DB THEN schema_valid
        reports M2 columns present AND on a pre-M2 DB the doctor flags the
        missing columns as a normal-severity warning (not a hard error — M1
        records still queryable)"
      - "GIVEN the migration logic WHEN run twice on the same DB THEN the second
        run is a no-op (idempotent)"
      - "GIVEN a database with a partial M2 column set (e.g., only tokens_in
        added) WHEN the binary opens it THEN the missing M2 columns are added on
        the next migration run (forward-fix, not an error)"
  - number: 3
    name: "ktx write persists M2 fields"
    depends_on: [ "2" ]
    status: complete
    acceptance:
      - "GIVEN a ktx write payload with tokens_in, tokens_out, cost, latency_ms,
        model, provider set WHEN ktx write persists it THEN those columns are
        non-NULL in the tool_calls row"
      - "GIVEN a ktx write payload without M2 fields WHEN ktx write persists it
        THEN the M2 columns are NULL (not 0, not empty string — NULL preserves
        'field absent' for reconstructability)"
      - "GIVEN a ktx write payload with M2 fields explicitly set to 0 (e.g.,
        tokens_in: 0) WHEN ktx write persists it THEN the column is 0, not NULL
        (preserves the distinction between absent and zero)"
      - "GIVEN a persisted tool_call with M2 fields WHEN ktx read <id> or ktx
        get <id> is invoked THEN the M2 fields appear in the JSON output (null
        when absent, value when set)"
      - "GIVEN a persisted tool_call with NULL M2 fields WHEN ktx get <id>
        --format text is invoked THEN no M2 section is rendered (silent absence,
        not 'n/a' filler)"
  - number: 4
    name: "ktx run extracts M2 fields from OpenCode events"
    depends_on: [ "2", "3" ]
    status: complete
    acceptance:
      - "GIVEN an OpenCode --format json tool_use event with token/model data
        WHEN ktx run opencode run --format json parses it THEN the persisted
        tool_calls row has the M2 columns populated"
      - "GIVEN an OpenCode event without token/model data WHEN ktx run persists
        it THEN the M2 columns are NULL (not guessed)"
      - "GIVEN the wrapper's parseToolEvent WHEN the event shape is unknown THEN
        M2 fields default to NULL rather than erroring — a missing field is not
        a parse failure"
      - "GIVEN a real OpenCode run (not the mock agent from M1 verification)
        WHEN completed THEN the persisted tool_calls have non-NULL tokens/model
        for at least one call, OR the run's verification log documents that
        OpenCode --format json does not emit M2 fields in tool_use events and
        the M2 surface is fed by sidecar callers (task 3) — both outcomes are
        valid"
      - "GIVEN the empirical-research outcome (whether OpenCode emits M2 fields
        or not) WHEN documented THEN the verification log records the finding
        and the M2 acceptance path forward is named: either wrapper extraction
        (success) or sidecar-only (documented gap, no regression)"
  - number: 5
    name: "Inspect surface — M2 in ktx get and ktx list"
    depends_on: [ "2", "3" ]
    status: complete
    acceptance:
      - "GIVEN a session with tool_calls that have non-NULL M2 fields WHEN ktx
        list --format text is invoked THEN the output table includes TOKENS (sum
        of tokens_in + tokens_out per call, summed across the session), COST,
        and MODEL columns derived from per-call roll-up of non-NULL values"
      - "GIVEN a session with mixed (some NULL, some non-NULL) M2 fields WHEN
        ktx list --format text is invoked THEN the rollup sums the non-NULL
        values only (a session with 3 calls where 1 has NULL cost sums the 2
        non-NULL costs, not zero)"
      - "GIVEN a tool_call with M2 fields WHEN ktx get <id> --format text is
        invoked THEN a M2 section appears below the existing fields showing
        tokens_in, tokens_out, cost, model, provider, latency_ms"
      - "GIVEN a tool_call with NULL M2 fields WHEN ktx get <id> --format text
        is invoked THEN no M2 section appears (no 0 / n/a placeholders)"
      - "GIVEN any tool_call WHEN ktx get <id> (JSON) is invoked THEN the JSON
        includes the M2 fields as null when absent, with the value when set"
      - "GIVEN a ktx list row WHEN the session has no non-NULL M2 fields THEN
        the COST/TOKENS columns show '-' (not 0, not n/a, not blank — explicit
        'no data' marker that is visually distinct from a zero total)"
      - "GIVEN a session WHEN ktx list (JSON, no --format) is invoked THEN the
        session row's JSON includes a top-level m2 object with tokens, cost,
        model rollup when any underlying call has non-NULL M2 fields, and omits
        or sets the m2 object to null when no underlying call has M2 data"
  - number: 6
    name: "M2 acceptance verification"
    depends_on: [ "1", "2", "3", "4", "5" ]
    status: complete
    acceptance:
      - "GIVEN the full M2 implementation WHEN a real OpenCode ktx run opencode
        run --format json \"<task>\" produces a tool_call THEN ktx get
        <tool-call-id> shows the M2 fields populated from the runtime, OR the
        verification log documents that OpenCode --format json does not emit M2
        fields and the surface is fed by sidecar"
      - "GIVEN a sidecar echo '{...}' | ktx write with M2 fields WHEN persisted
        THEN ktx read returns the M2 fields AND the cost is reconstructable from
        tokens_in, tokens_out, model against a known price (the dollar model
        from task 1)"
      - "GIVEN the M1 acceptance verification
        (.agentera/verification/m1-acceptance.md) WHEN re-run with the M2 binary
        THEN all M1 cases still pass (regression check — M2 is additive, not
        breaking)"
      - "GIVEN a new verification log at .agentera/verification/m2-acceptance.md
        WHEN written THEN it documents: M1 regression pass, sidecar-with-M2
        round-trip (including the absent vs zero distinction),
        wrapper-with-OpenCode-events M2 extraction outcome (extraction or
        documented gap), ktx list cost rollup including the mixed-NULL case, ktx
        get text M2 section including the silent-absence case, ktx doctor M2
        column check on a pre-M2 database"
      - "GIVEN the verification log WHEN complete THEN ROADMAP.md M2 acceptance
        is satisfied (cost reconstructable from published data)"
overall_acceptance: "GIVEN any persisted tool_call in the database WHEN
  inspected via ktx read <id> (JSON) or ktx get <id> (text) THEN the M2 fields
  appear when present and are NULL/absent otherwise. GIVEN any session with
  tool_calls WHEN ktx list is invoked THEN session-level cost and token totals
  are computed from non-NULL M2 fields (never inferred from zero values). GIVEN
  the M1 evidence WHEN re-inspected via the M2 binary THEN every M1 record still
  loads (additive migration, no breakage). GIVEN the cost-mechanics decision
  from task 1 WHEN applied to a known tokens_in/tokens_out/model triple THEN
  cost is reconstructable (either stored directly or computed from the
  decision's dollar model)."
surprises: |
  OpenCode --format json emits tokens/cost/model only on step_finish
  (step-aggregate), not on tool_use (per-tool). Task 4 wrapper
  therefore populates latency_ms (from part.state.time.{start,end})
  and provider (defaulted to 'opencode' as the runtime-known single
  exception) for tool_use rows; tokens_in/out/cost/model remain NULL
  for OpenCode-emitted tool_calls. The sidecar path (Task 3) and any
  future OpenCode shape that places them per-tool round-trip via the
  defensive state.metadata / flat-fallback reads.
