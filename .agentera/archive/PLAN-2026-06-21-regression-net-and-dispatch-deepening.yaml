    status: complete
    files: ["internal/cli/db.go", "internal/cli/prices.go", "internal/cli/doctor.go", "internal/cli/init.go", ".agentera/progress.yaml", "TODO.md"]
    notes:
      - "ktx db does not need NeedsDB (it only resolves and prints the path)."
