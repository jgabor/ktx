      - "GIVEN `ktx init opencode --project`, WHEN invoked under testutil.WithTempXDG, THEN <cwd>/.opencode/plugins/ktx.ts is written; without --project, then $XDG_CONFIG_HOME/opencode/plugins/ktx.ts is written."
      - "GIVEN the full test suite at the end of this task, WHEN `go test ./...` runs, THEN every M1, M2, and M3 acceptance criterion passes, and the Register call site for any new subcommand added in this plan is <= 10 lines (down from ~100 LOC of glue)."
overall_acceptance: "GIVEN the codebase at the end of this plan, WHEN `go test ./...` runs, THEN every previously-documented acceptance criterion (m1/m2/m3) is exercised by an automated test, and the suite completes in under 60 seconds. GIVEN a new subcommand added after this plan, WHEN registered via `dispatch.Register(name, opts, do)`, THEN the call site is <= 10 lines of glue because the deep module owns the flag set, db open, error envelope, and exit-code mapping. GIVEN an AI agent modifying internal/cli/ or internal/db/, WHEN `go test ./...` runs in the same loop, THEN zero regression is detected without subprocess plumbing."
surprises: >-
  Task 2 produced 24 top-level test functions and approximately 46
  subtests (70 PASS lines total) across the five new test files,
  exceeding the plan's stated budget by including natural companion
  cases (e.g. nil-M2 round-trip as JSON null, AC 6 caller-supplied
  cost wins, AC 4 empty-hint fresh session, sample-IDs empty DB).
  The inspect_test.go DROP-COLUMN negative path uses t.Skipf rather
  than t.Fatal because modernc.org/sqlite may reject DROP on certain
  column kinds depending on build flags; the positive branch still
  proves the probe behaviour. prices_test.go already existed from
  Task 1 (covering the WithHTTPClient seam); Task 2 extended it with
  AC 5 and a WriteToDisk companion rather than creating a duplicate
  file, since the plan rule 'one file per *_test.go' is preserved
  as long as AC 5 lives in prices_test.go and the seam tests stay
  alongside it.

  Task 3 produced 17 top-level test functions and 69 subtests (86
  PASS lines total) across 11 new test files, exceeding the plan's
  stated ~30-40 budget by the same margin as Task 2 (natural
  companion cases: dispatch contract, --format before/after
  positions, --quiet flag, agent non-zero exit, init show/uninstall
  round-trip, run with tool_use event). The expansion is justified:
  the proportional target is "one pass + one fail per acceptance
  criterion across 10 subcommands" — Task 3's 5 ACs × 10 subcommands
  = 50 minimum test cases before any companion. The actual
  distribution: write (10), read (5), get (6), list (6), db (7),
  prices (4), doctor (5), run (7 incl. Task 1's 2), bench (8),
  init (8), cli dispatcher (6) = 72 subtests + 14 dispatcher-level
  = 86 total, all green. The run_test.go seam test (Task 1 AC 3)
  lives alongside the Task 3 subcommand-level companion cases, in
  the same file, mirroring the Task 2 prices_test.go pattern.

  Two architectural notes that affect the test surface (no product
  change, both pre-existing): (1) the dispatcher's `commandIndex`
  closures call `cmd.run(args, opts)` which goes through each
  subcommand's `run(args, opts) -> runXWith(args, opts, os.Stdout,
  os.Stderr)` — i.e. the dispatcher→subcommand hop does not thread
  the injected `bytes.Buffer` from `runWith`. Subcommand-level
  tests must call `runXWith` directly to capture stdout; the
  dispatcher test exercises only the dispatcher's own surface
  (parseGlobalFlags, commandIndex lookup, --help/--version).
  Closing this gap is exactly Task 4's `dispatch` module; the
  regression net Task 3 builds makes that extraction safe. (2)
  `ktx bench run` is intentionally not exercised at the subcommand
  level because it requires a real `opencode` agent binary and a
  methodology file on disk; the runBenchReportImpl seam is the
  testable surface for the bench report half (covered in
  bench_test.go), and bench run's headline semantics are covered
  via the same runBenchReportImpl path in Task 2's bench_test.go
  (InsertBenchRun + QueryBenchRun + SummarizeBenchToolCalls).
  The bench_run wrapper's end-to-end test is intentionally
  deferred to the M3 acceptance harness until a CI agent fixture
  is available.

  A small test-only helper `chdir(t, dir)` was added to
  init_test.go to scope the project-install path; `t.Chdir`
  (Go 1.24+) is avoided because the project's go.mod pins an
  older toolchain. The helper captures the original cwd and
  restores it via a t.Cleanup, so parallel tests cannot observe
  a leaked cwd.

  Task 4 produced 18 top-level test functions and 13 subtests
  (31 PASS lines total) in a single `dispatch_test.go`, plus
  the new `internal/cli/dispatch.go` (291 LOC including the
  locked API surface, file/package doc comments, and the
  end-to-end runRegisteredVerb pipeline). Two files outside
  the Task 4 "files" scope were touched: (1) `internal/cli/errors.go`
  gained a 3-line `errors.Is(err, dbpkg.ErrNotFound)` branch in
  `toKtxError` so the central mapping function actually maps
  the sentinel to `CodeNotFound` — the plan design states
  "exit-code mapping via `exitCodeOf(err)`; `dbpkg.ErrNotFound → 2`",
  which is what the branch delivers; the same change makes
  `internal/cli/bench.go`'s pre-existing wrapper path consistent
  (the bench wrapper used to map `ErrNotFound` to `internal`/exit 4
  because `exitCodeOf` did not recognise the sentinel, a latent
  bug now fixed). (2) `internal/cli/cli.go`'s `runWith` was
  extended with a 7-line fall-through that consults
  `dispatchRegistry` after `commandIndex` misses, so the
  Task 4 demo verbs land in the dispatcher's hot path without
  any of the legacy verbs being migrated (the legacy table is
  preserved untouched, per the Task 4 hard constraint). The
  registry-first ordering means a verb registered via
  `dispatch.Register` shadows a legacy entry with the same
  name; no current verb does this, but Tasks 5-7 can rely on
  the shadow when migrating.

  The optional "demonstration verbs" deliverable was satisfied
  by the `TestDispatch_Integration` group (4 subtests) rather
  than by production `init()` registrations in `dispatch.go`.
  Each subtest registers a demo verb (e.g. `demo_echo`,
  `demo_fmt`, `demo_404`) via the test-only `registerFor`
  helper, exercises it through `runWith`, and unregisters
  via `t.Cleanup`. This keeps the production surface clean
  (no fake verbs ship in the binary) while proving the
  end-to-end integration the AC requires ("WHEN `ktx foo`
  runs"). A persistent demo verb in `dispatch.go` would have
  added ~30 LOC of placeholder code that exercises no real
  surface and would have to be deleted before Tasks 5-7
  migrate the legacy verbs.

  The `captureVerb` test helper was added so AC6 could
  inspect `ctx.Args` after the parse step (the spec asserts
  on `ctx.Args`, not on the verb's return value). The
  helper installs a no-op `CommandFunc` that copies the
  supplied `*DispatchContext` to a caller-supplied pointer;
  tests assert against the captured pointer after
  `runDispatch` returns. The pattern recurs in the
  format-extraction tests (where `ctx.Format` is the
  observable) and the NeedsDB+Passthrough test (where
  `ctx.DB` is the observable).

  Task 5 picked the "refactor body to CommandFunc" path
  rather than "wrap *_With body in a closure". The wrap
  path forces the verb to swallow the legacy's error
  printing (legacy `runXWith` returns `int` and prints the
  envelope itself), which either double-prints or loses
  the exit code; the refactor path keeps `runXWith` as a
  thin wrapper over a shared `*Logic` function that returns
  `(any, error)`. Both call sites — the legacy test seam
  and the new dispatch wrapper — use the same helper. The
  `runXWith` signatures (test seam) are unchanged so all
  Task 3 tests pass without modification. The refactor
  also drops the legacy top-level `runRead` / `runWrite`
  entry points (only ever called from the now-deleted
  entries in the `commands` slice); the production entry
  point `Run` was never affected.

  Task 5 used os.Pipe + os.Stdin swap for the dispatch
  stdin-injection tests. The dispatch module's
  runRegisteredVerb reads from os.Stdin when NeedsStdin
  is true; tests are serial (no t.Parallel in this
  package) so the process-global swap is safe, and
  t.Cleanup restores os.Stdin when each subtest returns.
  The pattern lives alongside the dispatch tests in
  `internal/cli/dispatch_io_test.go` (a new file, since
  read_test.go / write_test.go are the legacy direct-call
  seams); `ktx read` (4 subtests) and `ktx write` (5
  subtests) cover success, not-found, --help, and the
  two failure branches — the minimum cases the plan AC
  enumerates, plus the missing-id (usage) and missing
  required-field (usage) companions. The new file brings
  the cli package total to 39 top-level tests / 96 subtests
  (135 PASS lines), up from 35 / 82 (117) in Task 4; the
  dispatch_io_test.go delta is exactly 2 top-level / 14
  subtests.

  Task 6 produced 4 top-level tests and 19 subtests (23 PASS lines
  total) in `internal/cli/dispatch_query_test.go`, covering the 5
  plan ACs end-to-end through `runWith`. The dispatch path's
  `ktx get` / `ktx list` use the Task 5 refactor pattern (extract
  `*Logic` returning `(any, error)`, register via `dispatch.Register`
  in `init()`); `ktx run` does the same with PassthroughStdout=true
  and NeedsDB=true. `ktx bench` migrates only the top-level
  namespace dispatcher (`runBench` → `benchCommandFunc`); the
  inner `runBenchReport` / `runBenchReportImpl` / `runBenchRun`
  functions stay as direct test seams per the spec. The cli
  package now totals 43 top-level tests / 113 subtests (156 PASS
  lines), up from 39 / 96 (135) in Task 5; the
  dispatch_query_test.go delta is exactly 4 top-level / 19
  subtests.

  Two files outside the Task 6 "files" scope were touched: (1)
  `internal/cli/dispatch.go` gained a `Quiet` field on
  `DispatchContext` and a `--quiet/-q` flag binding on the
  dispatcher's internal flag set; `runDispatch` and
  `runRegisteredVerb` accept a `globalQuiet bool` parameter that
  the dispatcher merges with the subcommand-local `--quiet`. (2)
  `internal/cli/dispatch_test.go`'s 16 `runDispatch` call sites
  were updated to pass `false` for the new parameter; the test
  surface is unchanged. (3) `internal/cli/cli.go`'s `runWith`
  forwards `opts.Quiet` to `runDispatch` so a global
  `ktx --quiet run <agent>` reaches the verb body the same way
  `ktx run <agent> --quiet` does.

  The `DispatchContext.Quiet` extension is the only "locked API"
  deviation in Task 6. The plan Task 4 contract locks the
  Register / RegisterOptions / CommandFunc / DispatchContext
  shapes; adding a new field to DispatchContext is a minor
  non-breaking change that the existing call sites (only one:
  the dispatcher's `runRegisteredVerb` constructor) handle without
  modification. The `runDispatch` / `runRegisteredVerb` signature
  changes are internal — those functions are package-private
  and not part of the locked API. The extension was necessary
  because the locked API had no path for the verb body to know
  whether `--quiet` was set: `ctx.Args` was post-flag-parse
  (the dispatcher consumed any flag it knew about) and `PreParse`
  only returns a new args slice (no side channel for state).
  Without the extension, `ktx run <agent> --quiet` would either
  reject `--quiet` as an unknown flag (locking AC4 out of the
  dispatch path) or strip it in `PreParse` and lose the signal.
  The chosen path — extending `DispatchContext` with `Quiet` and
  the dispatcher's flag set with `--quiet/-q` — preserves the
  AC4 contract end-to-end through the dispatch registry while
  keeping the locked API surface additive-only.

  Two design notes that affect the test surface (no product
  change, both pre-existing): (1) `ktx run`'s child-exit-code
  propagation is preserved on the test seam (runRunWith) but
  lost on the dispatch path — a non-zero child exit is mapped to
  `*Error{CodeInternal}` (exit 4) by `runCommandFunc` because
  the locked dispatch API can only represent typed errors, not
  arbitrary exit codes. The AC4 stub exits 0 so the test path
  returns `(nil, nil)` and exit 0 matches; the non-zero case is
  exercised by `TestRunRunWith_Dispatch/non-zero_agent_exit_…`
  which uses the test seam and preserves the literal child exit
  code. The fail companion in dispatch_query_test.go asserts a
  non-zero child exit still produces a non-zero exit code on
  the dispatch path; it does NOT assert the literal value (the
  dispatcher can only surface exit 4 for any non-zero code).
  Closing this gap would require extending the dispatch API to
  support arbitrary exit codes — explicitly deferred to a
  future plan. (2) `ktx bench`'s namespace dispatcher forwards
  to the existing `runBenchReport` / `runBenchRun` adapter
  functions; those adapters print their own error envelopes and
  return int. `benchSubToErr` converts the int to a typed error
  so the dispatcher's `exitCodeOf` mapping produces the right
  exit code; the error envelope itself is rendered by the
  adapter (not by the dispatcher's `printError`) so the user
  sees the same envelope shape on both the legacy test seam
  and the dispatch path. The "exit 2 for not-found bench
  report id" contract is preserved because `benchSubToErr`
  maps ExitNotFound → `notFoundError` → exit 2.

  The `dispatch_query_test.go` file sits alongside
  `dispatch_io_test.go` (Task 5) and `dispatch_test.go` (Task 4)
  as the third end-to-end dispatch test file. The naming
  convention follows the verb category: `_io` for I/O primitives
  (read, write), `_query` for query / complex-flow verbs (get,
  list, run, bench). Each file owns the AC tests for its verb
  category; the `dispatch_test.go` core tests cover the
  dispatch module's own surface (not any specific verb).

  Task 6 found a small test-only artefact worth noting: the
  AC3 text-render assertion initially used `"\t-\t-\t-"` as the
  separator pattern, but tabwriter renders the cells with space
  padding (not raw tabs) once the cells are aligned. The probe
  had to be re-written to look for `"3           -       -     -"`
  — the padded-space pattern that tabwriter emits after a row
  with `tool_calls=3` and three "-" M2 markers. The fix is
  documented inline in the test file so future tabwriter-output
  assertions do not re-derive the same fix.

  Task 7 produced 1 new file (`internal/cli/dispatch_namespace_test.go`,
  839 LOC) and modified 6 plan-files (cli.go, db.go, prices.go,
  doctor.go, init.go, dispatch.go) plus the two state-sync YAML
  files. The total cli package grew from 8814 to 10044 lines
  (+1230); production code grew 6727 → 7067 (+340); test code
  grew 2087 → 2977 (+890). The test delta is dominated by
  dispatch_namespace_test.go; the production delta is the four
  verb refactors (extracted *Logic + CommandFunc + init() +
  scratch variables + PreParse hooks where needed) plus the
  dispatch module extension (Description field, RegisteredVerbs).

  Two non-trivial deviations worth recording:

  (1) The dispatcher's per-verb flag set in runRegisteredVerb
  only knows about --help/-h and --quiet/-q. Any verb-specific
  flag (ktx db's --path, ktx init's --project/--uninstall/--show)
  MUST be extracted via PreParse before the dispatcher's flag set
  runs — otherwise the verb's flag is rejected with "flag
  provided but not defined: -path". ktx init already used
  PreParse per the plan; ktx db was not in the plan's PreParse
  list but turned out to need it. The fix: a hand-rolled
  dbPreParse (NOT stdlib flag, which would reject --help if --help
  is not registered on this set). The verb body reads the stashed
  value via dbScratch.pathOverride. Two new files of scratch
  variable boilerplate (dbScratch / initScratch) were added; each
  is reset at the start of every invocation so parallel calls
  cannot observe leaked state.

  (2) The `ktx doctor` "pre-M3 → degraded → exit 0" contract
  cannot be exercised through the dispatch path because the
  dispatcher's doctorCommandFunc calls doctorLogic which calls
  buildDoctorReport which calls dbpkg.Open which ALWAYS applies
  the migration. CREATE TABLE IF NOT EXISTS bench_runs is
  idempotent — if the table is absent when Open runs, the
  migration creates it with all 10 columns, defeating the
  pre-M3 fixture. The plan's notes section acknowledges this:
  "the fixture constructs a pre-M2 schema by opening a fresh
  sql.Open('sqlite', ':memory:') with M1 columns only, skipping
  the migration." Skipping the migration requires bypassing
  dbpkg.Open, which means constructing a *dbpkg.DB from a
  pre-built *sql.DB. Since dbpkg.DB's `db` field is unexported,
  the test uses an unsafe.Pointer cast (dbpkgDBFromSQL helper,
  test-only, documented) to wrap the in-memory *sql.DB. The
  production surface is unchanged; the unsafe approach is
  contained within dispatch_namespace_test.go. A future
  cycle could expose an OpenWithoutMigration helper in dbpkg
  to remove the unsafe dependency; out of scope for Task 7.

  The empty commands slice forced a parallel change to the help
  surface: `ktx --help` previously listed commands from the
  legacy `commands` slice; with the slice empty, the help would
  list zero verbs. The fix added a `Description string` field
  to RegisterOptions and a `RegisteredVerbs()` function that
  returns the (name, description) pairs sorted by name. All 10
  verb files updated their Register call site to include
  Description; printHelp in cli.go now iterates the registered
  verbs instead of the legacy slice. This is a minor additive
  API change (the existing RegisterOptions fields are unchanged)
  and the lock-down impact is small: a future verb that forgets
  Description is still callable, just omitted from `ktx --help`.
  A future resonera could decide whether missing Description
  should be a build-time error.

  Two files outside the Task 7 "files" scope were touched:
  (1) `internal/cli/dispatch.go` gained a `Description` field on
  RegisterOptions and a `RegisteredVerbs()` package-level
  function returning a snapshot of the registry. The extension
  is additive — existing call sites (Tasks 5-6) work unchanged
  with a zero-value Description; only the new verb files in
  Task 7 set Description explicitly. (2) All 10 verb files
  updated their `Register(...)` call site to include
  Description; existing call-site signatures are unchanged
  except for the new optional field.
