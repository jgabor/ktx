header:
  level: full
  created: "2026-06-21"
  status: complete
  reviewed: "2026-06-21"
  critic_issues: "15 found, 15 addressed, 0 dismissed"
  title: "Lock in regression net and deepen subcommand dispatch"
what: "Two architectural-deepening refactors for the ktx Go CLI. (1) Replace 2,239 LOC of hand-rolled acceptance verification in `.agentera/verification/` with `go test`-runnable unit and integration tests exercising the existing testable seam (`runXWith` injection, in-memory SQLite). (2) Extract a single `dispatch` deep module in `internal/cli/` that owns subcommand flag-set plumbing, database open/close, error envelope rendering, and exit-code mapping, replacing ~100 LOC of glue per subcommand with one call site."
why: "The verification logs are the regression net for M1-M3 but every check requires hand-typed shell, paste-expected-output, and eyeball-diff; an AI agent modifying the codebase cannot verify in-loop. The testable seam is built into every `runXWith(args, opts, stdout, stderr)` -- injected stdio, no `os.Args` access. The seam exists; the tests do not. Subcommand boilerplate (`flag.NewFlagSet` + `dbpkg.Open` + error envelope) is duplicated across 10 files; M4/M5 will compound the duplication. Tests first, then refactor: the regression net makes the dispatch extraction safe."
constraints: "D1-D12 firm decisions stand. \"Boring before clever\": Go stdlib first, no new deps. Existing `runXWith(args, opts, stdout, stderr)` injection seam stays. `dbpkg.DB` and unexported `*sql.DB` stay. Schema and idempotent migrations stay. I/O vs query split (D2) stays: `ktx read`/`ktx write` raw JSON; `ktx get`/`ktx list`/`ktx bench` JSON default with `--format text`. Exit codes (D4): 0/1/2/3/4. File `internal/cli/dispatch.go` (not `command.go`) avoids collision with the unexported `command` type at `internal/cli/cli.go:45`. Dispatch does NOT own JSON or text rendering; verbs write to `ctx.Stdout`."
scope:
  included:
    - "Test seams: `dbpkg.OpenMemory()`, `Prices.WithHTTPClient(c)`, `executeRun` `runCmd` injection, `testutil.WithTempXDG(t)`."
    - "`internal/db` table-driven unit tests (persist, session, prices, bench, inspect)."
    - "`internal/cli` golden-file subcommand tests across all 10 subcommands."
    - "`internal/cli/dispatch.go` deep module with `Register(name, RegisterOptions, CommandFunc)` API."
    - "Migration of all 10 existing subcommands to use the new module."
    - "Final state sync: `.agentera/progress.yaml` cycle bump, `TODO.md` updates, full `go test ./...`."
  excluded:
    - "Schema changes; new tables; column additions."
    - "CLI surface changes; command names; global flags."
    - "New functionality -- this plan deepens existing surface."
  deferred:
    - "Cost-deriver consolidation -> TODO.md '-> Deepening'."
    - "`internal/db` file reorganisation -> TODO.md '-> Deepening'."
    - "Event-parser extraction -> TODO.md '-> Deepening'."
design: "Tasks ordered for safety: test seams first (Task 1), regression net next (Tasks 2-3), then the deep module extraction (Task 4) against an existing test surface, then migration (Tasks 5-7) in dependency order (I/O to query/complex to namespace). The `dispatch` module exposes `Register(verb, RegisterOptions, CommandFunc) int`. `RegisterOptions` declares NeedsDB, NeedsStdin, PassthroughStdout, FormatDefault, Help, PreParse. `CommandFunc` receives a `*DispatchContext` carrying opened `*dbpkg.DB`, parsed args, stdin, format, writers. Module owns flag parsing, db open/close, error envelope, exit-code mapping; verb owns output rendering. Tests exercise the existing `runXWith` seam directly via `bytes.Buffer` capture. Isolation uses `t.TempDir()` plus `testutil.WithTempXDG(t)` to set XDG paths per-test. `KTX_DB` is set via `t.Setenv`."
