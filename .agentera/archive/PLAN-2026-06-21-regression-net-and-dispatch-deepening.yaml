    acceptance:
      - "GIVEN `ktx db --path <tmp>/foo.db path`, WHEN invoked, THEN stdout is `<tmp>/foo.db`; on the next invocation without --path, the override is not persisted."
      - "GIVEN `ktx prices update` with WithHTTPClient set to a server returning 500, WHEN invoked, THEN exit 4 (manual-refresh hard-fail contract preserved)."
