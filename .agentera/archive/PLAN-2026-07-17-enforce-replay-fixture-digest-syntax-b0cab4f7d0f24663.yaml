header:
  level: light
  created: 2026-07-17
  status: complete
  title: "Plan: Enforce Replay Fixture Digest Syntax"
  id: plan:33707a7b-3ff7-4275-bc7c-770c5cf31ecf
what: Require every version-1 portable replay fixture stream digest to use the complete lowercase SHA-256 hexadecimal syntax before replay evaluation, while retaining the established behavior for valid fixtures and intentional evidence drift.
why: Prevent malformed digest text from being misclassified as evaluated replay drift, so the versioned fixture contract, exit status, failure class, correction guidance, and evidence output remain predictable.
constraints: Keep the remediation limited to portable file replay fixture validation, proportional regression coverage, documentation accuracy, and plan closeout. Preserve strict offline replay, valid-fixture results, and intentional content or expectation drift behavior. Do not alter the previous archive transition, unrelated project state, or infer decision satisfaction from degraded historical evidence or unobserved hosted CI.
overall_acceptance: GIVEN a version-1 portable replay fixture WHEN its stream digest and replay evidence are processed THEN malformed digest syntax is rejected before evaluation and well-formed fixtures retain their documented success or drift outcomes.
scope:
  included:
    - Version-1 portable replay fixture stream digest syntax validation
    - Focused malformed, valid, and intentional drift regression coverage
    - Replay fixture documentation accuracy and verification
    - Evidence-based plan closeout without decision-satisfaction inference
  excluded:
    - Other replay sources or fixture versions
    - Replay evaluation semantics unrelated to digest syntax
    - Hosted CI observation or historical decision-state repair
    - Changes to the previous archived plan or other project-memory artifacts
tasks:
  - number: 1
    name: Restore the portable replay digest contract
    depends_on:
      []
    status: complete
    acceptance:
      - GIVEN a version-1 portable replay fixture WHEN its stream digest syntax is validated THEN it is syntactically valid only when it contains exactly 64 characters drawn from lowercase hexadecimal digits.
      - GIVEN a stream digest that is missing, the wrong length, uppercase, or contains a non-hexadecimal character WHEN file replay is requested THEN replay evaluation does not run, exit 1 reports the invalid-replay-fixture class with the documented correction, and no replay evidence envelope is emitted.
      - GIVEN a syntactically valid lowercase digest WHEN the fixture is replayed THEN a matching digest preserves the valid-fixture outcome, while intentional content, digest, or expectation drift still emits inspectable failure evidence with the documented verification-failure class and exit 4.
      - GIVEN the remediation and proportional regression coverage are complete WHEN focused replay-fixture tests and the repository mage verify gate run and the user documentation is reviewed THEN the tests and gate pass and the documentation remains accurate or is corrected to match observable behavior.
      - GIVEN verified remediation evidence and degraded historical decision or progress state WHEN the task reaches final state and the plan is eligible for archival THEN closeout records only established evidence and does not infer decision satisfaction or hosted CI results.
    evidence: internal/cli digest regressions prove missing, wrong-length, uppercase, and 64-g values exit 1 with invalid-replay-fixture, correction guidance, and no envelope. Valid fixtures still PASS; syntactically valid content, digest, and expectation drift emits FAIL evidence and exact exit 4. go test ./internal/cli -count=1 and mage verify passed locally; docs/pipelines.md states exactly 64 lowercase hexadecimal characters. Progress entry 55 records the built-binary malformed-digest smoke result. No hosted CI result or decision satisfaction is claimed.
surprises:
