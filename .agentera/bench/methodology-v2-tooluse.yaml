methodology_version: "v2-tooluse"
date: "2026-06-30"

# v2-tooluse scope
#
# Tool-use variant of v1: same single-task, single-trial, exact-match
# scoring, but the task prompt is designed to trigger tool use (bash)
# so the parser_regression check in --replay exercises real tool_use
# events. v1's "What is 2+2?" task is answered directly without tools
# (tool_call_count=0), making the parser_regression check vacuously
# true (0 == 0). This methodology exercises the parser on real
# tool_use JSONL events.
scope: |
  Tool-use variant of v1: same single-task, single-trial, exact-match
  scoring, but the task prompt triggers bash tool use so the
  parser_regression check in --replay exercises real tool_use events.

inputs:
  agent:
    binary: opencode
    version: "1.17.8"
  model:
    id: "glm-5.2-short-fast-flex"
    provider: "neuralwatt"
  task:
    identifier: "bash_echo_v1"
    prompt: "Use the bash tool to run the command: echo 4. After running the command, respond with only the output you see."
    expected_output: "4"
  scoring:
    function: exact_match
    version: "v1"
    epsilon: 1.0e-9
  trials:
    n: 1
    non_determinism_handling: |
      v1 does not aggregate across trials. A single trial's score is
      the headline numerator.
  ktx:
    binary_version: "<ktx version — pinned at close>"
    commit: "<commit SHA — pinned at close>"
  bench_runs:
    row_id: "<row id — populated when a real run lands>"

computation: |
  cost_per_correct = cost_USD / max(score, 1.0e-9)
  where:
    cost_USD is the persisted `cost` column on the bench_runs row.
    score is the persisted `score` column (0.0 or 1.0 for exact-match).

output:
  artifact: ktx bench report
  default_format: json
  text_format: true
  fields:
    - methodology_version
    - bench_runs (rows array)
    - headline (cost_per_correct)

out_of_scope:
  - statistical significance / confidence intervals
  - "ktx bench compare (post-M3)"
  - compression impact on bench (M4)
  - cache TTL and auto-refresh (D11 deferral)
  - second scoring function (LLM-as-judge is the flexible default acknowledged but not implemented)
