  - summary: "Decision 14 (2026-06-24): M4 default compression pipeline =
      passthrough when no ktx.toml is present: `ktx compress <id>` produces..."
    number: 14
    date: 2026-06-24
    choice: "M4 default compression pipeline = passthrough when no ktx.toml is
      present: `ktx compress <id>` produces a new row in a new `compressed`
      table whose output equals the source's output and whose source_id
      references the original tool_calls.id; `ktx decompress <compressed-id>`
      resolves source_id and returns the source's original output bytes verbatim
      — this is the public-surface reversal that satisfies M4 acceptance.
      Built-in Go stages (strip-ansi, dedup-blank, head, truncate, normalize)
      exist but are OFF unless configured in ktx.toml (D5). The reversibility
      layer IS the database: the tool_calls table holds append-only originals
      (D7, D9 content_hash for integrity), never deletes them, and is
      nanoid-addressable (D3); compressed artifacts live in a separate
      `compressed` table (not polluting tool_calls evidence, which M3 bench
      cost-aggregates) with a source_id reference. No separate CCR hash store,
      no in-band `hash=…` markers, no retrieve tool, no BM25 sub-retrieval —
      reversal is out-of-band via `ktx decompress <id>`. Both the hook path (D1:
      `ktx hook` writes original via `ktx write`, returns compressed to agent)
      and the explicit-verb path (`ktx compress`/`ktx decompress`) share this
      mechanism: the database always holds the original. The
      conservative-on-failure contract is runtime-enforced by the pipeline
      runner (not a stage-author convention — the lowfat failure mode is
      explicitly rejected) with three invariants: (1) empty-output guard — a
      stage that produces empty output from non-empty input is discarded, input
      passes through; (2) stage-execution-error passthrough — a stage that
      errors (panic recovered, non-zero exit for external, timeout) passes its
      input through unchanged; (3) unknown-stage skipped with a stderr warning.
      Source-tool-failure protection (headroom's protect_error_outputs) is
      deferred: D9 lacks a failure signal (exit_code / is_error), adding one is
      a separate D9-extension resonera. Pipeline shape = linear ordered stages;
      content-type routing (D5, byte-level, no ML) selects which linear profile
      applies but is dormant for M4 (no content-type detection ships, single
      passthrough default profile). No aggressiveness model for M4 — no tiers,
      no knobs, no adaptive pressure; configured stages run at their natural
      behavior. Plugin registry semantics (`ktx plugin add/list/remove`) are
      deferred to a separate deliberation (TODO.md:30 open); D5's ktx.toml
      shell-macro model is the M5 extension story. ML deps are a hard no for
      ktx's core (no ONNX, no Magika, no model weights, no download subsystem);
      ML compressors appear only as user-configured external stages behind the
      router, per the vision's 'the router wins, the algorithm loses.'"
    feeds_into: M4 implementation (ktx compress, ktx decompress, compressed table
      schema, pipeline runner with conservative-on-failure invariants, hook-path
      transform in ktx hook), M5 ktx.toml pipeline config, post-M4 D9-extension
      resonera (exit_code / is_error field for source-tool-failure protection),
      post-M5 content-type detection deliberation (TODO.md:29), post-M4
      aggressiveness deliberation (TODO.md:47), M5 plugin registry deliberation
      (TODO.md:30), ARCHITECTURE.md Pipeline-and-compression and
      Reversibility-layer Decided sections
    satisfaction:
      state: user_confirmed_satisfied
      user_confirmation:
        confirmed_by: Jonathan Gabor <230093+jgabor@users.noreply.github.com>
        confirmed_at: 2026-07-09
    outcome: "M4 default compression pipeline = passthrough when no ktx.toml is
