  - summary: "Decision 12 (2026-06-20): v1 = exact-match scoring against a known
      good output, single-trial (N=1), single-task, methodology file
      committed..."
    number: 12
    date: 2026-06-20
    choice: "v1 = exact-match scoring against a known good output, single-trial
      (N=1), single-task, methodology file committed at
      `.agentera/bench/methodology-v1.yaml` referenced by a
      `methodology_version` string on every `bench_runs` row. Task shape:
      identifier + prompt + expected_output colocated in the methodology file
      (single task per v1; M3 task 4 pins the real (agent, model, task) triple
      by filling the placeholders). Scoring function: `exact_match` — string
      equality on the agent's final output against `expected_output`. Trial
      count: N=1; the v1 single trial's score is the headline numerator.
      Methodology versioning: `methodology_version: 'v1'` on every `bench_runs`
      row, pointing at the methodology file. `ktx bench report`: JSON default
      with `--format text` (D4, D2); emits a top-level `headline` (number) and a
      `rows` array; each row carries `id`, `agent`, `model`, `task`, `score`,
      `cost`, `methodology_version`, `timestamp`. Headline formula:
      `cost_per_correct = cost_USD / max(score, 1.0e-9)` USD, six decimal
      places. The `1e-9` epsilon prevents division by zero when score=0; the
      resulting large value correctly signals that an incorrect answer is
      unboundedly expensive per correct (the vision's 'cost is the contract'
      made loud). Depends on D2 (bench namespace), D7 (tool_calls evidence +
      cost column), D9 (flat JSON envelope for bench run input), D11
      (models.dev, tokens_in + tokens_out + model, soft-fail on fetch). Out of
      scope for v1 and explicitly deferred: statistical significance /
      confidence intervals, `ktx bench compare` (post-M3), compression impact on
      bench (M4), cache TTL/auto-refresh (D11 deferral), second scoring function
      (LLM-as-judge is the flexible default acknowledged but not implemented)."
