  format: yaml
decisions:
  - number: 13
    date: 2026-06-22
    question: How should ktx benchmark itself accurately, automatically, and
      reliably — the execution harness and comparison layer above D12's scoring
      contract?
    context: "D12 settled the v1 scoring methodology (exact-match, single-trial,
      cost_per_correct) and M3 implemented ktx bench run/report, proving the
      mechanics with a synthetic fixture (fake opencode binary + deterministic
      JSONL). But D12 and M3 did not address the execution layer: running real
      agents on real tasks, automating that in CI, and proving ktx's
      cost-reduction value claim. External research: headroom uses
      pytest-benchmark for micro-benchmarks plus scenario-based cost benchmarks
      with quality preservation tests (needles/errors must survive compression);
      lowfat uses Rust criterion for pure function-level benchmarks (strip-ansi,
      truncate, token-budget); rtk uses a Multipass VM with 11-phase integration
      tests including token-savings comparison (raw vs rtk-wrapped) and
      hyperfine latency measurement. openeval (the author's own project at
      ~/git/openeval) is a full harness for CLI coding agents with scenario
      management, pass@k, cost-per-passed-task, variation comparison, OTLP
      telemetry, and Docker isolation. The vision mandates 'cost is the
      contract' and 'boring before clever'. M4 (compression pipeline) is not yet
      built — ktx today only measures cost, does not reduce it. The open
      ARCHITECTURE.md item 'How per-layer savings roll into session and
      benchmark headline numbers without double-counting' is related but not
      directly resolved by this decision."
    alternatives:
      - name: Build ktx-native harness independently of openeval
        status: rejected
        description: Full control, no cross-project dependency. Duplicates scenario
          management, agent execution, and comparison infrastructure that
          openeval already provides. Violates DRY across projects.
        win_condition: Would be chosen if openeval did not exist or if ktx's benchmark
          needs were fundamentally incompatible with openeval's scenario model.
      - name: Two-tier model with ktx-native replay and openeval harness
        status: chosen
        description: Clean separation, no duplication, leverages openeval's existing
          infrastructure. ktx is unaware of openeval; openeval sees ktx as a
          wrapper command. Requires openeval to support per-variation agent
          command overrides (may need feature request). Two cost measurement
          systems (ktx D11 models.dev vs openeval config-based pricing) — both
          use provider-reported tokens, so numbers should match. Two tiers to
          maintain.
        win_condition: openeval can invoke `ktx run opencode` as the treatment
          variation's agent command, and the ktx-native replay benchmark
          correctly reproduces parser/cost numbers from a recorded session.
      - name: Single tier only (ktx-native or openeval, not both)
        status: rejected
        description: Simpler to maintain. Loses either the quick development feedback
          loop (ktx-native only) or the comprehensive published proof (openeval
          only).
        win_condition: Would be chosen if one tier was clearly sufficient for both
          development feedback and published proof.
    choice: "Two-tier benchmark model. Tier 1 (ktx-native): `ktx bench run --replay
      <session-id>` uses a recorded real OpenCode session, replays it through
      ktx's pipeline with an internal A/B comparison (baseline without
      compression + treatment with compression when M4 ships) in a single
      invocation. Deterministic, fast (seconds, no agent call), per-commit CI
      gate. Pre-M4: validates parser and cost-derivation accuracy, measures
      wrapper overhead. Post-M4: shows compression delta (token reduction, cost
      savings). Tier 2 (openeval): openeval runs live agent scenarios with
      with/without-ktx variation arms. Starts with shipped example-fixtures
      scenario (hello-verify, edit-file) to prove the comparison infrastructure
      end-to-end, upgrades to real SWE tasks ('Develop a TODO CLI in Go') later.
      Scheduled CI (nightly or pre-release), real API cost, pass@k +
      cost-per-passed-task. ktx is unaware of openeval; openeval sees ktx as a
      wrapper command. If openeval lacks telemetry for ktx-specific metrics
      (compression ratio, per-layer savings), file feature requests to the
      openeval repo. Design the harness for M4 compression, measure wrapper
      overhead and cost accuracy today."
    reasoning: >-
      openeval already solves the harness problem (scenario management, real
      agent execution, pass@k, variation comparison, Docker isolation) and the
      user owns it. Building a parallel harness inside ktx would duplicate that
      infrastructure and violate DRY. ktx's value in the benchmark is the
      compression (M4) and cost measurement (D11), not the harness. The
      ktx-native tier provides the quick development feedback loop that openeval
      cannot (seconds vs minutes, free vs real API cost, deterministic vs
      non-deterministic). The recorded replay model is the sweet spot: fast (no
      agent call), realistic (real agent output), reproducible (same recording
      produces same numbers), and tests compression on real data without agent
      variance. The internal A/B comparison in a single invocation means the
      developer sees the compression delta immediately without running two
      separate commands. Starting with openeval's example-fixtures proves the
      with/without-ktx comparison infrastructure before investing in scenario
      design. The per-commit plus scheduled CI rhythm is the standard tiered
      pattern: fast deterministic gate on every commit, comprehensive stochastic
      proof on schedule.


      Design rules (do not relitigate):

      - Two-tier model: ktx-native (recorded replay, per-commit) plus openeval
      (live agent, scheduled).

      - ktx-native: `ktx bench run --replay <session-id>` flag on existing M3
      command. Internal A/B (baseline plus compressed in one invocation). Single
      output with both numbers and delta. Deterministic, fast, per-commit CI
      gate.

      - openeval: variation arms (baseline: opencode, treatment: ktx run
      opencode). Start with example-fixtures scenario, upgrade to real SWE tasks
      later. Scheduled CI (nightly or pre-release). pass@k plus
      cost-per-passed-task.

      - ktx is unaware of openeval; openeval sees ktx as a wrapper command. No
      coupling between the two codebases.

      - If openeval lacks telemetry for ktx-specific metrics (compression ratio,
      per-layer savings), file feature requests to the openeval repo.

      - Design the harness for M4 compression; measure wrapper overhead and cost
      accuracy today (pre-M4).

      - D12 methodology-v1.yaml stays for the live `ktx bench run` path. The
      replay benchmark uses a recorded session fixture, not the methodology
      file's pinned task.

      - Recorded session fixture: capture a real OpenCode session once via `ktx
      run opencode`, store the event stream as a replayable fixture.

      - Relitigation boundary: D12 scoring contract (exact-match, N=1,
      cost_per_correct) is firm. D13 governs the execution harness and
      comparison layer, not the scoring.
    confidence: provisional
    feeds_into: M4 compression impact measurement, ktx bench --replay
      implementation, openeval ktx-impact scenario, CI automation for benchmark,
      ARCHITECTURE.md Measurement and benchmark section
  - number: 16
    date: 2026-06-29
    question: How does ktx validate wrapper capture against real opencode before
      building the D13 Tier 1 replay harness, and what evidence does the
      validation produce?
    context: "D13 committed to a two-tier benchmark model. Tier 1 (`ktx bench run
      --replay <session-id>`) reads a recorded real OpenCode session from
      ktx.db. But the M3 `bench run` path spawns `ktx run opencode <prompt>`,
      which spawns `opencode <prompt>` — the TUI default subcommand.
      bench_test.go only ever exercised the wrapper against a synthetic fake
      binary emitting deterministic JSONL; the parser pipeline has never been
      validated end-to-end against real opencode output. Before committing to a
      recording fixture format or a replay codepath, the wrapper-capture
      contract must be proven against real opencode JSONL. opencode also has
      `opencode run [message..] --format json` (non-interactive, emits raw JSON
      events on stdout) — that is the natural emission mode for the parser;
      rmux/TUI driving is unnecessary. Resonera deliberation 2026-06-29
      sequenced this: validation gate first; recording-contract deliberation
      deferred until validation produces evidence."
    alternatives:
      - name: Run rmux against an arbitrary task to validate capture
        status: rejected
        description: Drive opencode TUI via rmux against an arbitrary dev task; check
          ktx.db for session+tool_calls. Validates parser against realistic
          event shapes but conflates automation-layer reliability with wrapper
          capture; non-deterministic content; no D12 conformance signal.
        win_condition: Would be chosen if opencode lacked non-interactive JSONL emission
          and required TUI driving. It does not — `opencode run --format json`
          exists.
      - name: Skip validation; build recording fixture and --replay directly
        status: rejected
        description: "Assume the wrapper works; mine opencode.db for existing sessions
          and build `--replay` against them. Skips the cost of proving capture
          against real opencode. Risk: builds --replay on a wrapper-confidence
          assumption with zero evidence."
        win_condition: Would be chosen if M3 bench_test.go had already exercised the
          wrapper against real opencode. It has not — the suite covers only a
          synthetic fake binary.
      - name: Sequenced validation gate with per-layer assertions and non-interactive
          invocation
        status: chosen
        description: "Validation = run `ktx run opencode run --format json -m
          <methodology-pinned-model> <methodology-pinned-prompt>`; a shell
          script emits per-layer [PASS]/[FAIL] verdicts across: (1) session row
          + matching agent; (2) tool_calls count > 0 with non-zero
          tokens_in/out; (3) cost derived non-NULL via D11 cache; (4) parser
          clean (no silent error swallowing); (5) opencode answer exact-match
          against methodology expected_output (score=1.0). Drop rmux — opencode
          has non-interactive mode. Recording contract deferred until validation
          produces evidence; on pass, the session id IS the candidate replay
          fixture source. M3 bench run's literal `ktx run opencode <prompt>`
          invocation is suspected-broken against real opencode (TUI default
          subcommand); that fix is a separate TODO."
        win_condition: All five per-layer verdicts PASS on a single validation run; the
          session id is queryable via `ktx list` / `ktx get` with non-NULL cost
          and score=1.0; `ktx bench report --methodology v1` surfaces it as a
          valid bench run.
    choice: Sequenced validation gate using `ktx run opencode run --format json -m
      <m> <prompt>` against the methodology-pinned task, with full D12
      conformance acceptance bar broken into five per-layer [PASS]/[FAIL]
      assertions emitted by a shell script. Drop rmux — opencode's
      non-interactive mode emits the JSONL event stream the parser already
      handles. Recording-contract deliberation deferred until validation
      produces evidence; on pass, the session id is the candidate replay
      fixture. M3 bench run invocation gap (`ktx run opencode <prompt>` should
      be `ktx run opencode run --format json ...`) is a separate TODO.
    reasoning: "The wrapper has never been exercised end-to-end against real
      opencode. Building --replay on top of a wrapper-confidence assumption with
      zero evidence is the trap to avoid. The methodology-pinned task gives free
      D12 conformance data — if opencode answers correctly and cost derivation
      succeeds against the cached models.dev price, the resulting session id is
      simultaneously: (a) proof the wrapper captures correctly, (b) proof the
      parser handles real opencode JSONL, (c) proof the cost derivation pipeline
      works, and (d) the candidate fixture for D13 Tier 1 replay. Drop rmux
      because opencode's `--format json` flag emits the JSONL stream on stdout
      non-interactively; rmux adds automation-layer complexity without serving
      validation. Per-layer assertions isolate failures on first-pass — the base
      rate of failure on a never-exercised path is high; a shell script delivers
      the verdicts without modifying ktx itself, the cheapest YAGNI delivery
      vehicle. Recording contract stays deferred: the fixture IS the session id
      in ktx.db; serialization to a portable file format is an M5 concern, not
      today's. The M3 bench run invocation (`ktx run opencode <prompt>` literal)
      is suspected-broken against real opencode; that is a separate TODO, not
      part of this decision's scope."
    confidence: firm
    feeds_into: D13 Tier 1 validation gate; recording-contract deliberation
      (deferred until validation produces evidence); TODO entry for M3 bench run
      invocation fix; ARCHITECTURE.md Measurement-and-benchmark D13 addendum on
      validation before recording
  - number: 17
    date: 2026-06-30
    amendment_to: 16
    question: How should D16's L2 (token evidence) and L3 (cost evidence) layer
      assertions be reframed so that a validation PASS is achievable against the
      documented OpenCode 1.17.8 wrapper-capture behavior — without falsifying
      the gap recorded in m2-acceptance.md and m3-vision-gap.md — while
      preserving D16's intent (validate wrapper capture before building the D13
      Tier 1 replay harness)?
    context: "D16 is firm: validate wrapper capture against real opencode before
      committing to the D13 Tier 1 replay codepath or recording-contract format,
      via a shell script that emits five per-layer [PASS]/[FAIL] verdicts, with
      no Go source changes under internal/ or cmd/ and no direct SQLite access
      (ktx.db is reachable only through `ktx list` / `ktx get`). The reframed
      layers stay inside that same envelope. The empirical gap D16's L2/L3
      contract ignored is fully on record: parser.go lines 150-158 document that
      real OpenCode 1.17.8 `tool_use` events leave
      tokens_in/tokens_out/cost/model nil because OpenCode carries them on the
      separate step-aggregate `step_finish` event, not on `tool_use`; the
      captured fixture `.agentera/verification/fixtures/opencode-tool-use.jsonl`
      confirms the exact shape (one tool_use line with no token/cost/model
      fields, two step_finish lines carrying
      part.tokens.input/output/reasoning/cache and a numeric part.cost);
      m2-acceptance.md 'Surprises' §3 and lines 465-469, 751-753 persist the
      consequence — wrapper-persisted tool_call rows have tokens_in=NULL,
      tokens_out=NULL, cost=NULL, model=NULL for real OpenCode; run.go
      teeAndParse (lines 369-402) deliberately persists only tool_use events
      with no post-run step_finish enrichment; record.go SessionM2Rollups (lines
      486-496) uses HAVING SUM(tokens_in+tokens_out) IS NOT NULL OR SUM(cost) IS
      NOT NULL OR MIN(model) IS NOT NULL, so a real-opencode wrapper session is
      absent from the m2 rollup, which means `ktx list` exposes no m2 object for
      such a session by design. m3-vision-gap.md line 163 closes with
      'methodology v1 uses the sidecar path for the (agent, model, task) under
      test, because it is the only path that supplies M2 fields per-call for
      OpenCode today' — a recommendation never reconciled with D16 (which
      validates the wrapper path). The consequence: D16's win_condition ('all
      five per-layer PASS on a single validation run') is provably unachievable
      against real OpenCode as the L2/L3 contract is currently worded, because
      L2 and L3 assert a known-NULL persistence-layer behavior. The user
      instructed a reframe rather than an adoption or rejection, and confirmed
      D16 itself stays firm — D17 is an amendment to the L2/L3 layer assertions
      only. The validated reframe surface: the wrapper pipes every JSONL line
      opencode emits to its own stdout (run.go lines 378-379, passthrough before
      parse), so an external validation script already has access to the full
      event stream — including step_finish — without direct SQLite, without a
      new `ktx list tool_calls` command, and without touching Go source."
    alternatives:
      - name: "Adopt the reframe: L2/L3 read from the captured JSONL stream (wrapper
          stdout), not from persisted tool_call rows"
        status: chosen
        description: "L2 (reframed): on the captured JSONL stream that `ktx run ...`
          teed to the validation script's captured stdout, at least one line
          with type=step_finish has part.tokens.input > 0 AND part.tokens.output
          > 0 — proves the wrapper teed opencode's token-bearing events and they
          were observable; does NOT assert tokens reached tool_call rows. L3
          (reframed): on that same captured stream, either (a) at least one
          type=step_finish line carries part.cost as a number (provider-reported
          cost is non-NULL in the stream), OR (b) D11 derivation is
          reconstructable from the captured part.tokens.input/output plus the
          methodology-pinned model identifier, against the `ktx prices` cache,
          and the script-computed derived cost is > 0 (cache-miss treated as a
          real L3 FAIL per D11's environmental-failure policy, no silent
          bypass). L1, L4, L5 unchanged. The wrapper-side gap (tokens/cost/model
          stay NULL on tool_call rows for OpenCode tool_use events) remains
          recorded as known M2 behavior and feeds a future wrapper-side
          step_finish-enrichment deliberation — explicitly out of D17 scope."
        win_condition: All five per-layer verdicts PASS on a single `ktx run opencode
          run --format json -m neuralwatt/glm-5.2-short-fast-flex 'What is
          2+2?'` validation run; L4 still bridges the stream side and the
          persistence side (count of type=tool_use lines on stdout ==
          tool_call_count returned by `ktx list`), and the script still wires no
          direct SQLite, no `ktx list tool_calls`, and zero Go source edits.
      - name: "Reframe narrowly: drop L2/L3 entirely, validate only L1 (session
          captured), L4 (tool_use 1-to-1 persisted), L5 (answer match)"
        status: rejected
        description: Argue tokens/cost evidence is the D11 pipeline's territory, not
          wrapper-capture validation's. Keep a 3-layer gate.
        win_condition: Would be chosen if the validation gate's job were strictly 'did
          the wrapper persist what opencode emitted' with no cost-signal
          coverage at all.
        rationale: Drops every cost-pipeline signal from the gate; m3-vision-gap.md line
          163's recommendation that v1 use the sidecar path stays unresolved
          D17-wide; the recorded session id — the candidate replay fixture
          source — would carry no token/cost evidence at all, weakening both
          D16's intent (prove the wrapper+parser pipeline end-to-end before
          --replay) and any future recording-contract deliberation that asks 'is
          cost reconstructable from this fixture'.
      - name: "Reframe wider: extend the gate to also assert step_finish-driven
          reconstruction matches an expected cost nominal"
        status: rejected
        description: Same direction as the chosen alternative but also assert the
          derived cost matches a pre-computed expected nominal, exercising the
          D11 derivation arithmetic inside the gate.
        win_condition: Would be chosen if validating the D11 cost-derivation arithmetic
          were D17's scope.
        rationale: Scope-creep into the cost pipeline; D16 firm constraint 'must not
          modify ktx source under internal/ or cmd/' is preserved, but the gate
          now encodes an expected-cost assertion that belongs to a D11/bench-run
          validation, not a wrapper-capture gate; the chosen alternative already
          exercises D11 derivation as the L3(b) fallback path, which is the
          right amount of cost-pipeline coverage for a wrapper-capture gate.
          Expected-nominal comparison deferred to a cost-pipeline verification,
          not this gate.
      - name: Adopt the reframe AND record the wrapper-side step_finish enrichment gap
          as a deliberately deferred follow-up
        status: rejected
        description: Identical to the chosen alternative on the layer assertions;
          additionally writes a follow-up architecture/TODO entry recording that
          wrapper-side step_finish enrichment (back-fill tokens/cost/model onto
          persisted tool_call rows for OpenCode-emitted sessions) is a deferred
          gap, not blocking D16 validation or D13 Tier 1 if --replay
          reconstructs cost from the captured JSONL stream.
        win_condition: Same as the chosen alternative plus an explicit follow-up pointer
          in the architecture open-deliberations backlog and TODO.md.
        rationale: Folded into the chosen alternative's feeds_into string rather than
          carried as a separate winner; the follow-up entry itself is recorded
          as a feed-downstream of D17 via feeds_into, not a separate gating
          decision today. Folding avoids split-brain where two 'chosen'
          alternatives are essentially identical on the layer contract.
      - name: Reject the reframe; keep D16 L2/L3 as-stated and accept the documented
          FAIL
        status: rejected
        description: Run the validation script against real opencode, accept that L2 and
          L3 emit [FAIL] with reason 'tool_call rows carry NULL
          tokens/cost/model for OpenCode tool_use events', and treat the FAIL
          artifact as the deliverable.
        win_condition: Would be chosen if the FAIL artifact itself were the goal of D16
          (e.g., a deliberately-recorded demonstration that the wrapper path is
          unsuitable for v1).
        rationale: D16's chosen alternative explicitly states 'All five per-layer
          verdicts PASS on a single validation run; the session id is queryable
          via ktx list / ktx get with non-NULL cost and score=1.0' — i.e., the
          win_condition is all-PASS, not a documented FAIL. Accepting the FAIL
          contradicts D16's stated win_condition and would re-litigate D16
          itself, which the user instructed is firm. Also produces no candidate
          replay fixture source on a FAIL, defeating the gate's downstream
          purpose.
    choice: Amend D16's L2 and L3 layer assertions so that they read from the
      captured JSONL stream that `ktx run` teed to the validation script's
      captured stdout, instead of from the persisted tool_call rows reachable
      only via `ktx list` / `ktx get`. L2 (reframed) asserts at least one
      type=step_finish line on the captured stream carries part.tokens.input > 0
      AND part.tokens.output > 0. L3 (reframed) asserts either (a) at least one
      type=step_finish line carries part.cost as a number, or (b) D11 derivation
      is reconstructable from the captured step_finish tokens plus the
      methodology-pinned model identifier against the `ktx prices` cache, with
      the script-computed derived cost > 0 and a cache-miss treated as a real L3
      FAIL. L1, L4, L5 are unchanged; L4 retains its stream↔persistence bridge
      role. The wrapper-side step_finish-enrichment gap (tokens/cost/model stay
      NULL on tool_call rows for OpenCode tool_use events) stays recorded as
      known M2 behavior and is fed forward as an explicit deferred follow-up —
      not blocking D16 validation or D13 Tier 1 if --replay reconstructs cost
      from the captured JSONL stream.
    reasoning: "Every cited piece of evidence on disk confirms the same fact:
      against real OpenCode 1.17.8, the wrapper-persisted tool_call rows that
      `ktx list` / `ktx get` expose have tokens_in=NULL, tokens_out=NULL,
      cost=NULL, model=NULL — by documented design, not by defect. parser.go
      lines 150-158 name the root cause (OpenCode emits M2 fields on
      step_finish, a step-aggregate, not on tool_use); the fixture
      opencode-tool-use.jsonl shows the exact event shapes; m2-acceptance.md
      'Surprises' §3 records the persistence consequence; run.go teeAndParse
      persists only tool_use events with no step_finish enrichment; record.go
      SessionM2Rollups gates the m2 rollup on a non-NULL M2 field, so the `ktx
      list` m2 object for a real-opencode wrapper session is absent by
      construction. D16's L2 and L3 as currently written assert against exactly
      that persistence-layer behavior, so the gate's win_condition (all-PASS) is
      provably unachievable in the field — not because the wrapper is broken,
      but because the contract asserts a documented NULL. The reframe resolves
      this by switching the L2/L3 evidence source from the persistence layer
      (where the behavior is NULL-by-design) to the JSONL stream the wrapper
      already tees to stdout (run.go lines 378-379, passthrough-before-parse),
      where step_finish carries the token and cost fields opencode actually
      emitted. The reframe preserves D16's intent (validate wrapper capture
      end-to-end before --replay) and preserves the no-Go-source-changes and
      no-direct-SQLite constraints — the script captures `ktx run`'s stdout the
      same way it already does for L4. It does not falsify the gap: it stops
      asserting the gap as a gate failure, leaving it recorded as known M2
      behavior fed forward to a future enrichment deliberation. L4's
      stream↔persistence bridge (count of type=tool_use on stdout ==
      tool_call_count from `ktx list`) is unaffected and still proves the parser
      persisted every tool_use opencode emitted; only the token/cost assertions
      move to the stream side. The dropped-L2/L3 alternative is rejected because
      it would remove every cost-pipeline signal from the gate and leave
      m3-vision-gap.md line 163's sidecar recommendation unresolved D17-wide.
      The expected-cost-nominal alternative is rejected as scope-creep into the
      cost pipeline. The accept-the-FAIL alternative is rejected because it
      contradicts D16's explicit all-PASS win_condition and would re-litigate
      D16, which the user instructed is firm. The residual tension —
      m3-vision-gap.md line 163's recommendation that methodology v1 use the
      sidecar path because it is the only path that supplies M2 fields per-call
      for OpenCode — is NOT resolved by D17; D17 deliberately validates the
      wrapper path instead, on the user's explicit instruction that D16 stays
      firm. That tension is recorded in feeds_into and should be the subject of
      a future wrapper-vs-sidecar deliberation if --replay cost reconstruction
      from the captured stream proves insufficient. Confidence is provisional
      rather than firm because two residual tensions remain unresolved by D17:
      (1) the sidecar-vs-wrapper path question for v1, and (2) the L3(b) D11
      derivation exercise inside a wrapper-capture gate partially overlaps
      territory a cost-pipeline or bench-run verification would own. Both are
      surfaced in feeds_into; flagging them is the honest call rather than
      marking firm and burying the sidecar tension."
    confidence: provisional
    feeds_into: "D16 — L2 and L3 layer assertions amended by D17; D16 win_condition
      (all-PASS) now achievable against real OpenCode 1.17.8; ARCHITECTURE.md —
      Measurement-and-benchmark D13/D16 validation-gate section: L2/L3 layer
      text restated to read from captured JSONL stream, persistence-side
      NULL-by-design gap recorded as known M2 behavior not a gate failure;
      .agentera/plan.yaml — L2/L3 layer text (plan.yaml line 6 layer-(2)/(3) and
      line 18 L2/L3 acceptance) rewritten to assert against the captured JSONL
      stream from `ktx run`'s stdout, L1/L4/L5 unchanged, plan.surprises notes
      the reframe; scripts/validate-bench.sh — L2/L3 implementation reads from
      the captured stdout tee not from `ktx list` tool_call rows, L3(b)
      derivation computed in shell/jq against `ktx prices` cache, cache-miss
      treated as a real L3 FAIL per D11 environmental-failure policy; future
      deliberation — wrapper-side step_finish enrichment (back-fill
      tokens/cost/model onto persisted tool_call rows for OpenCode-emitted
      sessions) is a deferred gap, recorded, not blocking D16 validation or D13
      Tier 1 if --replay reconstructs cost from the captured JSONL stream;
      future deliberation — wrapper-vs-sidecar path for methodology v1,
      m3-vision-gap.md line 163 recommended the sidecar path, D17 deliberately
      validates the wrapper path on the user's instruction D16 stays firm,
      resolve before --replay finalizes the cost-reconstruction story"
  - number: 18
    date: 2026-06-30
    amendment_to: 16
    question: D16's invocation `ktx run opencode run --format json -m <m> <prompt>`
      cannot reach opencode today because the dispatcher's extractFormat
      (internal/cli/flags.go:34) consumes `--format <value>` from every position
      in the verb's args before the agent binary receives them — including from
      positions intended for the agent. Should D16's contract invocation stay
