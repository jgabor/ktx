  - number: 30
    date: 2026-07-15
    question: How should KTX assign and reconcile tool-call identity across trusted
      native runtime ingresses?
    context: "Task 1 retained pinned runtime contracts and offline probes in
      .agentera/verification/runtime-identity-evidence.md and
      .agentera/verification/runtime_identity_probe.go. Progress cycle 35
      corrects cycle 34 and is authoritative for retry-class coverage. The
      decision state is legacy/degraded: Decisions 3 and 26 are available only
      as irrecoverable summaries, so no missing historical fields are
      reconstructed. Their retained choices establish the 16-letter canonical
      domain and the versioned deterministic derivation. This decision
      generalizes eligibility and resolves retry equality, KTX session
      ownership, compressed-result authority, and compatibility without changing
      unrelated identity domains."
    alternatives:
      - name: "Trusted-ingress deterministic identity with fresh fallback and
          first-evidence authority: complete verified native tuples from
          recognized adapters converge; all other accepted events remain fresh
          observations."
        status: chosen
      - name: "Trust any caller-asserted runtime and tuple: generic flat or sidecar
          input could self-qualify and conflate unrelated evidence."
        status: rejected
      - name: "Keep deterministic eligibility Codex-only: rejects equivalent provenance
          and tuple evidence available from recognized OpenCode hook and wrapper
          paths."
        status: rejected
      - name: "Generate a fresh NanoID for every tool-call delivery: preserves duplicate
          source rows and duplicate roll-ups for eligible redelivery."
        status: rejected
      - name: "Compare raw serialized input and let every metadata difference conflict:
          differently formatted but semantically equal JSON would prevent
          equivalent OpenCode ingress events from converging."
        status: rejected
      - name: "Enrich or replace first evidence on retry and recompute the delivered
          compressed result: makes retry order and pipeline configuration alter
          already-recorded evidence or diverge persisted and returned results."
        status: rejected
    choice: "A recognized trusted native ingress is eligible for deterministic KTX
      tool-call identity only when its adapter/schema provenance verifies a
      complete usable (runtime, native session ID, native tool-call ID) tuple.
      Generic flat and sidecar compatibility input cannot self-qualify from
      caller-supplied runtime text. Ineligible, incomplete, or unverified tuples
      receive a fresh cryptographically random NanoID and carry no deduplication
      guarantee. Eligible tuples retain Decision 26's ktx-tool-call-id-v1
      ordered field framing, UTF-8 validation, ASCII-edge trim, runtime-only
      ASCII lowercase, SHA-256/base-26 derivation, exact 16-lowercase-letter
      canonical domain, cross-process/machine stability, fresh fallback, and
      no-alias rule. A new native call ID, including model-requested
      re-execution, is a distinct observation. For one deterministic ID,
      authoritative source equality is runtime, tool, input evidence under a
      strict canonical JSON comparison, and output bytes. Strict comparison
      requires UTF-8 JSON with valid Unicode scalar values and preserves every
      number token's original lexeme exactly, so 1, 1.0, and 1e0 are different.
      Object member names are compared after JSON unescaping; a duplicate name
      at any object depth makes strict comparison fail. Objects are ordered by
      their decoded member names using RFC 8785's UTF-16 code-unit ordering;
      insignificant whitespace is removed; strings and member names use RFC
      8785 string serialization; array order is preserved; and strings,
      booleans, null, and number lexemes otherwise retain their exact values.
      Inputs that fail this strict unique-key JSON handling compare by their
      exact original UTF-8 bytes instead. Exact retries
      reuse the existing source row. A difference in any authoritative field is
      a conflict; the first row remains unchanged. All other metadata is
      first-wins and ignored on retry, with no enrichment. The first successful
      source insertion owns the KTX session association; retries through another
      KTX ingress/session path neither move ownership nor increment another
      roll-up. The first persisted compressed artifact for that source is
      authoritative once present. An exact retry arriving before any artifact
      exists may safely receive source output; no later retry may replace the
      first artifact, and retries after it is persisted return it even if current
      pipeline configuration differs. Sequential and concurrent exact retries
      atomically converge to one source row, one source roll-up, and at most one
      authoritative compressed row; changed authoritative evidence conflicts
      before compression and cannot alter first evidence.
      Existing rows and references remain untouched. A pre-adoption observation
      redelivered after adoption may coexist once under its deterministic ID
      alongside unbounded legacy random duplicates. No migration, runtime-ID
      alias, or invented historical mapping is introduced."
    reasoning: Identity is trustworthy only where KTX controls or recognizes the
      ingress schema; tuple text alone is not provenance. Reusing Decision 26's
      established derivation is the smallest runtime-neutral extension. Strict
      canonical JSON comparison removes only object ordering, insignificant
      whitespace, and equivalent string escaping. Exact number lexemes avoid
      precision loss or cross-implementation numeric coercion, while duplicate
      keys fall back to exact bytes instead of depending on first-key or
      last-key parser behavior. Runtime, tool, canonical input, and output still
      prevent changed evidence from being conflated. First-wins metadata,
      source-session ownership, and compressed
      output form one auditable authority rule without enrichment or
      configuration-history machinery. Atomic insert-or-compare semantics make
      sequential and concurrent retries agree. Historical tuples were not
      retained, so coexistence without migration or alias is the only
      evidence-preserving compatibility contract. This supersedes Decision 3
      only where its retained choice implied a fresh NanoID for every tool-call
      insertion; it remains authoritative for fresh fallback and other
      KTX-generated identity domains. It supersedes Decision 26 only where
      deterministic eligibility was Codex-only; its derivation and compatibility
      rules remain authoritative.
    confidence: firm
    feeds_into: Trusted OpenCode and Codex ingress implementation, retry persistence
      and conflict handling, compressed-result reuse, and implementation Tasks
      3-5
  - number: 36
    date: 2026-08-13
    question: Should the live prompt-cache token percentage remain unavailable
      when a summary window contains multiple or missing provider/model
      identities, or should the summary pool all accepted model steps?
    context: The compact live summary is intended to provide one window-level
      headline while the separate breakdown command owns diagnostics. The active
      30-minute operator window contained 126 complete accepted OpenCode 1.18.5
      model steps across three OpenAI model identities, so the existing
      single-provider/model eligibility rule returned null despite every token
      bucket being measured. The pinned runtime contract normalizes uncached
      input, cache read, and cache write as disjoint buckets independently of the
      optional provider/model identity fields.
    alternatives:
      - name: Keep one provider/model identity per summary rate
        status: rejected
        description: Preserves the strict prior boundary but makes ordinary
          mixed-model summary windows unavailable even when all required token
          evidence is complete.
      - name: Pool models only within one provider
        status: rejected
        description: Covers common model switching but still makes the headline
          depend on optional provider identity even though the selected runtime
          contract defines the bucket semantics.
      - name: Pool all accepted rows under the supported runtime contract
        status: chosen
        description: Sum the three token buckets across accepted rows regardless
          of provider/model presence or equality, then calculate one
          token-weighted percentage. Unsupported runtime versions and incomplete
          or malformed buckets remain unavailable.
    choice: Supersede the live single-provider/model eligibility requirement for
      `ktx stats summary`. For every accepted OpenCode 1.18.5 model step in the
      requested window, sum cache read, uncached input, and cache write, then
      report `sum(cache_read) / sum(uncached_input + cache_read + cache_write) *
      100`. Include rows with different or missing provider/model identities.
      This is pooling by token volume, not an arithmetic mean of per-step,
      per-model, or per-provider percentages. Keep empty, unknown, malformed,
      incomplete, unsupported, and zero-denominator populations unavailable;
      preserve measured zero. Keep benchmark comparison identity gates and all
      prohibitions on provider-request and cache-internal claims unchanged.
    reasoning: The summary answers a runtime-contract window question, and all
      accepted rows share that accounting contract. Provider/model identity does
      not change the normalized bucket formula. Token weighting preserves the
      exact aggregate numerator and denominator, while averaging subgroup rates
      would distort differently sized populations. The existing summary schema
      remains version 8 because its JSON shape, field types, units, and formula
      are unchanged; the broader population is a compatible refinement recorded
      in the metric documentation rather than a wire-contract break.
    confidence: firm
    feeds_into: Live stats summary schema, aggregation eligibility, tests, help,
      changelog, pipeline documentation, and agent-facing telemetry guidance.
