          and sample-size labels only to schema v3. Retain every evaluated
          observation.
      - name: Inferential tests and automatic outlier filtering
        status: rejected
        description: P-values and confidence intervals over very small agent samples
          imply unsupported certainty; automatic filtering destroys retained
