 hook` shells out to `ktx write` to persist the ORIGINAL tool_call, then returns the TRANSFORMED response on stdout — the database always holds the original (reversibility via `ktx read`), the agent receives the compressed version.' D2 (firm) established `ktx compress`/`ktx decompress` as the user-facing explicit verbs with the guarantee `decompress(compress(x)) == x` and 'no flags — all configurability lives in ktx.toml.' D7 (firm) established tool_calls as append-only INSERT-only (originals never deleted). D3 (firm) established 16-char lowercase alpha nanoid addressability for every row. D5 (firm) committed to TOML config, shell-macro stages, byte-level non-ML content-type routing, inline arrays, external scripts as the reuse mechanism, no DSL, no compiled Go plugins. D9 (firm) specified content_hash is always recomputed from stored input+output (ktx owns integrity). The reversal primitives therefore already exist in the architecture; D14's question is what runs by default when no ktx.toml exists, where the compressed artifact lives such that `decompress(compress(x)) == x` holds, how the runner behaves when a stage fails or produces degenerate output, what shape the pipeline takes for v1, and what the v1 aggressiveness model and extension story are. The sub-questions (default behavior, content-type detection, reversibility layer, failure contract, pipeline shape, aggressiveness, plugin model, ML deps) are resolved together because they are mutually constraining: the default-behavior choice determines whether content-type detection is needed for M4, which determines whether a router ships, which determines the pipeline shape, which shapes the failure contract."
