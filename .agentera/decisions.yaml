meta:
  name: decisions
  version: 1.0.0
  description: Reasoning trail maintained by resonera. Each deliberation session
    appends one entry. Decisions are referenced by realisera, optimera,
    profilera, planera, inspektera, hej, dokumentera, visionera, resonera, and
    orkestrera for context on why choices were made.
  artifact_type: agent_facing
  path: .agentera/decisions.yaml
  producer: resonera
  consumers:
    - dokumentera
    - hej
    - inspektera
    - optimera
    - orkestrera
    - planera
    - profilera
    - realisera
    - resonera
