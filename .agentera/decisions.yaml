    reasoning: Deterministic descriptive evidence makes variance and unusual tool
      behavior auditable without overstating what small samples establish. Cycle
      pairing uses the control already built into the harness and avoids
      order-based matching. Additive v3-only fields preserve historical
      validation and ranking consumers while retaining the existing
