      stays schema_version=1 when NO attempt carries cache evidence
      (byte-identical to legacy v1) and bumps to schema_version=2 ONLY when at
      least one attempt under either side carries cache evidence. Under v2 the
      summary becomes self-contained: each baseline/candidate side carries
      pipeline_id, stage_labels (manifest.Pipelines[side].Stages), and
      pipeline_hash (manifest.Pipelines[side].SHA256); cache_read and
      cache_write distributions join the existing token/cost distributions;
      baseline_minus_candidate gains cache_read and cache_write entries. The
      replay envelope cost_drift section gains replayed_cache_read,
      original_cache_read, replayed_cache_write, original_cache_write fields
      (nullable) alongside the existing tokens/cost fields; cache drift
      detection mirrors cost drift detection absent-vs-zero-aware. Product code
      stays clean of project-memory markers — no decision ID, no legacy-vintage
      labels in errors."
    reasoning: "OpenCode step_finish event already emits
      part.tokens.cache.{read,write} (verified fixture
      tools/bench/fixtures/opencode-tool-use.jsonl). The captured stream is
      already retained (D20 recorded_streams contract). Cache telemetry is
      parse-and-persist, nothing structurally new. SUM is the correct
      aggregation because OpenCode emits per-request cache counts per
      step_finish — observed pattern read=100 then read=200 across two
      step_finish events in another fixture means SUM=300 (100+200), while MAX
      would give 200 — the wrong answer. The nullable-pointer +
      CacheReadEvents/CacheWriteEvents counter shape mirrors the existing
      TokensIn/TokensOut/Cost completeness contract exactly (ParseStream guards
      `sawCacheRead && CacheReadEvents == steps` before populating the pointer),
      so the absent-vs-zero distinction survives the round-trip the same way the
      token/cost contract already does. The conditional schema_version bump
      preserves the byte-match证据 contract ValidateExperiment relies on (legacy
