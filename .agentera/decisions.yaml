rovider. NULL is preserved when absent; 0 is preserved when set.\n- ktx doctor may flag records where all three of (tokens_in, tokens_out, model) are NULL as a normal-severity warning, signaling cost is not reconstructable for that call. Severity and command scope: future resonera."
