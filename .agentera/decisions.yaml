      cost (M2), benchmarks agents (M3), reversibly compresses stored data via
      the explicit-verb path `ktx compress`/`ktx decompress` (M4, D14), and
      loads user-defined compression extensions via `ktx plugin` + external
      subprocess stages (M5, D21). But NONE of these reduce the agent's runtime
      context-window token cost: `ktx compress` writes to the `compressed` table
      post-hoc (the agent already saw the full output), and the OpenCode plugin
      (installed by `ktx init opencode`, template at
      internal/cli/init.go:121-183) calls `ktx write` which is PASSIVE recording
      only. The missing piece is the D1 (firm) design: 'At M4, `ktx hook` shells
      out to `ktx write` to persist the ORIGINAL tool_call, then returns the
      TRANSFORMED response on stdout — the database always holds the original,
      the agent receives the compressed version.'


      The OpenCode plugin API (https://opencode.ai/docs/plugins/) exposes
      `tool.execute.after(input, output)`. The published type definition
      declares: `tool.execute.after?: (input: {tool: string; sessionID: string;
      callID: string}, output: {title: string; output: string; metadata: any})
      => Promise<void>`. The `Promise<void>` return plus a mutable `output`
      object matches the mutate-in-place convention. The `output.output` field
      is the STRING the agent sees as the tool's result. A mutation-test plugin
      was installed and CONFIRMED (2026-07-01): setting `output.output` to a
      marker string caused the agent to see the marker — mutation propagates to
      the agent context.
