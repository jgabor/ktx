  - summary: "Decision 11 (2026-06-19): Token source = provider-reported. ktx
      extracts M2 fields from the runtime's event stream when present..."
    number: 11
    date: 2026-06-19
    choice: "Token source = provider-reported. ktx extracts M2 fields from the
      runtime's event stream when present and persists them as-is; NULL when
      absent. The wrapper (ktx run opencode run --format json) parses the
      OpenCode event payload; the sidecar (ktx write) accepts whatever the
      caller supplies. ktx does not re-tokenize. Dollar model =
      https://models.dev — the same source OpenCode uses, so prices match what
      the user is billed. Local cache at $XDG_DATA_HOME/ktx/prices.json keyed by
      (provider, model) with input and output USD-per-million-token rates. ktx
      fetches on cache miss; fetch failure is a soft failure (cost not derived,
      stored cost still surfaced, no error). Reconstructability: cost is
      reconstructable when tokens_in, tokens_out, and model are all non-NULL
      against the cached (provider, model) price. The formula is public: cost =
      (tokens_in * in_price + tokens_out * out_price) / 1_000_000 in USD. ktx
      get/list show stored values verbatim — no derivation at read time.
      Auto-populate: ktx auto-fills id (D3 nanoid if absent), session_id
      (auto-create bare session per D9), content_hash (always recomputed from
      stored input+output — ktx owns integrity, not the caller), and timestamp
      (clock if absent). ktx does NOT auto-fill any M2 field — tokens_in/out,
      cost, latency_ms, model, provider come from the runtime (wrapper) or the
      caller (sidecar). NULL is preserved when absent; 0 is preserved when
      explicitly set (the absent-vs-zero distinction survives the round-trip per
      plan task 3 acceptance)."
