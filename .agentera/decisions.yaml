meta:
  name: decisions
  version: 1.0.0
  description: Reasoning trail maintained by resonera. Each deliberation session appends one entry. Decisions are referenced by realisera, optimera, profilera, planera, inspektera, hej, dokumentera, visionera, resonera, and orkestrera for context on why choices were made.
  artifact_type: agent_facing
  path: .agentera/decisions.yaml
  producer: resonera
  consumers:
    - dokumentera
    - hej
    - inspektera
    - optimera
    - orkestrera
    - planera
    - profilera
    - realisera
    - resonera
    - visionera
  format: yaml
decisions:
  - number: 1
    date: "2026-06-15"
    question: How does ktx integrate with agent runtimes, and where is the run recorded?
    context: "ktx is the boring CLI the agent-native developer adopts — a transparent layer in front of or alongside the agent. Research on lowfat, lean-ctx, headroom, tilth, and go-agent showed two integration patterns: wrappers (lowfat, tilth) that execute the agent process, and sidecars (lean-ctx, headroom) that receive events from an already-running agent. The vision also says one Go binary, no library import, no daemon. Hooks were identified as a third adoption path for TUI agents that cannot use the wrapper (interactive processes). For the wrapper, the agent's stdout/stderr must pass through to the caller — ktx cannot clobber it. Research on lowfat and rtk showed both are transparent proxies: output passes through stdout, analytics are out-of-band. The wrapper, sidecar, and hooks each write a per-session run to the same record store; `ktx bench` aggregates those runs into a headline number that proves the cost savings."
    alternatives:
      - name: Wrapper only
        status: rejected
        description: ktx run spawns the agent, captures output, records the run. Simplest but requires non-interactive mode and cannot serve TUI agents.
      - name: Sidecar only
        status: rejected
        description: ktx record receives events from the runtime. More flexible but heavier integration, no simple adoption path.
      - name: Wrapper + write + hooks with transparent proxy output
        status: chosen
        description: Three adoption paths writing to one record store. Wrapper for non-interactive (transparent proxy, run summary to stderr). Write (sidecar) for complex integrations. Hooks for TUI agents (bidirectional transformers, universal protocol stdin/stdout). --quiet suppresses inline run summary. --format json structures it. Run always in store.
    choice: "Wrapper (ktx run) + sidecar (ktx write) + adapters (ktx init), all writing to the same record store. The wrapper is a transparent proxy: agent stdout passes through untouched, one-line per-session run summary to stderr. Hooks are bidirectional transformers with a universal protocol (stdin JSON payload → stdout JSON response). Session identity is file-based: first invocation generates a nanoid and writes it to $XDG_RUNTIME_DIR/ktx/sessions/<ppid>.json with session_id, ppid, and ppid_start_time; subsequent invocations reuse it. Session close is lazy: a file is stale when ppid is dead or ppid_start_time no longer matches (PID reuse); stale file triggers close on next call. --quiet suppresses the inline run summary. --format json emits structured run summary to stderr instead. Run always written to store regardless of display mode. The run is per-session evidence; `ktx bench` aggregates runs into a headline number that proves the cost savings."
    reasoning:
      "The wrapper matches the vision's boring CLI any agent runtime adopts — zero integration work for the developer. Hooks cover the TUI case that wrappers cannot. The sidecar write command handles complex integrations. All three share one record store, so the inspection surface (get, list) is topology-agnostic. Transparent proxy output ensures pipe-safety. The one-line run summary gives immediate feedback without requiring a follow-up ktx get. Hooks are bidirectional transformers with a universal protocol: stdin JSON payload, stdout JSON response. This enables in-flight compression and transformation, aligning with the vision of ktx as a transparent compression layer. Session identity is self-contained: file-based tracking keyed by parent PID at $XDG_RUNTIME_DIR/ktx/sessions/<ppid>.json. Runtime-specific adapters translate native hook models into the universal stdin/stdout protocol (OpenCode: thin TS plugin shells out to `ktx hook` via Bun's `$`, lowfat pattern; Claude Code: direct subprocess via PreToolUse config). Staleness = liveness check + PID-reuse guard (start-time match). The runtime only invokes the hook; ktx manages all state. The run is per-session evidence; `ktx bench` is the headline number. Lowfat-aligned: runs in the record store, headline via bench/stats, no separate artifact noun.

      Design rules (do not relitigate):

      - Three integration paths, three distinct verbs because three distinct operations: wrapper (ktx run) executes the agent and captures output; sidecar (ktx write) receives events from an already-running agent; adapter (ktx init) wires ktx into the agent's runtime.

      - Wrapper output: agent stdout untouched; one-line run summary to stderr; --quiet suppresses the run summary line.

      - Adapter protocol (M4): bidirectional transformers via `ktx hook` command. stdin JSON payload → stdout JSON response. Agent-runtime adapters translate native hook models into this protocol: OpenCode uses a thin TS plugin shelling out via Bun's `$` (lowfat pattern); Claude Code invokes `ktx hook` directly via PreToolUse/PostToolUse config. For M1–M3 (passive recording), adapters call `ktx write` directly — no `ktx hook` command needed until M4 compression requires response transformation. At M4, `ktx hook` shells out to `ktx write` to persist the ORIGINAL tool_call, then returns the TRANSFORMED response on stdout — the database always holds the original (reversibility via `ktx read`), the agent receives the compressed version. `ktx write` remains the single persistence code path (DRY); `ktx hook` owns only the transform layer. Not a hot path (KB payloads, seconds/minutes between calls), so subprocess overhead is negligible. The word 'hook' is overloaded: `ktx init` installs adapters, `ktx hook` is the M4 per-event command, 'hook path' is the conceptual integration mode — each mechanically correct, disambiguated via `--help` cross-references (D2).

      - Session identity propagation: the ktx subprocess invoked by the adapter (`ktx write` for M1, `ktx hook` for M4) is a direct child of the agent process (ppid = agent PID, stable for TUI lifetime). Session file at $XDG_RUNTIME_DIR/ktx/sessions/<ppid>.json stores: session_id (nanoid), ppid, ppid_start_time. Staleness = liveness check (ppid alive?) + PID-reuse guard (ppid start-time matches recorded start-time). Stale → close old session, create new on next call. KTX_SESSION_ID env var noop (D10) prevents double-recording when wrapper and hook are both active.

      - Session lifecycle (open/update/close) is path-specific:
        * Open: first tool_call creates the session row (D7) and writes the session file (hook path only; wrapper manages identity directly via KTX_SESSION_ID; sidecar is caller-provided per D9).
        * Update: each tool_call INSERT triggers UPDATE of roll-up counters/timestamps on the session row (D7).
        * Close — wrapper: immediate, on child process exit (ktx run is the parent, it knows). Hook: lazy, on next call after ppid death (D1 staleness) + future `ktx doctor --fix` or `ktx db --prune` for orphans. Sidecar: caller-driven, `event_type=session_close` payload to ktx write (D9). There is no explicit 'last tool call' event; the last tool_call is simply the last INSERT before close was triggered."
    confidence: firm
    feeds_into: M1 implementation, CLI command surface, hook design, run format
  - number: 2
    date: "2026-06-15"
    question: What shape should the ktx command tree have, including store vs query layers?
    context: ktx is the boring CLI the agent-native developer adopts. Context engineering is the primary capability, and the `compress`/`decompress` verbs are the user-facing entry to it; the bench namespace produces the headline number that proves the cost savings. Agentera uses namespaces (state plan, check validate). Infrastructure CLIs (git, docker, kubectl) use flat verbs. OpenCode uses flat verbs for primary actions (run, serve, stats) and namespaces for managed resources (agent create, auth login, session list). Pi is even flatter — almost everything is top-level verbs with flags. The CLI needs both mechanical record I/O (record a run, read raw JSON) and human-facing queries (formatted run, aggregated lists). Benchmarking is multi-step (run, report, compare) and needs grouping as a separate namespace because it is the headline, not a per-run artifact.
    alternatives:
      - name: Flat verbs only
        status: rejected
        description: Everything flat. ktx run, ktx get, ktx plugin, ktx hook, ktx bench, ktx report, ktx compare. Flags do the work.
      - name: Namespaced only
        status: rejected
        description: Everything namespaced. ktx call run, ktx call get, ktx bench run, ktx store read, ktx store write.
      - name: Hybrid with two-layer store/query separation
        status: chosen
        description: Flat verbs for actions (run, write, read, get, list, compress, decompress). Namespaces for managed resources (plugin add/list/remove, hook install/uninstall/list, bench run/report/compare). Store primitives (read/write) always raw JSON. Query commands (get/list) JSON default with --format text.
    choice: "Hybrid command tree with two layers. Store primitives: ktx read (raw JSON) and ktx write (create from sidecar events), always raw JSON, no --format flag. Query layer: ktx get, ktx list, and ktx bench — all JSON by default with --format text for human-readable output. Flat verbs for primary actions: run, write, read, get, list, compress, decompress — the `compress`/`decompress` pair is the user-facing entry to context engineering. Namespaces for managed resources: plugin (add/list/remove), bench (run/report/compare). Top-level verb `ktx init` for runtime adapter installation (supersedes former `ktx hook` namespace — not all runtimes use hooks; OpenCode uses plugins, Codex would use AGENTS.md injection). Diagnostics: ktx doctor — read-only health check for the store, config resolution, and ID format."
    reasoning:
      "Both OpenCode and Pi validated the hybrid pattern: flat verbs for things you do, namespaces for things you manage. Matches git, docker, kubectl, and gh conventions. The store/query separation is clean: read/write are store primitives (like file I/O) — mechanical, raw, no formatting. get/list are query commands — derived, aggregated, format-aware. Bench is a multi-step workflow that benefits from namespace grouping — the bench produces the headline number that proves the cost savings, not a per-run artifact.

      Design rules (do not relitigate):

      - Two-layer model: store primitives (ktx read, ktx write) vs query commands (ktx get, ktx list). Store is raw record I/O with no --format; query is derived, aggregated, format-aware.

      - Commands are verbs, not nouns. ktx record was rejected (noun/verb ambiguity — humans type it expecting to see a record, not create one) in favor of ktx write.

      - `ktx init` (runtime adapter installation) and `ktx plugin` (compression extension registry) are different operations with different verbs: init is a one-time lifecycle change in the agent's runtime; plugin is a registry CRUD operation. Do not 'unify' them. The former `ktx hook` namespace is superseded by `ktx init` — not all runtimes use hooks (OpenCode uses plugins, Codex would use AGENTS.md injection).

      - --help cross-references near-synonyms and asymmetric pairs so users can discover the right verb without reading the design rationale: `ktx read --help` mentions `ktx get` and vice versa; `ktx plugin --help` mentions `ktx init` and vice versa. Do not assume the user knows the store/query split or the lifecycle/CRUD distinction.

      - Bench uses subcommands (run, report, compare), not flags, because each is a distinct operation that may be invoked independently. Subcommands make the verb explicit; flags would collapse distinct operations under one verb.

      - compress/decompress are the user-facing entry to context engineering. Input is a record ID (`<id>`). Output is a new record; the new record ID is printed to stdout. No flags — all configurability lives in `ktx.toml`. Reversibility is guaranteed (decompress(compress(x)) == x). The memory stage (D5 rule 2) is a pipeline stage; its operational spec (when it runs, what it reads/writes, sync vs async) is implementation detail."
    confidence: firm
    feeds_into: CLI command surface, help text structure, store implementation, query implementation, M3 bench design
    satisfaction:
      state: user_confirmed_satisfied
      evidence: "M1 + M2 ship ktx read/write/get/list/doctor with the documented split:
        ktx read and ktx write are store primitives (raw JSON, no --format); ktx get
        and ktx list are query commands (JSON default, --format text). The hybrid
        flat-verb + namespace pattern is exercised in the M1 and M2 verification
        logs (.agentera/verification/m1-acceptance.md, m2-acceptance.md). ktx bench
        is M3 scope, namespaced per D2 design rule; M3 plan (.agentera/plan.yaml)
        confirms the bench/run/report/compare shape. --help cross-references between
        ktx read and ktx get observed in cmd/ktx help output."
      user_confirmation:
        confirmed_by: Jonathan Gabor
        confirmed_at: "2026-06-19"
  - number: 3
    date: "2026-06-15"
    question: How should ktx address recorded calls?
    context: Every recorded call needs a stable identifier for ktx get, ktx compress, ktx decompress, and ktx list. Options include content hash (git-style SHA prefix), sequential integer, UUID, and timestamp. The identity says infrastructure-shaped and empirical.
    alternatives:
      - name: Content hash prefix
        status: rejected
        description: Git-style SHA prefix (ktx get a3f2b1c). Deterministic, deduplicates identical calls, but ID changes if run is modified.
      - name: Sequential ID
        status: rejected
        description: Auto-incrementing integer (ktx get 42). Simple but requires counter store, does not deduplicate.
      - name: UUID
        status: rejected
        description: Standard UUID (ktx get 550e8400-...). Globally unique but long and not human-memorable.
      - name: 16-char lowercase alpha nanoid
        status: chosen
        description: go-nanoid with a-z alphabet, 16 chars (ktx get abcdefghijklmnop). ~75 bits entropy, collision-safe for billions of records.
    choice: 16-character lowercase alphabetic nanoid using github.com/matoous/go-nanoid with custom alphabet a-z. Content hash stored as a separate run field for verification.
    reasoning: 26^16 gives ~4.36 x 10^22 unique values. At 10 IDs/sec, ~29 billion IDs before 1% collision probability. Lowercase-only matches infrastructure conventions (docker names, git hex, kubectl resources). No ambiguous characters (0/O, 1/l). Short enough to type and read aloud. Content hash remains available as a separate field for verification without being the primary key.
    confidence: firm
    feeds_into: Record store schema, run format, go-nanoid dependency
  - number: 4
    date: "2026-06-15"
    question: What output format and global flags should ktx commands use?
    context: ktx is the boring CLI the agent-native developer adopts. Runs are per-session evidence (tokens-in, tokens-out, dollars, content hash) written for every call; `ktx bench` is a separate command that aggregates runs into the headline number that proves the cost savings. Both are JSON by default — empirical-first, the bench as a derived artifact. Numbers not adjectives. Exit codes as truth. The primary consumer is a program, not a human. Traditional CLIs (git, docker, kubectl) default to human-readable text with --format json for machines. Agentera uses --format text|json|yaml + --fields. OpenCode uses --help, --version, --log-level, --pure. rtk uses -u (ultra-compact), -v (verbose). The identity says boring before clever and infrastructure-shaped.
    alternatives:
      - name: Text default with extended flags
        status: rejected
        description: Text by default, --format json for machines. Add --verbose, --no-color, --config. Traditional but adds complexity.
      - name: JSON default with minimal flags
        status: chosen
        description: "JSON by default, --format text for humans. Five global flags: --format, --quiet/-q, --store, --help/-h, --version/-v."
    choice: "JSON by default for ktx get, ktx list, and ktx bench. --format text for human-readable output. ktx read always returns raw JSON (store primitive, no format flag). Five global flags: --format (text|json, default json), --quiet/-q (suppress stderr run summary), --store path (record store location override; default $XDG_DATA_HOME/ktx/store/), --help/-h, --version/-v."
    reasoning:
      "The empirical-first identity means the primary consumer is a program. JSON default makes ktx pipe-friendly without flags. Humans opt in with --format text. This inverts the traditional convention but matches the product's purpose — ktx is infrastructure, not an interactive tool. Minimal flags cover essential needs: --format for output switch, --quiet for suppressing inline run summaries, --store for CI isolation and testing. No --verbose (diagnostics go through ktx doctor), no --no-color (JSON has no color), no --config (config discovered from project root or XDG paths). The run is per-session evidence; `ktx bench` is a separate command that aggregates runs into the headline number that proves the cost savings.

      Design rules (do not relitigate):

      - Store commands (ktx read, ktx write) always return raw JSON. No --format flag. Mechanical.

      - Default record store lives at $XDG_DATA_HOME/ktx/store/ when --store is not passed. XDG-compliant split: config at $XDG_CONFIG_HOME/ktx/config.toml (D5), data at $XDG_DATA_HOME/ktx/store/. --store path overrides for CI isolation and testing.

      - Query commands (ktx get, ktx list, ktx bench) return JSON by default; --format text for humans.

      - Wrapper (ktx run) passes agent stdout through untouched; one-line run summary to stderr; --quiet suppresses the run summary line.

      - Hooks are bidirectional transformers — stdin JSON payload, stdout JSON response. Run in store via write.

      - Errors: machine-parseable JSON on stderr for agents; --format text for humans. Exit codes are the truth (0=ok, 1=usage, 2=not-found, 3=conflict, 4=internal)."
    confidence: firm
    feeds_into: All command output implementations, flag parsing layer
  - number: 5
    date: "2026-06-15"
    question: How should users extend ktx compression, and what config format should it use?
    context: "ktx is the boring CLI the agent-native developer adopts. Compression is the primary capability, and memory is the technique that makes compression stick across sessions — the TOML pipeline expresses memory as a stage so go-agent can drive async distillation inline with the compression flow. The research showed three extension patterns: lowfat's custom DSL (.lf filter language), headroom's TOML config + learn plugins, lean-ctx's TOML + hooks. The vision says Go stdlib first, no ML deps, no new runtimes, no magic and boring before clever. lowfat defines named macros composed in pipelines. Both TOML and YAML require an external Go dependency. JSON is stdlib but terrible for human-edited config (no comments, verbose)."
    alternatives:
      - name: Go plugin interface
        status: rejected
        description: Compiled Go shared libraries. Type-safe but requires Go toolchain to write plugins.
      - name: Config DSL with named macros (YAML)
        status: rejected
        description: YAML config with declarative rules and named macros for reuse. More common in Go/K8s ecosystem but has parsing footguns.
      - name: TOML config with inline shell macro arrays and content-type routing
        status: chosen
        description: One TOML config file (ktx.toml) with shell macro arrays. Content-type detected from bytes routes to the matching macro pipeline. Inline arrays only, no named macros. External scripts for reuse.
    choice: "Single TOML config file (ktx.toml) using github.com/BurntSushi/toml, at project root or ~/.config/ktx/config.toml. Shell macro arrays with content-type routing: each content type maps to an array of shell commands forming a pipeline. Content type detected from bytes (JSON, logs, code, prose). The pipeline can include memory-aware stages (shell macros calling go-agent for async distillation; content-type routing into a `memory` pipeline). Inline arrays only — no named macros in config. External scripts are the reuse mechanism. No custom DSL."
    reasoning:
      "Shell macros require no DSL to learn. Inline arrays handle simple cases (2-3 pipeline stages). External scripts handle complex cases and serve as the reuse mechanism, keeping the config flat. Content-type routing is automatic (detected from bytes, like headroom's ContentRouter). Matches boring before clever — shell is the most universal extension mechanism. TOML is compact for arrays of shell commands and flat routing tables, supports # comments, and has no YAML boolean parsing footguns. Config-file feel matches the infrastructure-shaped identity (Cargo.toml, pyproject.toml, lowfat.toml). One small dependency justified by the usability gain. Memory is the technique that makes compression stick across sessions; the TOML pipeline expresses it as a stage, with go-agent handling async distillation.

      Design rules (do not relitigate):

      - Plugin (add/remove) and hook (install/uninstall) are different abstractions: plugin is a code module ktx loads (registry operation); hook is a config change in the agent's runtime. Do not unify.

      - Memory is a pipeline stage, not a separate command. The TOML pipeline expresses memory as a stage so go-agent drives async distillation inline with compression."
    confidence: firm
    feeds_into: M5 implementation, config file schema, content-type detection, BurntSushi/toml dependency
  - number: 6
    date: "2026-06-16"
    question: What on-disk format should the record store use?
    context: Decision 4 chose $XDG_DATA_HOME/ktx/store/ as the default record store location but did not define the internal layout. Decision 3 chose 16-character nanoid IDs and a separate content hash field. M1 requires runs with agent identity, input, and output. M3 bench aggregation and ktx list filtering benefit from indexed lookup. Research compared tilth append-only JSONL, lowfat SQLite metrics, lean-ctx SQLite WAL, and one-file-per-run layouts. The user chose SQLite over file-per-run or JSONL for PoC, with the database at a single XDG path rather than a store directory.
    alternatives:
      - name: One JSON file per run
        status: rejected
        description: store/{nanoid}.json — trivial ktx read by path, but weak list/filter and no indexed aggregation for bench.
      - name: Append-only JSONL
        status: rejected
        description: store/runs.jsonl — strong audit stream, but ktx read requires scan or secondary index.
      - name: SQLite database file
        status: chosen
        description: $XDG_DATA_HOME/ktx/ktx.db — indexed lookup by nanoid, natural ktx list filters, bench aggregation. ktx read returns serialized JSON row.
      - name: Directory per run with blob split
        status: rejected
        description: store/{nanoid}/run.json + blobs — overkill for M1; blob policy undefined.
    choice: SQLite database at $XDG_DATA_HOME/ktx/ktx.db. The default record store is a single database file, not a directory tree. --store path overrides the database file path for CI isolation and testing. Parent directory ($XDG_DATA_HOME/ktx/) is created if missing. ktx read returns the stored run as raw JSON (row serialization). This supersedes Decision 4's default store path of $XDG_DATA_HOME/ktx/store/.
    reasoning:
      "SQLite gives indexed lookup by nanoid (Decision 3), efficient ktx list and future bench aggregation (M3), and a single durable artifact under XDG data home. The store/query split from Decision 2 is preserved: ktx read/write remain mechanical I/O; read serializes the stored record as JSON rather than reading a literal file per run. Research from lowfat and lean-ctx validates SQLite for CLI metrics and event stores. Run table schema is a separate decision (TODO: run record schema).

      Design rules (do not relitigate):

      - Default database path: $XDG_DATA_HOME/ktx/ktx.db (XDG data home, not config home).

      - --store overrides the SQLite database file path, not a directory.

      - Supersedes Decision 4 default store directory ($XDG_DATA_HOME/ktx/store/).

      - ktx read/write: mechanical store I/O; read emits raw JSON serialization of the stored run record."
    confidence: firm
    feeds_into: Record store schema, store implementation, M1 implementation, M3 bench design, --store flag semantics, ktx doctor
  - number: 7
    date: "2026-06-16"
    question: What SQLite schema should store sessions, tool calls, and per-call metrics?
    context: 'Decision 6 chose SQLite at $XDG_DATA_HOME/ktx/ktx.db. Decision 3 chose 16-character nanoid IDs and a separate content_hash field. Decision 1 chose three integration paths: wrapper (ktx run), sidecar (ktx write), and hooks (ktx hook install). A single-row runs table does not fit long-lived TUI agent sessions with many tool calls over hours. lowfat uses separate commands and invocations tables for metrics vs ranking; ktx must store per-call evidence and session-level rollups. The user rejected one-table upsert of growing JSON blobs in favor of sessions plus tool_calls. ktx run names the wrapper CLI command only; the stored unit of aggregation is a session, not a "run" row.'
    alternatives:
      - name: Single runs table with upserted JSON blob
        status: rejected
        description: One row per session, append tool calls into a growing JSON column. Simple table count but large rewrites, no indexed per-call access, hidden complexity.
      - name: Append-only event log with query-time roll-up
        status: rejected
        description: One events table; session state derived at read time. Flexible but heavy ktx read/bench logic for PoC.
      - name: Sessions plus append-only tool_calls with session roll-up
        status: chosen
        description: Two tables. Session opens on first tool call and spans until the last. tool_calls rows are append-only evidence and per-call metrics; sessions row holds roll-up counters and bounds.
    choice: "Two-table schema in ktx.db: sessions and tool_calls. A session is the stored aggregate unit: it begins at the first tool call and ends at the last tool call in that engagement. tool_calls rows are append-only (one row per measured tool call) with input, output, content_hash, and per-call metrics. The sessions row is updated incrementally for roll-up counters and timestamps only, not by rewriting call payloads. ktx run is the wrapper CLI command for invoking an agent subprocess; it is not the name of a stored table or row type. Hooks record through the store write path (ktx write); ktx read reads raw stored JSON. Each table row is addressed by nanoid (Decision 3)."
    reasoning:
      "Long TUI sessions produce many tool calls over hours. Append-only tool_calls avoids SQLite row bloat and preserves per-call inspectability for M1 evidence and M2 cost fields. Session roll-up matches Decision 1's per-session evidence and future ktx bench headline without conflating the wrapper command (ktx run) with stored entities. lowfat's split between detailed tracking and lightweight aggregation informs the pattern, but ktx stores full call evidence in tool_calls rather than metrics-only rows. Hooks are silent and use the write/read store path, not the wrapper command.

      Design rules (do not relitigate):

      - Two tables: sessions (aggregate) and tool_calls (append-only evidence + per-call metrics).

      - Session boundary: first tool call creates/opens the session. Close is path-specific, not 'last tool call' — wrapper closes immediately on child process exit; hook closes lazily on next call after ppid death (D1 staleness) + future `ktx doctor --fix`/`ktx db --prune` for orphans; sidecar closes on explicit `event_type=session_close` payload (D9). `ended_at` is set by the close trigger, not by the tool_call itself.

      - ktx run: wrapper CLI command only. Stored entities are sessions and tool_calls.

      - Hooks: record via ktx write (store primitive); inspect via ktx read. Hooks use bidirectional protocol: stdin JSON payload → stdout JSON response (Decision 1).

      - tool_calls: INSERT only. sessions: INSERT on open, UPDATE roll-up counters/timestamps/ended_at on each call and on close.

      - Both sessions.id and tool_calls.id use 16-char lowercase alphabetic nanoid; tool_calls.session_id references sessions.id.

      - content_hash is a separate field on each tool_call row (Decision 3); session-level hash is derived on close if needed."
    confidence: firm
    feeds_into: Record store schema, M1 implementation, M2 cost fields, hook design, ktx write input format, ktx read output shape, session identity for hooks
    satisfaction:
      state: user_confirmed_satisfied
      evidence: "M1 closed with ktx write persisting rows to tool_calls via INSERT-only paths (internal/store/persist.go PersistToolCall), and ktx read / ktx get surfacing those rows without any UPDATE or DELETE codepath. M2 landed additive M2 columns (tokens_in, tokens_out, cost, latency_ms, model, provider) via in-place ALTER TABLE inside store.Open; existing rows untouched, NULL for new columns. Migration is idempotent (column-existence check) and forward-fixes partial sets. M2 verification log (.agentera/verification/m2-acceptance.md) confirms existing rows unchanged after migration. No UPDATE or DELETE statements exist in the project against tool_calls or sessions; the append-only contract is enforced by absence."
      user_confirmation:
        confirmed_by: Jonathan Gabor
        confirmed_at: "2026-06-19"
  - number: 8
    date: "2026-06-16"
    question: What persistence terminology and database path CLI should ktx use?
    context: 'Prose used "record store" and phrasing like "write the record to the store," which read awkwardly. Decision 6 already chose a SQLite file at $XDG_DATA_HOME/ktx/ktx.db. Decision 4 introduced a global --store flag for path override. The user prefers verb-led grammar (persist/write/read the record) and naming the container database when needed—not "record store." CLI override should be explicit via a db namespace rather than a global --store flag.'
    alternatives:
      - name: Keep record store terminology and global --store flag
        status: rejected
        description: Continue compound noun record store and --store on every command tree decision from D4/D6.
      - name: Ledger as container noun
        status: rejected
        description: Accounting-flavored container; strong fit for cost contract but user chose database.
      - name: Database terminology, verb-led grammar, ktx db --path
        status: chosen
        description: Record remains the unit. Database is the SQLite file. Avoid record store. I/O vs query replaces store vs query in prose. Path override via ktx db --path <file>, not global --store.
