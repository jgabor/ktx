- number: 14
  date: '2026-06-24'
  question: What is the default compression pipeline for M4 — built-in behavior when no user config exists, where reversibility
    is captured, and what conservative-on-failure contract governs it?
  context: 'M4 acceptance (ROADMAP.md): ''Compressed outputs are always reversible to the original on demand. Done when: a
    compressed output can be retrieved as the original bytes via the public surface.'' Two source projects were studied at
    the source level. lowfat (Rust, zdk/lowfat) ships 6 known shell commands compressed by default with command-name+subcommand
    lexical classification, enforces NO runtime passthrough-on-failure (it is a plugin-author convention — the research-notes
    claim to the contrary was inaccurate at the source level), and retains originals only as audit artifacts (track SQLite
    table, 20-file tee-on-failure ring) with no restore API. headroom (Python+Rust, chopratejas/headroom) activates its full
    pipeline by default with an ML text compressor (Kompress, 261–601MB ONNX) as the fallback for unmatched content, detects
    content type via Magika (Google''s ML classifier), enforces multi-layer runtime conservative-on-failure (empty-output
    guard, protect_error_outputs, stage-failure passthrough, CCR-storage-failure → non-reversible compression, never no compression),
    and provides first-class reversibility via CCR — a hash-indexed SQLite-backed LRU+TTL store, in-band `hash=…` markers
    in the compressed text, a `headroom_retrieve(hash, query?)` tool (injected function tool or standalone MCP server), and
    BM25 sub-retrieval with structured errors on miss. ktx differs from both structurally: it wraps arbitrary agent tool_call
    OUTPUT (the `output` field in the flat JSON envelope of D9), not shell commands, so lowfat''s command-name classification
    does not apply; and its vision explicitly mandates ''boring before clever — Go stdlib first, no ML deps, no new runtimes,
    no magic,'' ''reversibility before aggression,'' and the tension resolution ''the router wins, the algorithm loses,''
    which rejects headroom''s ML deps (Kompress, Magika) as core dependencies. Critically, D1 (firm, do-not-relitigate) already
    established the reversal primitive for the hook path: ''At M4, `ktx hook` shells out to `ktx write` to persist the ORIGINAL
    tool_call, then returns the TRANSFORMED response on stdout — the database always holds the original (reversibility via
    `ktx read`), the agent receives the compressed version.'' D2 (firm) established `ktx compress`/`ktx decompress` as the
    user-facing explicit verbs with the guarantee `decompress(compress(x)) == x` and ''no flags — all configurability lives
    in ktx.toml.'' D7 (firm) established tool_calls as append-only INSERT-only (originals never deleted). D3 (firm) established
    16-char lowercase alpha nanoid addressability for every row. D5 (firm) committed to TOML config, shell-macro stages, byte-level
    non-ML content-type routing, inline arrays, external scripts as the reuse mechanism, no DSL, no compiled Go plugins. D9
    (firm) specified content_hash is always recomputed from stored input+output (ktx owns integrity). The reversal primitives
    therefore already exist in the architecture; D14''s question is what runs by default when no ktx.toml exists, where the
    compressed artifact lives such that `decompress(compress(x)) == x` holds, how the runner behaves when a stage fails or
    produces degenerate output, what shape the pipeline takes for v1, and what the v1 aggressiveness model and extension story
    are. The sub-questions (default behavior, content-type detection, reversibility layer, failure contract, pipeline shape,
    aggressiveness, plugin model, ML deps) are resolved together because they are mutually constraining: the default-behavior
    choice determines whether content-type detection is needed for M4, which determines whether a router ships, which determines
    the pipeline shape, which shapes the failure contract.'
  alternatives:
  - name: Passthrough default (compress nothing by default without configuration)
    status: chosen
    description: 'With no ktx.toml present, the default pipeline is passthrough: `ktx compress <id>` produces a new compressed
      record whose output equals the source''s output, referencing the source by id. Built-in Go stages exist (strip-ansi,
      dedup-blank, head, truncate, normalize) but are OFF unless configured in ktx.toml. The M4 acceptance test configures
      at least one stage to prove compress(input) ≠ input AND `ktx decompress <compressed-id>` returns the exact original
      bytes. headroom''s opt-out posture (compress aggressively by default) and lowfat''s opt-in 6-commands posture both rejected:
      headroom violates ''reversibility before aggression'' (aggression before reversal is proven in production) and requires
      ML fallback; lowfat''s command-name model does not apply to tool_call output.'
    win_condition: 'M4 acceptance: a configured-stage compressed output is retrievable as the exact original bytes via `ktx
      decompress <compressed-id>`; no-config invocation is passthrough.'
  - name: Always-on lossless-ish builtins (strip-ansi, dedup-blank, normalize)
    status: rejected
    description: 'Ship a small set of ''safe'' stages always on. Rejected on three grounds: (1) these stages are lossy, not
      lossless — strip-ansi removes ANSI escape sequences, dedup-blank removes blank lines, normalize collapses whitespace;
      the information loss may be acceptable to the agent but the transform is not mathematically invertible, which complicates
      the M4 reversal test and requires the full source-reference machinery for what is presented as a ''safe default''; (2)
      ''reversibility before aggression'' is explicit — aggression is gated on a proven reversal contract, and shipping always-on
      transforms with no config reverses that ordering; (3) a behavior change with no configuration violates ''invisible until
      needed.'' If these stages are valuable, users opt in via ktx.toml (D5).'
    win_condition: Would be chosen if the vision licensed any default aggression before reversal is proven, or if a truly
      invertible default transform existed.
  - name: Full pipeline active by default (headroom model)
    status: rejected
    description: 'Compress aggressively out-of-box unless opted out, with ML fallback for unmatched content. Rejected: conflicts
      with ''reversibility before aggression,'' ships aggression before the reversal contract is exercised in production,
      and requires content-type detection + ML fallback (Kompress, Magika) that violate ''no ML deps, no new runtimes, no
      magic.'''
    win_condition: Would be chosen only if the vision permitted ML deps and treated compression ratio as the M4 contract instead
      of reversal.
  - name: Database-as-reversibility-store (source reference, no separate CCR)
    status: chosen_sub
    description: 'The tool_calls table already holds the original output (D7 append-only INSERT-only, D9 content_hash recomputed
      from stored input+output), originals are never deleted, and every row is nanoid-addressable (D3). Compressed artifacts
      are rows in a new `compressed` table — not polluting the tool_calls evidence table, which would corrupt M3 bench cost
      aggregation by injecting zero-cost non-measured rows into the cost-summed evidence set. The `compressed` table carries
      at minimum: id (D3 nanoid), source_id (references tool_calls.id), output (the compressed bytes), content_hash (recomputed
      from the compressed output, D9 integrity rule), pipeline (a record of what stages ran, e.g., a JSON array or a hash
      of the ktx.toml profile), timestamp. `ktx decompress <compressed-id>` reads the compressed row, resolves source_id,
      and returns the source''s original output bytes verbatim. No separate hash store, no in-band `hash=…` markers in the
      compressed text, no dedicated retrieve tool, no BM25 sub-retrieval. This is a direct, mechanical consequence of three
      firm decisions already in force: D1 (''the database always holds the original — reversibility via ktx read''), D7 (append-only
      originals never deleted), D3 (nanoid addressability).'
    win_condition: M4 acceptance via `ktx decompress <id>` returning the exact original bytes; both hook-path (in-flight)
      and explicit-verb (`ktx compress`) reversal share the same mechanism.
  - name: CCR-style hash store with in-band markers and retrieve tool (headroom)
    status: rejected
    description: 'Separate SQLite-backed LRU+TTL store, hash marker in compressed text, dedicated `headroom_retrieve(hash,
      query?)` tool, BM25 sub-retrieval, structured error on miss. Rejected on four grounds: (1) duplicates the database ktx
      already has (violates DRY — the originals are already in tool_calls per D7); (2) in-band `hash=…` markers are magic
      the vision rejects (''no magic'') and the reversal surface D2 chose is `ktx decompress <id>`, not marker-parsing; (3)
      it solves a problem ktx does not have — headroom''s LLM retrieves compressed content mid-conversation via a function
      tool because headroom compresses in-flight and the LLM sees the marker; ktx''s agent or developer calls `ktx decompress
      <compressed-id>` out-of-band by id; (4) LRU+TTL eviction introduces miss-semantics and non-retrieval failure modes that
      contradict M4''s ''always reversible'' acceptance. In-band marker-based retrieval may be revisited as a post-M4 open
      deliberation if and only if a concrete agent-mid-conversation retrieval use case emerges that the out-of-band `ktx decompress`
      surface cannot serve.'
    win_condition: Would be chosen if originals were not already durably persisted in the database (they are, per D7), or
      if the agent needed to retrieve compressed content mid-conversation without an out-of-band CLI call.
  - name: Inline mathematically-invertible transforms only
    status: rejected
    description: 'Restrict compress stages to transforms whose inverse reconstructs the original (dictionary substitution,
      run-length encoding, etc.). Rejected: the most useful compression stages for agent tool output — strip-ansi, head, truncate,
      summarize, dedup-blank — are lossy, not invertible; restricting to invertible transforms cripples the pipeline and forfeits
      the value of compression. Reversal via retained originals (the chosen model) is strictly more general: any stage, lossy
      or lossless, is reversible because the original is in the database. headroom and lowfat both retain originals rather
      than restrict to invertible transforms, validating this.'
    win_condition: Would be chosen only if ktx refused to retain originals and demanded mathematical invertibility instead.
  - name: Runtime-enforced multi-layer conservative-on-failure contract
    status: chosen_sub
    description: 'The pipeline runner enforces three invariants on every invocation, as runtime guarantees (not stage-author
      conventions, explicitly rejecting the lowfat failure mode): (1) empty-output guard — if a stage produces empty output
      from non-empty input, the stage''s output is discarded and the stage''s input passes through unchanged (headroom''s
      ''compression must NEVER blank out non-empty input,'' enforced by the runner); (2) stage-execution-error passthrough
      — if a stage returns an error (panic recovered, non-zero exit for external shell-macro stages, timeout), the input to
      that stage passes through unchanged and the pipeline continues to the next stage (or halts and returns original if the
      stage was terminal — halting-vs-continuing is an M4 implementation detail); (3) unknown-stage skipped — an unrecognized
      stage name is skipped with a stderr warning, not a fatal error. These hold for built-in Go stages and external shell-macro
      stages alike. The word ''contract'' in TODO.md:28 is honored: runtime-enforced, not convention.'
    win_condition: A buggy or malicious stage cannot blank out non-empty input; a failing stage never substitutes guessed
      content; the runner never silently drops to no-compression without the original being recoverable (originals are always
      in the database regardless of stage behavior).
  - name: Plugin-author passthrough-on-failure convention (lowfat)
    status: rejected
    description: 'Stages opt into passthrough-on-failure via their own logic; the runner does not enforce it. Rejected: TODO.md:28
      explicitly names this a ''contract,'' which implies runtime enforcement; a convention permits a buggy or malicious stage
      to compress a failed-command''s output or blank out non-empty input. The lowfat source-level finding — that passthrough-on-failure
      is a plugin-author convention, not a runtime guarantee — is exactly the failure mode ktx refuses.'
    win_condition: Would be chosen only if every stage author were trusted and the contract were downgraded from 'contract'
      to 'guideline.'
  - name: Source-tool-failure protection (headroom's protect_error_outputs)
    status: deferred
    description: 'Skip compression entirely when the source tool_call indicates failure — non-zero exit, traceback in output,
      explicit error field. Deferred for M4 with a documented gap: D9''s flat JSON payload lacks a failure signal (no exit_code
      or is_error field on the tool_call; tool_call failure semantics are runtime-specific and not normalized in D9). Adding
      such a signal is a separate D9-extension deliberation, not part of D14. M4''s contract covers compression-STAGE failures
      (the runner''s behavior when a stage fails or produces degenerate output), not source-TOOL failures (the decision of
      whether to attempt compression at all on a failed tool''s output). The two are distinct concerns and should not be conflated.
      A traceback-pattern heuristic would be content-type detection (sub-question 2), which is itself deferred.'
    win_condition: M4 ship without source-tool-failure protection; the gap is documented and a D9-extension resonera (exit_code
      / is_error field) is the prerequisite for closing it post-M4.
  - name: Linear ordered stages with content-type profile selection (hybrid-linear)
    status: chosen_sub
    description: 'The pipeline is a linear sequence of ordered stages executed by a single runner. Content-type routing (per
      D5, firm: ''Content-type detected from bytes'') selects which linear profile applies — routing is profile selection
      among linear pipelines, NOT a strategy-object-per-type dispatch. For M4 the single ''default'' profile is passthrough
      (zero stages); the router is dormant (no content-type detection ships, no profiles to select among). For M5, ktx.toml
      defines per-content-type linear profiles (e.g., `[pipeline.json]`, `[pipeline.logs]`, `[pipeline.code]`), each an ordered
      array of shell-macro or built-in stages; the router selects the profile by content type, then the runner executes it
      linearly. Built-in Go stages and external shell-macro stages (D5) share the same runner contract: input bytes in, output
      bytes out, error-or-nil. This is ''boring before clever'': the simplest shape that satisfies D5''s routing commitment
      without a strategy object per type. headroom''s strategy-dispatch shape is premature for v1 (no type-specific compressors
      to dispatch to yet) and rejected.'
    win_condition: M4 pipeline executes zero or more stages in order under the runner's failure contract; M5 ktx.toml defines
      per-content-type linear profiles; the router selects, the runner executes.
  - name: Router → per-type compressor (headroom strategy dispatch)
    status: rejected
    description: 'Each content type dispatches to a distinct compressor object with its own internal logic. Rejected for v1:
      premature until multiple type-specific compressors exist (M4 ships none); more complex than linear profile selection;
      ''boring before clever'' favors the simpler shape. The chosen profile-selection model achieves the same dispatch (content
      type → which stages run) without a strategy object per type. Re-evaluate post-M5 if type-specific compressors with non-linear
      internal flow prove necessary.'
    win_condition: Would be chosen if type-specific compressors required fundamentally non-linear internal flow that a linear
      profile could not express.
  - name: No aggressiveness model for M4
    status: chosen_sub
    description: 'No tiers, no continuous knobs (bias, target_ratio), no adaptive pressure scaling. Configured stages run
      at their natural behavior: a `head 100` stage heads 100 lines, a shell macro does what it does. Aggressiveness is a
      post-reversal concern — ''reversibility before aggression'' means reversal is proven (M4) before ratio tuning (post-M4).
      The existing open item (TODO.md:47, ARCHITECTURE.md ''Aggressiveness tiers'') remains open and is explicitly not closed
      by D14. M4 acceptance requires only that a compressed output is retrievable as the original, not that compression achieves
      any particular ratio.'
    win_condition: M4 acceptance does not require aggressiveness control; the reversal contract holds at any aggressiveness
      level, so aggressiveness is orthogonal to M4.
  - name: lite/full/ultra global enum (lowfat)
    status: rejected
    description: 'Single global aggressiveness level threaded into every stage as a value that scales head limits, token budgets,
      etc. Rejected for M4: no stages are on by default (sub-question 1), so the level has nothing to scale; premature. May
      be revisited post-M4 when stages ship and a ratio-tuning surface is warranted.'
    win_condition: Would be chosen for M4 only if default stages shipped and needed a global scale.
  - name: Continuous knobs + adaptive pressure (headroom)
    status: rejected
    description: 'Float bias (default 1.0), target_ratio, adaptive min_ratio (0.85 relaxed → 0.65 aggressive by context pressure),
      per-auth-mode policies. Rejected for M4: requires context-pressure instrumentation ktx does not have; ''boring before
      clever'' rejects the complexity for v1; adaptive pressure is a research-grade feature that presupposes a working compression
      pipeline M4 does not yet have. Premature by two milestones.'
    win_condition: Would be chosen only post-M5 after a baseline pipeline ships and ratio-tuning becomes a measured need rather
      than a speculation.
  - name: Defer plugin registry semantics to a separate deliberation
    status: chosen_sub
    description: 'D14 does NOT define the `ktx plugin add/list/remove` registry semantics (D2 namespace). D5 (firm) already
      committed the extension CONFIG model: ktx.toml with shell-macro arrays, byte-level content-type routing, inline arrays,
      external scripts as the reuse mechanism, no DSL, no compiled Go plugins. The v1 extension story for M5 is ktx.toml per
      D5; the `ktx plugin` registry (what `add` registers, whether it is a named external script with metadata or just a ktx.toml
      entry, how it is discovered) is a separate open deliberation (TODO.md:30 remains open) and is not an M4 blocker — M4
      ships with passthrough default and no plugin registry. D14''s scope is the default pipeline + reversal + failure contract;
      conflating the plugin model would violate the ''one decision per question'' discipline of the decisions.yaml trail.'
    win_condition: M4 ships with no plugin registry; M5 extension is via ktx.toml (D5); TODO.md:30 remains open and is a prerequisite
      for M5's `ktx plugin` namespace.
  - name: Define plugin model in D14
    status: rejected
    description: 'Resolve `ktx plugin` registry semantics here. Rejected: scope creep — D14''s question is the default pipeline
      + reversal + failure contract, and the plugin model deserves its own deliberation (likely D15) with its own research
      (D5 said ''plugin is a code module ktx loads (registry operation)'' but did not define the registry mechanics). Not
      an M4 blocker (M5 scope).'
    win_condition: Would be chosen only if M4 acceptance required a working plugin registry (it does not; M4 is reversal-only).
  - name: Hard no for ktx core; ML only behind the router as a user-configured external stage
    status: chosen_sub
    description: 'ktx''s Go binary has ZERO ML dependencies — no ONNX runtime, no Magika, no embedded model weights, no model-download
      subsystem. This is the strict reading of the vision''s ''no ML deps, no new runtimes, no magic'' and is consistent with
      D5 (shell macros as the extension mechanism). headroom''s Kompress (261–601MB ONNX) and Magika are rejected as core
      deps. ML compressors (Kompress, Magika, future ML models) may appear ONLY as user-configured external stages invoked
      via shell macros (D5) — ktx dispatches to them via subprocess, never ships them. The vision''s tension resolution (''the
      router wins, the algorithm loses'') is the governing principle: ktx will never be the best compressor; it will be the
      best at dispatching to compressors the user chooses, including ML ones. The ''no ML deps'' rule is absolute for ktx''s
      CORE; the escape hatch is the router (user-configured external stage), not a conditional clause inside ktx.'
    win_condition: M4 ships with no ML deps; future ML compression is achievable via user-configured external stages without
      a resonera to relax the core prohibition.
  - name: Conditional ML escape (relax 'no ML deps' if a future resonera proves no stdlib approach achieves acceptable ratios)
    status: rejected
    description: 'Permit ML deps in ktx''s core if a future resonera proves no stdlib approach achieves acceptable compression
      ratios. Rejected: the vision is explicit and not framed as provisional (''no ML deps, no new runtimes, no magic'');
      a conditional clause weakens the rule and invites relitigation on every ratio benchmark. The router escape (user-configured
      external ML stage) already provides the path for ML compression WITHOUT weakening the core rule. A future resonera may
      revisit ONLY if the user explicitly requests it, but D14 treats the rule as firm-per-vision.'
    win_condition: Would be chosen only if the user explicitly revisited the vision's 'no ML deps' clause.
  - name: Content-type detection deferred for M4; reaffirmed as stdlib-byte-level for M5 (per D5)
    status: chosen_sub
    description: 'M4 ships WITHOUT content-type detection: the default pipeline is passthrough (sub-question 1), so there
      is nothing to route. Byte-level content-type detection (JSON parse success; diff markers `+`/`-`/`@@`; log patterns;
      code-fence ``` detection) is a prerequisite for M5 configured pipelines that route by content type, and D5 (firm) already
      committed it as ''detected from bytes'' and ''like headroom''s ContentRouter'' — but WITHOUT ML (no Magika). The existing
      open item (TODO.md:29, ARCHITECTURE.md ''Content-type detection heuristics — JSON vs logs vs code vs prose from bytes;
      ambiguity fallback order'') remains open and is explicitly not closed by D14; D14 only scopes it as post-M4. ktx''s
      internal/parser package classifies OpenCode EVENT types (tool_use vs session_finish vs error), not content types of
      the output bytes; extending it to content-type classification is an M5 implementation task, not an M4 one. An explicit
      content-type field on the D9 payload (caller declares the type) is a possible future D9 extension but is NOT required
      — D5 committed to byte-level detection, and payload-declared types would dual-source the truth (caller-declared vs byte-detected),
      risking drift.'
    win_condition: M4 acceptance does not require content-type detection; M5 ships byte-level stdlib heuristics per D5; TODO.md:29
      remains open as an M5 prerequisite.
  - name: Byte-level ML detection (Magika)
    status: rejected
    description: 'Detect content type via Magika (Google''s ML content-type classifier, Rust native) as headroom does. Rejected:
      Magika is an ML dependency, violating ''no ML deps.'' Also overkill for v1: stdlib byte heuristics (JSON parse, diff-marker,
      code-fence, log-pattern) cover the common cases with no deps and predictable behavior.'
    win_condition: Would be chosen only if the vision permitted ML deps AND stdlib heuristics proved insufficient for M5's
      content-type routing needs.
  - name: Explicit content-type field on the D9 payload (caller declares)
    status: rejected
    description: 'Add a `content_type` field to the flat JSON tool_call payload; the caller (agent runtime or sidecar) declares
      the type. Rejected as the PRIMARY mechanism: it dual-sources truth (caller-declared vs byte-detected), the caller may
      not know or may lie, and D5 already committed to byte-level detection. MAY be accepted as a HINT field in a future D9
      extension (byte-detection wins on conflict), but D14 does not extend D9.'
    win_condition: Would be chosen if D5 had not already committed to byte-level detection, or if caller-declared types proved
      empirically more accurate than byte heuristics in M5.
  choice: 'M4 default compression pipeline = passthrough when no ktx.toml is present: `ktx compress <id>` produces a new row
    in a new `compressed` table whose output equals the source''s output and whose source_id references the original tool_calls.id;
    `ktx decompress <compressed-id>` resolves source_id and returns the source''s original output bytes verbatim — this is
    the public-surface reversal that satisfies M4 acceptance. Built-in Go stages (strip-ansi, dedup-blank, head, truncate,
    normalize) exist but are OFF unless configured in ktx.toml (D5). The reversibility layer IS the database: the tool_calls
    table holds append-only originals (D7, D9 content_hash for integrity), never deletes them, and is nanoid-addressable (D3);
    compressed artifacts live in a separate `compressed` table (not polluting tool_calls evidence, which M3 bench cost-aggregates)
