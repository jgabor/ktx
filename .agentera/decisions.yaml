  - number: 13
    date: "2026-06-22"
    question: "How should ktx benchmark itself accurately, automatically, and reliably — the execution harness and comparison layer above D12's scoring contract?"
    context: "D12 settled the v1 scoring methodology (exact-match, single-trial, cost_per_correct) and M3 implemented ktx bench run/report, proving the mechanics with a synthetic fixture (fake opencode binary + deterministic JSONL). But D12 and M3 did not address the execution layer: running real agents on real tasks, automating that in CI, and proving ktx's cost-reduction value claim. External research: headroom uses pytest-benchmark for micro-benchmarks plus scenario-based cost benchmarks with quality preservation tests (needles/errors must survive compression); lowfat uses Rust criterion for pure function-level benchmarks (strip-ansi, truncate, token-budget); rtk uses a Multipass VM with 11-phase integration tests including token-savings comparison (raw vs rtk-wrapped) and hyperfine latency measurement. openeval (the author's own project at ~/git/openeval) is a full harness for CLI coding agents with scenario management, pass@k, cost-per-passed-task, variation comparison, OTLP telemetry, and Docker isolation. The vision mandates 'cost is the contract' and 'boring before clever'. M4 (compression pipeline) is not yet built — ktx today only measures cost, does not reduce it. The open ARCHITECTURE.md item 'How per-layer savings roll into session and benchmark headline numbers without double-counting' is related but not directly resolved by this decision."
    alternatives:
    - name: Build ktx-native harness independently of openeval
      status: rejected
      description: Full control, no cross-project dependency. Duplicates scenario management, agent execution, and comparison infrastructure that openeval already provides. Violates DRY across projects.
      win_condition: Would be chosen if openeval did not exist or if ktx's benchmark needs were fundamentally incompatible with openeval's scenario model.
    - name: Two-tier model with ktx-native replay and openeval harness
      status: chosen
      description: Clean separation, no duplication, leverages openeval's existing infrastructure. ktx is unaware of openeval; openeval sees ktx as a wrapper command. Requires openeval to support per-variation agent command overrides (may need feature request). Two cost measurement systems (ktx D11 models.dev vs openeval config-based pricing) — both use provider-reported tokens, so numbers should match. Two tiers to maintain.
      win_condition: openeval can invoke `ktx run opencode` as the treatment variation's agent command, and the ktx-native replay benchmark correctly reproduces parser/cost numbers from a recorded session.
    - name: Single tier only (ktx-native or openeval, not both)
      status: rejected
      description: Simpler to maintain. Loses either the quick development feedback loop (ktx-native only) or the comprehensive published proof (openeval only).
