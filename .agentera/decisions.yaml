e routing (D5, byte-level, no ML) selects which linear profile applies but is dormant for M4 (no content-type detection ships, single passthrough default profile). No aggressiveness model for M4 — no tiers, no knobs, no adaptive pressure; configured stages run at their natural behavior. Plugin registry semantics (`ktx plugin add/list/remove`) are deferred to a separate deliberation (TODO.md:30 open); D5's ktx.toml shell-macro model is the M5 extension story. ML deps are a hard no for ktx's core (no ONNX, no Magika, no model weights, no download subsystem); ML compressors appear only as user-configured external stages behind the router, per the vision's 'the router wins, the algorithm loses.'"
    reasoning: "D14 is governed by four vision principles already in force, and the choices fall out of applying them to the research rather than from any novel insight. (1) 'Reversibility before aggression' sets the ordering: M4 proves the reversal contract FIRST with a do-nothing default pipeline, then compression stages arrive (M5, configured). Shipping always-on transforms — even 'safe' ones like strip-ansi — before the reversal contract is exercised in production would invert that ordering, and the transforms are lossy anyway (strip-ansi removes ANSI codes irreversibly), so the 'lossless builtins' middle ground is a category error. (2) 'Boring before clever — Go stdlib first, no ML deps, no new runtimes, no magic' rejects headroom's Kompress (261–601MB ONNX) and Magika as core deps and favors a linear pipeline over a strategy-dispatch router for v1. (3) 'The router wins, the algorithm loses' is the ML escape hatch: ML compression lives behind the router as a user-configured external stage (D5 shell macro), never inside the binary — no conditional clause needed, no future resonera required to add ML compression, only to add it INSIDE the core (which is the firm prohibition). (4) D1's already-firm rule — 'the database always holds the original, reversibility via ktx read' — makes the reversibility layer almost tautological: ktx already has an append-only, nanoid-addressable, never-deleted store of originals (tool_calls, D7+D3+D9). headroom's CCR exists because headroom compresses in-flight and needs the LLM to retrieve compressed content mid-conversation via an in-band marker; ktx's reversal is out-of-band by id (`ktx decompress <id>`), so the marker protocol, the retrieve tool, the BM25 sub-retrieval, and the LRU+TTL store are all solutions to a problem ktx does not have. The `compressed` table is the minimal addition: a compressed artifact is not a tool_call (it has no provider tokens, no real cost, no agent invocation — storing it in tool_calls would corrupt M3 bench cost aggregation by injecting zero-cost non-evidence rows into the cost-summed set), so a separate table with a source_id reference is the DRY-respecting, evidence-preserving choice. The conservative-on-failure contract being runtime-enforced rather than convention is a direct reading of TODO.md:28's word 'contract' and a direct rejection of lowfat's source-level failure mode (passthrough-on-failure is a plugin-author convention in lowfat, not a runtime guarantee — a buggy or malicious plugin CAN compress failed-command output). headroom's multi-layer runtime enforcement (empty-output guard, protect_error_outputs, stage-failure passthrough) is the right model; D14 adopts the layers that do not require a D9 schema change (empty-output guard, stage-error passthrough, unknown-stage skip) and defers the one that does (protect_error_outputs) to a D9-extension resonera that adds exit_code / is_error. The deferrals (content-type detection, aggressiveness, plugin registry) are not evasions — each is scoped to its existing open deliberation (TODO.md:29, TODO.md:47, TODO.md:30) and is a prerequisite for M5, not M4. M4's acceptance ('a compressed output can be retrieved as the original bytes via the public surface') is satisfiable with a passthrough pipeline and one configured stage proving compress ≠ original AND decompress == original; nothing more is needed, and shipping more would violate 'reversibility before aggression.'\n\nDesign rules (do not relitigate):\n\n- Default pipeline (no ktx.toml) = passthrough (identity). `ktx compress <id>` with no config produces a new compressed record whose output equals the source's output. Built-in stages (strip-ansi, dedup-blank, head, truncate, normalize) exist but are OFF unless configured. Always-on builtins and full-pipeline-by-default are both rejected.\n\n- Reversibility layer = the database. The tool_calls table holds append-only originals (D7, D9 content_hash for integrity, D3 nanoid addressability); originals are never deleted. Compressed artifacts live in a separate `compressed` table (NOT in tool_calls, which M3 bench cost-aggregates) with a source_id reference to tool_calls.id. `ktx decompress <compressed-id>` resolves source_id and returns the source's original output bytes verbatim. No separate CCR hash store, no in-band `hash=…` markers, no retrieve tool, no BM25 sub-retrieval. Both the hook path (D1: `ktx hook` writes original via `ktx write`, returns compressed to agent) and the explicit-verb path (`ktx compress`/`ktx decompress`) share this mechanism. Exact `compressed` table schema (column names, whether pipeline-config is a JSON blob or a hash, indices) is an M4 implementation detail; the firm rule is source_id reference + separate table + no in-band markers.\n\n- Conservative-on-failure contract = runtime-enforced by the pipeline runner, NOT a stage-author convention (lowfat's failure mode is rejected). Three invariants: (1) empty-output guard — a stage producing empty output from non-empty input is discarded, input passes through; (2) stage-execution-error passthrough — a stage that errors (panic recovered, non-zero exit for external, timeout) passes its input through unchanged; (3) unknown-stage skipped with stderr warning. Holds for built-in Go stages and external shell-macro stages alike.\n\n- Source-tool-failure protection (headroom's protect_error_outputs) is DEFERRED, not rejected. D9's payload lacks a failure signal (no exit_code / is_error field); adding one is a separate D9-extension resonera, prerequisite for closing this gap post-M4. M4's contract covers compression-stage failures, not source-tool failures.\n\n- Pipeline shape = linear ordered stages. Content-type routing (D5, byte-level, no ML) selects which linear profile applies (profile selection, not strategy-object-per-type dispatch). For M4 the single default profile is passthrough; the router is dormant (no content-type detection ships). For M5, ktx.toml defines per-content-type linear profiles; the router selects, the runner executes linearly. Built-in Go stages and external shell-macro stages (D5) share the same runner contract (bytes in, bytes out, error-or-nil).\n\n- No aggressiveness model for M4: no tiers (lite/full/ultra), no continuous knobs (bias, target_ratio), no adaptive pressure. Configured stages run at their natural behavior. The open item (TODO.md:47, ARCHITECTURE.md 'Aggressiveness tiers') REMAINS OPEN — D14 does not close it, only scopes it as post-M4.\n\n- ML deps = hard no for ktx's core (Go binary). No ONNX, no Magika, no embedded weights, no model-download subsystem. ML compressors appear ONLY as user-configured external stages (D5 shell macros) behind the router. The vision's 'the router wins, the algorithm loses' is the escape hatch; no conditional clause inside ktx's core is permitted. A future resonera may revisit ONLY if the user explicitly requests it.\n\n- Content-type detection is DEFERRED for M4 (passthrough default needs no routing) and reaffirmed as stdlib byte-level (no ML / no Magika) for M5 per D5. The open item (TODO.md:29, ARCHITECTURE.md 'Content-type detection heuristics') REMAINS OPEN as an M5 prerequisite. An explicit content-type field on the D9 payload (caller declares) is a possible future D9 hint-extension but is NOT the primary mechanism — D5 committed to byte-level detection, and dual-sourcing risks drift.\n\n- Plugin registry semantics (`ktx plugin add/list/remove`) are DEFERRED to a separate deliberation. D5 (firm) is the v1 extension story: ktx.toml with shell-macro arrays. TODO.md:30 REMAINS OPEN as an M5 prerequisite; D14 does not close it.\n\n- `compressed` table is NOT in tool_calls. tool_calls is measured-tool-invocation evidence with per-call metrics (D7, D11); a compressed artifact has no provider tokens, no real cost, no agent invocation. Storing it in tool_calls would corrupt M3 bench cost aggregation (injecting zero-cost non-evidence rows into the cost-summed set). Separate table, source_id reference."
    confidence: firm
    feeds_into: "M4 implementation (ktx compress, ktx decompress, compressed table schema, pipeline runner with conservative-on-failure invariants, hook-path transform in ktx hook), M5 ktx.toml pipeline config, post-M4 D9-extension resonera (exit_code / is_error field for source-tool-failure protection), post-M5 content-type detection deliberation (TODO.md:29), post-M4 aggressiveness deliberation (TODO.md:47), M5 plugin registry deliberation (TODO.md:30), ARCHITECTURE.md Pipeline-and-compression and Reversibility-layer Decided sections"

  - number: 15
    date: "2026-06-26"
    question: "D9 failure-signal extension — what fields capture tool-call failure on the flat JSON payload, how does the pipeline runner gate compression on source-tool failure, and how does each runtime map its failure signal into the payload?"
    context: "D14 (firm) deferred source-tool-failure protection: 'D9's flat JSON payload lacks a failure signal (no exit_code or is_error field); adding such a signal is a separate D9-extension resonera.' D14 explicitly names the fields 'exit_code / is_error' and keeps source-tool-failure protection distinct from its three compression-STAGE failure invariants (empty-output guard, stage-error passthrough, unknown-stage skip). TODO.md:29 and ARCHITECTURE.md open item #244 both require this deliberation before implementation. D9 (firm) owns the flat JSON tool_call payload shape: required fields (id, session_id, tool, input, output, content_hash, timestamp) and optional M2 fields (tokens_in, tokens_out, cost, latency_ms, model, provider). The existing ToolCall struct (internal/db/record.go) uses nullable pointer fields (*int64/*float64/*string) for optional M2 fields to preserve the absent-vs-zero distinction through JSON+SQL round-trips; the JSON tags deliberately omit omitempty so absent surfaces as JSON null. The parser (internal/parser/parser.go) is the single source of truth for the tool_call shape: OpenCode tool_use events nest under part.state; part.state.metadata carries tool-specific output including an 'exit' field for bash-style tools. The flat fallback reads defensively from the top level. Both the wrapper (run.go) and the future hook path use ParseEvent. The pipeline runner (internal/pipeline/pipeline.go) enforces D14's three invariants; compressLogic (internal/cli/compress.go) calls runner.Run([]byte(source.Output)) after fetching the source. Reversibility: tool_calls holds append-only originals (D7/D9/D3); compressed artifacts live in a separate 'compressed' table with a source_id reference; ktx decompress <id> returns the source's original output verbatim. The schema migration pattern (internal/db/open.go) is idempotent ALTER TABLE ADD COLUMN via PRAGMA table_info checks — the same pattern used for M2, bench_runs, and compressed columns."
    alternatives:
      - name: Dual nullable fields (exit_code + is_error) with pre-pipeline identity-row gate and runtime-specific mapping
        status: chosen
        description: "Three sub-decisions, one comprehensive choice. (1) Field shape: add ExitCode *int64 (diagnostic) and IsError *bool (canonical gating signal) to the ToolCall struct, both nullable pointers with no omitempty — nil = absent = no failure signal = treated as success; &false = explicitly successful; &true = failed; &0 = explicitly exited zero; &nonzero = exit-code-based failure. is_error is canonical: the pipeline runner checks is_error only; exit_code is never used for gating. The two fields are independent: a tool that throws (no exit code) can set is_error=&true with exit_code=nil; a bash tool sets exit_code=&N and is_error=&(N!=0) at parse time. (2) Gating semantics: when is_error is true, compressLogic writes an IDENTITY compressed row (output == source.output, pipeline JSON == '[]', stderr warning 'ktx: warning: source tool_call indicates failure, compression skipped') and prints the compressed id (stable surface). This is a PRE-PIPELINE GATE — distinct from D14's three IN-PIPELINE invariants (empty-output guard, stage-error passthrough, unknown-stage skip). The gate checks is_error before runner.Run is called; the invariants govern stage behavior during execution. The two concerns are not conflated: the gate decides WHETHER to attempt compression; the invariants decide what happens WHEN a stage fails. (3) Runtime mapping: OpenCode (concrete) — exit_code from part.state.metadata.exit (int64); is_error derived at parse time (exit_code != 0 when present, nil when absent). Flat-fallback (defensive) — exit_code from top-level exit_code/exit/code; is_error from top-level is_error/error; derive is_error from exit_code when is_error absent but exit_code present. Sidecar (ktx write) — caller sets exit_code/is_error directly in the JSON payload; ktx persists as-is. Schema migration: idempotent ALTER TABLE ADD COLUMN (exit_code INTEGER, is_error INTEGER) via PRAGMA table_info, same pattern as M2/bench_runs/compressed. SQLite stores is_error as INTEGER 0/1/NULL; the Go layer converts via sql.NullInt64 to *bool. Backward-compatible: existing rows get NULL for both (absent = success)."
        win_condition: "A tool that throws (no exit code) can express failure via is_error; the gating logic checks one field; exit_code is diagnostic only; M4 reversibility holds (decompress(compress(failed-source)) == source.output); stable CLI surface (compress always prints an id); consistent with D14's passthrough-default; the gate is distinct from D14's in-pipeline invariants; OpenCode mapping is concrete and testable; backward-compatible (nil = success for existing rows)."
      - name: exit_code only, derive is_error at gate time
        status: rejected
        description: "Store only ExitCode *int64; derive is_error = (exit_code != 0) at compress time. Single field, single source of truth."
        win_condition: "Would be chosen if every runtime failure manifested as a numeric exit code. Rejected because a tool that throws (no exit code) cannot express failure — the task explicitly flags this case — and the sidecar path (ktx write) has no way for a caller to signal 'this tool failed' without inventing an exit code."
      - name: is_error only, drop exit_code
        status: rejected
        description: "Store only IsError *bool; do not persist the exit code. Simpler schema."
        win_condition: "Would be chosen if the exit code had no diagnostic value. Rejected because D14 names both fields and the exit code is useful inspection evidence (ktx get shows it; a developer debugging a failed tool_call can see the exit code without re-reading the runtime event)."
      - name: Refuse to compress on source-tool failure (no compressed row)
        status: rejected
        description: "When is_error is true, compressLogic writes no compressed row and returns a non-fatal 'refused' signal to the caller. The caller (hook path or explicit verb) handles the refusal."
        win_condition: "Would be chosen if identity rows polluted the compressed table or if the passthrough semantic were unsafe. Rejected: an identity row is a valid artifact (the D14 no-config default already produces identity for all tools); refusing changes the CLI surface (sometimes no id printed); the hook path would need a fallback path that returns the source output directly — the same semantic as an identity row but with extra complexity. The conservative-on-failure contract says 'pass through unchanged and record that fact' — identity is the pass-through."
      - name: OpenCode is_error from an explicit error field in state (not metadata.exit)
        status: rejected
        description: "Read an explicit 'error' or 'is_error' field from part.state (not metadata.exit) as the failure signal. Would capture tools that throw without an exit code at parse time."
        win_condition: "Would be chosen if OpenCode 1.17.8 emitted such a field on tool_use events. Rejected for the initial mapping: the codebase does not show such a field, and the task scopes the OpenCode mapping to metadata.exit. The is_error payload field exists for future OpenCode shapes or custom adapters that do emit an explicit error; a parser update would add the read when the field appears. The sidecar and flat-fallback paths already support caller-supplied is_error independent of exit_code."
      - name: Claude Code failure mapping (defensive/deferred)
        status: deferred
        description: "Not knowable from the current codebase (no Claude Code parser or adapter exists). The flat-fallback path reads defensively: exit_code from top-level exit_code/exit/code; is_error from top-level is_error/error. When is_error is absent but exit_code is present, is_error is derived (exit_code != 0). The concrete Claude Code mapping is settled when a Claude Code adapter is built (M4+ hook path or a future wrapper)."
        win_condition: "Deferred: settled when a Claude Code adapter is implemented. The flat-fallback defensive reads cover any runtime that emits failure fields at the top level today."
    choice: "D9 payload extension: add two optional nullable fields to the flat JSON tool_call payload — exit_code (*int64, diagnostic) and is_error (*bool, canonical gating signal) — following the M2 nullable-pointer convention (nil = absent = no failure signal = treated as success; &false = explicitly successful; &true = failed; &0 = explicitly exited zero; &nonzero = exit-code-based failure). is_error is canonical: the pipeline runner checks is_error only; exit_code is never used for gating. The two fields are independent: a tool that throws (no exit code) can set is_error=&true with exit_code=nil; a bash tool sets exit_code=&N and is_error=&(N!=0) at parse time. Gating semantics: when is_error is true, compressLogic writes an IDENTITY compressed row (output == source.output, pipeline JSON == '[]', stderr warning 'ktx: warning: source tool_call indicates failure, compression skipped') and prints the compressed id (stable surface). This is a PRE-PIPELINE GATE — distinct from D14's three IN-PIPELINE invariants (empty-output guard, stage-error passthrough, unknown-stage skip). The gate checks is_error before runner.Run is called; the invariants govern stage behavior during execution. The two concerns are not conflated: the gate decides WHETHER to attempt compression; the invariants decide what happens WHEN a stage fails. OpenCode mapping (concrete): exit_code from part.state.metadata.exit (int64); is_error derived at parse time (exit_code != 0 when present, nil when absent). Flat-fallback mapping (defensive): exit_code from top-level exit_code/exit/code; is_error from top-level is_error/error; derive is_error from exit_code when is_error absent but exit_code present. Claude Code mapping: deferred (not knowable from codebase; flat-fallback covers it today). Schema migration: idempotent ALTER TABLE ADD COLUMN (exit_code INTEGER, is_error INTEGER) via PRAGMA table_info, same pattern as M2/bench_runs/compressed. SQLite stores is_error as INTEGER 0/1/NULL; the Go layer converts via sql.NullInt64 to *bool. Backward-compatible: existing rows get NULL for both (absent = success)."
    reasoning: "Three vision principles govern D15, and the choices fall out of applying them to the D14 deferral. (1) 'Boring before clever' favors two nullable pointer fields following the M2 convention already proven in the codebase — no new pattern, no new type, no derivation logic at gate time (is_error is a direct check, not exit_code != 0). Deriving is_error from exit_code at gate time was rejected because it would require the gate to understand exit_code semantics (what counts as failure?) and would lose the 'tool that throws' case (no exit code). Storing both means the parse layer derives is_error once (from exit_code for OpenCode) and the gate checks a single boolean — the derivation is at the parse boundary, the gating is at the compress boundary, and neither re-derives. (2) 'Reversibility before aggression' favors the identity-row gate: a failed tool's output passes through unchanged to the compressed artifact, so decompress(compress(failed-source)) == source.output holds. Refusing to compress was rejected because it changes the CLI surface (sometimes no id printed) and forces the hook path to maintain a fallback that returns the source output directly — the same semantic as an identity row but with extra complexity. The identity row is consistent with D14's no-config default (identity for all tools) and with the conservative-on-failure contract's 'pass through unchanged and record that fact' — the fact is recorded via stderr warning + pipeline='[]' + output==source.output (all inspectable). (3) 'The router wins, the algorithm loses' favors a stable CLI surface: ktx compress always prints an id, regardless of whether compression ran or was skipped. The decision to skip happens behind the surface; the caller (hook or explicit verb) sees the same shape.\n\nThe pre-pipeline gate is deliberately distinct from D14's three in-pipeline invariants. D14's invariants govern what happens WHEN a stage fails during execution (empty output, error, unknown name). D15's gate governs WHETHER to attempt compression at all (is_error on the source). The gate fires BEFORE runner.Run is called; the invariants fire DURING execution. A source with is_error=nil (absent) and a stage that errors exercises the D14 invariants, not the D15 gate. A source with is_error=&true and a configured pipeline exercises the D15 gate (pipeline skipped entirely, no stage runs). The two concerns are not conflated because they operate at different levels and never interact.\n\nDesign rules (do not relitigate):\n\n- Two new optional fields on the D9 flat JSON tool_call payload: exit_code (*int64, diagnostic) and is_error (*bool, canonical gating signal). Both nullable pointers, no omitempty (absent surfaces as JSON null, consistent with M2).\n- is_error is canonical for gating. The pipeline runner / compressLogic checks is_error only. exit_code is NEVER used for gating — it is diagnostic evidence persisted for inspection (ktx get surfaces it).\n- Absent is_error (nil) = no failure signal = treated as success (compression proceeds). &false = explicitly successful (compression proceeds). &true = failed (compression skipped, identity row written). The nil-vs-&false distinction is preserved by the pointer discipline, matching M2's absent-vs-zero distinction.\n- Source-tool-failure gate: when is_error is true, compressLogic writes an identity compressed row (output == source.output, pipeline == '[]', stderr warning). This is a PRE-PIPELINE gate, distinct from D14's three IN-PIPELINE invariants. The gate fires before runner.Run; the invariants fire during execution.\n- OpenCode mapping: exit_code from part.state.metadata.exit; is_error derived at parse time (exit_code != 0 when present, nil when absent). Tools without an exit field → both nil (success).\n- Flat-fallback mapping: defensive reads from top level (exit_code from exit_code/exit/code; is_error from is_error/error; derive is_error from exit_code when is_error absent but exit_code present).\n- Claude Code mapping: deferred (not knowable from codebase; flat-fallback covers it).\n- Sidecar path (ktx write): caller sets exit_code/is_error directly in the JSON payload; ktx persists as-is (pointer discipline).\n- Schema migration: idempotent ALTER TABLE ADD COLUMN (exit_code INTEGER, is_error INTEGER) on tool_calls, same PRAGMA table_info pattern as M2/bench_runs/compressed. SQLite has no native BOOL; is_error stored as INTEGER 0/1/NULL, converted to *bool via sql.NullInt64 in GetToolCall.\n- Backward-compatible: existing rows get NULL for both columns (absent = success). M1–M4 regression preserved."
    confidence: firm
