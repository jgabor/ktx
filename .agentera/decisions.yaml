  - number: 28
    date: 2026-07-15
    question: How should schema-v3 benchmark evidence describe small, variable
      samples and paired pipeline effects without making inferential claims or
      silently removing unusual runs?
    context: Schema v3 already distinguishes reproducible estimated API cost from
      reported cost. The live harness alternates baseline and candidate
