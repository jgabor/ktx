      (pipeline_id, stage_labels, pipeline_hash) read straight from
      manifest.Pipelines[side] — no new identification surface, the runner
      already records these in the manifest (D21-style) before any attempt runs.
      Cache deltas under baseline_minus_candidate join the existing
      tokens_in/tokens_out/cost deltas without renaming or contradicting the
      existing fields; strategy identity stays baseline-vs-candidate (the
