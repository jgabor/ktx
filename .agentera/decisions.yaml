  - number: 31
    date: 2026-07-14
    question: How does ktx capture, persist, and report OpenCode prompt-cache
      telemetry (cache_read / cache_write tokens) alongside the existing
      token/cost evidence so strategy effects on caching, token spend, and total
      cost are attributable from a single self-contained experiment summary?
    context: OpenCode step_finish events already supply tokens.input, tokens.output,
      and cost (a non-cumulative per-step delta), and additionally include
      part.tokens.cache.{read,write} as per-request deltas. The ktx
      cost-evidence pipeline today captures tokens/cost but discards cache
      telemetry. The recorded_streams table already holds the authoritative
      stream; cache telemetry is a parse-and-persist question, not a new capture
      surface. Attempts that predate cache evidence (the schema-v1 attempts and
      the legacy summary.golden.json) must keep regenerating byte-for-byte
      identical summaries so historical experiments continue to validate. The
      wrapper persists only tool_use rows (D17/TODO.md:31 open item), and the
      task contract explicitly forbids putting model-step cache usage on
      tool_calls — cache telemetry lives on the step-aggregate, not the
      per-event row. bench_runs already has additive columns (D11/D15/D20
      introduced additive migrations); additive columns with NULL preserving
      absent-vs-zero is the established pattern. summary.json schema_version=1
      is read byte-comparatively by ValidateExperiment; bumping it for
      cache-bearing experiments lets historical byte-match validation remain
      exact, while cache-bearing experiments use schema_version=2. The live A/B
      pipeline identity (baseline/candidate side) already lives in the manifest
      (manifest.Pipelines[side].PipelineID / .Stages / .SHA256), so carrying it
      onto each summary side opens attribution without opening a new
      identification surface.
    alternatives:
      - name: Capture cache telemetry as SUM per attempt, persist to both experiment
          evidence and bench_runs, summarize under schema v2
        status: chosen
        description: "extend ParseStream (internal/experiment/stream.go) and the
          live-bench extractStreamMetrics (internal/cli/bench_run.go) to read
          part.tokens.cache.{read,write} on every step_finish event. Per-attempt
          aggregation is the SUM across the step_finish events — cache counts
          are per-request (OpenCode 1.17.8 fixture shows read=0 then read=15232
          across two step_finish events; SUM = 15232). Absent vs emitted zero is
          preserved via nullable *float64 on experiment.Metrics and nullable
          *int64 on dbpkg.BenchRun, with new CacheReadEvents/CacheWriteEvents
          counters on experiment.UsageEvidence mirroring the existing
          TokensInEvents/TokensOutEvents/CostEvents completeness counters.
          Persist the two columns additively on bench_runs (cache_read INTEGER,
          cache_write INTEGER) with NULL preserving absent — no tool_calls
          changes. Strategy-attribution: each baseline/candidate side of
          summary.json carries pipeline_id, stage_labels
          (manifest.Pipelines[side].Stages), and pipeline_hash
          (manifest.Pipelines[side].SHA256) from the manifest so the summary is
          self-contained. Cache distributions (cache_read, cache_write) join the
          existing tokens_in/tokens_out/cost distributions, plus
          baseline-minus-candidate deltas for cache_read and cache_write. The v2
          augmentation fires ONLY when ANY attempt under either side carries
          cache evidence; otherwise the summary regenerates byte-identical to
          schema_version=1 (legacy byte-match preserved). The replay envelope
          cost_drift section gains replayed/stored cache_read and cache_write
          values alongside the existing tokens/cost comparisons, with
          absent-vs-emitted-zero preserved on both sides."
      - name: MAX cache counts across step_finish events (treat as cumulative)
        status: rejected
        description: Treat cache.read/write as cumulative per-step counts and take the
          MAX observed value across step_finish events, under the assumption
          that each event reports the running total rather than a per-request
          delta.
        rationale: "OpenCode step_finish cache counts are per-request, not cumulative —
          the fixture proves this: read=0 on the first step_finish then
          read=15232 on the second means the provider billed 15232+0 = 15232
          cache-read tokens total (per-request SUM matches), not MAX=15232 as if
          the first event's 0 were a prefix of the second. MAX coincidentally
          gives the same answer when the first event is 0, but produces wrong
          results when every event carries a non-zero per-request delta (e.g.
          read=100 then read=200 would give MAX=200 but SUM=300). Live evidence
          confirms: tokens.total == tokens.input + tokens.output +
          tokens.reasoning + tokens.cache.read + tokens.cache.write for every
          event, so cache values are per-request deltas just like
          tokens.input/output/cost."
      - name: Persist cache telemetry on tool_calls rows (per-event columns)
        status: rejected
        description: Add cache_read/cache_write columns to tool_calls and populate them
          from the step_finish event the wrapper persists.
        rationale: "OpenCode emits cache tokens on the step-aggregate step_finish event,
          not on tool_use (per-tool). Putting model-step cache usage on
          tool_calls rows would couple an aggregate metric to per-tool evidence
          and force every per-row consumer (cost-summed bench_runs headline,
          compression savings attribution, identity-derivation) to reason about
          a NULL column it does not need. violates the cost-summed evidence-set
          invariant D14 preserved when it introduced the compressed table: cache
          telemetry serializes the same way — added to bench_runs, not
          tool_calls."
      - name: Add a cache miss ratio as a headline metric
        status: rejected
        description: Compute cache_read / (cache_read + tokens.input) as a single
          headline number alongside cache_read/cache_write.
        rationale: Inventing a derived ratio expands the measurement surface beyond the
          provider-reported observations. The two raw cache counts already carry
          the provider's signal in unambiguous units; the cache_read
          distribution and baseline-minus-candidate delta let reviewers compute
          their own derived ratios without ktx committing to a formula that may
          not survive a provider's billing nuances.
      - name: Bump summary schema_version unconditionally to v2
        status: rejected
        description: Always emit schema_version=2 in summary.json, even for cache-less
          experiments.
        rationale: ValidateExperiment byte-matches the regenerated summary against the
          persisted summary.json. An unconditional bump would invalidate every
          historical summary.golden.json (the experiment-test fixture, any
          archived experiment directory) and force a rewrite of cache-less
          experiments. The conditional bump (v2 only when cache evidence is
          present) preserves the v1 byte-match contract for legacy experiments
          while opening v2 for cache-bearing ones.
    choice: "Capture cache telemetry on the existing step_finish parse paths and
      persist it additively. Per-attempt aggregation is SUM across step_finish
      events (per-request deltas). Absent vs emitted zero is preserved via
      nullable pointers: experiment.Metrics.CacheRead/CacheWrite are *float64
      (matching the existing TokensIn/TokensOut/Cost shape under
      attempts.jsonl); dbpkg.BenchRun.CacheRead/CacheWrite are *int64 (matching
      the INTEGER-column-but-NULL-when-absent shape of the bench_runs headline
      store). experiment.UsageEvidence gains CacheReadEvents and
      CacheWriteEvents counters mirroring TokensInEvents. bench_runs gains
      cache_read and cache_write INTEGER columns via an additive ALTER TABLE
