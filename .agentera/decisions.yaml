          introduced a new persisted artifact type (compressed outputs), it
          created a new ktx.db TABLE (the `compressed` template: id, source_id,
          output, content_hash, pipeline, timestamp), not a file; the captured
          stream is a new machine-captured ktx artifact of the same kind, so it
          gets a table, following D14. D12's methodology-v1.yaml is a committed
          file because it is a human-authored INPUT CONTRACT, not
          machine-captured run evidence — a different category. The existing
          `.agentera/verification/fixtures/opencode-tool-use.jsonl` is a curated
          TEST fixture, not a captured-run evidence row; it does not override
          the D14 artifact-to-table precedent for captured-run evidence. (3)
          file-only does not help sessions captured before this feature ships
          and requires a path-resolution convention. Portability for CI is a
          real requirement (D13 per-commit gate) but is addressed via export
          from the ktx.db source of truth (see the deferred hybrid alternative
          and feeds_into), not by making the file the source of truth."
      - name: sessions.captured_stdout TEXT column
        status: rejected
        description: Add a captured_stdout BLOB/TEXT column to the sessions table;
          --replay reads it by session_id. One source of truth; session_id is
          the only key needed.
        win_condition: Would be chosen if the sessions table's update cadence matched a
          set-once captured stream.
        rationale: "Rejected because sessions is a roll-up table (D7: INSERT on open,
          UPDATE roll-up counters/timestamps/ended_at on each call and on close)
          — a captured stream is set-once at capture time and never updated
          (INSERT-only, the D7/D14 append-only ethos). Mixing two update
          cadences (per-call roll-up UPDATE vs set-once stream INSERT) in one
          table is a schema smell and complicates the append-only reasoning D7
          guards. It also denormalizes a potentially large TEXT (multi-step
          sessions emit many events) into the roll-up row that `ktx list`/`ktx
          get` read on every session query. D14's
          separate-evidence-from-artifacts principle applies: the captured
          stream is session-LEVEL evidence distinct from the sessions roll-up
          counters — a dedicated table (c2) is the clean separation, just as
          `compressed` is separate from `tool_calls`."
