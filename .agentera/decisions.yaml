  - number: 32
    date: 2026-07-27
    question: Should ambient database access continue to require a caller-supplied
      executable digest on every invocation, or should safety be enforced without
      user-visible runtime proof?
    context: >-
      The per-invocation digest proof selected on 2026-07-27 makes ordinary
      commands such as `ktx stats summary` fail until the user asks the running
      binary for its own hash and supplies that hash back. This is a deliberateness
      check, not a trust boundary: the expected value has no independent trust root,
      an explicit KTX_DB bypasses it, and a modified binary can report its own hash.
      Generated OpenCode code already pins one canonical executable path. Database
      integrity is independently protected by read-only SQLite mode, forward-only
      schema checks, transactional migration, rollback coverage, and hermetic
      development and CI boundaries. Existing generated plugins may continue to
      pass the old root flag after the binary is upgraded.
    alternatives:
      - name: Remove runtime-proof authorization, make query commands genuinely
          read-only, and preserve a hidden no-op compatibility flag.
        status: chosen
        description: Delete digest comparison and all proof propagation. Query
          commands open an existing current-schema database with SQLite read-only
          enforcement and use an ephemeral empty database when the persistent file
          is absent. Older schemas require an explicit migration-capable path;
          newer schemas remain rejected before writes. Keep parsing the old flag
          without advertising or enforcing it so already-generated integrations do
          not break.
      - name: Retain digest proof only for write-capable commands.
        status: rejected
        description: Removes friction from inspection but preserves a caller-supplied
          value that still does not establish independent trust and retains most of
          the propagation machinery.
      - name: Replace the digest with a durable receipt or install marker.
        status: rejected
        description: Hides the ceremony but adds mutable authorization state,
          revocation and stale-state semantics without creating a cryptographic
          trust root.
      - name: Verify signed release artifacts automatically.
        status: rejected
        description: Would create meaningful provenance but requires signing,
          distribution, key-rotation, and development-build policy outside the
          current product requirement.
    choice: Supersede the per-invocation ambient runtime-proof choice. Remove the
      executable digest as a database authorization input and remove it from public
      help, documentation, command plumbing, nested invocations, and newly generated
      OpenCode code. Retain `--expect-runtime-sha256` only as a hidden ignored string
      flag for compatibility with already-generated plugins and scripts. Preserve
      `binary-capabilities` and executable identity in automatic diagnostics; they
      remain inspection evidence, not authorization. Make get, read, list, stats,
      decompress, benchmark report, and telemetry list use a current-schema
      read-only database handle that cannot create or migrate persistent state.
      Preserve their absent-database result semantics through an ephemeral empty
      current-schema handle. A read-only open of an older schema fails with a
      structured migration-required correction; an explicit database migration
      command and existing write-capable commands retain transactional forward
      migration. A newer schema remains a roll-forward error and is never lowered.
      Write-capable commands continue to create and migrate their selected database
      without an additional proof flag. Development, tests, CI, and rehearsal remain
      forbidden from ambient live access and continue to use disposable hermetic
      roots and explicit seeded databases.
    reasoning: >-
      Automatically comparing the running executable with a digest derived
      from those same bytes is tautological. Requiring a human to relay that value
      adds recurring failure and documentation surface without authenticating a
      release. The durable safety properties already live at better boundaries:
      SQLite read-only mode prevents query-side mutation, schema version checks stop
      incompatible binaries, migration transactions and rollback tests protect
      upgrades, and Mage prevents development verification from discovering live
      state. A hidden ignored flag is justified only by the concrete installed
      generated-plugin compatibility requirement. This replacement makes normal use
      invisible while making the implementation's claims match what it can actually
      prove.
    confidence: firm
    feeds_into: Root CLI parsing and help; dispatcher database modes; read-only query
      opening; explicit database migration; schema diagnostics; generated OpenCode
      invocation; database safety, binary capability, telemetry, pipeline, README,
      and agent guidance; runtime-proof and migration regression tests.
  - number: 33
    date: 2026-07-28
    question: Should the generated OpenCode plugin require its embedded maximum
      database schema to equal the runtime binary's reported maximum before it
      registers hooks?
    context: A plugin generated while schema 8 was current disabled itself after
      the installed binary advanced to schema 9, even though the OpenCode callback
      contracts had not changed. The startup warning classified this database-only
      difference as unverifiable binary identity. Re-running `ktx init opencode`
      regenerated the plugin and restored equality, but coupled every database
      schema change to adapter regeneration. The same startup check compares the
      independently observed canonical path and digest with the candidate's
      DB-free response, while callback commands enforce their own acknowledgement
      and envelope contracts and database opens enforce schema compatibility.
    alternatives:
      - name: Decouple database schema from OpenCode adapter activation while
          preserving candidate consistency checks.
        status: chosen
        description: Validate that the capability response contains a non-negative
          safe-integer maximum schema, but do not compare it with generated plugin
          state. Continue to verify response schema, canonical path, digest, and a
          non-blank build version, then pin the canonical path for callbacks.
      - name: Remove the startup capability handshake and pin only the canonical
          path.
        status: rejected
        description: Avoids the false incompatibility but also removes the current
          startup candidate consistency check and broadens this change beyond the
          demonstrated database-schema coupling.
      - name: Keep exact maximum-schema equality and rely on adapter regeneration.
        status: rejected
        description: Preserves the current mechanism but continues to treat an
          unrelated database migration as an adapter incompatibility and produces
          recurring startup failure after schema-only upgrades.
      - name: Add adapter protocol range negotiation now.
        status: rejected
        description: Would model the correct compatibility dimension but adds a
          protocol lifecycle before any incompatible adapter wire change requires
          one. Existing callback validation remains the current contract boundary.
    choice: Stop generating the maximum database schema into the OpenCode plugin
      and stop requiring exact equality at startup. Preserve the DB-free
      `binary-capabilities` command and its maximum-schema field for diagnostics,
      release evidence, benchmark provenance, and structured database errors.
      Generated plugins continue to resolve one PATH candidate, canonicalize and
      hash it, invoke that exact path for capabilities, validate the response
      schema, canonical path, digest, non-blank build version, and well-formed
      non-negative safe-integer maximum schema, then use the canonical path for
      callbacks. Candidate validation failures identify the failed field and its
      expected and actual values where applicable. Database schema compatibility
      remains enforced by database open and migration boundaries, not plugin
      activation. Re-run `ktx init opencode` to pick up generated plugin source
      changes, but a database-schema increase alone does not invalidate an
      installed plugin.
    reasoning: Maximum database schema and adapter wire compatibility are separate
      contracts. Exact equality blocked a compatible adapter without authenticating
      the executable, proving callback compatibility, or improving database safety.
      The binary already rejects unsupported newer databases and migrates supported
      older schemas at the appropriate command boundary. Keeping the narrower path,
      digest, and response-shape checks preserves the established PATH-drift and
      candidate-consistency behavior while removing the demonstrated false failure.
      Protocol negotiation remains unnecessary until an actual incompatible adapter
      change supplies requirements to negotiate.
    confidence: firm
    feeds_into: Generated OpenCode candidate validation and fixtures; binary
      capability and OpenCode telemetry documentation; adapter refresh guidance.
  - number: 34
    date: 2026-07-30
    question: How should the pinned SkillsBench bridge authenticate OpenAI runs
      when the host has OpenCode OAuth metadata but no API key?
    context: The committed bridge supported only API-key execution through the
      mandatory LiteLLM proxy. Read-only analysis of BenchFlow 0.6.5 at commit
      737146cc60fbc1b3595198eebbabba4628592d02 and OpenCode 1.18.5 showed that a
      custom codex-acp manifest can preserve BenchFlow's built-in subscription
      authentication while launching OpenCode ACP. The host authentication object
      contains access and refresh credentials and therefore cannot become retained
      campaign provenance.
    alternatives:
      - name: Keep API-key-only proxy execution
        status: rejected
        description: Preserves the existing bridge but cannot execute from the
          selected host OAuth credential.
      - name: Convert or proxy the OAuth credential as an API key
        status: rejected
        description: Changes authentication semantics, risks conflicting routing,
          and would make proxy cost claims unsupported.
      - name: Add an explicit dual-mode bridge
        status: chosen
        description: Preserve API-key plus LiteLLM behavior and add a separate
          OpenCode OAuth path using BenchFlow native subscription auth and
          ACP-native usage.
    choice: Add explicit api-key and opencode-oauth campaign modes. OAuth accepts
      only an explicit no-follow host auth file, minimizes it in memory to the
      OpenAI OAuth object, injects it only into the BenchFlow child environment,
      and scrubs conflicting provider, proxy, OpenCode auth, configuration, and
      model-catalog inputs. Disable task-local OpenCode project configuration and
      prove the descriptor-bound BenchFlow agent resolution before execution.
      Declare codex-acp only as
      the BenchFlow registry compatibility identity while retaining OpenCode
      1.18.5 as the runtime identity. Pin OAuth to openai/gpt-5.4 with high as the
      only enabled variant. Require ACP-native usage and keep OAuth price and cost
      unavailable; any non-null source price or cost evidence invalidates an OAuth
      attempt. Scan prepared and produced campaign files for the exact access and
      refresh strings, fail closed, and remove affected retained files after a
      detected post-run leak. Require a durable immediate-scan marker before
      importing an OAuth attempt, then rescan with the current credentials. Keep
      rendering secret-free and tool-free.
    reasoning: The dual-mode boundary preserves the audited API-key route while
      matching the selected host authentication semantics. Explicit credential
      input and environment scrubbing prevent ambient credentials from silently
      changing the route. Metadata-only provenance states what the bridge can
      prove without retaining a path, account, expiry, credential, or digest.
      Exact-value scans and the nonsecret completion marker address normal
      retained-artifact leakage and credential rotation without claiming that
      crashed BenchFlow host temporary files or an external sandbox cannot survive.
    confidence: provisional
    feeds_into: SkillsBench campaign schema and CLI; generated agent manifest,
      launch wrapper, and OpenCode configuration; execution environment and leak
      gate; import and validation authority; benchmark methodology and runbook;
      live OAuth evidence.
