    choice: "Persist the captured JSONL stream in a new INSERT-only
      `recorded_streams` table in ktx.db, following D14's `compressed` table
      template: id (D3 16-char nanoid PK), session_id (NOT NULL FK to
      sessions.id), bench_run_id (NOT NULL FK to bench_runs.id), stream_text
      (TEXT — the verbatim JSONL stream exactly as opencode emitted it),
      content_hash (D9 SHA-256 of stream_text), stream_format (TEXT, e.g.
      'opencode-jsonl-1'), captured_at (TEXT RFC3339Nano). One row per captured
      bench run. Capture trigger: `ktx bench run` (the live bench path) ONLY —
      runBenchRun already holds the captured agentStdout bytes in memory
      (bench.go:998-1050, verified); after extracting stream metrics and
      inserting the bench_runs row it INSERTs the stream into recorded_streams
      keyed by the found session_id and the just-inserted bench_run_id. `ktx
      run` (the wrapper subprocess) stays a D1 transparent proxy and does NOT
      persist the stream — no unbounded ktx.db growth, no wrapper behavior
      change. `--replay <session-id>` loads the recorded_streams row by
      session_id, loads the original bench_runs row from the FK, re-parses the
      stream through parser.ParseEvent (validates parser accuracy: replayed
      tool_use count matches originally-persisted tool_call_count),
      re-aggregates tokens/cost via extractStreamMetrics (validates
      cost-derivation accuracy: re-derived tokens/cost match the original
      bench_runs row), and emits a consistency headline comparing replay-derived
      vs original. Schema migration: idempotent CREATE TABLE IF NOT EXISTS in
      db.Open schemaStatements (same pattern as the `compressed` table — a new
      table, not an ALTER TABLE column add), self-healing for pre-D20 databases;
      no migration function needed beyond the existing schemaStatements list.
      Pre-M4: `--replay` vs original consistency check (parser accuracy +
      cost-derivation accuracy + wrapper overhead). Post-M4: the same recorded
      stream is re-processed through the compression pipeline (baseline
      no-compression vs treatment with-compression) per D13; the
      recorded_streams schema is stream-only. Note: M4 A/B has a persistence gap
      — D14's `compressed.source_id` FK requires a persisted tool_call, but
      --replay parses in-memory; the no-schema-change claim is aspirational, not
      contractual (see design rules and confidence). The D16 candidate fixture
      (bench_run id `ccsbkoluqgkgtelc`, paired session_id `sdeloqgthcgasfld`,
      produced via validate-bench.sh / `ktx bench run` chain) is invalidated by
      D20: no recorded_streams companion exists for it because the stream was
      discarded by runBenchRun's in-memory bytes.Buffer before D20's persistence
      step landed; a fresh `ktx bench run opencode <model> <task>` invocation
      produces both the bench_runs row AND its recorded_streams companion under
      D20's contract. Portability (export/import for CI runners) is deferred to
      CI wiring (TODO.md:31) per YAGNI — the ktx.db table does not preclude a
      future `ktx bench export <id>` that reads stream_text and writes a
      portable .jsonl fixture, and `--replay` is extensible to accept a file
      path without breaking the session-id contract."
    reasoning: >-
      Five architectural constraints settle D20, and the choice falls out of
      applying them rather than from any novel insight.


      (1) 'Cost is the contract — evidence persisted to the database; numbers
      not adjectives.' The captured JSONL stream IS the authoritative cost
      evidence per D17 — the wrapper-persisted tool_call rows carry NULL
      tokens/cost/model for OpenCode because OpenCode 1.17.8 emits M2 fields on
      `step_finish` (step-aggregate), not on `tool_use` (per-tool); verified in
      run.go:385-418 teeAndParse which persists only tool_use via
      parser.ParseEvent and passes `step_finish`/`text` events through to stdout
      without persisting them. D17 declared the stream the authoritative source
      but did not define where it lives — D20 closes that gap: the cost evidence
      goes in the database, not in a sibling repo file or an in-memory buffer
      discarded on function return. A portable .jsonl file (candidate b) is
      rejected because the bench_runs row the stream is paired with already
      lives in ktx.db (two sources of truth, drift risk) and because the
      existing `.agentera/verification/fixtures/opencode-tool-use.jsonl` is a
      curated TEST fixture, not a captured-run evidence row — D16's
      script-captured session id is machine-captured run evidence, a different
      category that follows the D14 artifact-to-table precedent, not the D12
      human-authored-contract precedent. A sessions.captured_stdout column
      (candidate c1) is rejected because sessions is a D7 roll-up table with
      per-call UPDATE cadence, while a recorded stream is set-once INSERT-only —
      mixing two update cadences in one table is a schema smell D14 explicitly
      refused when it created `compressed` rather than polluting tool_calls.
      D14's precedent (separating `compressed` from `tool_calls` because
      injecting non-evidence rows into the cost-summed evidence set would
      corrupt M3 bench aggregation) applies transitively: the captured stream is
      session-level evidence distinct from the sessions roll-up counters and
      from tool_calls per-row evidence; a dedicated table (recorded_streams) is
      the clean separation, exactly as `compressed` was the clean separation for
      compressed artifacts.


      (2) 'Boring before clever — Go stdlib first, no new runtimes, no daemon.'
      No new infrastructure. The migration follows the exact template
      `compressed` established (idempotent CREATE TABLE IF NOT EXISTS in
      schemaStatements at open.go); no migration framework, no versioning code,
      no new dependency. The capture code path already exists — runBenchRun
      already holds agentStdout bytes in memory (bench.go:998-1050, verified);
      D20 adds one INSERT statement after the bench_runs INSERT that already
      happens. extractStreamMetrics (bench.go:1384-1447, verified) already
      parses the stream; `--replay` reuses it unchanged. parser.ParseEvent (the
      single source of truth for the ktx tool_call shape) is invoked by
      `--replay` verbatim; the parser is exercised against the recorded stream
      without spawning the agent.


      (3) D13's locked-in design rules. The `--replay` flag goes on the existing
      M3 `ktx bench run` command (not a new subcommand); single-invocation
      internal A/B (not two commands); pre-M4 validates parser and
      cost-derivation accuracy and measures wrapper overhead; post-M4 adds the
      compression delta. D12 scoring contract (exact-match, N=1,
      cost_per_correct) is firm and D13 governs the harness, not the scoring —
      D20 does not touch the scoring contract, it defines the persistence
      contract that `--replay` reads. The recorded_streams table is the
      harness-side artifact (D13 Tier 1); the methodology-v1.yaml file stays for
      the live `ktx bench run` path per D13's 'replay benchmark uses a recorded
      session fixture, not the methodology file's pinned task' rule; the
      recorded stream paired with its bench_runs row IS that fixture.


      (4) YAGNI. D20 ships the minimal contract: persist the stream, `--replay`
      reads it, pre-M4 consistency check. The M4 compression delta (baseline vs
      treatment via the same stream) is acknowledged as the post-M4 extension
      but NOT implemented — the recorded_streams schema does not need a
      compressed counterpart column because the compression pipeline (D14)
      writes its artifacts to the existing `compressed` table (with source_id
      referencing tool_calls.id, not recorded_streams.id). The M4 A/B comparison
      loads the recorded stream once, parses+persists the tool_call outputs into
      the in-memory replay fixture, runs `ktx compress` on each tool_call's
      output via the existing `compressed` machinery, recomputes the cost
      aggregation against the (compressed) outputs, and emits the
      baseline-vs-treatment delta — no new column needed on recorded_streams.
      (Caveat: the M4 A/B persistence gap — `compressed.source_id` requires a
      persisted tool_call but --replay parses in-memory — may require schema
      work; the 'no schema change' claim is aspirational, see design rules.)
      Portability (`ktx bench export <session-id>` and `--replay <file>`) is
      deferred to CI wiring (TODO.md:31); D20's table does not preclude it but
      YAGNI says build the export surface when the CI gate demands it, not now.


      (5) D17's residual tensions. D17 flagged two provisional tensions. (a)
      Wrapper-vs-sidecar path for v1: D19's feeds_into deferred this as 'no
      longer urgent; re-deliberate only if --replay cost reconstruction from the
      captured JSONL stream proves insufficient.' D20 RESOLVES this for the
      --replay codepath: `--replay` reads the recorded stream and re-aggregates
      via extractStreamMetrics (already proven against the D16-PASS session);
      the wrapper path is sufficient for v1 replay because the captured stream
      carries the tokens/cost/model (D17 reframe) and D20 persists that stream
      where it can be replayed. Cost reconstruction is sufficient for --replay
      because the stream IS persisted; the sidecar path is not needed for
      replay. Future use cases needing live cost tracking (not replay) may
      revisit the sidecar question independently — D20's scope is the recording
      contract for --replay, not a global sidecar verdict. (b) L3(b) D11
      derivation overlap with cost-pipeline verification territory: D20 RESOLVES
      this too — the L3(b) derivation branch IS the pre-M4 `--replay`
      consistency check. `--replay` re-runs extractStreamMetrics AND D11
      derivation (tokens + model → cached price → derived cost) from the
      freshly-persisted stream and compares the replay-derived cost to the
      originally-recorded bench_runs row. The two concerns are unified by
      design, not duplicated: the recorded stream is where both the
      provider-reported cost (step_finish.part.cost, L3 branch (a)) AND the
      derivation inputs (step_finish.part.tokens + model identifier, L3 branch
      (b)) live, and `--replay` exercises both end-to-end in one consistency
      check.


      Design rules (do not relitigate):


      - recorded_streams is INSERT-only (D7 ethos). One row per captured bench
      run. No UPDATE path; no DELETE path (reversibility via originals never
      deleted — D7). One-to-one pairing with bench_runs (each `ktx bench run`
      invocation produces exactly one bench_runs row and exactly one
      recorded_streams row; re-running `ktx bench run` against the same task
      produces new rows because temperature>0 non-determinism means streams
      differ — D12 documented limitation).

      - recorded_streams.session_id REFERENCES sessions(id);
      recorded_streams.bench_run_id REFERENCES bench_runs(id). Open enables
      foreign_keys per connection (open.go).

      - recorded_streams.content_hash is SHA-256 of stream_text, recomputed at
      write time (D9). ktx owns integrity; the caller does not supply
      content_hash.

      - Capture trigger: `ktx bench run` ONLY. `ktx run` (wrapper subprocess)
      stays a D1 transparent proxy — agent stdout passes through untouched, only
      tool_use-derived tool_call rows persisted. No new write to ktx.db from the
      wrapper path. validate-bench.sh is unaffected (it invokes `ktx run`
      directly, not `ktx bench run`); its sessions do NOT acquire
      recorded_streams companions.

      - `--replay` read path: loads recorded_streams by session_id; session-id
      is the documented --replay arg per D13. bench_run_id is an internal FK
      (for JOIN to bench_runs), not a public --replay arg. Note: the bench_runs
      table has no session_id column; recorded_streams is the first persistent
      session-to-bench_run linkage. Not-found → exit 2 (D4 contract).

      - Pre-M4 comparison: replay-derived metrics vs original bench_runs row.
      The consistency check's value is NOT re-computation verification
      (extractStreamMetrics is deterministic — re-running it on the same stream
      produces identical output by construction). The real value is: (a) stream
      integrity — content_hash of the recorded stream_text matches what was
      captured; (b) parser determinism — re-parsed tool_use count via
      parser.ParseEvent matches the originally-persisted tool_call_count; (c)
      price cache drift detection — D11 derived cost (tokens + model -> cached
      price -> derived cost) may differ if `ktx prices update` ran between
      capture and replay, surfacing cache drift as an actionable signal.
      Overhead: replay duration vs original wrapper duration.

      - Post-M4 comparison: same stream re-processed through the compression
      pipeline. Persistence gap acknowledged: D14's `compressed` table has
      `source_id REFERENCES tool_calls(id)`, but --replay parses tool_calls IN
      MEMORY from the recorded stream (not persisted). How M4's `ktx compress`
      writes to `compressed` without a persisted tool_call row to FK-reference
      is UNRESOLVED — either --replay must persist in-memory tool_calls to
      ktx.db first (adds tool_call rows not in the original session,
      complicating M3 bench aggregation), or `compressed.source_id` must be
      relaxed, or a new `replay_artifacts` table is needed. The 'no schema
      change between pre-M4 and post-M4 recorded_streams' claim is aspirational
      not contractual; M4's --replay A/B will determine the actual schema
      requirement. This gap is why D20's confidence is provisional, not firm.

      - Schema migration: idempotent CREATE TABLE IF NOT EXISTS in db.Open
      schemaStatements, same pattern as the `compressed` table (open.go). No
      ALTER TABLE column add required (new table, not column on existing table).
      Self-healing for pre-D20 databases; pre-existing ktx.db files gain the
      table on next open.

      - D16 fixture incompatibility: the candidate fixture D16 declared
      (bench_run id `ccsbkoluqgkgtelc`, paired session_id `sdeloqgthcgasfld`,
      captured by validate-bench.sh and the `ktx bench run opencode
      glm-5.2-short-fast-flex addition_v1` chain per the M3 invocation fix TODO)
      has no recorded_streams companion and CANNOT be retroactively persisted —
      the stream was discarded by runBenchRun's in-memory bytes.Buffer when the
      function returned before D20's persistence step existed. D20 requires a
      fresh `ktx bench run opencode <model> <task>` invocation to produce a
      D20-compliant replay fixture. The D16 5/5-PASS verdict remains valid
      wrapper-validation evidence; the D16 bench_runs id is NOT a valid
      `--replay` fixture under D20.

      - Portability deferred: `ktx bench export <session-id>` and `--replay
      <file>` are future surfaces for CI (TODO.md:31). The ktx.db table does not
      preclude them; YAGNI says build when CI demands. The portable fixture
      format is the raw stream_text plus the original bench_runs comparison
      metrics — a self-contained JSONL-plus-JSON envelope that lets a file-based
      `--replay` run the pre-M4 consistency check without the capture machine's
      ktx.db.
