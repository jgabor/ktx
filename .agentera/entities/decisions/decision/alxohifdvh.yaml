id: alxohifdvh
artifact: decisions
record:
  date: 2026-09-13
  question: Should KTX introduce universal preprocessing or reusable filter composition, and how should sharing, precedence, inspection, and reproducibility work?
  context: The user wants reusable recipes that simplify configuration and are easy to share. Six of seven retained benchmark pipeline files repeat strip-ansi, dedup-blank, normalize, while the command-specific examples intentionally use different stage lists. This establishes repetition, not a measured maintenance failure or a case for automatic common processing. The discussion initially favored route-and-profile bundles, but the user explicitly revised that direction after examining routing versus stage composition. The final selected unit contains stages only. Existing configuration capture already retains the actual execution configuration rather than rereading source files later.
  alternatives:
    - name: Share self-contained local stage-list recipes that profiles explicitly expand in place into one linear pipeline.
      status: chosen
    - name: Keep sharing limited to copied full configurations or duplicated stage lists.
      status: rejected
    - name: Automatically apply universal or wildcard preprocessing to every selected profile.
      status: rejected
    - name: Bundle routes, private profiles, and profile settings into recipes; this earlier proposal within the discussion was superseded by the user's stage-only choice.
      status: rejected
    - name: Deduplicate stages by name, use first/last-occurrence replacement, or add implicit parameters, inheritance, and override layers.
      status: rejected
    - name: Introduce nested recipe imports, executable plugin definitions inside recipes, a registry, or automatic remote downloads.
      status: rejected
    - name: Silently skip missing recipe files or preserve only source paths and hashes for benchmark reproducibility.
      status: rejected
  choice: A recipe contains only an ordered stage list. A profile explicitly references local recipe files at chosen positions; expansion is equivalent to writing those stages there, preserving every occurrence and argument. Routing, profile selection, recovery settings, timeouts, and executable plugin definitions remain in the main configuration under existing defaults and rules. Recipes may reference stages supplied by the existing local registry, including locally configured plugins, but cannot define or override plugin commands. Customize by editing a local recipe or placing ordinary stages before or after its reference; no special append mechanism is needed. Recipes are self-contained and cannot reference other recipes. Relative references resolve from the main configuration's directory, independent of the working directory; explicit absolute local paths are permitted but are not portable. Add no remote loading, automatic updates, missing-file search, or variable substitution for references. Missing files and invalid recipe structure make the complete configuration invalid through existing configuration-error handling. Preserve current unknown-stage and invalid-stage-argument warning/fallback rules. Run the expanded profile as one pipeline with existing failure handling, structural safeguards, final size checks, and recovery-cue placement; no per-recipe gates or terminal-stage signals. Extend existing non-executing inspection to show expanded routing/profile/stage order, effective recovery and timeout settings, source origins, and effective built-in versus plugin resolution without exposing plugin command bodies. For benchmarks, capture the main configuration and contributing recipe contents once, resolve only from captured bytes, retain both source inputs and the exact executable expansion, and execute that frozen expansion without following live references afterward. Validation and regeneration must verify agreement among retained sources, expansion, and recorded execution identities while preserving archive confinement and sensitive-data handling. Configuration syntax must preserve existing stage tokens and existing configurations; exact syntax is implementation work, not a chosen token convention.
  reasoning: "Stage-only expansion serves reuse and sharing while retaining one understandable sequential model. Name-based deduplication can discard intentionally different operations or alter the input to intervening stages. Editing a local copy requires manual upkeep, and later processing cannot recover information already removed, but these limitations are explicit rather than hidden override semantics. Config-relative files are movable together, and excluding nested imports and plugin installation bounds composition. Inspection and frozen source-plus-execution retention extend existing evidence contracts instead of relying on paths that can change. Confidence remains provisional until compatibility, loading, expansion, diagnostics, and benchmark tests pass; no live outcome improvement or user-confirmed implementation satisfaction is claimed. Evidence: ktx.example.toml, tools/bench/pipelines/*.toml, tools/bench/screen-configs/keep-ends-73-1.toml, and docs/pipelines.md (first-match routing, filter packs, diagnostics, and captured execution configuration). The prior pipeline stage semantics decision hhdcvandfi remains unchanged."
  confidence: provisional
  feeds_into: Complete discussion TODO nshlhrlqbv; replace its open architectural question with the planned stage-recipe composition map; add three bounded implementation/verification TODOs for local recipe loading and expansion, non-executing expanded inspection, and recipe-aware frozen benchmark snapshots.
