  choice: Reject either machine-protocol stdout response above 65,536 bytes before trimming or JSON decoding. Accept the exact boundary; retain at most 65,537 bytes including the sentinel and cancel excess writers through existing settled process/container cleanup. No cap on generic runner.output, Git status, session lists, tool output or recordings. Build diagnostics retain their separate 64 KiB truncation-and-drain policy, not rejection.
