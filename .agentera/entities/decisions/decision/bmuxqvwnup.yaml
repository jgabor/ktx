id: bmuxqvwnup
artifact: decisions
record:
  date: 2026-06-29
  question: How does ktx validate wrapper capture against real opencode before building the D13 Tier 1 replay harness, and what evidence does the validation produce?
  context: "D13 committed to a two-tier benchmark model. Tier 1 (`ktx bench run --replay <session-id>`) reads a recorded real OpenCode session from ktx.db. But the M3 `bench run` path spawns `ktx run opencode <prompt>`, which spawns `opencode <prompt>` — the TUI default subcommand. bench_test.go only ever exercised the wrapper against a synthetic fake binary emitting deterministic JSONL; the parser pipeline has never been validated end-to-end against real opencode output. Before committing to a recording fixture format or a replay codepath, the wrapper-capture contract must be proven against real opencode JSONL. opencode also has `opencode run [message..] --format json` (non-interactive, emits raw JSON events on stdout) — that is the natural emission mode for the parser; rmux/TUI driving is unnecessary. Resonera deliberation 2026-06-29 sequenced this: validation gate first; recording-contract deliberation deferred until validation produces evidence."
  alternatives:
    - name: Run rmux against an arbitrary task to validate capture
      status: rejected
      description: Drive opencode TUI via rmux against an arbitrary dev task; check ktx.db for session+tool_calls. Validates parser against realistic event shapes but conflates automation-layer reliability with wrapper capture; non-deterministic content; no D12 conformance signal.
      win_condition: Would be chosen if opencode lacked non-interactive JSONL emission and required TUI driving. It does not — `opencode run --format json` exists.
    - name: Skip validation; build recording fixture and --replay directly
      status: rejected
      description: "Assume the wrapper works; mine opencode.db for existing sessions and build `--replay` against them. Skips the cost of proving capture against real opencode. Risk: builds --replay on a wrapper-confidence assumption with zero evidence."
      win_condition: Would be chosen if M3 bench_test.go had already exercised the wrapper against real opencode. It has not — the suite covers only a synthetic fake binary.
    - name: Sequenced validation gate with per-layer assertions and non-interactive invocation
      status: chosen
      description: "Validation = run `ktx run opencode run --format json -m <methodology-pinned-model> <methodology-pinned-prompt>`; a shell script emits per-layer [PASS]/[FAIL] verdicts across: (1) session row + matching agent; (2) tool_calls count > 0 with non-zero tokens_in/out; (3) cost derived non-NULL via D11 cache; (4) parser clean (no silent error swallowing); (5) opencode answer exact-match against methodology expected_output (score=1.0). Drop rmux — opencode has non-interactive mode. Recording contract deferred until validation produces evidence; on pass, the session id IS the candidate replay fixture source. M3 bench run's literal `ktx run opencode <prompt>` invocation is suspected-broken against real opencode (TUI default subcommand); that fix is a separate TODO."
      win_condition: All five per-layer verdicts PASS on a single validation run; the session id is queryable via `ktx list` / `ktx get` with non-NULL cost and score=1.0; `ktx bench report --methodology v1` surfaces it as a valid bench run.
  choice: Sequenced validation gate using `ktx run opencode run --format json -m <m> <prompt>` against the methodology-pinned task, with full D12 conformance acceptance bar broken into five per-layer [PASS]/[FAIL] assertions emitted by a shell script. Drop rmux — opencode's non-interactive mode emits the JSONL event stream the parser already handles. Recording-contract deliberation deferred until validation produces evidence; on pass, the session id is the candidate replay fixture. M3 bench run invocation gap (`ktx run opencode <prompt>` should be `ktx run opencode run --format json ...`) is a separate TODO.
  reasoning: "The wrapper has never been exercised end-to-end against real opencode. Building --replay on top of a wrapper-confidence assumption with zero evidence is the trap to avoid. The methodology-pinned task gives free D12 conformance data — if opencode answers correctly and cost derivation succeeds against the cached models.dev price, the resulting session id is simultaneously: (a) proof the wrapper captures correctly, (b) proof the parser handles real opencode JSONL, (c) proof the cost derivation pipeline works, and (d) the candidate fixture for D13 Tier 1 replay. Drop rmux because opencode's `--format json` flag emits the JSONL stream on stdout non-interactively; rmux adds automation-layer complexity without serving validation. Per-layer assertions isolate failures on first-pass — the base rate of failure on a never-exercised path is high; a shell script delivers the verdicts without modifying ktx itself, the cheapest YAGNI delivery vehicle. Recording contract stays deferred: the fixture IS the session id in ktx.db; serialization to a portable file format is an M5 concern, not today's. The M3 bench run invocation (`ktx run opencode <prompt>` literal) is suspected-broken against real opencode; that is a separate TODO, not part of this decision's scope."
  confidence: firm
  feeds_into: D13 Tier 1 validation gate; recording-contract deliberation (deferred until validation produces evidence); TODO entry for M3 bench run invocation fix; ARCHITECTURE.md Measurement-and-benchmark D13 addendum on validation before recording
