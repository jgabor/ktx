id: cavzdptazv
artifact: decisions
record:
  date: 2026-10-22
  question: How should ktx support Claude Code as a runtime, show its compression KPIs inside Claude Code, and run generated-adapter tests without depending on Bun everywhere?
  context: "D15 deferred the Claude Code mapping because it was not knowable from the codebase. Claude Code 2.1.304 documents a PostToolUse command hook whose hookSpecificOutput.updatedToolOutput replaces a built-in tool's result when the value matches the tool's output shape; a mismatching value is ignored, so the runtime keeps the original output. The Codex PostToolUse path cannot be reused: Claude Code treats decision block as feedback added next to the original output, and the closed Codex field set requires model and turn_id, which Claude Code does not send while it adds new fields across releases. Claude Code mods (plugins with a TypeScript hooks module, from 2.1.287, early access) can run a host command on a timer and draw a plugin status line and a pane; plugins cannot ship a statusLine setting. OpenCode runs plugins under Bun, while local version-manager shims break hermetic Bun and Node test runs because they resolve through HOME. No documented hook source exposes per-model-step token or cost telemetry; the transcript format is undocumented and OpenTelemetry needs a collector."
  alternatives:
    - name: Generated local plugin marketplace with a hook plugin and a KPI mod — ktx writes a local marketplace folder with one ktx plugin (PostToolUse command hook and a KPI mod); the user registers it once with claude plugin commands and ktx never edits Claude Code settings.
      status: chosen
    - name: Reuse the Codex PostToolUse ingress for Claude Code — Claude Code would show both the original and the compressed output, and the closed Codex field set would make every Claude Code call untrusted.
      status: rejected
    - name: Merge a hook into Claude Code settings.json — Mirrors the Codex installer but rewrites a large shared user file that already holds unrelated hooks and a status line, and the KPI display must be a plugin anyway.
      status: rejected
    - name: Collect Claude Code model telemetry from the transcript now — Relies on an undocumented file format and conflicts with firm telemetry decisions that admit only pinned runtime contracts.
      status: rejected
  choice: "Add Claude Code as a trusted hook ingress. The generated hook runs `ktx hook --runtime claude-code`; the explicit runtime argument is the adapter discriminator, like OpenCode's runtime field. A payload is trusted when hook_event_name is PostToolUse and session_id, tool_use_id, tool_name, tool_input, and tool_response are present with the expected types; unknown extra fields are allowed. Trusted calls derive deterministic identity from (claude-code, session_id, tool_use_id) under a dedicated provenance label and count as explicit success, except interrupted calls, which stay unknown. Version one matches only Bash: ktx stores and compresses stdout, returns the original tool_response with only stdout replaced through updatedToolOutput, and records background, image, interrupted, or non-string results as passthrough without running the pipeline. PostToolUseFailure is not recorded yet. The hook sets no timeout and the Claude Code branch never exits with status 2. `ktx init claude` generates a local marketplace with one ktx plugin that holds the hook and a mod that polls `ktx stats summary` and shows a band above the prompt and a /ktx pane; a status-line snippet is documented only as a fallback. Claude Code model telemetry is deferred to a structured discussion. The generated OpenCode plugin uses runtime-neutral node: APIs; adapter tests run under Node, and the generated-adapter readiness gate stays on Bun to match production OpenCode. Test harnesses resolve the real runtime binary before hermetic HOME and PATH changes."
  reasoning: The documented updatedToolOutput contract is the only path that replaces built-in tool output, and its shape check makes a wrong mapping fail safe. An open trust check survives Claude Code's additive field changes while the explicit runtime argument keeps dispatch unambiguous. Limiting version one to Bash stdout keeps the output mapping exact. A generated plugin keeps installation reversible without touching shared settings. Keeping one Bun gate preserves production fidelity while Node removes Bun from ordinary test runs.
  confidence: firm
  feeds_into: Hook ingress and help, correlation provenance, ktx init, generated Claude Code plugins, mage adapter refresh, adapter test harness, CI, documentation, and the Claude Code telemetry discussion.
