id: gspugoqrpd
artifact: decisions
record:
  date: 2026-07-01
  question: How does ktx compress tool_call output in-flight before the agent sees it, and what is the concrete `ktx hook` stdin/stdout protocol, the OpenCode plugin's `tool.execute.after` mutation contract, the latency/async policy, and the failure behavior that closes the runtime-token-cost gap (M1-M5 compress post-hoc; in-flight compression is the missing piece)?
  context: |-
    ktx has completed M1-M5 (ROADMAP verified 2026-07-01): it measures agent cost (M2), benchmarks agents (M3), reversibly compresses stored data via the explicit-verb path `ktx compress`/`ktx decompress` (M4, D14), and loads user-defined compression extensions via `ktx plugin` + external subprocess stages (M5, D21). But NONE of these reduce the agent's runtime context-window token cost: `ktx compress` writes to the `compressed` table post-hoc (the agent already saw the full output), and the OpenCode plugin (installed by `ktx init opencode`, template at internal/cli/init.go:121-183) calls `ktx write` which is PASSIVE recording only. The missing piece is the D1 (firm) design: 'At M4, `ktx hook` shells out to `ktx write` to persist the ORIGINAL tool_call, then returns the TRANSFORMED response on stdout — the database always holds the original, the agent receives the compressed version.'

    The OpenCode plugin API (https://opencode.ai/docs/plugins/) exposes `tool.execute.after(input, output)`. The published type definition declares: `tool.execute.after?: (input: {tool: string; sessionID: string; callID: string}, output: {title: string; output: string; metadata: any}) => Promise<void>`. The `Promise<void>` return plus a mutable `output` object matches the mutate-in-place convention. The `output.output` field is the STRING the agent sees as the tool's result. A mutation-test plugin was installed and CONFIRMED (2026-07-01): setting `output.output` to a marker string caused the agent to see the marker — mutation propagates to the agent context.
  alternatives:
    - name: "`ktx hook` binary command (D1 design made concrete)"
      status: chosen
      description: "A new flat verb `ktx hook` registered via dispatch (NeedsDB=true, PassthroughStdout=true). The plugin's `tool.execute.after` spawns `ktx hook` via Bun.spawn with stdin = D9 flat JSON tool_call envelope. In one process: (1) parse stdin into ToolCall; (2) persist original via shared PersistToolCall (DRY); (3) load ktx.toml; (4) apply D15 gate; (5) run pipeline or return source unchanged (passthrough/D15-skip); (6) write JSON envelope on stdout: {\"output\": string, \"compressed_id\": string|null, \"source_id\": string}. Plugin parses envelope, sets output.output = envelope.output. On any ktx failure, plugin leaves output.output unchanged (D14 conservative failure). KTX_SESSION_ID noop preserved (D10)."
      win_condition: With ktx.toml configuring stages, a real opencode tool_call produces a persisted original AND a compressed row, and the agent's context receives the compressed output; with no ktx.toml, identical to ktx write (passthrough, zero behavioral change). Mutation-test CONFIRMED output.output propagation (2026-07-01).
    - name: Plugin chains `ktx write` + `ktx compress` + `ktx read`
      status: rejected
      description: No new verb. Plugin calls ktx write, then ktx compress, then ktx read, parses JSON in TypeScript.
      rationale: Three subprocess spawns per tool_call. ktx read returns the whole record JSON, forcing TS-side JSON parsing — re-introducing the hallucination surface D21 eliminated. D1 (firm) already rejected this shape by designing ktx hook as the single per-event transform verb.
    - name: Async compression (persist original, return original, compress in background)
      status: rejected
      description: Plugin persists original via ktx write and returns the ORIGINAL output immediately. Background process compresses later.
      rationale: DEFEATS THE PURPOSE. The gap is reducing the agent's runtime context-window token cost. Returning the original and compressing in the background leaves the agent paying full token cost. The agent's context-window tokens are the expensive resource ktx exists to reduce; async does not touch them.
    - name: Proxy mode (wire-level interception, no plugin)
      status: rejected
      description: ktx as a foreground proxy between agent and model, intercepting tool results at the wire level.
      rationale: Violates 'no daemon' (vision). Introduces a long-running process on the critical path. The hook+mutation path achieves the same transform WITHOUT a daemon, and the successful mutation test closed this alternative.
    - name: "`experimental.chat.messages.transform` (transform full message history)"
      status: rejected
      description: A plugin subscribes to experimental.chat.messages.transform and rewrites tool output content before each LLM call.
      rationale: "Rejected as PRIMARY: experimental/unstable API; transforms ALL messages on every LLM call (O(n^2)); wrong timing (fires before LLM call, not after tool execution); strictly heavier than targeted output mutation. Retained as documented fallback IF mutation had failed — but mutation CONFIRMED, so this path is not needed."
  choice: "`ktx hook` is a new flat verb (D1's per-event transform command) that does all three steps in ONE process — persist original, run pipeline, return compressed bytes — closing the runtime-token-cost gap that M1-M5 left open. The plugin (updated `ktx init opencode` template) calls `ktx hook` via Bun.spawn with stdin = D9 flat JSON tool_call envelope, captures stdout (a JSON envelope), and mutates `output.output = envelope.output`. Single subprocess; DRY (in-process persistence via the shared `internal/db.PersistToolCall` — the same code `ktx write` calls — plus in-process compression via the shared `internal/pipeline` runner that `ktx compress` uses). The envelope `{\"output\": string, \"compressed_id\": string|null, \"source_id\": string}` carries the bytes the agent should see plus IDs for developer-side reversibility (`ktx decompress <compressed_id>` returns the original); the IDs NEVER reach the agent context (invisibility). `ktx hook` creates a compressed row ONLY when the pipeline actually transforms (no compressed row on passthrough / D15-skip). When no ktx.toml is present (passthrough default per D14), `ktx hook` persists the original and returns it unchanged with `compressed_id: null` — zero pipeline latency, identical behavioral outcome to today's `ktx write` path."
  reasoning: |-
    D1 is firm and already committed the design — D22 fills in the concrete protocol, plugin contract, and latency policy. The 'shells out to ktx write' phrase is honored as 'delegates to the write code path' (via shared PersistToolCall, in-process — strictly faster and DRY). D14 conservative-on-failure governs both layers: INSIDE ktx hook (D14 invariants + D15 gate); OUTSIDE at plugin level (any ktx hook failure -> plugin leaves output.output unchanged). The OpenCode plugin type contract supports mutation: `tool.execute.after`'s `output.output` (string field) mutated in place = the agent sees the compressed bytes. EMPIRICALLY CONFIRMED (2026-07-01): mutation-test plugin set output.output to a marker string, the agent saw the marker. Confidence is firm.

    Design rules (do not relitigate):
    - `ktx hook` is a single subprocess; persistence + pipeline + envelope formatting happen in-process, calling the same internal/db.PersistToolCall and internal/pipeline runner code. No nested subprocess.
    - Plugin mutation contract: set `output.output` to the envelope's `output` value.
    - Envelope shape: single JSON line on stdout: {"output": string, "compressed_id": string|null, "source_id": string}.
    - Compressed-row creation: ONLY when pipeline transforms. Identity/D15-skip returns source.output with compressed_id=null.
    - Conservative-on-failure at PLUGIN level: any ktx hook failure -> leave output.output unchanged. ktx is invisible; failures degrade to pass-through.
    - Sync compression (block tool result until compressed). Async rejected.
    - Critical-path timeout: ktx hook enforces a pipeline timeout (default 30s). Timeout -> return source.output unchanged + stderr warning. New vs D5/M5's deferred timeout — justified because ktx hook is on the agent's critical path.
    - D10 noop preserved: KTX_SESSION_ID set -> plugin skips ktx hook entirely.
    - `ktx hook` is a flat verb registered via dispatch with NeedsDB=true and PassthroughStdout=true.
    - compressLogic refactor prerequisite: return (compressedID, compressedOutput string, error) as values so both ktx compress and ktx hook consume the shared pipeline+persist code. Implemented as compressPipeline — the shared D15-gate + D14-pipeline core (returns compressedOutput, pipelineJSON, transformed bool, error); compressCore wraps it (always inserts); hookLogic wraps it (inserts only when transformed, passes 30s timeout).
  confidence: firm
  feeds_into: implementation of `ktx hook` verb (internal/cli/hook.go — new; dispatch Register with NeedsDB=true, PassthroughStdout=true); compressPipeline (internal/cli/compress.go — shared D15+D14 pipeline core; compressCore wraps with always-insert; hookLogic wraps with insert-when-transformed + 30s timeout); updated OpenCode plugin template (internal/cli/init.go ktxOpencodePluginTemplate — tool.execute.after spawns `ktx hook` via Bun.spawn, sets output.output = envelope.output, preserves KTX_SESSION_ID noop); envelope parser in the plugin; pipeline timeout (hookPipelineTimeout=30s hardcoded in hook.go; ktx.toml configurability deferred to Phase 2); migration of existing installed plugins (ktx init opencode --show detects old ktx-write template and suggests re-init); architecture documentation of the in-flight compression hook. The successful mutation test closes the rejected foreground proxy alternative.
