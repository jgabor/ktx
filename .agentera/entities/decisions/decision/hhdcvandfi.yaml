id: hhdcvandfi
artifact: decisions
record:
  date: 2026-09-13
  question: What additional stage metadata, ordering rules, or continuation semantics are justified by current pipeline evidence?
  context: The runner applies configured stages in order, conservatively skips failures, protects recognized JSON structure, and retains only a smaller final result. Current JSON-block behavior shows that truncation before compaction can break a block in mixed text that the whole-input JSON guard does not recognize. TestUnwrapResult_PipelineCannotDiscardJSONStructure explicitly rejects recognized wrapper-to-text extraction followed by truncation because the final guard still expects the original JSON format. These are source and regression-test observations, not demonstrated live ordering incidents. Retained controlled candidate evaluation also shows that smaller output can lose required facts; historical recovery-aware comparisons do not establish a benefit from new stage rules.
  alternatives:
    - name: Add bounded read-only ordering warnings and permit verified extraction from recognized wrappers, with protection for recognized inner JSON.
      status: chosen
    - name: Keep all behavior unchanged or provide documentation alone despite the demonstrated interactions.
      status: rejected
    - name: Automatically reorder stages or reject configurations based on potentially intentional ordering.
      status: rejected
    - name: Introduce a general stage-ordering checker, arbitrary format-conversion permissions, or stage-controlled stop signals.
      status: rejected
    - name: Treat every extracted result as unprotected text, even when it contains recognized JSON.
      status: rejected
  choice: In existing read-only configuration diagnostics, warn when an effective, valid built-in json-block follows an effective, valid built-in head, keep-ends, truncate, or token-budget. Explain that earlier truncation may break blocks before compaction and that compaction-first does not guarantee content preservation. Preserve configured order and existing diagnostic conventions; do not reject configurations, execute plugins, or emit repeated per-call warnings for this rule. Invalid arguments retain their existing diagnostics. Plugin overrides do not inherit built-in ordering assumptions. Permit an intentional format change only after verified extraction of the text from a wrapper shape already recognized by unwrap-result; a stage assertion or matching plugin name is insufficient. Apply existing JSON-recognition rules to the verified extracted content so recognized inner JSON remains protected against later structural damage. Unknown, ambiguous, malformed, error, or otherwise rejected wrappers gain no format-change permission. Preserve stage-error and empty-output fallback, recoverable originals, and the final size check against the original pipeline input. No general metadata taxonomy, conversion system, automatic ordering, or terminal-stage signal is selected.
  reasoning: "Ordering can destroy structure before a later stage sees it, but unusual order can also be intentional, so narrow warnings are more defensible than enforcement. Legitimate wrapper removal and accidental JSON damage require different treatment; verified extraction with inner-JSON protection addresses that distinction without trusting arbitrary plugins. Format validity and smaller size still do not prove useful facts were preserved. Confidence is provisional until implementation tests establish the warning scope, extraction checks, plugin behavior, fallback, recovery, and size contracts. Live task improvement remains unmeasured. Evidence: internal/pipeline/stages/json_block_test.go, internal/pipeline/stages/unwrap_result_test.go, internal/pipeline/runner_test.go, tools/bench/evidence/targeted-residual-candidate-evaluation.json, tools/bench/evidence/recovery-aware-comparison-v7.md, and .agentera/verification/read-only-pipeline-diagnostics.md. The user approved recording this direction and connecting the backlog; no implementation satisfaction was confirmed."
  confidence: provisional
  feeds_into: Complete discussion TODO mvnbhuotkn; remove the resolved Pipeline stage semantics architectural question; add separate implementation and verification TODOs for truncation-before-JSON-block diagnostics and verified wrapper extraction with inner JSON protection.
