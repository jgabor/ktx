id: hsgbnahzew
artifact: decisions
record:
  date: 2026-10-27
  question: What should an agent receive when it follows the recovery footer, which recovery calls stay uncompressed, and how is recovery measured across hook runtimes?
  context: "The recovery footer names `ktx read <source_id>`, which prints the whole tool_call record as one line of escaped JSON. In a verified 24-hour Claude Code sample (2026-10-25T19:46:52Z to 2026-10-26T19:46:52Z) under a keep-ends:2:1 default profile with no routes, 184 Bash calls invoked `ktx read` and 73 came back re-compressed with a new footer. Agents' first recovery in a transcript was almost always a plain `ktx read` (48 of 75 transcripts; 1 piped into a parser), and after a plain read passed, none re-parsed the same ID. Later recoveries switched to piping the record through python or jq: 80 such commands, all extracting only `output`, and 69 of the 81 piped extractions were re-compressed because the hook does not exempt recovery commands. After 47 of the 73 re-compressed reads the next step was Read or a redirect to a file; Bash redirects to /tmp or scratchpad files rose from about 5% of Bash calls in the prior week to 52%, and two coordinators told subagents to bypass the hook that way. `ktx read` and `ktx get` print byte-identical record JSON, and `ktx decompress <compressed_id>` prints the original output verbatim. The footer is emitted by the OpenCode, Claude Code and Codex hooks, while recovery attempts are recorded only for OpenCode inside a collection interval, matched on an exact `ktx read <id>` command whose JSON output is parsed for a byte-exact check. The earlier recovery footer decision named its own revisit trigger, observed sessions showing reactive recovery is insufficient, and this sample meets it. It also describes `ktx decompress` as returning compressed bytes, which contradicts the code."
  alternatives:
    - name: Footer keeps `ktx read <source-id>`, and `ktx read` prints the original output text
      status: chosen
    - name: Keep `ktx read` JSON and exempt recovery inside pipes
      status: rejected
    - name: Footer names `ktx decompress <source-id>`, with read and write kept as a JSON pair
      status: rejected
    - name: Make `ktx get` print the output text by default
      status: rejected
    - name: Add a new recovery verb
      status: rejected
    - name: Footer names both a JSON and a text command
      status: rejected
    - name: Footer names `ktx read <source-id> | jq -r .output` with an exact-command exemption
      status: rejected
    - name: Redesign the whole command surface before fixing recovery
      status: rejected
  choice: "The recovery footer keeps its single-line form and its `ktx read <source-id>` command. `ktx read <tool-call-id>` prints the original output verbatim instead of the record JSON; `ktx read` on a session ID exits with a usage error that names `ktx get <id>`. `ktx get` keeps printing the record JSON, and `ktx decompress` is unchanged. Every hook runtime records a Bash call whose whole command is a direct recovery invocation (`ktx read <id>`, `ktx get <id>` or `ktx decompress <id>`, optionally with `2>&1`) as intentional passthrough without running the pipeline. Pipes, command lists, redirections and substitutions that contain a recovery call compress as usual. The footer covers every hook runtime (OpenCode, Claude Code and Codex). Every hook runtime records recovery attempts linked to their source by the exact footer command, outside as well as inside collection intervals, with a byte-exact check of the printed text against the stored original. `ktx stats` reports recovery calls and recovered bytes next to savings, per profile. Benchmark recovery checks follow the text output; retained archives and historical methodologies stay unchanged, and a new methodology version is used if attempt or summary semantics change. This is the first step toward a command surface of three pairs: read and write for text, compress and decompress as pipe filters, and get and set for JSON records. Until that surface is decided, `ktx write` still takes a JSON record while `ktx read` returns text."
  reasoning: "Agents recover output, not records: every parse in the sample extracted only `output`, so the footer command should print text that needs no parser. Keeping the footer command unchanged avoids moving it now and again after the surface redesign, and keeps benchmark linkage and OpenCode recovery matching keyed on the same command. Nothing loses the record, because `ktx get` already prints the same JSON. Agents copy the footer command literally (48 of 48 first recoveries), so one command with a plain cue is enough. Exempting only direct recovery calls keeps the earlier rejection of a per-call bypass intact; text output removes the main reason agents piped. Recording recovery for every runtime and reporting it next to savings makes the cost of lossy profiles visible in numbers, which the headline reduction alone hid. The wider surface redesign touches the sidecar ingress, benchmarks, docs and the stable-surface promise, so it gets its own discussion instead of being settled here. Conditions: (1) after this ships, re-measure how often agents slice recovery output through pipes and whether sliced recoveries are cut again; (2) recovery-attempt evidence must work outside collection intervals, which may need a schema change. Deferred: flagging redirect-then-Read bypasses waits until non-Bash Claude Code tools are recorded."
  confidence: firm
  feeds_into: Supersedes the record-JSON recovery output, the OpenCode-only scope and the decompress description in the earlier recovery footer decision; its single-line footer amendment, the anti-worsening gate, the opt-in footer and the content-only artifact invariants stand. Feeds the direct-recovery passthrough bug, `ktx read` text output, recovery evidence for all runtimes, net recovery cost in stats, the benchmark recovery check, the command surface discussion, and the I/O and query separation section of ARCHITECTURE.md.
