id: iklzthoapi
artifact: decisions
record:
  date: 2026-07-27
  question: What forward-upgrade, executable-identity, schema-incompatibility, database-surface, and hermetic verification contracts should govern ktx before downstream implementation?
  context: "Source call-site characterization found two primitives: ResolvePath is DB-free; OpenReadOnly is genuinely read-only and never creates or migrates; Open creates a missing database and migrates an existing supported database. A live schema Y above binary maximum X already fails before migration. Generated OpenCode currently discards which ktx and invokes bare ktx for every callback. Ordinary callbacks preserve output on failures, while required benchmark collection fails closed. Schema 8 and ordinary safe auto-migration must remain unchanged in this decision-only task."
  alternatives:
    - name: Adopt one explicit database-surface matrix, a DB-free versioned binary-capability identity, stable schema-incompatibility diagnostics and plugin-instance deduplication, a genuinely read-only doctor, and per-invocation hermetic development roots.
      status: chosen
    - name: Keep resolving or invoking bare ktx per callback without a digest-bound maximum-schema identity.
      status: rejected
    - name: Treat every read-looking command as read-only despite Open call sites, or let doctor migrate.
      status: rejected
    - name: Suppress schema errors by message text, share suppression across process lifetimes, or suppress distinct errors.
      status: rejected
    - name: Use a shared KTX_DB or ambient live application path for full-suite verification.
      status: rejected
    - name: Replace ordinary safe auto-migration with explicit-only migration, or recover from Y>X by lowering user_version.
      status: rejected
  choice: "Classify production surfaces as follows. DB-free, with neither fresh creation nor existing upgrade: ResolvePath; global and command help; version; init; config and plugin management; db path; replay-file; compare preflight; corpus generation; agent identity/capabilities; and evidence preflight. DB-free does not mean side-effect-free: their separately documented non-database filesystem or process effects remain. Genuinely read-only, with neither creation nor migration: OpenReadOnly, db report, bench export, summarize, and validate; absent databases are not created. Open-backed fresh-creation and existing-upgrade surfaces: dispatcher get/read/list/stats/decompress and write/compress/hook; run; telemetry database subcommands; and bench normal run/replay/report. Doctor currently has both Open capabilities despite read-only wording and must downstream use genuinely read-only access, report that an upgrade is required, and never migrate. Normal compare and rank create fresh isolated per-attempt owner databases only and reject reused attempt directories, so they are fresh-creation-capable but not existing-attempt-upgrade paths. Introduce downstream a DB-free ktx.binary-capabilities/v1 response identifying the effective binary by canonical executable path, executable SHA-256, build version, and maximum supported database schema. Generated OpenCode plugins resolve and canonicalize one ktx candidate once, verify that response, and invoke that pinned absolute path thereafter. A database user_version Y greater than binary maximum X is schema-incompatible, exits 5, and returns actual schema Y, maximum X, canonical database path, plus canonical binary path, digest, and build version. Ordinary plugin deduplication uses exactly error class + binary digest + canonical database path + actual Y + maximum X for one plugin instance. After the first matching incompatibility it skips repeated database opens and preserves original tool output; distinct keys are never suppressed. Required benchmark collection always propagates the incompatibility and fails closed. Plugin process restart resets suppression; no in-process binary-change detection is promised. Recovery installs and verifies a binary supporting Y or newer and never lowers user_version. Preserve ordinary safe auto-migration after installation. Mage and CI full-suite verification must unset KTX_DB and allocate one unique disposable HOME and XDG_DATA_HOME, XDG_CONFIG_HOME, XDG_CACHE_HOME, and XDG_STATE_HOME per invocation while keeping Go, Bun, and linter caches separate; development and rehearsal never access the ambient live path."
  reasoning: The matrix distinguishes names and intent from actual Open behavior, including fresh creation versus existing upgrade, so downstream work can remove accidental writes without disabling intended migration. A capability response obtained from the candidate binary binds maximum-schema support to the exact executable that callbacks will use; pinning its canonical absolute path eliminates PATH drift, while process-restart reset avoids unsupported in-process replacement detection. A typed exit and complete structured identity make incompatibility machine-actionable. The full key suppresses only repeated ordinary failures from the same binary/database/schema state, preserving output and all distinct errors, while required evidence remains fail-closed. Read-only doctor prevents diagnosis from changing the database. Per-invocation application roots reflect independent benchmark ownership and prevent test contamination or ambient live-database access without discarding reusable language/tool caches. Installing a forward-capable binary is the only safe Y>X recovery because lowering user_version would misrepresent on-disk schema.
  confidence: firm
  feeds_into: Plan task pitdhqcgsp audit, binary-capability command and generated OpenCode pinning, database open-mode corrections, doctor diagnostics, schema-incompatibility exit and structured errors, plugin suppression, Mage/CI hermetic verification, and downstream tests and documentation.
