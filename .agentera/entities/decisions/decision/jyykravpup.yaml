record:
  date: 2026-09-06
  question: What recording resource lifecycle is feasible without changing accepted sizes, TEXT storage, completion authority, or last-copy retention?
  context: "Active task jfgymxttel in plan hljjrlykxb operates under standing authority yohiahsqjv, Linux scope ygcysqxcfr and terminal boundary llshvynohy. The supplied analyze session corrected an initial impossibility claim: the existing SQLite length limit can bound recording collection, but publication and replay remain whole-value operations. Local bounded probes and the remaining benchmark gate are documented in .agentera/verification/recording-resource-lifecycle.md."
  alternatives:
    - name: Bounded private recording spool and incremental hash, existing-limit acceptance, whole-value publication/replay with explicit proportional budgets; retain the unresolved complete-benchmark resource gate.
      status: chosen
    - name: Keep whole-stream capture buffers; this retains avoidable collection growth and loses recoverable temporary bytes on interruption.
      status: rejected
    - name: Add a smaller recording or benchmark cap; this rejects previously accepted inputs without authority.
      status: rejected
    - name: Replace TEXT/schema or extract unsafe driver handles for incremental blobs; this exceeds current scope and approval.
      status: rejected
    - name: Claim spooling plus ReadAll is fully streamed, or truncate benchmark metrics at the recording limit; these hide remaining memory growth or change results.
      status: rejected
  choice: |-
    Select a 64 KiB reusable recording transfer slab and incremental SHA-256 into private owner storage. Recording-only heap overhead target is 8 MiB over a matched control. Bound active recording payload by the existing effective SQLITE_LIMIT_LENGTH L, queried without modification on the actual reserved publication connection; before reservation use only the existing compile ceiling of 1,000,000,000 bytes. Re-query on connection replacement and retain existing writer/schema/retry boundaries without holding a writer lease during child execution. Stop recording only after bytes exceed that existing boundary; forwarding remains unrestricted by it. Attempt ordinary INSERT for every completed N <= L: row headers and six other columns count, so do not subtract guessed metadata or impose a new cap. Retain TEXT and existing APIs.
    Choose qualification RSS targets of 128 MiB + 16N for publication including post-commit verification, and 256 MiB + 64N for replay/accepted-size benchmark processing. At the compile ceiling these are approximately 15.03 and 59.85 GiB, not input-independent low memory. Choose 64 MiB + 4L marginal isolated publication-storage allowance, including spool and SQLite journal/page work. These are future test thresholds, not proven worst-case bounds or runtime rejection limits. Budget failures require correction or an explicit approval gate, never silent truncation. Per-operation bounds are not a global retention quota across arbitrarily many failed recordings.
    The actual run/attempt owner creates private 0700/0600 material within its owned data/archive boundary, never an external generic temporary provenance path. Existing completed producer/session receipt authority, including normal nonzero exits, remains unchanged. Only completed intact bytes may be inserted. The database transaction owns publication; the same owner verifies exact row identity, linkage, size and recomputed hash before deleting redundant temporary bytes. On publication failure or uncertain commit retain the completed private spool and truthful unavailable/unverified status; reconcile exact identity before retry. Interrupted, size-crossed, write-failed or uncertain-completion material stays partial/unknown and never becomes completed replay. Preserve committed evidence and existing forwarding/process settlement. Recovery remains explicit and owner-controlled; no new public recovery command or automatic promotion is selected. Never automatically prune the last partial, orphaned, failed-publication or durable copy. Durable deletion remains user-owned.
    This selects a feasible limited recording improvement, not a full PERF1 fix. Current benchmark stdout/stderr, scoring and model-step processing are not bounded by L. Before qualifying mljcarlewi, resolve the neutral architecture question and reciprocal TODO task at benchmark-recording-resource-coverage: establish contract-preserving bounded consumers for independently accepted streams including >L, or obtain explicit scope/contract approval. A second unbounded spool or truncation at L does not satisfy this gate. No product implementation or lifecycle completion is authorized by this receipt.
  reasoning: The simplest authorized recording boundary is the database's existing inability to persist a value above L, not a newly invented acceptance ceiling. At 16 MiB the local spool/hash process peaked at 15,392 KiB RSS versus 46,416 for buffer capture, but publication and replay still reached 102,300 and 102,484 KiB. Dense-step evidence also increases metrics work. An actual-connection probe returned L=1,000,000,000; lowering only its disposable test limit to 4,096 accepted 3,800 bytes but rejected 4,096 and 4,097, confirming row overhead. Measurements justify a collection benefit and explicit proportional budgets, not a worst-case or whole-benchmark claim. Private retained spools reconcile completion-only publication with last-copy preservation without schema change.
  confidence: provisional
  feeds_into: hljjrlykxb/jfgymxttel remains in_progress; mljcarlewi remains pending with the complete-benchmark gate unresolved. PERF1 planning disposition only. Completed producer ownership jgvodxuxul and progress vjwekaemvb remain authoritative; archive confinement, prior uncommitted work and user-owned satisfaction remain.
