id: kaassitjyj
artifact: decisions
record:
  date: 2026-06-30
  question: What is the recording contract for `ktx bench run --replay <session-id>` — what gets persisted when a real OpenCode session is captured, in what shape, where it lives, and how `--replay` reads it back to reproduce parser/cost numbers without re-invoking the agent?
  context: "Decision 13 (firm) locked Tier 1 as `ktx bench run --replay <session-id>` reading a recorded real OpenCode session and replaying it through ktx's pipeline with a single-invocation internal A/B; the `--replay` flag goes on the existing M3 `ktx bench run` command, pre-M4 validates parser and cost-derivation accuracy plus wrapper overhead, post-M4 adds the compression delta. Decision 16 (firm) validated the wrapper path against real opencode 1.17.8 (5/5 per-layer PASS, bench_run id `ccsbkoluqgkgtelc`, paired session_id `sdeloqgthcgasfld`) and declared that bench_run id the candidate replay fixture source. Note: D16's text referred to the 'session id' as the candidate fixture source, but the id actually recorded and queryable via `ktx bench report` is the bench_run id; the session_id was found at runtime by `findWrapperSession` (bench.go:1222) and was not persisted in the bench_runs row (the bench_runs table has no session_id column). D16 inherited a session-id/bench_run-id conflation; D20 corrects it by recording both ids explicitly; D16 explicitly deferred the recording-contract format until validation produced evidence — this is that deliberation. Decision 17 (provisional) reframed D16's L2/L3 to read tokens/cost/model from the captured JSONL stream (step_finish events), not from persisted tool_call rows, because OpenCode 1.17.8 emits tokens/cost on the step-aggregate `step_finish` event, not on per-tool `tool_use` events — the wrapper (run.go teeAndParse, lines 385-418, verified) persists only tool_use rows via parser.ParseEvent and passes step_finish/text events through to stdout without persisting them, so tool_call rows are NULL-by-design for tokens/cost/model against real OpenCode. The captured JSONL stream is therefore the authoritative source for tokens/cost/model (D17); the helper extractStreamMetrics (bench.go:1384-1447, verified) already parses it. Decisions 18 and 19 (firm) proved the wrapper path works for v1 (extractFormat passthrough fix + argv-doubling fix); D19's feeds_into states the wrapper-vs-sidecar tension is 'no longer urgent' and to 're-deliberate only if --replay cost reconstruction from the captured JSONL stream proves insufficient.' The captured stream is NOT currently persisted anywhere: runBenchRun (bench.go:997-1050, verified) spawns `ktx run opencode run --format json ...` as a subprocess, captures its stdout into a bytes.Buffer, passes the bytes to extractStreamMetrics and extractAgentOutput, then discards the buffer on return. The current ktx.db schema (open.go, verified) has sessions, tool_calls (D15 columns included), bench_runs, and compressed (D14). D14 established the precedent that a new persisted ktx artifact type gets a new ktx.db table — `compressed` (id, source_id, output, content_hash, pipeline, timestamp) — NOT a file, NOT a column on an existing table, because injecting non-evidence rows into tool_calls would corrupt the M3 cost-summed evidence set. Architectural constraints in force: boring before clever (stdlib first, no daemon), one Go binary, reversibility before aggression, cost is the contract (evidence persisted to the database; numbers not adjectives), router wins/algorithm loses, YAGNI, D3 (16-char nanoid addressability), D7 (tool_calls INSERT-only append-only), D9 (content_hash recomputed from stored data), D6/D8 (ktx.db is the single record store). Four fixture-format candidates were evaluated: (a) re-read ktx.db by session id with no new persistence; (b) serialize the captured JSONL stream to a portable committed file; (c1) add a captured_stdout TEXT column to sessions; (c2) add a new recorded_streams table to ktx.db; (d) hybrid — persist in ktx.db (c2) plus an export/import surface for CI portability."
  alternatives:
    - name: Re-read ktx.db by session id — no new persistence
      status: rejected
      description: Do not persist the raw stream; --replay reads the session's tool_call rows and the bench_runs row from ktx.db and reconstructs tokens/cost from them.
      win_condition: Would be chosen if the per-event stream carrying tokens/cost/model were already in the database.
      rationale: Rejected because D17's core finding, verified in code (run.go:385-418 teeAndParse persists only tool_use via parser.ParseEvent; step_finish and text events are passthrough-only and never reach the database), means the per-event stream is simply not persisted. The tool_call rows carry NULL tokens/cost/model for OpenCode sessions by documented design (parser.go:150-158; m2-acceptance.md 'Surprises' §3). The bench_runs row carries aggregate scalars (tokens_in=41, tokens_out=2, cost=0.002597825 for the D16 session), not the per-event stream. --replay cannot re-parse the stream through parser.ParseEvent (there is no stream to parse) and cannot re-aggregate via extractStreamMetrics (there are no step_finish events). The pre-M4 consistency check (replay vs original) is therefore impossible without persisting the stream. Rejected unless paired with a persistence change, at which point this candidate collapses into (c1), (c2), or (d).
    - name: Portable file fixture (committed .jsonl)
      status: rejected
      description: A fixture-as-file at `.agentera/verification/fixtures/<session-id>.jsonl` (or similar); --replay reads the file, re-parses through the parser pipeline, re-aggregates via extractStreamMetrics. Shareable across machines and CI runners; git-trackable.
      win_condition: Would be chosen if the captured stream were a human-authored reproducibility CONTRACT (like D12's methodology-v1.yaml) rather than machine-captured run evidence.
      rationale: "Rejected on three grounds. (1) Two sources of truth: the bench_runs row lives in ktx.db; the stream would live in a repo file; the two can drift (a re-capture updates one but not the other). D6/D8 established ktx.db as the single record store and D17 declared the stream the authoritative cost evidence — authoritative cost evidence belongs in the database, not a sibling file. (2) D14 precedent: when ktx introduced a new persisted artifact type (compressed outputs), it created a new ktx.db TABLE (the `compressed` template: id, source_id, output, content_hash, pipeline, timestamp), not a file; the captured stream is a new machine-captured ktx artifact of the same kind, so it gets a table, following D14. D12's methodology-v1.yaml is a committed file because it is a human-authored INPUT CONTRACT, not machine-captured run evidence — a different category. The existing `.agentera/verification/fixtures/opencode-tool-use.jsonl` is a curated TEST fixture, not a captured-run evidence row; it does not override the D14 artifact-to-table precedent for captured-run evidence. (3) file-only does not help sessions captured before this feature ships and requires a path-resolution convention. Portability for CI is a real requirement (D13 per-commit gate) but is addressed via export from the ktx.db source of truth (see the deferred hybrid alternative and feeds_into), not by making the file the source of truth."
    - name: sessions.captured_stdout TEXT column
      status: rejected
      description: Add a captured_stdout BLOB/TEXT column to the sessions table; --replay reads it by session_id. One source of truth; session_id is the only key needed.
      win_condition: Would be chosen if the sessions table's update cadence matched a set-once captured stream.
      rationale: "Rejected because sessions is a roll-up table (D7: INSERT on open, UPDATE roll-up counters/timestamps/ended_at on each call and on close) — a captured stream is set-once at capture time and never updated (INSERT-only, the D7/D14 append-only ethos). Mixing two update cadences (per-call roll-up UPDATE vs set-once stream INSERT) in one table is a schema smell and complicates the append-only reasoning D7 guards. It also denormalizes a potentially large TEXT (multi-step sessions emit many events) into the roll-up row that `ktx list`/`ktx get` read on every session query. D14's separate-evidence-from-artifacts principle applies: the captured stream is session-LEVEL evidence distinct from the sessions roll-up counters — a dedicated table (c2) is the clean separation, just as `compressed` is separate from `tool_calls`."
    - name: recorded_streams table in ktx.db
      status: chosen
      description: "New INSERT-only table `recorded_streams`: id (D3 16-char nanoid PK), session_id (NOT NULL FK to sessions.id), bench_run_id (NOT NULL FK to bench_runs.id), stream_text (TEXT — the verbatim JSONL stream), content_hash (D9 SHA-256 of stream_text), stream_format (TEXT, e.g. 'opencode-jsonl-1'), captured_at (TEXT RFC3339Nano). One row per captured bench run. Capture trigger: `ktx bench run` (live) ONLY — runBenchRun already holds the captured agentStdout bytes (bench.go:998-1050); after extracting metrics and inserting the bench_runs row it INSERTs the stream into recorded_streams keyed by the found session_id and the inserted bench_run_id. `ktx run` (the wrapper subprocess) stays a transparent proxy (D1) and does NOT persist the stream — no unbounded ktx.db growth, no wrapper behavior change. `--replay <session-id>` reads recorded_streams + bench_runs from ktx.db, re-parses the stream through parser.ParseEvent (validates parser accuracy: tool_use count matches persisted tool_call_count), re-aggregates tokens/cost via extractStreamMetrics (validates cost-derivation accuracy: re-derived tokens/cost match the original bench_runs row), and emits a headline comparing replay-derived vs original. Migration: idempotent CREATE TABLE IF NOT EXISTS in db.Open schemaStatements (same pattern as the compressed table — a new table, not an ALTER TABLE column add), self-healing for pre-existing databases."
      win_condition: A `ktx bench run opencode <model> <task>` invocation persists a bench_runs row AND a recorded_streams row; `ktx bench run --replay <session-id>` re-parses the recorded stream, re-derives tokens/cost via extractStreamMetrics, and emits a consistency headline (replay-derived vs original bench_runs row) with zero agent calls; pre-M4 the comparison is 'replay vs original' (consistency check), M4 extends the same stream to 'baseline (no compression) vs treatment (compressed)'.
    - name: "Hybrid: ktx.db table + export/import surface"
      status: deferred
      description: Persist the stream in ktx.db (the chosen recorded_streams table) AND provide `ktx bench export <session-id>` (writes the stream + original bench_runs metrics to a portable .jsonl fixture) plus `--replay <file>` (reads the fixture directly) for CI portability.
      win_condition: Would be chosen when the D13 per-commit CI gate (TODO.md:31 CI wiring) lands and demands a fixture portable to CI runners.
      rationale: "Deferred, not rejected: export/import is REQUIRED for the D13 per-commit CI gate (the gate runs `ktx bench run --replay` on a CI runner that has no captured session), but it belongs to CI wiring (TODO.md:31 — blocked on the --replay TODO, not started) rather than to the recording contract (D20). YAGNI defers building the export/import surface until CI wiring demands it. The chosen recorded_streams table does NOT preclude portability: export is a trivial future read (SELECT stream_text, write to file) and `--replay` is extensible to accept a file path without breaking the session-id contract. D20's scope is the recording contract (what/how/where --replay reads); portability is the adjacent CI-transport concern, explicitly fed forward. (The captured stream is a self-contained JSONL recording; a portable fixture would carry the stream plus the original bench_runs comparison metrics so a file-based --replay can run the pre-M4 consistency check without the capture machine's ktx.db.)"
  choice: "Persist the captured JSONL stream in a new INSERT-only `recorded_streams` table in ktx.db, following D14's `compressed` table template: id (D3 16-char nanoid PK), session_id (NOT NULL FK to sessions.id), bench_run_id (NOT NULL FK to bench_runs.id), stream_text (TEXT — the verbatim JSONL stream exactly as opencode emitted it), content_hash (D9 SHA-256 of stream_text), stream_format (TEXT, e.g. 'opencode-jsonl-1'), captured_at (TEXT RFC3339Nano). One row per captured bench run. Capture trigger: `ktx bench run` (the live bench path) ONLY — runBenchRun already holds the captured agentStdout bytes in memory (bench.go:998-1050, verified); after extracting stream metrics and inserting the bench_runs row it INSERTs the stream into recorded_streams keyed by the found session_id and the just-inserted bench_run_id. `ktx run` (the wrapper subprocess) stays a D1 transparent proxy and does NOT persist the stream — no unbounded ktx.db growth, no wrapper behavior change. `--replay <session-id>` loads the recorded_streams row by session_id, loads the original bench_runs row from the FK, re-parses the stream through parser.ParseEvent (validates parser accuracy: replayed tool_use count matches originally-persisted tool_call_count), re-aggregates tokens/cost via extractStreamMetrics (validates cost-derivation accuracy: re-derived tokens/cost match the original bench_runs row), and emits a consistency headline comparing replay-derived vs original. Schema migration: idempotent CREATE TABLE IF NOT EXISTS in db.Open schemaStatements (same pattern as the `compressed` table — a new table, not an ALTER TABLE column add), self-healing for pre-D20 databases; no migration function needed beyond the existing schemaStatements list. Pre-M4: `--replay` vs original consistency check (parser accuracy + cost-derivation accuracy + wrapper overhead). Post-M4: the same recorded stream is re-processed through the compression pipeline (baseline no-compression vs treatment with-compression) per D13; the recorded_streams schema is stream-only. Note: M4 A/B has a persistence gap — D14's `compressed.source_id` FK requires a persisted tool_call, but --replay parses in-memory; the no-schema-change claim is aspirational, not contractual (see design rules and confidence). The D16 candidate fixture (bench_run id `ccsbkoluqgkgtelc`, paired session_id `sdeloqgthcgasfld`, produced via validate-bench.sh / `ktx bench run` chain) is invalidated by D20: no recorded_streams companion exists for it because the stream was discarded by runBenchRun's in-memory bytes.Buffer before D20's persistence step landed; a fresh `ktx bench run opencode <model> <task>` invocation produces both the bench_runs row AND its recorded_streams companion under D20's contract. Portability (export/import for CI runners) is deferred to CI wiring (TODO.md:31) per YAGNI — the ktx.db table does not preclude a future `ktx bench export <id>` that reads stream_text and writes a portable .jsonl fixture, and `--replay` is extensible to accept a file path without breaking the session-id contract."
  reasoning: |-
    Five architectural constraints settle D20, and the choice falls out of applying them rather than from any novel insight.

    (1) 'Cost is the contract — evidence persisted to the database; numbers not adjectives.' The captured JSONL stream IS the authoritative cost evidence per D17 — the wrapper-persisted tool_call rows carry NULL tokens/cost/model for OpenCode because OpenCode 1.17.8 emits M2 fields on `step_finish` (step-aggregate), not on `tool_use` (per-tool); verified in run.go:385-418 teeAndParse which persists only tool_use via parser.ParseEvent and passes `step_finish`/`text` events through to stdout without persisting them. D17 declared the stream the authoritative source but did not define where it lives — D20 closes that gap: the cost evidence goes in the database, not in a sibling repo file or an in-memory buffer discarded on function return. A portable .jsonl file (candidate b) is rejected because the bench_runs row the stream is paired with already lives in ktx.db (two sources of truth, drift risk) and because the existing `.agentera/verification/fixtures/opencode-tool-use.jsonl` is a curated TEST fixture, not a captured-run evidence row — D16's script-captured session id is machine-captured run evidence, a different category that follows the D14 artifact-to-table precedent, not the D12 human-authored-contract precedent. A sessions.captured_stdout column (candidate c1) is rejected because sessions is a D7 roll-up table with per-call UPDATE cadence, while a recorded stream is set-once INSERT-only — mixing two update cadences in one table is a schema smell D14 explicitly refused when it created `compressed` rather than polluting tool_calls. D14's precedent (separating `compressed` from `tool_calls` because injecting non-evidence rows into the cost-summed evidence set would corrupt M3 bench aggregation) applies transitively: the captured stream is session-level evidence distinct from the sessions roll-up counters and from tool_calls per-row evidence; a dedicated table (recorded_streams) is the clean separation, exactly as `compressed` was the clean separation for compressed artifacts.

    (2) 'Boring before clever — Go stdlib first, no new runtimes, no daemon.' No new infrastructure. The migration follows the exact template `compressed` established (idempotent CREATE TABLE IF NOT EXISTS in schemaStatements at open.go); no migration framework, no versioning code, no new dependency. The capture code path already exists — runBenchRun already holds agentStdout bytes in memory (bench.go:998-1050, verified); D20 adds one INSERT statement after the bench_runs INSERT that already happens. extractStreamMetrics (bench.go:1384-1447, verified) already parses the stream; `--replay` reuses it unchanged. parser.ParseEvent (the single source of truth for the ktx tool_call shape) is invoked by `--replay` verbatim; the parser is exercised against the recorded stream without spawning the agent.

    (3) D13's locked-in design rules. The `--replay` flag goes on the existing M3 `ktx bench run` command (not a new subcommand); single-invocation internal A/B (not two commands); pre-M4 validates parser and cost-derivation accuracy and measures wrapper overhead; post-M4 adds the compression delta. D12 scoring contract (exact-match, N=1, cost_per_correct) is firm and D13 governs the harness, not the scoring — D20 does not touch the scoring contract, it defines the persistence contract that `--replay` reads. The recorded_streams table is the harness-side artifact (D13 Tier 1); the methodology-v1.yaml file stays for the live `ktx bench run` path per D13's 'replay benchmark uses a recorded session fixture, not the methodology file's pinned task' rule; the recorded stream paired with its bench_runs row IS that fixture.

    (4) YAGNI. D20 ships the minimal contract: persist the stream, `--replay` reads it, pre-M4 consistency check. The M4 compression delta (baseline vs treatment via the same stream) is acknowledged as the post-M4 extension but NOT implemented — the recorded_streams schema does not need a compressed counterpart column because the compression pipeline (D14) writes its artifacts to the existing `compressed` table (with source_id referencing tool_calls.id, not recorded_streams.id). The M4 A/B comparison loads the recorded stream once, parses+persists the tool_call outputs into the in-memory replay fixture, runs `ktx compress` on each tool_call's output via the existing `compressed` machinery, recomputes the cost aggregation against the (compressed) outputs, and emits the baseline-vs-treatment delta — no new column needed on recorded_streams. (Caveat: the M4 A/B persistence gap — `compressed.source_id` requires a persisted tool_call but --replay parses in-memory — may require schema work; the 'no schema change' claim is aspirational, see design rules.) Portability (`ktx bench export <session-id>` and `--replay <file>`) is deferred to CI wiring (TODO.md:31); D20's table does not preclude it but YAGNI says build the export surface when the CI gate demands it, not now.

    (5) D17's residual tensions. D17 flagged two provisional tensions. (a) Wrapper-vs-sidecar path for v1: D19's feeds_into deferred this as 'no longer urgent; re-deliberate only if --replay cost reconstruction from the captured JSONL stream proves insufficient.' D20 RESOLVES this for the --replay codepath: `--replay` reads the recorded stream and re-aggregates via extractStreamMetrics (already proven against the D16-PASS session); the wrapper path is sufficient for v1 replay because the captured stream carries the tokens/cost/model (D17 reframe) and D20 persists that stream where it can be replayed. Cost reconstruction is sufficient for --replay because the stream IS persisted; the sidecar path is not needed for replay. Future use cases needing live cost tracking (not replay) may revisit the sidecar question independently — D20's scope is the recording contract for --replay, not a global sidecar verdict. (b) L3(b) D11 derivation overlap with cost-pipeline verification territory: D20 RESOLVES this too — the L3(b) derivation branch IS the pre-M4 `--replay` consistency check. `--replay` re-runs extractStreamMetrics AND D11 derivation (tokens + model → cached price → derived cost) from the freshly-persisted stream and compares the replay-derived cost to the originally-recorded bench_runs row. The two concerns are unified by design, not duplicated: the recorded stream is where both the provider-reported cost (step_finish.part.cost, L3 branch (a)) AND the derivation inputs (step_finish.part.tokens + model identifier, L3 branch (b)) live, and `--replay` exercises both end-to-end in one consistency check.

    Design rules (do not relitigate):

    - recorded_streams is INSERT-only (D7 ethos). One row per captured bench run. No UPDATE path; no DELETE path (reversibility via originals never deleted — D7). One-to-one pairing with bench_runs (each `ktx bench run` invocation produces exactly one bench_runs row and exactly one recorded_streams row; re-running `ktx bench run` against the same task produces new rows because temperature>0 non-determinism means streams differ — D12 documented limitation).
    - recorded_streams.session_id REFERENCES sessions(id); recorded_streams.bench_run_id REFERENCES bench_runs(id). Open enables foreign_keys per connection (open.go).
    - recorded_streams.content_hash is SHA-256 of stream_text, recomputed at write time (D9). ktx owns integrity; the caller does not supply content_hash.
    - Capture trigger: `ktx bench run` ONLY. `ktx run` (wrapper subprocess) stays a D1 transparent proxy — agent stdout passes through untouched, only tool_use-derived tool_call rows persisted. No new write to ktx.db from the wrapper path. validate-bench.sh is unaffected (it invokes `ktx run` directly, not `ktx bench run`); its sessions do NOT acquire recorded_streams companions.
    - `--replay` read path: loads recorded_streams by session_id; session-id is the documented --replay arg per D13. bench_run_id is an internal FK (for JOIN to bench_runs), not a public --replay arg. Note: the bench_runs table has no session_id column; recorded_streams is the first persistent session-to-bench_run linkage. Not-found → exit 2 (D4 contract).
    - Pre-M4 comparison: replay-derived metrics vs original bench_runs row. The consistency check's value is NOT re-computation verification (extractStreamMetrics is deterministic — re-running it on the same stream produces identical output by construction). The real value is: (a) stream integrity — content_hash of the recorded stream_text matches what was captured; (b) parser determinism — re-parsed tool_use count via parser.ParseEvent matches the originally-persisted tool_call_count; (c) price cache drift detection — D11 derived cost (tokens + model -> cached price -> derived cost) may differ if `ktx prices update` ran between capture and replay, surfacing cache drift as an actionable signal. Overhead: replay duration vs original wrapper duration.
    - Post-M4 comparison: same stream re-processed through the compression pipeline. Persistence gap acknowledged: D14's `compressed` table has `source_id REFERENCES tool_calls(id)`, but --replay parses tool_calls IN MEMORY from the recorded stream (not persisted). How M4's `ktx compress` writes to `compressed` without a persisted tool_call row to FK-reference is UNRESOLVED — either --replay must persist in-memory tool_calls to ktx.db first (adds tool_call rows not in the original session, complicating M3 bench aggregation), or `compressed.source_id` must be relaxed, or a new `replay_artifacts` table is needed. The 'no schema change between pre-M4 and post-M4 recorded_streams' claim is aspirational not contractual; M4's --replay A/B will determine the actual schema requirement. This gap is why D20's confidence is provisional, not firm.
    - Schema migration: idempotent CREATE TABLE IF NOT EXISTS in db.Open schemaStatements, same pattern as the `compressed` table (open.go). No ALTER TABLE column add required (new table, not column on existing table). Self-healing for pre-D20 databases; pre-existing ktx.db files gain the table on next open.
    - D16 fixture incompatibility: the candidate fixture D16 declared (bench_run id `ccsbkoluqgkgtelc`, paired session_id `sdeloqgthcgasfld`, captured by validate-bench.sh and the `ktx bench run opencode glm-5.2-short-fast-flex addition_v1` chain per the M3 invocation fix TODO) has no recorded_streams companion and CANNOT be retroactively persisted — the stream was discarded by runBenchRun's in-memory bytes.Buffer when the function returned before D20's persistence step existed. D20 requires a fresh `ktx bench run opencode <model> <task>` invocation to produce a D20-compliant replay fixture. The D16 5/5-PASS verdict remains valid wrapper-validation evidence; the D16 bench_runs id is NOT a valid `--replay` fixture under D20.
    - Portability deferred: `ktx bench export <session-id>` and `--replay <file>` are future surfaces for CI (TODO.md:31). The ktx.db table does not preclude them; YAGNI says build when CI demands. The portable fixture format is the raw stream_text plus the original bench_runs comparison metrics — a self-contained JSONL-plus-JSON envelope that lets a file-based `--replay` run the pre-M4 consistency check without the capture machine's ktx.db.
  confidence: firm
  feeds_into: "TODO.md --replay step 1 (persist captured JSONL stream) — UNBLOCKED: D20 settles the format (recorded_streams table), location (ktx.db), and shape (id, session_id, bench_run_id, stream_text, content_hash, stream_format, captured_at); TODO.md --replay steps 2-4 (--replay flag, replay logic, A/B comparison) — UNBLOCKED on D20; ARCHITECTURE.md Measurement-and-benchmark section — D20 records the recording contract and the D16 fixture invalidation under a D13/D16 addendum; internal/db/open.go schemaStatements — add recorded_streams table (id TEXT PRIMARY KEY, session_id TEXT NOT NULL REFERENCES sessions(id), bench_run_id TEXT NOT NULL REFERENCES bench_runs(id), stream_text TEXT, content_hash TEXT, stream_format TEXT, captured_at TEXT); new internal/db code (recorded_streams.go or extension to bench.go) — RecordedStream struct + PersistRecordedStream + GetRecordedStreamBySession + GetRecordedStreamByBenchRun; internal/cli/bench.go runBenchRun — INSERT stream into recorded_streams after the bench_runs INSERT (the agentStdout bytes are already in scope); internal/cli/bench.go --replay flag — add `--replay <session-id>` flag that bypasses the wrap-spawn-score path and reads from recorded_streams instead; future enhancement — `ktx bench report <id>` surfaces the paired session_id when a recorded_streams companion exists (closes the discovery gap: users get a bench_run_id from `ktx bench run`; they need a session_id for `--replay`; the report output bridges them); M4 A/B persistence gap — compressed.source_id REFERENCES tool_calls.id but --replay parses in-memory; unresolved, aspirational 'no schema change' claim; CI wiring TODO (TODO.md:31) — portability (ktx bench export <file> + --replay <file>) deferred to CI gate implementation per YAGNI; D17 wrapper-vs-sidecar tension — RESOLVED for the --replay codepath by D20 (wrapper path persists stream that --replay reads; sidecar not needed for v1 replay; D19's re-deliberate-if-insufficient trigger closed for --replay). Future use cases needing live cost tracking (not replay) may revisit the sidecar question independently; D17 L3(b) D11 derivation overlap with cost-pipeline verification — RESOLVED by D20 (L3(b) IS the pre-M4 --replay consistency check; the two concerns unified by design); D16 candidate fixture (bench_run id ccsbkoluqgkgtelc, paired session_id sdeloqgthcgasfld) — INVALIDATED by D20 (no recorded_streams companion; stream discarded in-memory before D20's persistence step existed); fresh `ktx bench run opencode <model> <task>` invocation required to produce D20-compliant replay fixture (paired bench_runs + recorded_streams rows)"
