record:
  date: 2026-07-25
  question: How should call evidence, session roll-ups, and experiment artifacts compose into benchmark aggregates without duplicate or mutable truth?
  context: Startup decision history was degraded. Exact CLI retrieval found immutable migrated summaries srbeduhnos and ukduzdmvtv; their full historical detail is unavailable and is not reconstructed. Full decisions yxlsglvpof and uilebafxdn establish first-evidence authority and runtime-only telemetry. The retained methodology-v5 experiment validates all ten attempts, measured counts 3/3, and byte-identical summary regeneration. Current regeneration reparses stream cache and reasoning fields but otherwise consumes copied attempt metrics.
  alternatives:
    - name: "Field-scoped authority with deterministic projection. Win condition: each measurement has one source authority, duplicate representations count once, and unchanged authority regenerates identical bytes despite changed mutable projections. The retained vectors pass."
      status: chosen
    - name: "Add call, session, and experiment measurements then deduplicate. Win condition: deduplication cannot depend on mutable copies or reconstructed identity. Failed because additive inputs create the parallel truth the contract forbids."
      status: rejected
    - name: "Make session roll-ups or experiment summaries authoritative. Win condition: mutation or duplication cannot change aggregates and inspection reads the same evidence. Failed because these artifacts are mutable or derived."
      status: rejected
    - name: "Keep mixed reconciliation, reparsing only selected stream fields while trusting other copied attempt metrics. Win condition: every copied measurement survives the mutation vector unchanged. Failed for call counts, tokens, cost, and other unreconciled fields."
      status: rejected
  choice: "Aggregate each measurement exactly once from its field authority. First accepted tool-call source rows and first compressed artifacts own call evidence; retained raw runtime streams own runtime model-step usage; manifest and pricing snapshots own methodology, cohort intent, identity provenance, and estimate inputs; the first append-only attempt record owns only orchestration facts unavailable below it. Session counters, session snapshots, copied attempt measurements, summaries, rankings, and reports are projections or validation witnesses, never additive sources. Duplicate identity is idempotent; conflicting duplicate evidence is an error and cannot replace first evidence. Canonical attempts and summaries regenerate in stable manifest/attempt order with canonical serialization. Authority vector: baseline-003/ktx.db row sgveusltqzacpqyj belongs to session anmxgkugdmkzbaes and attempt baseline-003. The source row count 1, session roll-up 1, and copied attempt count 1 represent one call; aggregate count is 1 from sgveusltqzacpqyj, not 3. Runtime stream usage is independently field-authoritative: 2 step_finish events sum to tokens_in 21386, cache_read 11264, cache_write 0, and cost 0. Regeneration vector: keep the manifest, first orchestration envelope, database, and stream unchanged; change session count 1 to 9, copied attempt call count 1 to 9, copied tokens_in 21386 to 1, append a duplicate attempt projection, and replace summary values. Canonical baseline-003 remains 1 call and the stated stream totals; measured counts remain 3/3 and regenerated summary bytes remain identical."
  reasoning: "A field-scoped authority registry preserves the architecture contract that benchmark and inspection read the same evidence while allowing each evidence class to own facts it uniquely observes. The retained experiment demonstrates the same call in a source row, session roll-up, and attempt artifact, plus exact raw stream sums. Mutable views remain useful for divergence diagnostics but cannot alter results. One bounded implementation follow-up is selected: materialize canonical attempts from these authorities, reject conflicts, and preserve retained legacy bytes."
  confidence: firm
  feeds_into: Resolves the benchmark evidence aggregation question and TODO eflgpingek; adds one implementation follow-up for authoritative benchmark regeneration.
