id: ksfsxbvbkq
artifact: decisions
record:
  date: 2026-07-26
  question: Which derived runtime cache-reuse views and comparison claims may ktx add without creating provider-native semantics or changing historical outputs?
  context: "Firm decisions uilebafxdn, ufrltsdlaw, and zcdzpzguri limit evidence to runtime model steps and explicit configuration provenance: model steps are not provider requests; unknown, malformed, and measured zero remain distinct; configured identity never backfills source events. The older provisional decision ymghvfzdck rejected a generic headline cache-miss ratio. Pinned OpenCode 1.18.4 commit 49c69c5 and its Usage blob 98fcc9a show non-cached input, cache read, and cache write are non-overlapping and sum to inclusive input; publisher blob 33652a6 maps them independently. Local retained evidence has three complete steps but measured cache-write zero throughout, so positive-write disjointness is source-contract evidence, not an empirical local case. Startup decision listing was degraded with 33 older entries omitted; no omitted fields are reconstructed."
  alternatives:
    - name: Permit one versioned, non-ranking OpenCode-reported cached-input-share view plus a secondary consecutive-step reusable-basis estimate, governed by deterministic availability and claim gates.
      status: chosen
    - name: Restore a generic cache-miss or provider hit ratio.
      status: rejected
    - name: Infer reusable provider prefixes, retries, resets, TTL causes, missed cost, or provider identity from token movement or configured context.
      status: rejected
    - name: Change existing summary schemas, historical bytes, or cost-per-correct rankings in place.
      status: rejected
  choice: "Amend only the old ratio prohibition's scope: continue to forbid a generic or headline cache-miss ratio, but permit a descriptive OpenCode-reported cached-input share for OpenCode 1.18.4 as sum(cache_read) divided by positive sum(uncached_input + cache_read + cache_write) across every contributing measured model step. Cache write is included because the pinned runtime contract makes all three input buckets disjoint; any other runtime/version is unavailable until an equivalent invariant is pinned. Permit a secondary Pi-style estimate only for adjacent same-session steps with positive retained order, retry-absence, and reset/compaction-absence coverage, stable runtime contract, complete buckets, and prior positive cache activity: reusable basis=min(prior logical input,current logical input), shortfall=basis-current cache read, and estimated reuse share=current cache read/basis. A current read above basis is ineligible. Retain zero and all small values; label shortfall at most 1024 tokens within the noise floor without censoring it. Compare measured cycle pairs as candidate-minus-baseline direct share. Fewer than five complete pairs is descriptive only. With at least five, use a two-sided 95% paired Student-t interval; higher requires its lower bound above zero, stable provenance, protocol compliance, and candidate mean fact score and full-pass rate no lower than baseline on the same pairs. Secondary evidence is always estimated and cannot rank or rescue the direct outcome. Permanently forbid provider request, hit, miss, fill, eviction, eligibility, prefix, isolation, TTL-cause, missed-cost, cross-provider pooled, or causal wording. Preserve existing schemas, bytes, historical fixture meaning, and rankings."
  reasoning: The direct share is now justified by a pinned runtime normalization invariant rather than provider billing assumptions, while per-attempt sums preserve every measured step and completeness rules prevent partial evidence from becoming a ratio. Runtime/version scoping acknowledges that retained local evidence has no positive cache-write example. The consecutive-step formula is useful only as a bounded estimate; requiring positive boundary coverage and deterministic reason precedence prevents silence from becoming continuity evidence. A fixed paired direction, minimum sample, two-sided interval, quality gate, and identity rules make identical evidence authorize the same wording. Keeping both views non-ranking and additive preserves historical regeneration and the firm provider-internal prohibition.
  confidence: firm
  feeds_into: Versioned cache-reuse metric contract; runtime collection alignment; sequence coverage; direct and secondary derivation; paired comparison; claim authorization; final offline and bounded-live verification.
