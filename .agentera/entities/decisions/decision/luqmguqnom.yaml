id: luqmguqnom
artifact: decisions
record:
  date: 2026-07-25
  question: Which routing taxonomy and profile-selection contract should ktx support from the retained characterization?
  context: "Current routing is deterministic, ordered, first-match selection over configured tool name, command prefix, subcommand, and exit status, with a caller-supplied default. Startup decision state was degraded: 5 of 33 entries returned and 28 were omitted by byte budget. Exact CLI retrieval found migrated summary juxcewxpkq, whose user-confirmed choice included byte-detected JSON/log/code/prose routing and a memory pipeline; full historical detail is unavailable. Runtime-only characterization covers six retained calls: three have no candidate content signal, two have one, and one overlaps JSON and instruction signals. Fixture provenance supplies two mappings, and memory/session has no case."
  alternatives:
    - name: "Keep profile selection explicit and metadata-only; treat layers as conceptual; leave automatic content taxonomy and layer-to-profile mappings unsupported. Win condition: implemented metadata vectors are deterministic while evidence cannot justify content precedence or profile benefit. Passed."
      status: chosen
    - name: "Add deterministic byte/content classes and same-named layer profiles. Win condition: retained runtime cases distinguish stable exclusive classes, demonstrate ambiguity precedence and profile benefit, and cover memory/session. Failed."
      status: rejected
    - name: "Use content signals only after metadata rules miss. Win condition: unmatched calls classify reliably and measured candidate profiles outperform default. Failed."
      status: rejected
    - name: "Add scores, thresholds, confidence bands, or semantic classification. Win condition: labeled outcomes and calibration evidence support them. Failed and outside the allowed contract."
      status: rejected
  choice: Supported routing inputs remain configured tool, command_prefix, subcommand, and documented exit_status values. All predicates in a rule must match; rules are evaluated in configuration order; the first match selects its named profile. No match, nil call, or malformed input needed by a candidate rule selects the caller-supplied default unless an explicit catch-all rule matches. Layers do not imply profile names. JSON-document, diff-marker, log-marker, instruction-marker, NDJSON-count, output-size, line-count, and session/memory dimensions do not select profiles. This supersedes only the automatic content-routing and memory-pipeline portion of migrated summary juxcewxpkq; its config-format choices are unchanged. The misspelled exit_status wildcard observation remains isolated in TODO atwyurusrl and is not a supported vector.
  reasoning: "Existing metadata behavior and fallback are directly exercised. Candidate content evidence is sparse, overlapping, partly historical or fixture-provenance-based, has no comparative profile outcome, and lacks memory/session coverage. Preserving explicit configuration avoids asserting that lexical shape establishes semantic layer or that a same-named profile is beneficial. Deterministic contract vectors from tools/bench/evidence/routing-candidate-characterization.json are: route-tool-name => tool-profile; route-command-prefix => prefix-profile; route-command-prefix-subcommand-disagreement => subcommand-profile; route-first-match-overlap => broad-profile; route-no-rules => default; route-malformed-command-input => default; route-catch-all-malformed-input => catch-all; route-exit-failure => failure-profile; route-nil-error-is-success => success-profile. Repeating identical manifest inputs must return the same profiles. Findings digest: d67f0db622a1e6bfd2f7ccd0bd716554e8001f0613787c95d71f62ebdd5abadd. No new routing implementation is selected."
  confidence: firm
  feeds_into: ARCHITECTURE.md routing grammar and layer description; resolves TODO lynhsfjoce; preserves separate exit-status validation TODO atwyurusrl; no implementation task is added.
