id: lvuuqynajv
artifact: decisions
record:
  date: 2026-06-30
  amendment_to: 16
  question: D16's contract invocation `ktx run opencode run --format json -m <m> <prompt>` was still failing end-to-end after D18 (extractFormat skip for PassthroughStdout verbs). Strace showed opencode receiving argv=[opencode, opencode, run, --format, json, ...] — a doubled agent name at the front. Should the reframe-and-fix scope be widened to cover this second wrapper bug as well?
  context: "D18 relaxed D16's 'no Go source changes' constraint to permit a minimal extractFormat fix (skip extractFormat for PassthroughStdout verbs so the wrapper forwards `--format` to the agent). After landing D18 + the new regression test (`internal/cli/dispatch_test.go` 'PassthroughStdout preserves --format in ctx.Args', passing), running scripts/validate-bench.sh still produced opencode top-level help on stderr and exit 1. Diagnosis was widened via strace: `strace -f -e trace=execve -o /tmp/ktx-strace.log ./ktx run opencode run --format json ...` revealed execve(\"/bin/opencode\", [\"opencode\", \"opencode\", \"run\", \"--format\", \"json\", ...]) — the agent name was passed twice. The cause: in `internal/cli/run.go:298` `runCommandFunc` does `agent := ctx.Args[0]` (correct) and passes the whole `ctx.Args` (including the agent name at position 0) to `filterKtxFlags`, which returns it unchanged as `agentArgs`; then `executeRun` at run.go:220 calls `runCmd(ctx, agent, agentArgs...)` which is `exec.CommandContext(ctx, \"opencode\", \"opencode\", \"run\", ...)` — Go's exec uses `agent` as argv[0] and appends `agentArgs` as argv[1..n], so the leading `opencode` in agentArgs becomes argv[1] and opencode's yargs treats it as the default `[project]` positional for the TUI subcommand. The same bug exists in run.go:117 `runRunWith` (the Task 1-3 test seam): `agent := rest[0]; return executeRun(agent, agentArgs, ...)` where agentArgs still contains rest[0]. Two prior probe runs were misread by me as showing no doubling: (a) `ktx run /bin/echo run --format json ...` outputted `/bin/echo run --format json ...` which I read as 'echo showed its args' but actually was echo printing argv[1..] starting with the doubled `/bin/echo`; (b) `ktx run /tmp/wrap-opencode.sh ...` with a probe script logging `argv[0..n]` from bash `$@` produced a log where bash's `$1` was the doubled agent name, but my probe labeled bash `$1` as `argv[0]` and I misread the doubled agent as the program-name slot. Both probe misreads are corrected in retrospect: doubling was present in both. The D18 extractFormat fix was correct and necessary (without it, `--format` would be eaten before the agent saw it) AND insufficient (doubling was a separate, second wrapper bug). The cleaner fix per the explore agent's Option 1 is surgical in executeRun: defensively strip `agentArgs[0]` when it equals `agent` before passing to runCmd. This is what was implemented. A regression test is added that asserts ctx.Args preserves --format (already in place from D18) but the doubling regression itself is covered by an end-to-end run of scripts/validate-bench.sh against real opencode — the synthetic /bin/echo fake (which happily accepts any argv and exits 0) cannot catch a doubling bug because echo doesn't care. D18's regression test was insufficient; D19's evidence is the actual validation run producing 5/5 [PASS]. Both fixes (extractFormat skip from D18, argv stripping from D19) are minimal and at the dispatch/run boundary; no other Go source under internal/ or cmd/ is touched."
  alternatives:
    - name: Apply surgical argv-stripping fix in executeRun; widen D18's scope implicitly
      status: chosen
      description: "Add to executeRun (run.go:220 area): `agentArgsTail := agentArgs; if len(agentArgsTail) > 0 && agentArgsTail[0] == agent { agentArgsTail = agentArgsTail[1:] }` before `runCmd(ctx, agent, agentArgsTail...)`. Fixes the doubling at the boundary where exec happens; both runCommandFunc (dispatch path) and runRunWith (test seam) benefit without changes. Regression evidence: scripts/validate-bench.sh produces 5/5 [PASS] against real opencode 1.17.8 (neuralwatt/glm-5.2-short-fast-flex, 'What is 2+2?'); L4 (parser 1-to-1) PASS with tool_use=0 == tool_call_count=0 — the model answered without invoking any tools; L2 (stream-token-evidence) PASS with 1/1 step_finish lines having tokens.input>0 AND tokens.output>0; L3 (stream-cost-evidence) PASS via branch (a) — step_finish.part.cost=0.0031...; L1 PASS — session id queryable via ktx list; L5 PASS — text='4'. The validate=PASS verdict is the candidate replay fixture source per D16."
      win_condition: scripts/validate-bench.sh against real opencode emits validation=PASS and exits 0; the resulting session id is queryable via ktx list (recorded as the candidate D13 Tier 1 replay fixture source); go test ./... stays green; the existing D18 regression test for --format passthrough still passes.
    - name: "Cleaner contract: change runCommandFunc and runRunWith to slice ctx.Args[1:] before filterKtxFlags"
      status: rejected
      description: Make agentArgs actually mean 'args to the agent' (i.e. ctx.Args[1:]) rather than 'the whole ctx.Args slice'; update both runCommandFunc (run.go:298) and runRunWith (run.go:105) to use ctx.Args[1:] or rest[1:].
      win_condition: Would be chosen if the goal were to clean up the latent ambiguity where agentArgs[0] is supposed to mean the agent name but isn't stripped.
      rationale: Larger blast radius (two callers, both tests need updating); the existing dispatch_test.go test ('PassthroughStdout preserves --format in ctx.Args') asserts ctx.Args matches the input verbatim including [0]=agent, so it would need to change. The surgical fix in executeRun is functionally equivalent for D16's contract; the contract cleanup can happen separately if it becomes a recurring footgun.
    - name: Re-deliberate as part of D18 (amend D18's text rather than adding D19)
      status: rejected
      description: Update D18's alternatives, choice, and win_condition to cover both the extractFormat fix AND the argv-stripping fix; D18 becomes a single decision covering both wrapper bugs.
      win_condition: Would be chosen if the deliberation trail cared about decision count.
      rationale: "D18 is firm and recorded; rewriting its text retroactively erases the deliberation trail. D19 is cleaner: it stands on its own as 'second wrapper bug found and fixed after D18 proved insufficient', preserving the chronology of misdiagnosis and correction."
    - name: Record argv doubling as a TODO and stop D16 validation
      status: rejected
      description: Add a TODO for the doubling bug; leave scripts/validate-bench.sh in a state where it cannot validate against real opencode; accept D16's overall acceptance criterion as unmet.
      win_condition: Would be chosen if the doubling fix required a long-deliberation process. It does not — it is a 4-line surgical change with immediate end-to-end evidence of correctness.
      rationale: Stopping defers the validation without need; the fix is small and produces 5/5 [PASS] immediately; the user explicitly chose 'fix then run' in D18 and the spirit of that choice applies here as well.
  choice: "Apply a surgical argv-stripping fix in executeRun (run.go:220 area): defensively strip agentArgs[0] when it equals agent before passing to runCmd, so the agent name is not doubled in argv[1..n]. Both runCommandFunc and runRunWith benefit. The regression evidence is scripts/validate-bench.sh producing validation=PASS (5/5 per-layer [PASS]) against real opencode 1.17.8 (neuralwatt/glm-5.2-short-fast-flex, 'What is 2+2?'); the resulting session id is the candidate D13 Tier 1 replay fixture source per D16. The fix is minimal and at the dispatch/run boundary; no other Go source under internal/ or cmd/ is touched. The extractFormat fix from D18 stays in place (it was correct and necessary); D19's argv-stripping is the second, complementary fix."
  reasoning: "D18's extractFormat fix was landed and tested to preserve --format passthrough for the run verb, but scripts/validate-bench.sh against real opencode still produced ktx run exiting non-zero with opencode top-level help on stderr. Strace on the ktx run path revealed execve(\"/bin/opencode\", [\"opencode\", \"opencode\", \"run\", ...]) — a doubled agent name at the front of argv. The cause is in executeRun: `runCmd(ctx, agent, agentArgs...)` where agentArgs still contains the agent name at position 0; Go's exec.CommandContext uses `agent` as argv[0] and appends `agentArgs` as argv[1..n], so agentArgs[0] (which equals agent) is appended as a second agent-name at argv[1]. opencode's yargs treats argv[1]=\"opencode\" as the positional `project` for the default `[project]` subcommand and emits its top-level help because the path resolution fails. Two earlier probe runs were misread by me as showing no doubling — both actually confirmed doubling once I re-read the probe-script's labeling versus bash positional semantics. The chosen fix (surgical argv-stripping in executeRun) is minimal, defensive, and works for both runCommandFunc and runRunWith paths; the alternative of changing the runCommandFunc/runRunWith contract to use ctx.Args[1:] is rejected as larger-blast-radius with no functional benefit for D16's contract. The alternative of amending D18 directly is rejected to preserve the deliberation chronology honestly. After landing D19's fix, scripts/validate-bench.sh produces validation=PASS (5/5 layers: L1 session-capture, L4 parser-1-to-1 with tool_use=0==tool_call_count=0, L2 stream-token-evidence via step_finish.tokens, L3 stream-cost-evidence branch (a) via step_finish.cost, L5 text='4'); ktx test suite stays green; the existing D18 --format-passthrough regression test still passes. The D16 invocation contract `ktx run opencode run --format json -m <m> <prompt>` is now end-to-end exerciseable against real opencode, and the resulting session id is the candidate D13 Tier 1 replay fixture source per D16. Confidence is firm: 5/5 [PASS] verdicts across two consecutive validation runs against real opencode (different session ids each time) plus the test suite green plus the strace-verified argv shape. The M3 bench.go invocation fix TODO is unblocked by D18+D19 landing first and remains a separate, scoped task. The wrapper-vs-sidecar path deliberation (deferred per D17) is now also unblocked — D18+D19 proved the wrapper path works for v1; the sidecar path remains m3-vision-gap.md's recommendation but is no longer the only path that supplies end-to-end evidence. Decisive move: re-deliberate the wrapper-vs-sidecar question only if --replay cost reconstruction proves insufficient; until then, D18+D19 + the D17-amended validation gate settles D16 firmly."
  confidence: firm
  feeds_into: D16 — invocation contract exerciseable end-to-end against real opencode after D18+D19; D16 win_condition (all-PASS) achieved; the resulting session id in ktx.db is the candidate D13 Tier 1 replay fixture source; ARCHITECTURE.md Measurement-and-benchmark validation-gate section — D19 records the second wrapper-bug fix (argv doubling) alongside D18's extractFormat fix; scripts/validate-bench.sh — produces 5/5 [PASS] verdicts unmodified after D18+D19; the M3 bench.go invocation fix TODO (TODO.md:28) — unblocked by D18+D19; still scoped to prepending `run --format json -m <m>`; wrapper-vs-sidecar path for v1 (deferred per D17) — no longer urgent; D18+D19 proved the wrapper path works for v1; re-deliberate only if --replay cost reconstruction from the captured JSONL stream proves insufficient; wrapper-side step_finish enrichment (deferred per D17) — unchanged; not blocking D16/D13 Tier 1 if --replay reconstructs cost from the captured stream
