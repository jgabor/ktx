id: rjnmbxjobr
artifact: decisions
record:
  date: 2026-10-22
  question: How should the ktx Claude Code plugin be published for installation through Claude Code's own plugin commands, how does it find the ktx executable, how do plugin and binary versions stay compatible, and what becomes of `ktx init claude`?
  context: The Claude Code adapter decision (cavzdptazv) chose a marketplace that `ktx init claude` generates under $XDG_DATA_HOME, named ktx-local, with the canonical ktx path written into the hook and the mod. The plugin was never meant to be local-only. A published plugin is the same file for every user, so it cannot hold a per-user path. The OpenCode plugin already finds ktx on PATH at startup and pins that binary for the session. The Bash hook is a command in hooks.json, so ktx runs before any plugin code can check versions; only the mod can stop itself. The mod accepts only `ktx stats summary` schema 10. The repository has no tags, and `ktx --version` reports a hardcoded `0.1.0-dev` (or `dev` from `mage build`), so a `go install ...@vX` build does not report its release today. No one but the maintainer has installed the ktx-local marketplace.
  alternatives:
    - name: Publish ktx@ktx from the ktx repository as the only install path; the plugin finds ktx on PATH; the mod checks a minimum ktx version; `ktx init claude` installs through the claude CLI
      status: chosen
    - name: Keep `ktx init claude` generation beside a published plugin as a second install path
      status: rejected
    - name: Find ktx through a fixed location, a plugin setting, or a pinned path
      status: rejected
    - name: Keep the binary contract backward compatible, or make the plugin tolerant of unknown schemas, instead of a version check
      status: rejected
    - name: Compare a dedicated plugin contract number instead of the ktx release version
      status: rejected
    - name: Publish from a separate repository, or only through Anthropic's plugin directory
      status: rejected
    - name: Have `ktx init claude` only print the install commands
      status: rejected
  choice: "Publish one plugin, ktx, from a marketplace named ktx at the root of the jgabor/ktx repository, installed as ktx@ktx. It replaces the generated ktx-local marketplace as the only install path. The plugin pins no path: the Bash hook runs `ktx hook --runtime claude-code` and the mod runs `ktx stats summary`, both resolved through PATH, because ktx is installed first like any Go binary. The mod reads `ktx --version` at session start and, below the minimum release the plugin declares, turns itself off with one line that says to upgrade ktx. The hook relies on ktx keeping `hook --runtime claude-code` stable. ktx reports its release version from Go build info, so `go install ...@vX.Y.Z` builds report vX.Y.Z; builds without a release version pass the check. Publishing waits for tagged releases. `ktx init claude` runs `claude plugin marketplace add jgabor/ktx` and `claude plugin install ktx@ktx`, succeeds when they are already present, and prints a note to run /reload-plugins; when `claude` is not on PATH it prints the commands instead. ktx changes Claude Code configuration only through the claude CLI and never edits its settings files. No migration code is written for ktx-local; the maintainer's machine is cleaned up once by hand. For development, `mage install` builds ktx and registers the local checkout as the ktx marketplace; a second target, `mage installRelease`, installs the released binary with `go install github.com/jgabor/ktx/cmd/ktx@latest` and points the ktx marketplace at GitHub, so each mode pairs a plugin and a binary from the same source."
  reasoning: "One install path avoids keeping a generator, marker, and staleness reports for a second way to get the same plugin. PATH lookup matches the OpenCode adapter and how Go binaries are installed; a published file cannot hold a per-user path, and a fixed location breaks other installs. A minimum-version check gives one clear failure instead of silent drift, and a release version is a contract users already understand; build-info versions make it real for `go install`, and letting development builds pass keeps the maintainer loop working. Serving ktx@ktx from the code repository keeps the plugin versioned with the binary it calls, and the shared marketplace name lets a machine switch between the local checkout and GitHub without renaming anything. Running the claude CLI keeps installation to one command while leaving Claude Code's settings to Claude Code. This replaces the generated-marketplace part of the Claude Code adapter decision (cavzdptazv); its hook ingress, trust check, and Node test choices stand. Not yet verified live: that Claude Code resolves a bare `ktx` through PATH for the hooks.json command and for the mod's process call; implementation acceptance must prove both."
  confidence: firm
  feeds_into: Resolve discussion TODO lzdlajlmrg; remove the Claude Code plugin distribution question from ARCHITECTURE.md; supersede the generated-marketplace TODO ikmkvqtvjf; add TODOs for build-info versions, the published plugin with `ktx init claude` install, and the mage dev and release install targets.
