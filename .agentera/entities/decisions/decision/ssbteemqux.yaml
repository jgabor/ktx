id: ssbteemqux
artifact: decisions
record:
  date: 2026-06-30
  amendment_to: 16
  question: D16's invocation `ktx run opencode run --format json -m <m> <prompt>` cannot reach opencode today because the dispatcher's extractFormat (internal/cli/flags.go:34) consumes `--format <value>` from every position in the verb's args before the agent binary receives them — including from positions intended for the agent. Should D16's contract invocation stay as-stated and the wrapper be fixed, or should D16 be re-routed through the sidecar path?
  context: "D17 reframed D16's L2/L3 layer assertions but left the invocation contract intact. Running scripts/validate-bench.sh against real opencode (D16's overall acceptance) produced ktx run exiting non-zero with opencode emitting only its top-level help on stderr. The fixture dry-run (which bypasses ktx run) had produced correct L2/L3/L5 verdicts against the captured JSONL fixture, proving the script's per-layer logic was sound. Diagnosis: ktx's dispatcher's extractFormat (internal/cli/dispatch.go:259-263 calling flags.go:34 extractFormat) scans every arg in the verb's arg slice — including args after the agent binary that should pass through. With `ktx run opencode run --format json -m <m> <prompt>`, extractFormat removes `--format json` before the run verb sees it, so opencode's `run` subcommand receives `run -m <m> <prompt>` without `--format json` and defaults to `--format default` (TUI). opencode then emits only its top-level help and exits 1. Confirmed two ways: (a) `ktx run /bin/echo run --format json -m foo 'What is 2+2?'` forwards `run -m foo What is 2+2?` (no `--format json`); (b) the literal canonical example from `ktx run --help` (`ktx run opencode run --format json \"explain closures in JavaScript\"`) reproduces the failure with the same opencode-help-on-stderr signature. The M3 bench run invocation gap TODO (TODO.md:28) proposed prepending `run --format json -m <m>` to bench.go's literal invocation; that fix would also fail for the same reason. D16's reason-for-being is to validate the WRAPPER path against real opencode; re-routing to the sidecar path would contradict D16, contradict the user's choice to keep D16 firm in D17, and overlap with what m3-vision-gap.md:163 already recommended for v1 (the wrapper-vs-sidecar deliberation D17 explicitly deferred). The cleaner answer for preserving D16's intent is the minimal wrapper fix, scoped tightly: skip extractFormat when the registered verb has PassthroughStdout=true (only `run` today). Per-verb opt-out preserves the existing extractFormat behavior for query verbs (get, list, bench, doctor) whose tests assert `--format` is extracted in either position (get_test.go:9, list_test.go:5); only the run verb's passthrough changes. Implementation: one conditional in dispatch.go plus a regression test. Out of scope: the M3 bench.go invocation fix (separate TODO, still needed after this fix lands), the wrapper-vs-sidecar path deliberation (still deferred per D17 feeds_into), and the step_finish-enrichment gap (still deferred per D17 feeds_into)."
  alternatives:
    - name: "Fix dispatch.go: skip extractFormat for PassthroughStdout verbs; keep D16 contract invocation as-stated"
      status: chosen
      description: "Relax D16's 'must NOT modify ktx source under internal/ or cmd/' constraint to permit a minimal, tightly-scoped edit to internal/cli/dispatch.go (one conditional: skip extractFormat when reg.opts.PassthroughStdout). Add a regression test that asserts `--format <value>` passes through to the agent unchanged when the verb is `run`. Then run scripts/validate-bench.sh against real opencode and emit the D17-amended per-layer verdicts. D16's contract invocation (`ktx run opencode run --format json -m <m> <prompt>`) stays as-stated and is finally exerciseable end-to-end against real opencode. No other Go source under internal/ or cmd/ is touched. The M3 bench.go invocation fix TODO is still needed (it adds the `run --format json -m <m>` prepend) and is unblocked by this D18 landing first."
      win_condition: scripts/validate-bench.sh against real opencode (neuralwatt/glm-5.2-short-fast-flex, 'What is 2+2?') emits five per-layer [PASS]/[FAIL] verdicts per D17-amended contract; L1 PASS, L2 PASS, L3 PASS (branch (a) or (b)), L4 PASS (count of tool_use lines == persisted tool_call_count), L5 PASS (text='4'). Existing ktx test suite stays green; the new regression test asserts `--format` passthrough for the run verb.
    - name: "Re-route D16 to the sidecar path: capture opencode stdout directly, pipe tool_use lines through ktx write"
      status: rejected
      description: "Bypass ktx run entirely: capture `opencode run --format json -m <m> <prompt>` to a file, parse each type=tool_use line, pipe through `ktx write` per the sidecar contract. Validates the sidecar capture path instead of the wrapper path."
      win_condition: Would be chosen if D16's purpose were agnostic to which capture path. It is not — D16 explicitly validates the WRAPPER path against real opencode.
      rationale: Contradicts D16's chosen alternative (validate the WRAPPER path) and D17's explicit deferral of the wrapper-vs-sidecar question; overlaps with what m3-vision-gap.md:163 already recommended for v1; replaces scripts/validate-bench.sh with a different sidecar-driven script, abandoning the wrapper capture validation D16 was designed to produce.
    - name: Record wrapper bug as a TODO and stop D16 validation this session
      status: rejected
      description: Add a third TODO describing the extractFormat passthrough bug; leave scripts/validate-bench.sh in place (smoke-tested via dry-run); stop without running the actual validation.
      win_condition: Would be chosen if the wrapper fix required a long-deliberation process that exceeded the user's patience. It does not — the fix is small and well-scoped, and the user chose fix-then-run.
      rationale: The fix is small enough to land today; stopping defers the validation without need. Adds bookkeeping without delivering D16 evidence.
    - name: Patch extractFormat only locally (uncommitted) and run the script
      status: rejected
      description: Apply the extractFormat fix in dispatch.go without committing it; run the script with the patched binary on PATH; report verdicts without recording the fix.
      win_condition: Would be chosen if the user wanted quick evidence without modifying ktx permanently.
      rationale: Deceptive — the validation would not be reproducible against the ktx binary the user actually runs. D16's warranty requires the ktx binary the script invokes to actually pass `--format` through; an uncommitted local patch means the verdict comes from a ktx nobody else has. Unfaithful to D16's evidence contract.
  choice: "Relax D16's 'must NOT modify ktx source under internal/ or cmd/' constraint to permit a minimal, tightly-scoped edit to internal/cli/dispatch.go: skip extractFormat (flags.go:34) when the registered verb's PassthroughStdout opt is true (only `run` today). Add a regression test asserting `--format <value>` forwards unchanged to the agent via `ktx run`. After the fix lands and tests pass, run scripts/validate-bench.sh against real opencode (neuralwatt/glm-5.2-short-fast-flex, 'What is 2+2?') per D17-amended contract and emit the per-layer verdicts. D16's contract invocation stays as-stated. The M3 bench.go invocation fix TODO is unblocked (it still needs to prepend `run --format json -m <m>` to bench.go's literal invocation)."
  reasoning: "D17 reframed D16's L2/L3 layer assertions; D16's invocation contract was intact and looked exerciseable. Running scripts/validate-bench.sh — the validation gate per D16's overall acceptance — produced an unexpected wrapper-level failure: ktx run exited non-zero and opencode emitted only its top-level help on stderr. The fixture dry-run (which bypasses ktx run by reading static JSONL) had produced correct L2/L3/L5 verdicts against the captured fixture, proving the script's per-layer logic was sound. Diagnosis located the gap in internal/cli/dispatch.go:259-263 calling internal/cli/flags.go:34 extractFormat, which scans every arg in the verb's arg slice and consumes `--format <value>` from any position — including positions after the agent binary that should pass through. With `ktx run opencode run --format json -m <m> <prompt>`, extractFormat removes `--format json` before the run verb sees it; opencode then receives `run -m <m> <prompt>` without `--format json`, defaults to `--format default` (TUI), emits only its top-level help, and exits 1. Two confirmations: (a) `ktx run /bin/echo run --format json -m foo 'What is 2+2?'` forwards `run -m foo What is 2+2?` — `--format json` is gone; (b) the literal canonical example from `ktx run --help` (`ktx run opencode run --format json \"explain closures in JavaScript\"`) reproduces the same failure with the same opencode-help-on-stderr signature. The M3 bench run invocation gap TODO (TODO.md:28) proposed prepending `run --format json -m <m>` to bench.go's literal invocation; that proposed fix would also fail for the same reason — extractFormat eats `--format` regardless of where it appears or what verb's args it sits in. The chosen alternative is a per-verb opt-out preserving extractFormat's behavior for the query verbs (get, list, bench, doctor) whose tests assert `--format` is extracted in either position. Only the run verb's passthrough changes, and only because run is the only verb today with PassthroughStdout=true and the only verb whose args include agent-supplied flags that legitimately use `--format` as their own. The fix is minimal and well-scoped: one conditional in dispatch.go plus a regression test. The alternative of re-routing D16 to the sidecar path is rejected because it contradicts D16's explicit choice to validate the WRAPPER path, contradicts D17's defer-the-wrapper-vs-sidecar-question, and overlaps with what m3-vision-gap.md:163 already recommended for v1. Container 'record as TODO and stop' is rejected because the fix is small enough to land today and the user chose fix-then-run. Committing an uncommitted local patch is rejected as deceptive to D16's reproducibility contract. Confidence is firm: the diagnosis has two independent confirmations, the fix is single-conditional and preserves extractFormat's behavior for the verbs whose tests assert it, and the existing dispatch_test.go and run tests will catch any regression. The M3 bench.go invocation fix TODO is unblocked by this landing first and remains a separate, scoped task."
  confidence: firm
  feeds_into: D16 — invocation contract (`ktx run opencode run --format json -m <m> <prompt>`) finally exerciseable end-to-end against real opencode after D18 fix lands; ARCHITECTURE.md — note the wrapper passthrough fix under Measurement-and-benchmark validation gate section; scripts/validate-bench.sh — runs unmodified after D18 fix; the M3 bench.go invocation fix TODO (TODO.md:28) — unblocked by D18, still scoped to prepending `run --format json -m <m>`; wrapper-vs-sidecar path deliberation — still deferred per D17, still open after D18; wrapper-side step_finish enrichment — still deferred per D17, still open after D18
