id: tbllywdtbf
artifact: decisions
record:
  date: 2026-10-22
  question: Should ktx install into OpenCode and Codex through each runtime's own plugin system, as the Claude Code plugin does, and if so, through which channels, how do the plugins find and stay compatible with ktx, what do `ktx init opencode` and `ktx init codex` do, how do benchmarks keep an exact plugin identity, and where do the OpenCode sidebar and Codex statistics live?
  context: "The Claude Code plugin distribution decision (rjnmbxjobr) publishes ktx@ktx from this repository: one plugin artifact, found on PATH, versioned by commit, with a minimum ktx version check in the mod; `ktx init claude` runs the claude CLI and mage switches between the checkout and the release. OpenCode and Codex still get generated adapters: `ktx init opencode` writes a TypeScript server plugin embedded in the binary, which finds ktx on PATH at startup, and `ktx init codex` merges a hook with a canonical ktx path into Codex hooks.json. Benchmarks require the generated OpenCode plugin's hash to match the binary. OpenCode v1.19.4 loads npm plugin specs from `opencode.json` (server) and `tui.json` (TUI); one package can export `./server` and `./tui`, and an undocumented `opencode plugin <pkg>` command installs a package and edits those files. There is no OpenCode marketplace. Codex 0.163.0 installs plugins with `codex plugin marketplace add` and `codex plugin add`, reads `.agents/plugins/marketplace.json` and `.codex-plugin/plugin.json`, also reads the Claude Code `.claude-plugin` layout, and requires plugin hooks to be trusted in /hooks; its docs disagree on whether plugin hooks load. Codex has no panel or status API for plugins. The separate opencode-ktx project is an OpenCode TUI sidebar that polls `ktx stats summary`. The maintainer already has an npm account (jgabor)."
  alternatives:
    - name: One plugin artifact per runtime in this repository, installed through each runtime's own plugin system, with commit identity and a minimum ktx version check
      status: chosen
    - name: Move Codex to a repository plugin but keep the OpenCode plugin embedded in the binary
      status: rejected
    - name: Publish native plugins and keep the embedded copies that `ktx init` writes, as two artifacts per runtime
      status: rejected
    - name: Keep the exact binary-to-plugin hash check for benchmarks by embedding the plugin hash in the binary
      status: rejected
    - name: Distribute the OpenCode plugin through a GitHub spec or a folder that ktx downloads instead of the npm registry
      status: rejected
    - name: Publish the OpenCode compression plugin and sidebar as two packages, or leave the sidebar in opencode-ktx
      status: rejected
    - name: Have `ktx init` edit OpenCode config files itself, or only print install commands
      status: rejected
    - name: Show no ktx statistics in Codex, or have the hook emit statistics lines
      status: rejected
    - name: Leave OpenCode and Codex out of the mage development and release install targets
      status: rejected
  choice: "Each runtime gets one plugin artifact, kept in this repository and installed through the runtime's own plugin system, with the same identity rules as ktx@ktx: the plugin finds ktx on PATH, is identified by the commit or release it came from, and checks that ktx is at least its minimum release where the runtime runs plugin code (a release version below the minimum turns the statistics display off with one line saying to upgrade; versions without a release number pass). OpenCode: one npm package published under the maintainer's npm account on each ktx release, exporting `./server` (Bash and tool-output compression and model-step telemetry, replacing the generated plugin) and `./tui` (the statistics sidebar moved in from opencode-ktx, which is then retired). Codex: a plugin served from this repository's marketplace with its own `.agents/plugins/marketplace.json`, `.codex-plugin/plugin.json` and hooks file whose PostToolUse hook runs `ktx hook` through PATH, so Codex never loads the Claude Code hooks; it bundles a skill or command that shows `ktx stats summary` on request, and users still trust the hook once in /hooks. `ktx init opencode` and `ktx init codex` install through each runtime's CLI (`opencode plugin` for the package; `codex plugin marketplace add jgabor/ktx` and `codex plugin add`), succeed when already installed, and print the commands when the CLI is missing; neither writes generated adapter files any more. Benchmarks install ktx and the OpenCode plugin from one commit and record that commit and the plugin's content hash; the generated-plugin-matches-binary check retires, and earlier archives remain historical evidence. `mage install` points runtimes that are already set up at the checkout (the Codex ktx marketplace at the checkout, OpenCode plugin entries at the checkout folder) and `mage installRelease` points them at GitHub and the npm release, so plugin and binary always come from the same source."
  reasoning: "One artifact per runtime removes the drift between an embedded copy and a published one, and the Claude Code plugin shows the identity rules work: commit or release identity plus a minimum-version check is enough for users, and benchmarks keep exactness by building ktx and installing the plugin from one commit and recording both. The npm registry is OpenCode's documented route and the account exists. One OpenCode package gives the same complete setup as ktx@ktx, compression plus a live display, and retires a second project that duplicated the stats contract. Codex's plugin system mirrors Claude Code's, but its separate manifest and hooks file keep the Codex hook contract (`ktx hook`) apart from the Claude one, and Codex offers no panel, so statistics come on request. Running each runtime's CLI keeps installation to one command without ktx editing runtime configuration. Extending the mage targets keeps the development and release pairing consistent across runtimes. This replaces the generated adapters chosen for OpenCode and Codex, the benchmark binary-match check, and the part of the development install decision (yyorkhqcyb) that refreshes generated adapters; the Claude Code adapter's hook ingress and trust choices and the hook protocol stand. Unverified at decision time and required as implementation acceptance: that `opencode plugin` installs both targets of one package and how it refreshes a cached version, that Codex loads hooks from a repository-marketplace plugin after trust, and that Codex prefers the Codex manifest over the Claude Code one in this repository."
  confidence: firm
  feeds_into: Resolve discussion TODO wljbjnqufk; remove the native distribution question from ARCHITECTURE.md; add TODOs for the OpenCode package, the Codex plugin, benchmark plugin identity, and the mage install targets for OpenCode and Codex.
