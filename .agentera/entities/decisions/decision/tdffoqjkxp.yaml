id: tdffoqjkxp
artifact: decisions
record:
  date: 2026-07-25
  question: How should ktx attribute compression savings across tool delivery, runtime usage, setup, quality, and cost without duplicate or invented evidence?
  context: "Startup decision history was degraded, so no omitted detail is reconstructed. Exact CLI retrieval supplied full decisions uilebafxdn and knzmjhynxa. They require runtime-only collection and field-scoped authority: first retained tool-call rows and compressed artifacts own delivery evidence, raw runtime streams own model-step usage, manifests and pricing snapshots own methodology, identity provenance, and estimate inputs, and orchestration records own only otherwise-unavailable facts. The validated ten-attempt runtime-telemetry experiment provides paired delivery, usage, quality, setup, and cost evidence but no provider-internal cache or request semantics."
  alternatives:
    - name: "Use a field-scoped, non-additive attribution ledger. Win condition: every value names one field authority, evidence class, provenance, phase, and comparison unit; derived views never become additional contributions. Evidence test: baseline-003/candidate-003 and the retained setup and measured cohorts reconcile exactly without adding byte, token, cache, runtime-cost, estimate, pair, cohort, or phase views together."
      status: chosen
    - name: "Build an additive causal decomposition from output bytes, input tokens, cache tokens, setup, and cost. Win condition: components are independent and sum to a defensible total. It fails because the observed layers overlap and the experiment does not identify causal shares."
      status: rejected
    - name: "Collapse runtime-reported and estimated costs, setup, and measured phases into one normalized savings headline. Win condition: the unit has one billing meaning and stable phase basis. It fails because runtime zero has no billing semantics, estimates are contextual, and setup and measured evidence answer different questions."
      status: rejected
    - name: "Publish only raw observations and decline attribution. Win condition: no unsupported inference. It is safe but unnecessarily weak because field authority, paired deltas, phase boundaries, and provenance support a useful non-additive contract."
      status: rejected
  choice: "Attribute each field once at its authority and compare like with like; never sum cross-field deltas or present correlation as causal decomposition. Worked example, measured cycle 1: tool delivery is retained ktx evidence from baseline source row sgveusltqzacpqyj and candidate source row rqbgfbpeivqecrti plus first candidate compressed artifact ojldcmcdmwfwmefq. The same 50,118-byte original is delivered as 50,118 baseline bytes and 1,819 candidate bytes, a 48,299-byte (96.37%) delivery reduction. Runtime usage is raw OpenCode stream evidence from two step_finish events per arm: baseline uncached input 21,386 plus cache_read 11,264 gives logical input 32,650; candidate uncached input 1,898 plus cache_read 11,264 gives 13,162; logical-input delta is 19,488, cache_read delta 0, and cache_write is 0 for both. Logical input is a derived view of the mutually exclusive input components, not another additive contribution. Quality is retained task-scoring evidence: both pair members score 1, and both measured cohorts pass 3/3. Runtime-reported cost is literal stream telemetry, 0 for each arm and delta 0; it is not billing evidence. Price-derived measured estimates use manifest identity provenance and pricing.json: 0.026682 USD baseline versus 0.005316 candidate, delta 0.021366. Setup estimates remain a separate phase: 0.055148 baseline versus 0.013600 candidate; measured means remain 0.025400 versus 0.007413. The 0.167186 experiment estimate total is budget context, and first-turn cumulative break-even (0.081830 versus 0.018916) is a derived phase view, not another contribution. Measured cache_read distributions are baseline [11264,11264,11264] and candidate [11264,5632,11264]; cache_write is [0,0,0] for both. Provider/model identity is explicit manifest/runtime configuration provenance, not provider-response proof. Provider hits, misses, fills, request count or boundaries, isolation, eviction, prefix composition, and the billing meaning of runtime zero remain unavailable; runtime observations, configuration, documentation, and estimates cannot fill them."
  reasoning: The chosen ledger satisfies field-scoped authority and makes every reported comparison reproducible while preserving the experiment's actual limits. Tool compression plausibly precedes lower runtime input in the paired case, but this design does not establish how much of the token or estimated-cost delta was caused by output reduction, cache behavior, reasoning variation, or another runtime effect. Keeping delivery, runtime usage, scored quality, reported cost, and estimated cost as parallel evidence classes prevents double counting. Setup and measured phases support cumulative break-even only as an explicitly derived view. One implementation follow-up is required to make benchmark reporting expose these evidence classes, provenance, phases, and non-additive rules; no further evidence collection is required for this contract.
  confidence: firm
  feeds_into: Resolves the savings-attribution question and TODO vdjnnxeylx; adds one implementation follow-up for field-scoped attribution reporting.
