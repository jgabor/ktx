id: tllhidapad
artifact: decisions
record:
  date: 2026-07-01
  question: What is `ktx plugin` concretely, and how does it relate to shell-macro pipeline stages stored in ktx.toml?
  context: "Decision 2 (firm) established `ktx plugin` as registry CRUD, distinct from `ktx init` (runtime adapter installation). Decision 5 (firm) committed the extension CONFIG model: ktx.toml with shell-macro arrays, inline arrays, external scripts as the reuse mechanism, no DSL, no compiled Go plugins. Decision 14 (firm) explicitly deferred plugin registry semantics here, scoping M4 to passthrough default + reversal + failure contract. The M4 code already has the seams: `Registry.Register` (internal/pipeline/pipeline.go:132-134) implements 'last writer wins' precedence designed for 'user config over built-in'; the `Stage` interface (bytes-in, bytes-out, error-or-nil) is process-agnostic so external shell-macro stages slot in without a runner rewrite; the hand-rolled TOML reader in internal/config/config.go:38-46 anticipates BurntSushi/toml adoption for 'M5 richer surface (content-type profiles, shell macros, plugin references)' because it cannot parse `[[plugin]]` array-of-tables. TODO.md:41 has been open since 2026-06-21 pending this deliberation; M5 cannot start without it. User intent stated in deliberation (2026-07-01): the registry is NOT primarily a human-ergonomics layer — it is agent-native CLI discipline. Agents editing TOML by hand hallucinate paths, drift from canonical shape, and produce malformed arrays; `ktx plugin add/list/remove` gives them a schema-enforced `--json` CLI surface that translates intent into correctly-shaped config edits (per AGENTS.md 'agent-native CLI development' principles: structured bounded I/O, self-correcting usability, schema-first architecture)."
  alternatives:
    - name: No registry — ktx.toml IS the registry (YAGNI)
      status: rejected
      description: Kill the `ktx plugin` namespace. Agents and humans edit ktx.toml's `[pipeline.default].stages` and any future `[[plugin]]` blocks directly. Amends D2.
      win_condition: Would be chosen if TOML-by-hand editing did not produce hallucinations or malformed arrays in agent sessions.
      rationale: "Rejected on the user's stated intent: agents editing TOML by hand are exactly the failure mode this registry exists to prevent. A pure-YAGNI kill leaves agents to author `stages = [\"sh:~/scripts/my-strip.sh\"]` strings with no schema enforcement, no introspection surface, and no path validation. The agent-native CLI principles in AGENTS.md (structured bounded I/O, self-correcting usability) require a structured verb surface, not free-form file editing."
    - name: Separate registry file
      status: rejected
      description: "`ktx plugin add` writes to ~/.local/share/ktx/plugins.yaml; ktx.toml stages reference plugin names resolved through this registry. Two-file model."
      win_condition: Would be chosen if separation of concerns between plugin definitions and pipeline composition outweighed single-source-of-truth.
      rationale: "Rejected because it introduces two files to keep in sync (drift risk), a name-resolution layer in the pipeline runner (complexity), and contradicts D5's 'ktx.toml IS the extension config' commitment. D5's single-file ethos and D14's artifact-to-ktx.db-table precedent both point toward single-source: ktx.toml owns plugin defs AND pipeline composition."
    - name: Installed scripts dir
      status: rejected
      description: "`ktx plugin add <path>` copies/symlinks the script into ~/.local/share/ktx/plugins/<name>/ and registers metadata; ktx.toml references by short name. Plugins are managed artifacts."
      win_condition: Would be chosen if ktx needed to ship or install plugins as managed artifacts with their own lifecycle.
      rationale: Rejected as scope creep. The user explicitly declined shareable installs and ecosystem features (YAGNI). External scripts at user-chosen paths, referenced by ktx.toml, are D5's existing model; adding a managed install dir introduces a script-sync problem (`ktx plugin update`?), a permissions model, and a uninstall-graph. None of this serves the agent-native intent.
    - name: Structured editor over ktx.toml [[plugin]] blocks
      status: chosen
      description: "`ktx plugin add/list/remove` are structured editors over `[[plugin]]` blocks in ktx.toml itself. Single source of truth (D5 honored). Block fields: `name` (required, the token used in stages arrays), `command` (required, the shell command), `description` (optional, agent+human introspection). `ktx plugin list --json` returns a UNIFIED view: built-in Go stages (marked `builtin=true`, `removable=false`) AND user `[[plugin]]` blocks (marked `builtin=false`, `removable=true`). `ktx plugin remove <name>` on a user-named plugin deletes its `[[plugin]]` block; if the name is also a built-in (e.g. `head`), the built-in re-emerges (the M4 `Register` last-writer-wins precedence already implements this). `ktx plugin remove <name>` on a builtin with no user override is a self-correcting usage error listing removable entries. Token syntax `name:arg` (first colon split, M4 existing) extends to external plugins — parameterised external stages use `plugin-name:arg` in the stages array. Companion verb `ktx config show --json` returns the active `[pipeline.<profile>].stages` arrays, so agents have a structured read surface for the active pipeline without authoring or reading TOML."
      win_condition: "`ktx plugin add foo ~/scripts/foo.sh --description '...'` writes a `[[plugin]]` block to ktx.toml; `ktx plugin list --json` returns the full valid-stage namespace (builtins + user); `ktx plugin remove foo` deletes the block; `ktx config show --json` returns the active pipeline stages for the default profile. Agents compose pipelines via `ktx plugin add` + edit `[pipeline.default].stages`, never by authoring TOML by hand."
  choice: "`ktx plugin add/list/remove` is a structured editor over `[[plugin]]` blocks in ktx.toml. Block fields: `name` (required), `command` (required), `description` (optional). D5 honored (single source of truth: ktx.toml owns both plugin definitions and pipeline composition). D2 honored (`ktx plugin` is registry CRUD, distinct from `ktx init`). Unified `list --json` view returns built-in Go stages (builtin=true, removable=false) and user plugins (builtin=false, removable=true) in one command — agent reasons about valid stage names with a single call. Precedence is the M4 `Registry.Register`'s existing 'last writer wins' rule (pipeline.go:132-134): a user plugin named `head` overrides the built-in head stage; removing the user plugin restores the built-in. Token syntax `name:arg` (first colon split, M4 existing) is reused: external plugins can be parameterised as `plugin-name:arg` in stages arrays. Companion verb `ktx config show --json` exposes the active `[pipeline.<profile>].stages` arrays so agents can verify 'did `foo` actually get used in the active pipeline?' without reading ktx.toml."
  reasoning: |-
    The choice falls out of three firm constraints.

    (1) Agent-native CLI intent (user's stated reason). The registry is NOT primarily for humans — it is a schema-enforced CLI surface agents call via `--json` instead of authoring TOML by hand. Every agent-edited TOML file is a hallucination vector (paths, array shape, key spelling). `ktx plugin add` with `name` + `command` + `--description` args collapses the authoring task to a structured call, and `ktx plugin list --json` makes the resulting state introspectable without re-reading the file. This directly realises AGENTS.md's agent-native principles (structured bounded I/O, self-correcting usability, schema-first) without forcing agents to parse free-form TOML.

    (2) D5's single-source-of-truth. ktx.toml already owns extension config; creating a parallel registry file (rejected alternative B) would introduce a drift surface and a resolution layer the pipeline runner does not need. The structured-editor pattern means the registry IS ktx.toml — `ktx plugin` is a verb shim that emits TOML edits in a schema-safe way, and `ktx compress` reads ktx.toml unchanged. No new file, no new resolution step, no D5 amendment.

    (3) M4 code's existing contract. The `Registry` (pipeline.go:109) already has `Register(name, s)` with last-writer-wins precedence explicitly 'matching the user config over built-in precedence a future plugin registry will need' (pipeline.go:132-134). The `Stage` interface is bytes-in, bytes-out, error-or-nil — process-agnostic, so an external shell-macro Builder slots in unchanged. The hand-rolled TOML reader in internal/config/config.go:38-46 explicitly anticipates BurntSushi/toml adoption for 'M5 richer surface (content-type profiles, shell macros, plugin references)' because the M4 reader cannot parse `[[plugin]]` array-of-tables. D21's choice lands directly in the seam M4 left open.

    Design rules (do not relitigate):
    - `ktx plugin` is registry CRUD over `[[plugin]]` blocks in ktx.toml — distinct from `ktx init` (runtime adapter installation). D2 honored.
    - Block fields: `name` (required, the token used in stages arrays), `command` (required, shell command), `description` (optional, agent+human introspection).
    - `ktx plugin list --json` returns a unified view: built-in Go stages (builtin=true, removable=false) AND user `[[plugin]]` blocks (builtin=false, removable=true). Single command for full valid-stage namespace.
    - Precedence: `Registry.Register`'s last-writer-wins (pipeline.go:132-134). User plugin named `head` overrides the built-in head; removing the user plugin restores the built-in. `ktx plugin remove <name>` where name is a builtin with no override returns a self-correcting usage error listing removable entries.
    - Token syntax `name:arg` (first colon split, M4 existing) is reused. External plugins can be parameterised as `plugin-name:arg` in stages arrays.
    - Companion verb `ktx config show --json` exposes the active `[pipeline.<profile>].stages` arrays. Agents verify 'did `foo` actually get used?' without reading ktx.toml. Separation from `ktx plugin list` honors SOLID single-responsibility.
    *
    Deferred (deliberate YAGNI, not rejections of future work):
    - Install-from-URL (`ktx plugin add org/repo`) — shareable installs. User explicitly declined.
    - Discovery by directory scanning — same.
    - Hashicorp-style compiled Go plugins — D5 prohibits.
    - Per-plugin `content_type` routing field — TODO.md:29 owns content-type detection; do not bake routing into the plugin block before that deliberation lands.
    - Per-stage `timeout` override — D14 failure contract territory; defer to a separate failure-policy resonera if needed.
    - `enabled = false` toggle — YAGNI for v1; agents can `remove` and re-`add`.
    - The external shell-macro Stage Builder subprocess contract (stdin/stdout bytes, exit-code error mapping) is implementation detail for planera; D21 settles WHAT, planera figures out HOW.
  confidence: firm
  feeds_into: "TODO.md:41 (plugin registry vs TOML pipeline) — UNBLOCKED and resolved by D21; ARCHITECTURE.md Pipeline-and-compression section — remove Open deliberations item, add D21 Decided entry; ARCHITECTURE.md CLI surface and ergonomics — D21 names `ktx plugin add/list/remove` and `ktx config show` as M5 verbs; internal/config/config.go — adopt BurntSushi/toml for `[[plugin]]` array-of-tables parsing (hand-rolled reader cannot support this shape); internal/pipeline/pipeline.go Registry — add external shell-macro Builder (subprocess invocation: stdin/stdout bytes, exit-code error mapping); internal/cli/plugin.go (new) — `ktx plugin add/list/remove` verb implementing structured ktx.toml editor; internal/cli/config.go (new) — `ktx config show --json` verb; TODO.md (new entry) — `ktx config show --json` companion verb surfaced by D21; M5 planera — D21 is the M5 contract; planera figures out the Builder subprocess details"
