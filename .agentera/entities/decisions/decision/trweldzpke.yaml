id: trweldzpke
artifact: decisions
record:
  date: 2026-07-09
  amendment_to: 23
  question: D23 shipped a multi-line recovery footer (a header line plus source_id plus original and compressed sizes plus the recovery command). The D23 plan flagged "empirical observation of agent recovery behavior" as the unvalidated assumption behind its provisional satisfaction. The signal has now arrived and it is negative. Should the D23 footer shape be revised to a single-line instructional form, and if so does dropping the original-size byte count break the decision context the footer is meant to carry?
  context: 'A real OpenCode session with recover_footer enabled fired the D23 footer on an `agentera prime --format json` output (source_id yvtxrsapfjcdczpt; 17615 to 8895 bytes; 49 percent reduction). The agent acknowledged seeing the footer in its own reasoning transcript ("It explicitly told me how to read the full non-truncated output and I ignored it") and re-ran the original tool call to /tmp rather than invoking `ktx read <source_id>`. The fielded footer read as a labelled report block (header plus four labelled fields); the recovery command was the last of four lines, prefaced by the verb "recover:" which reads as a label, not an action. The failure mode is structural rather than contextual: the agent noticed but did not act.'
  alternatives:
    - name: Single-line instructional footer; drop original size; keep compressed size + reduction percent + action cue + recovery command
      status: chosen
      description: 'buildRecoveryFooter emits one line: a leading newline, the bracket-ktx-bracket brand flag, the literal phrase "output compressed:", the compressed byte count, an open paren, the reduction percent, "% reduction", a close paren, a unicode bullet separator, the instructional cue "get full output with", and the literal `ktx read <source_id>` recovery command with the source_id as its argument, terminated by a newline. Leading bracket-ktx-bracket brand flag; then the size signal (decision context for weighing recovery cost against precision loss, preserved via the reduction percent); then a unicode bullet separator; then an instructional cue ("get full output with") immediately before the literal `ktx read <source_id>` command. Original byte count dropped — the reduction percent alone conveys loss magnitude at lower token cost than carrying both sizes. The "get full output with" cue names the action the agent is being invited to perform; "recover:" reads as a label.'
    - name: Reorder multi-line footer so the recovery command is the first line; keep all four D23 fields
      status: rejected
      description: Re-emit the same source_id / original / compressed / recover labelled lines but with the recover line first.
      rationale: The ktx recovery header framed the footer as a labelled report, not an action; re-ordering inside the same block keeps the structural feature that failed.
    - name: Collapse to one line but keep both original and compressed sizes
      status: rejected
      description: Single-line plus instructional framing, preserving the D23 original-size field.
      rationale: The reduction percent derives the original; carrying both adds tokens without adding decision context beyond what the ratio encodes. In the observed case the 49 percent reduction already tells the agent roughly half was lost. This is the user-confirmed simplification.
    - name: Leave the D23 footer as-is; treat the missed recovery as agent behavior, not a footer-shape issue
      status: rejected
      description: Record the negative empirical signal in progress.yaml; do not change buildRecoveryFooter.
      rationale: "The footer exists per D23 to move the in-context agent to recovery. If the agent does not move on the footer, the artifact fails its purpose. Restating the same shape against contradictory evidence converts firm into dogma and contradicts the AGENTS.md Do-not-relitigate clause: this is an explicit user-requested revisit grounded in empirical contradiction of the provisional-held assumption."
  choice: 'Amend D23 footer shape to a single-line instructional form. buildRecoveryFooter in internal/cli/hook.go now emits a single line containing the bracket-ktx-bracket brand flag, the compressed size in bytes, the reduction ratio as a percent, a unicode bullet separator, an instructional cue, and the literal `ktx read <source_id>` recovery command with the source_id as its argument. Fields retained from D23: source_id as the ktx read argument, compressed byte size, reduction ratio percent, recovery command `ktx read <source_id>`. Field dropped: the original byte count literal — the reduction percent alone conveys loss magnitude. Field added: an instructional cue ("get full output with") prefacing the recovery command. All D23 invariants preserved: footer off by default (recover_footer false); footer only when transformed is true; footer-aware anti-worsening gate unchanged in mechanism (it uses len of the footer, now slightly shorter); persisted Compressed.Output stays content-only; envelope.Output carries compressed plus footer; plugin propagates envelope.output verbatim; source_id surfaces only when recover_footer is enabled (D22 amendment); compressed_id stays dev-facing and never appears in the footer.'
  reasoning: 'D23 was provisionally satisfied pending empirical observation. The observation is a near-worst-case negative: the agent saw the footer, acknowledged it in its own reasoning transcript, and still chose a costlier workaround. The failure is "agent noticed but did not act" rather than "agent did not notice". The fielded footer read as a labelled report rather than an action invocation; the single-line instructional form reprioritises action — leading brand flag, then size signal, then separator, then the action cue naming the action immediately before the literal command. Dropping the original-size literal: the ratio derives it; carrying both adds tokens but no decision context. Cost-is-the-contract applies to the footer itself as much as to the compressed payload: a footer that adds fewer bytes AND is more likely to be followed is strictly better on both axes D23 cares about (token overhead AND recovery completion). Conservative-on-failure preserved: any future failure of the new footer does not regress the gate or content-only invariant (both are mechanism-level, format-agnostic). Compaction footnote: this edit also normalises the prior D23 satisfaction record against the freshly-installed decisions schema (state value fixed, unsupported review_needed field dropped) and flips ten earlier-shipped decisions (D1, D3, D4, D5, D6, D8, D10, D11, D12, D14) out of the active set by attaching a satisfaction block with state user_confirmed_satisfied. The ten are shipped-and-firm historical conclusions (early milestones, foundational CLI shape, M2 cost mechanics, M4 default pipeline, etc.) whose reasoning text is preserved untouched; only the satisfaction category changes.'
  confidence: firm
  feeds_into: internal/cli/hook.go buildRecoveryFooter (new single-line format string plus updated doc comment); internal/cli/hook.go printHookHelp (footer-description help text updated to drop the original from the size list and add the action-cue framing); internal/cli/hook_footer_test.go (assertions updated to probe the bracket-ktx-bracket marker instead of the legacy ktx recovery string; footer marker is now newline bracket-ktx-bracket; TestBuildRecoveryFooter_SizesAndRatio renamed to TestBuildRecoveryFooter_CompressedSizeAndRatio and asserts the original byte count does NOT surface); ktx.example.toml (footer-contents comment block updated to single-line plus instructional cue, with an explanatory note for the original-size omission); D23 satisfaction record normalised against the decisions schema (state value fixed, unsupported review_needed field dropped); ten earlier-shipped decisions flipped out of the active set (D1, D3, D4, D5, D6, D8, D10, D11, D12, D14); progress.yaml cycle 17
