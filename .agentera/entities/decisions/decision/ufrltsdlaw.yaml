id: ufrltsdlaw
artifact: decisions
record:
  date: 2026-07-26
  question: Which runtime-visible context observations should ktx retain, and what conclusions may they support?
  context: The firm runtime-only collection boundary permits only runtime-emitted fields or explicit runtime configuration with provenance. Retained OpenCode 1.18.4 evidence already establishes runtime session relationships, submitted-prompt equality groups, local event order, and emitted token/cache/cost fields while explicitly lacking provider-visible prefix, tool-schema segmentation, completion order, compaction, and provider request identity/count. The ordinary plugin emits native session/message/part identity, local acceptance order, optional runtime provider/model identity, and model-step measurements; it does not emit composed context segments. The retained synthetic probe has an explicit configured instruction and disables tools, but the current characterization does not normalize an instruction segment or expose schemas. Content-derived hashes are pseudonymous and may reveal low-entropy values, so general retention must not be called privacy-safe by default.
  alternatives:
    - name: Retain existing runtime identities, local order, emitted measurements, and provenance-scoped hashes/counts only for exact runtime-visible or explicit sanitized configuration segments; label every unsupported segment and boundary unavailable.
      status: chosen
    - name: Retain only already-emitted runtime identities, order, and token fields, with no derived equality evidence. Rejected because the retained sanitized runtime evidence already justifies scoped submitted-prompt and session equality hashes and ordinal/group counts without retaining content.
      status: rejected
    - name: Infer provider-visible prefixes or provider request boundaries from token movement, equality hashes, session continuity, or configured context. Rejected by the firm runtime-only boundary because none of those observations exposes provider composition or requests.
      status: rejected
  choice: "Keep two explicit evidence classes. Canonical runtime telemetry may retain the runtime-emitted native session/message/part identities needed for first-evidence identity, local acceptance/event ordinals, provider/model only when runtime-emitted or supplied by explicit runtime configuration, runtime/version/config provenance, and emitted uncached-input, cache-read, cache-write, output, reasoning, and cost fields with measured-zero distinct from unavailable. A derived context characterization may retain SHA-256 equality identifiers and UTF-8 byte or item counts only for exact submitted-prompt or instruction bytes that the runtime emits or an explicit sanitized runtime configuration supplies; each observation names segment kind, algorithm/count unit, source artifact or event, runtime/version, configuration digest, collection scope, and availability. Existing submitted-prompt and session hashes and ordinal groups remain valid only for their retained sanitized fixture. Instructions are available only when exact configured bytes and provenance are retained; the current characterization therefore leaves an instruction segment unavailable. Tool schemas remain unavailable because tools-disabled configuration is not a schema. Compaction/truncation events and before/after counts remain unavailable unless the runtime emits an explicit event; token changes are not compaction evidence. Session hashes establish runtime-local equality only; ordinals establish capture/launch order only, and completion order remains unavailable. Retain derived records with the benchmark/session evidence lifecycle and delete them with that scope; do not build a cross-experiment identity index. Exclude prompt/instruction content, credentials, secrets, raw cache namespaces, and extra message/part identifiers from derived records. Treat hashes as pseudonymous, not anonymous: do not hash secrets or general unsanitized/low-entropy user context, and do not expand general content-derived retention before the separate trust/redaction decision. Missing, unsupported, malformed, or uncollected segments are labeled unavailable, never zero or unchanged. Segment equality or change describes only that named runtime-visible segment. Provider-visible prefix composition, breakpoints, cache eligibility, provider request identity/count/boundaries, retries, isolation, and causality remain unavailable and cannot be inferred from any derived context evidence. No broader instrumentation or implementation follow-up is selected now."
  reasoning: This bounded combination preserves observations the runtime and retained synthetic configuration can actually substantiate while avoiding both needless loss of useful equality evidence and invented composition telemetry. Segment-specific provenance prevents a submitted prompt, configured instruction, session identity, or token aggregate from being relabeled as a composed prefix. The current evidence supports submitted-prompt/session equality and local ordering, but not instruction normalization, tool schemas, compaction, completion order, or provider requests; truthful unavailable labels are therefore part of the contract. Scoping existing hashes to sanitized fixtures and deferring general content-derived retention to the trust/redaction discussion addresses linkability and dictionary risk without pretending SHA-256 anonymizes content. No new follow-up is warranted because the selected contract does not require hypothetical runtime hooks and current unsupported segments must stay unavailable until actual runtime/config evidence exists.
  confidence: firm
  feeds_into: Runtime context evidence documentation; benchmark evidence manifests and validation; runtime cache telemetry configuration discussion; trust, redaction, and audit discussion.
