id: vwkbbycmgx
artifact: decisions
record:
  date: 2026-06-22
  question: How should ktx benchmark itself accurately, automatically, and reliably — the execution harness and comparison layer above D12's scoring contract?
  context: "D12 settled the v1 scoring methodology (exact-match, single-trial, cost_per_correct) and M3 implemented ktx bench run/report, proving the mechanics with a synthetic fixture (fake opencode binary + deterministic JSONL). But D12 and M3 did not address the execution layer: running real agents on real tasks, automating that in CI, and proving ktx's cost-reduction value claim. External research: headroom uses pytest-benchmark for micro-benchmarks plus scenario-based cost benchmarks with quality preservation tests (needles/errors must survive compression); lowfat uses Rust criterion for pure function-level benchmarks (strip-ansi, truncate, token-budget); rtk uses a Multipass VM with 11-phase integration tests including token-savings comparison (raw vs rtk-wrapped) and hyperfine latency measurement. openeval (the author's own project at ~/git/openeval) is a full harness for CLI coding agents with scenario management, pass@k, cost-per-passed-task, variation comparison, OTLP telemetry, and Docker isolation. The vision mandates 'cost is the contract' and 'boring before clever'. M4 (compression pipeline) is not yet built — ktx today only measures cost, does not reduce it. The open ARCHITECTURE.md item 'How per-layer savings roll into session and benchmark headline numbers without double-counting' is related but not directly resolved by this decision."
  alternatives:
    - name: Build ktx-native harness independently of openeval
      status: rejected
      description: Full control, no cross-project dependency. Duplicates scenario management, agent execution, and comparison infrastructure that openeval already provides. Violates DRY across projects.
      win_condition: Would be chosen if openeval did not exist or if ktx's benchmark needs were fundamentally incompatible with openeval's scenario model.
    - name: Two-tier model with ktx-native replay and openeval harness
      status: chosen
      description: Clean separation, no duplication, leverages openeval's existing infrastructure. ktx is unaware of openeval; openeval sees ktx as a wrapper command. Requires openeval to support per-variation agent command overrides (may need feature request). Two cost measurement systems (ktx D11 models.dev vs openeval config-based pricing) — both use provider-reported tokens, so numbers should match. Two tiers to maintain.
      win_condition: openeval can invoke `ktx run opencode` as the treatment variation's agent command, and the ktx-native replay benchmark correctly reproduces parser/cost numbers from a recorded session.
    - name: Single tier only (ktx-native or openeval, not both)
      status: rejected
      description: Simpler to maintain. Loses either the quick development feedback loop (ktx-native only) or the comprehensive published proof (openeval only).
      win_condition: Would be chosen if one tier was clearly sufficient for both development feedback and published proof.
  choice: "Two-tier benchmark model. Tier 1 (ktx-native): `ktx bench run --replay <session-id>` uses a recorded real OpenCode session, replays it through ktx's pipeline with an internal A/B comparison (baseline without compression + treatment with compression when M4 ships) in a single invocation. Deterministic, fast (seconds, no agent call), per-commit CI gate. Pre-M4: validates parser and cost-derivation accuracy, measures wrapper overhead. Post-M4: shows compression delta (token reduction, cost savings). Tier 2 (openeval): openeval runs live agent scenarios with with/without-ktx variation arms. Starts with shipped example-fixtures scenario (hello-verify, edit-file) to prove the comparison infrastructure end-to-end, upgrades to real SWE tasks ('Develop a TODO CLI in Go') later. Scheduled CI (nightly or pre-release), real API cost, pass@k + cost-per-passed-task. ktx is unaware of openeval; openeval sees ktx as a wrapper command. If openeval lacks telemetry for ktx-specific metrics (compression ratio, per-layer savings), file feature requests to the openeval repo. Design the harness for M4 compression, measure wrapper overhead and cost accuracy today."
  reasoning: |-
    openeval already solves the harness problem (scenario management, real agent execution, pass@k, variation comparison, Docker isolation) and the user owns it. Building a parallel harness inside ktx would duplicate that infrastructure and violate DRY. ktx's value in the benchmark is the compression (M4) and cost measurement (D11), not the harness. The ktx-native tier provides the quick development feedback loop that openeval cannot (seconds vs minutes, free vs real API cost, deterministic vs non-deterministic). The recorded replay model is the sweet spot: fast (no agent call), realistic (real agent output), reproducible (same recording produces same numbers), and tests compression on real data without agent variance. The internal A/B comparison in a single invocation means the developer sees the compression delta immediately without running two separate commands. Starting with openeval's example-fixtures proves the with/without-ktx comparison infrastructure before investing in scenario design. The per-commit plus scheduled CI rhythm is the standard tiered pattern: fast deterministic gate on every commit, comprehensive stochastic proof on schedule.

    Design rules (do not relitigate):
    - Two-tier model: ktx-native (recorded replay, per-commit) plus openeval (live agent, scheduled).
    - ktx-native: `ktx bench run --replay <session-id>` flag on existing M3 command. Internal A/B (baseline plus compressed in one invocation). Single output with both numbers and delta. Deterministic, fast, per-commit CI gate.
    - openeval: variation arms (baseline: opencode, treatment: ktx run opencode). Start with example-fixtures scenario, upgrade to real SWE tasks later. Scheduled CI (nightly or pre-release). pass@k plus cost-per-passed-task.
    - ktx is unaware of openeval; openeval sees ktx as a wrapper command. No coupling between the two codebases.
    - If openeval lacks telemetry for ktx-specific metrics (compression ratio, per-layer savings), file feature requests to the openeval repo.
    - Design the harness for M4 compression; measure wrapper overhead and cost accuracy today (pre-M4).
    - D12 methodology-v1.yaml stays for the live `ktx bench run` path. The replay benchmark uses a recorded session fixture, not the methodology file's pinned task.
    - Recorded session fixture: capture a real OpenCode session once via `ktx run opencode`, store the event stream as a replayable fixture.
    - Relitigation boundary: D12 scoring contract (exact-match, N=1, cost_per_correct) is firm. D13 governs the execution harness and comparison layer, not the scoring.
  confidence: provisional
  feeds_into: M4 compression impact measurement, ktx bench --replay implementation, openeval ktx-impact scenario, CI automation for benchmark, ARCHITECTURE.md Measurement and benchmark section
