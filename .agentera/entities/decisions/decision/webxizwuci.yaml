id: webxizwuci
artifact: decisions
record:
  date: 2026-07-09
  question: Should ktx surface an in-agent recovery path for lossy compression, and if so, what shape reconciles with the D22 invisibility contract and the D15 anti-worsening gate?
  context: "A real OpenCode session running an aggressive pipeline (keep-ends + token-budget) truncated five tool outputs the agent ultimately needed in full. Recovery cost 8+ workaround tool calls (file saves to /tmp, `node -e` JSON introspection, chunked `read` with offset/limit), including a `read` of a /tmp file the agent had just written that was itself truncated. The per-call anti-worsening gate checks `len(compressed) < len(input)` and is locally optimal per call but blind to downstream recovery overhead, so net session cost went UP despite per-call compression savings. The originals already existed in the database (D1, D22 persist the source before the pipeline runs), and the envelope already carries `source_id` + `compressed_id` (hook.go:28-32), but the OpenCode plugin discards both IDs by design (D22 invisibility: \"never injected into the agent's context\"). The gap was not mechanism — it was that the plugin discarded the recovery handle as \"invisible,\" leaving the agent no one-call undo. The truncation marker (`[... (N lines omitted) ...]`) was visible to the agent, but the agent never reached for `ktx read`/`ktx decompress` because no recovery instruction was surfaced."
  alternatives:
    - name: Proactive bypass (agent signals ktx to skip lossy compression per call)
      status: rejected
      description: Agent tells ktx "don't lossy-compress this one" up front, preventing the loss. Rejected for v1 because it requires the agent to know in advance which tool outputs need full fidelity, which the motivating session shows agents do not. Also requires a new per-call signaling surface (env var, JSON field, or flag) that does not exist; YAGNI before reactive recovery is observed insufficient.
    - name: Reactive recovery via plugin footer (source_id + size signal + recovery command)
      status: chosen
      description: ktx hook composes a recovery footer appended to the agent-visible compressed output, carrying source_id (recovery handle), original size, reduction ratio, and the recovery command `ktx read <source_id>`. The anti-worsening gate is amended to include footer bytes (compressed + footer must be < input to fire). Stored compressed artifact (DB row) stays content-only; `ktx decompress <id>` returns pure compressed. Agent-visible output (envelope.Output) carries content + footer. Per-call recovery only; session-batch is YAGNI.
    - name: Full metadata block (both IDs + pipeline name + both recovery commands)
      status: rejected
      description: Footer carries source_id AND compressed_id plus pipeline name and both `ktx read` and `ktx decompress` commands. Rejected because compressed_id and `ktx decompress` are dev-facing (reversibility audits, off-line inspection); the agent's recovery path is `ktx read` (returns the original untransformed). Pipeline name is YAGNI for the agent's recovery decision; size signal (ratio) is sufficient.
  choice: "Reactive recovery via plugin footer, off by default, configurable via ktx.toml. ktx hook composes the recovery footer when compression actually transforms (transformed=true) AND the configured `recover_footer` flag is enabled (default false). Footer shape: source_id, original size, reduction ratio, and `ktx read <source_id>` recovery command. The anti-worsening gate (D15/D14) is amended to include footer bytes: passthrough fires when `len(compressed) + len(footer) >= len(input)`, so compression wins too small to clear footer overhead are suppressed. D22 invisibility clause is amended for `source_id` only: source_id surfaces in the agent-visible footer when recovery is enabled; compressed_id stays dev-facing and is never in the footer. Stored compressed rows (DB) remain content-only; `ktx decompress <compressed_id>` returns the pure compressed bytes. Agent recovery path: `ktx read <source_id>` returns the ORIGINAL (untransformed) tool_call record. Recovery always layers — agents cannot replace in-context content; recovery appends the original as a fresh tool result alongside the compressed version."
  reasoning: |-
    The originals already exist in the DB (D1, D22 persisted them before the pipeline ran). The envelope already carries source_id + compressed_id. The gap was that the plugin discarded both IDs as invisible — no one-call undo existed. Surfacing source_id in a structured footer turns silent loss into compressed-with-recovery. The "include footer bytes" choice pressures the gate to refuse wins too small to justify the footer overhead — compression net-negative cases are now self-suppressing. Footer is OFF by default so existing users see no behavior change; agents that need recoverability opt in via `ktx.toml`. Size signal (ratio) in the footer gives the agent decision context to weigh recovery cost against benefit, avoiding over-recovery on large originals. Per-call recovery only; session-batch primitives are YAGNI until observed sessions show agents struggling with N recovery calls compounding context.
    Design rules (do not relitigate):
    - Footer composition lives in ktx hook (hook.go owns source_id, original size, reduction ratio). Plugin propagates envelope.Output unchanged (init.go:197-199 stays a simple assignment of envelope.output to output.output). The plugin does not parse or reformat the footer.
    - Config-gated: `[pipeline.default] recover_footer = false` (default). When false, behavior is byte-for-byte identical to today (D22 unchanged, no source_id in agent context). When true, footer is appended when transformed=true and the amended gate passes.
    - Amended anti-worsening gate (D15/D14 amendment): passthrough when `len(compressed) + len(footer) >= len(input)`. Stored compressed row stays content-only (no footer); the gate comparison uses the agent-visible bytes (compressed + footer) against the original input.
    - D22 invisibility amendment: source_id surfaces in the agent-visible footer WHEN recovery is enabled. compressed_id stays dev-facing (hookEnvelope still returns it for `ktx decompress`/audit), never in the footer. The invisible-by-default contract is preserved; opting into recovery opts into source_id visibility.
    - Recovery produces layering, not replacement: agents cannot replace in-context content. `ktx read <source_id>` returns the original tool_call record; the agent surfaces it as a fresh tool result. Compressed content stays in context; original layers on top.
    - Per-call recovery only. Session-batch primitives (`ktx read --recent`, "all compressed outputs in current session") are YAGNI; revisit only if observed sessions show agents struggling with N recovery calls compounding context.
    - Scope: footer is OpenCode-hook-path-specific. Wrapper mode (`ktx run`) does not intercept tool results today and so carries no footer there. Sidecar callers compose their own.
    - Footers are off by default. Existing users see no behavior change; the decision is opt-in via config.
  confidence: firm
  feeds_into: ktx hook footer composition (internal/cli/hook.go — build footer bytes when transformed=true and recover_footer enabled; append to envelope.Output); anti-worsening gate amendment (internal/cli/compress.go compressPipeline — pass footer length into gate comparison; passthrough when len(compressed)+len(footer) >= len(input)); config schema (internal/config/config.go — add recover_footer bool field to [pipeline.default], default false); ktx.example.toml (document recover_footer knob); D22 amendment recorded (source_id visibility is config-gated, not absolute); ARCHITECTURE.md (remove the "Agent-driven bypass and recovery surfacing" open deliberation added in this session — resolved by D23); TODO.md (implementation work entry)
