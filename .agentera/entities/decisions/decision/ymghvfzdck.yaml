id: ymghvfzdck
artifact: decisions
record:
  date: 2026-07-14
  question: How does ktx capture, persist, and report OpenCode prompt-cache telemetry (cache_read / cache_write tokens) alongside the existing token/cost evidence so strategy effects on caching, token spend, and total cost are attributable from a single self-contained experiment summary?
  context: OpenCode step_finish events already supply tokens.input, tokens.output, and cost (a non-cumulative per-step delta), and additionally include part.tokens.cache.{read,write} as per-request deltas. The ktx cost-evidence pipeline today captures tokens/cost but discards cache telemetry. The recorded_streams table already holds the authoritative stream; cache telemetry is a parse-and-persist question, not a new capture surface. Attempts that predate cache evidence (the schema-v1 attempts and the legacy summary.golden.json) must keep regenerating byte-for-byte identical summaries so historical experiments continue to validate. The wrapper persists only tool_use rows (D17/TODO.md:31 open item), and the task contract explicitly forbids putting model-step cache usage on tool_calls — cache telemetry lives on the step-aggregate, not the per-event row. bench_runs already has additive columns (D11/D15/D20 introduced additive migrations); additive columns with NULL preserving absent-vs-zero is the established pattern. summary.json schema_version=1 is read byte-comparatively by ValidateExperiment; bumping it for cache-bearing experiments lets historical byte-match validation remain exact, while cache-bearing experiments use schema_version=2. The live A/B pipeline identity (baseline/candidate side) already lives in the manifest (manifest.Pipelines[side].PipelineID / .Stages / .SHA256), so carrying it onto each summary side opens attribution without opening a new identification surface.
  alternatives:
    - name: Capture cache telemetry as SUM per attempt, persist to both experiment evidence and bench_runs, summarize under schema v2
      status: chosen
      description: "extend ParseStream (internal/experiment/stream.go) and the live-bench extractStreamMetrics (internal/cli/bench_run.go) to read part.tokens.cache.{read,write} on every step_finish event. Per-attempt aggregation is the SUM across the step_finish events — cache counts are per-request (OpenCode 1.17.8 fixture shows read=0 then read=15232 across two step_finish events; SUM = 15232). Absent vs emitted zero is preserved via nullable *float64 on experiment.Metrics and nullable *int64 on dbpkg.BenchRun, with new CacheReadEvents/CacheWriteEvents counters on experiment.UsageEvidence mirroring the existing TokensInEvents/TokensOutEvents/CostEvents completeness counters. Persist the two columns additively on bench_runs (cache_read INTEGER, cache_write INTEGER) with NULL preserving absent — no tool_calls changes. Strategy-attribution: each baseline/candidate side of summary.json carries pipeline_id, stage_labels (manifest.Pipelines[side].Stages), and pipeline_hash (manifest.Pipelines[side].SHA256) from the manifest so the summary is self-contained. Cache distributions (cache_read, cache_write) join the existing tokens_in/tokens_out/cost distributions, plus baseline-minus-candidate deltas for cache_read and cache_write. The v2 augmentation fires ONLY when ANY attempt under either side carries cache evidence; otherwise the summary regenerates byte-identical to schema_version=1 (legacy byte-match preserved). The replay envelope cost_drift section gains replayed/stored cache_read and cache_write values alongside the existing tokens/cost comparisons, with absent-vs-emitted-zero preserved on both sides."
    - name: MAX cache counts across step_finish events (treat as cumulative)
      status: rejected
      description: Treat cache.read/write as cumulative per-step counts and take the MAX observed value across step_finish events, under the assumption that each event reports the running total rather than a per-request delta.
      rationale: "OpenCode step_finish cache counts are per-request, not cumulative — the fixture proves this: read=0 on the first step_finish then read=15232 on the second means the provider billed 15232+0 = 15232 cache-read tokens total (per-request SUM matches), not MAX=15232 as if the first event's 0 were a prefix of the second. MAX coincidentally gives the same answer when the first event is 0, but produces wrong results when every event carries a non-zero per-request delta (e.g. read=100 then read=200 would give MAX=200 but SUM=300). Live evidence confirms: tokens.total == tokens.input + tokens.output + tokens.reasoning + tokens.cache.read + tokens.cache.write for every event, so cache values are per-request deltas just like tokens.input/output/cost."
    - name: Persist cache telemetry on tool_calls rows (per-event columns)
      status: rejected
      description: Add cache_read/cache_write columns to tool_calls and populate them from the step_finish event the wrapper persists.
      rationale: "OpenCode emits cache tokens on the step-aggregate step_finish event, not on tool_use (per-tool). Putting model-step cache usage on tool_calls rows would couple an aggregate metric to per-tool evidence and force every per-row consumer (cost-summed bench_runs headline, compression savings attribution, identity-derivation) to reason about a NULL column it does not need. violates the cost-summed evidence-set invariant D14 preserved when it introduced the compressed table: cache telemetry serializes the same way — added to bench_runs, not tool_calls."
    - name: Add a cache miss ratio as a headline metric
      status: rejected
      description: Compute cache_read / (cache_read + tokens.input) as a single headline number alongside cache_read/cache_write.
      rationale: Inventing a derived ratio expands the measurement surface beyond the provider-reported observations. The two raw cache counts already carry the provider's signal in unambiguous units; the cache_read distribution and baseline-minus-candidate delta let reviewers compute their own derived ratios without ktx committing to a formula that may not survive a provider's billing nuances.
    - name: Bump summary schema_version unconditionally to v2
      status: rejected
      description: Always emit schema_version=2 in summary.json, even for cache-less experiments.
      rationale: ValidateExperiment byte-matches the regenerated summary against the persisted summary.json. An unconditional bump would invalidate every historical summary.golden.json (the experiment-test fixture, any archived experiment directory) and force a rewrite of cache-less experiments. The conditional bump (v2 only when cache evidence is present) preserves the v1 byte-match contract for legacy experiments while opening v2 for cache-bearing ones.
  choice: "Capture cache telemetry on the existing step_finish parse paths and persist it additively. Per-attempt aggregation is SUM across step_finish events (per-request deltas). Absent vs emitted zero is preserved via nullable pointers: experiment.Metrics.CacheRead/CacheWrite are *float64 (matching the existing TokensIn/TokensOut/Cost shape under attempts.jsonl); dbpkg.BenchRun.CacheRead/CacheWrite are *int64 (matching the INTEGER-column-but-NULL-when-absent shape of the bench_runs headline store). experiment.UsageEvidence gains CacheReadEvents and CacheWriteEvents counters mirroring TokensInEvents. bench_runs gains cache_read and cache_write INTEGER columns via an additive ALTER TABLE migration (new benchRunsCacheColumns list; idempotent; CREATE TABLE includes them on fresh databases). No tool_calls changes. summary.json stays schema_version=1 when NO attempt carries cache evidence (byte-identical to legacy v1) and bumps to schema_version=2 ONLY when at least one attempt under either side carries cache evidence. Under v2 the summary becomes self-contained: each baseline/candidate side carries pipeline_id, stage_labels (manifest.Pipelines[side].Stages), and pipeline_hash (manifest.Pipelines[side].SHA256); cache_read and cache_write distributions join the existing token/cost distributions; baseline_minus_candidate gains cache_read and cache_write entries. The replay envelope cost_drift section gains replayed_cache_read, original_cache_read, replayed_cache_write, original_cache_write fields (nullable) alongside the existing tokens/cost fields; cache drift detection mirrors cost drift detection absent-vs-zero-aware. Product code stays clean of project-memory markers — no decision ID, no legacy-vintage labels in errors."
  reasoning: "OpenCode step_finish event already emits part.tokens.cache.{read,write} (verified fixture tools/bench/fixtures/opencode-tool-use.jsonl). The captured stream is already retained (D20 recorded_streams contract). Cache telemetry is parse-and-persist, nothing structurally new. SUM is the correct aggregation because OpenCode emits per-request cache counts per step_finish — observed pattern read=100 then read=200 across two step_finish events in another fixture means SUM=300 (100+200), while MAX would give 200 — the wrong answer. The nullable-pointer + CacheReadEvents/CacheWriteEvents counter shape mirrors the existing TokensIn/TokensOut/Cost completeness contract exactly (ParseStream guards `sawCacheRead && CacheReadEvents == steps` before populating the pointer), so the absent-vs-zero distinction survives the round-trip the same way the token/cost contract already does. The conditional schema_version bump preserves the byte-match证据 contract ValidateExperiment relies on (legacy summary.golden.json keeps validating; cache-bearing experiments validate against their own v2 fixture). Pipeline-attribution fields on each side (pipeline_id, stage_labels, pipeline_hash) read straight from manifest.Pipelines[side] — no new identification surface, the runner already records these in the manifest (D21-style) before any attempt runs. Cache deltas under baseline_minus_candidate join the existing tokens_in/tokens_out/cost deltas without renaming or contradicting the existing fields; strategy identity stays baseline-vs-candidate (the methodology vocabulary), so attribution flows downstream. Tool-calls stays untouched: cache is step-aggregate evidence (per-step_finish), never per-tool, and the D14 invariant (cost-summed evidence set not injected with non-evidence rows) is preserved. No tool_calls columns added. No cache miss ratio — the raw cache distributions plus the baseline-minus-candidate deltas carry the provider signal without inventing a derived metric. The replay cost_drift section provides consistency on cache the same way it already provides consistency on tokens and cost. Confidence is provisional: the implementation follows established patterns (nullable pointer + additive ALTER + byte-match golden), but the v2 schema bump will need at least one cache-bearing golden to lock the byte-match contract."
  confidence: provisional
  feeds_into: internal/experiment/model.go (Metrics.CacheRead/CacheWrite *float64; UsageEvidence.CacheReadEvents/CacheWriteEvents int); internal/experiment/stream.go (ParseStream reads part.tokens.cache.{read,write}; SUM aggregation; completeness gate); internal/experiment/summary.go (conditional schema_version=2 when cache evidence present; per-side pipeline_id + stage_labels + pipeline_hash; cache_read/cache_write distributions; baseline_minus_candidate cache_read/cache_write deltas); internal/db/schema.go (bench_runs CREATE TABLE cache_read/cache_write columns; new benchRunsCacheColumns list; migrateTx ALTER TABLE ADD COLUMN loop for older databases); internal/db/bench.go (BenchRun.CacheRead/CacheWrite *int64 with json tags; InsertBenchRun/QueryBenchRun carry the new columns; SummarizeBenchToolCalls unchanged — cache comes from the stream, not tool_calls); internal/cli/bench_run.go (streamMetrics gains cacheRead/cacheWrite; extractStreamMetrics parses part.tokens.cache.{read,write}; BenchRun populated from streamMetrics on the live path); internal/cli/bench_replay.go (cost_drift envelope gains replayed_cache_read/original_cache_read/replayed_cache_write/original_cache_write fields, plus cache_drift detection mirroring cost drift); tools/bench/methodology-v4-eval-matrix.yaml (output.fields lists cache_read/cache_write); docs/pipelines.md (cache telemetry in the output contract); legacy summary.golden.json byte-match preserved by the conditional schema_version bump; new cache-bearing golden (summary_cache.golden.json) locks the v2 byte-match contract
