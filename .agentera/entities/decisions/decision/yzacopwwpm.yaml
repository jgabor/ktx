id: yzacopwwpm
artifact: decisions
record:
  date: 2026-08-23
  question: What schema-readiness, timeout-ownership, and measurable release contract governs every database-backed KTX surface?
  context: The user requires migration to be automatic and invisible for every schema-dependent surface. This explicitly revisits the stale-schema read-only and manual-migration portions of iklzthoapi without changing its DB-free classification, binary identity, hermetic verification, or newer-than-binary recovery. Per-invocation ambient runtime digest proof from pkncauwnqe remains required. Controlled-host current-schema and generated 3.2 GB schema-15/16 evidence now supplies an approved numeric budget basis.
  alternatives:
    - name: Make readiness automatic for every supported stale database surface, give KTX sole deadline ownership, and gate releases at the controlled-host observed worst plus 25 percent.
      status: chosen
    - name: Keep query and doctor surfaces read-only on stale schemas and require an explicit migration command.
      status: rejected
    - name: Let adapters impose independent callback deadlines or use descriptive measurements without numeric release limits.
      status: rejected
  choice: "Every database-backed surface performs internal readiness before its operation. Missing databases retain surface-specific logical-empty, missing-input, or creation behavior. Current schemas avoid migration; query and inspection operations are read-only after readiness. Every supported older schema is prepared automatically, including for queries and doctor, with no schema-migration-required result or manual prerequisite. This supersedes only the stale-schema read-only/manual-migration portions of iklzthoapi. Schemas newer than the binary fail before writes and recover only by installing a forward-capable binary. Ambient Open-backed access still requires pkncauwnqe per-invocation runtime digest proof before path inspection or database effects. KTX solely owns startup, supported coordination, SQLite retry, operation, and migration deadlines; adapters wait for and preserve one KTX attribution. Stable exhausted-wait attributions are runtime-startup-timeout, database-unavailable/coordinator-timeout, database-unavailable/sqlite-lock-exhaustion, operation-timeout, and migration-timeout. Release measurement uses host allspark, CPU 2, GOMAXPROCS=1, one warmup and five measured samples for a minimal current database, a 3,205,058,560-byte current fixture, and fresh reflink copies of a 3,205,734,400-byte schema-15 fixture. Limits are ceil(worst observed across workloads times 1.25): readiness latency 61,670,678 ns, exclusive lock hold 513,522,625 ns, journal growth 10,900 bytes, peak RSS 26,465,280 bytes, and total completion 542,109,859 ns. Any excess blocks release; correctness, recovery, integrity, and newer-schema checks remain independent gates."
  reasoning: "Automatic readiness removes user-visible schema administration while preserving operation semantics after readiness. One timeout owner prevents contradictory callback and database failures. The approved empirical rule converts measurements into reproducible limits without inventing targets: exact host, binary, fixtures, sample count, instrumentation, observed worst values, derivation, and limits are recorded in docs/schema-readiness.md. Forward-only failure and per-invocation digest proof preserve the existing safety boundaries."
  confidence: firm
  feeds_into: Schema-15-to-16 compatibility and resumability, universal database-surface readiness, deterministic migration lifecycle verification, production-scale release gates, and final documentation synchronization.
