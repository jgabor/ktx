id: zcdzpzguri
artifact: decisions
record:
  date: 2026-07-26
  question: Which runtime cache telemetry and explicit runtime configuration should ktx retain, and how should unavailable fields and provenance be represented?
  context: The firm runtime-only boundary permits runtime-emitted observations and explicit runtime configuration with provenance, but excludes provider telemetry and provider-request semantics. OpenCode 1.18.4 retained streams expose per-model-step uncached input, cache read, cache write, output, reasoning, and cost with per-field measured, unknown, or malformed states. Benchmark attempts retain ordered model steps, role/side/cycle context, configuration and stream hashes, while manifests and attempt cache context retain configured model/provider/variant and runtime version. Observed mode has no adapter source or adapter version. Provider docs and pricing are references or estimates only. Decision state previously omitted or compacted remains unavailable and is not reconstructed.
  alternatives:
    - name: Retain runtime-emitted cache fields at their existing per-observation authority and explicit runtime/configuration provenance at existing attempt and manifest authorities; represent unsupported adapter/control and omitted fields as unavailable.
      status: chosen
    - name: Add runtime/provider cache-control ownership or capability negotiation. Rejected because the firm boundary does not authorize provider control as evidence, and retained OpenCode observations establish no supported isolation adapter.
      status: rejected
    - name: Reconstruct omitted cache fields from aggregate totals, runtime configuration, provider documentation, pricing, or neighboring observations. Rejected because those sources cannot establish the missing runtime-emitted value.
      status: rejected
  choice: Retain each runtime model-step observation’s uncached-input, cache-read, cache-write, output, reasoning, and reported-cost fields independently with source-event ordinal and runtime-emitted identity when present. A non-negative emitted value, including zero, is measured; zero cache read means no runtime-reported reuse and zero cache write means no runtime-reported fill. Missing or null is unavailable, represented by the existing machine state `unknown`; malformed is `malformed` and also unavailable for totals, estimates, and claims. Never replace either state from totals, configuration, docs, prices, another field, or another observation. Attempt totals exist only when every contributing model step measured that field. Attempt context retains experiment/attempt identity, side, role, cycle, execution order, observed cache mode, source `unavailable`, configured model/provider/variant, runtime version, configuration digest, and links/hashes for the retained stream. Manifest context retains the experiment-wide selected identity/configuration, runtime identity/version, observed mode, unavailable adapter source, methodology, repository/image provenance, and retention links. Per-step provider/model identity remains only what the runtime emitted; configured identity stays attempt/manifest context with provenance and never backfills a source event. Runtime version identifies the runtime contract that emitted or interpreted evidence. Adapter source and adapter version remain unavailable in observed mode; runtime version must not be relabeled as adapter version. Unsupported isolated/control modes are configuration outcomes only, produce no cache evidence, and authorize no provider-control or negotiation claim. Retain raw runtime streams and normalized model steps with their benchmark attempt/experiment lifecycle; retain sanitized explicit configuration or its digest according to the existing manifest/attempt authority, never credentials or raw cache namespaces. If a runtime omits a field, an attempt has no model step, or an adapter/control mode is unsupported, the fallback is unavailable—not reconstruction. Price-derived API cost remains separately labeled estimate and provider docs/pricing remain references, never telemetry. These observations support only runtime-reported cache-token values for the named runtime/version/configuration and attempt. They do not establish provider requests/counts/retries, provider-internal hit/miss/fill/eviction, cache eligibility, key/breakpoint, isolation, prefix composition, causality, or generic effectiveness. No implementation follow-up is selected because existing authorities already encode this contract; flwcllesfe will validate retained evidence later.
  reasoning: This choice preserves the finest evidence the runtime actually emits and keeps configuration and run context at the authorities that can substantiate them. Independent field states prevent a complete total or documented formula from laundering an omitted value into telemetry. Explicit observed/unavailable mode and separate runtime-versus-adapter provenance prevent unsupported control machinery from becoming evidence. Existing cache-aware collection, normalization, retention, and reports already preserve measured zero, unknown/malformed fields, complete-only totals, stream links, and attempt/manifest context, so adding product work would create unsupported semantics rather than improve evidence.
  confidence: firm
  feeds_into: Retained runtime cache evidence validation task flwcllesfe; benchmark manifests, attempts, validation, and telemetry documentation.
