artifact: decisions
record:
  date: 2026-09-06
  question: How can recording capture and normal benchmark interpretation use finite working memory without changing accepted results or evidence ownership?
  context: Completes the scope left provisional in jyykravpup under existing standing authority yohiahsqjv, without revising that historical record or progress szjxgyhosj. User-supplied verified analysis ses_f8a23cf36ffer1wnt7IAN5Xjry and local source review establish that normal bench consumes aggregate usage, first model/provider, final answer and recording bytes, not ModelSteps. Task jfgymxttel in plan hljjrlykxb remains in_progress; mljcarlewi owns future implementation. Evidence and qualification cases are in .agentera/verification/recording-resource-lifecycle.md.
  alternatives:
    - name: One private stdout spool shared by recording and benchmark interpretation, incremental hash, aggregate-only reader passes, private stderr spool, unchanged whole-value publication/replay.
      status: chosen
    - name: Keep whole stdout/stderr buffers or retain every ModelStep in normal bench; both grow with total input.
      status: rejected
    - name: Stop benchmark capture or interpretation at SQLite L; this changes independently accepted metrics and scores.
      status: rejected
    - name: Add a second stdout spool, a new input cap, schema migration or unsafe driver access; none is necessary.
      status: rejected
    - name: Unify oversized-line behavior or alter scoring during the resource fix; that changes unrelated semantics.
      status: rejected
  choice: |-
    Select one owner-private stdout spool, also the recording spool, with incremental SHA-256 and size accounting. Normal bench keeps capturing beyond the existing SQLite length limit L; it interprets the completed spool without whole-stream materialization or ModelSteps retention. Standalone optional recording may stop retaining after crossing L and preserve its partial copy while forwarding continues. Bench cannot stop its shared spool at L. Temporary storage scales with accepted stdout N and stderr E; there is no new hard cap or global retention quota.

    After the existing exact private producer/session completion receipt and intact spool completion, use sequential bounded reader passes. Aggregate-only usage preserves shared exact sums, completeness, absent/zero/malformed handling, floating cost order, and first nonempty model/provider extraction. Keep rich usage APIs and ModelSteps for experiment consumers. Usage retains its 64 MiB per-record skip-and-continue behavior, including exact-boundary and EOF details. Answer extraction keeps its existing 4 MiB Scanner configuration, stops after an oversized line, returns the last prior candidate, retains content/part precedence, and uses unchanged TrimSpace exact-match scoring. Do not replace this stop behavior with usage's skip behavior. Preserve tool-row/stream cost and model fallback precedence.

    Select private stderr scratch capture with bounded reader forwarding only on the existing failed-wrapper path, including ordinary completed nonzero exit. Preserve the warning, opening delimiter, all stderr bytes in order, and closing delimiter without inserting a newline or trimming. Successful unused stderr scratch is not recording evidence and may be removed; failed diagnostic scratch may be removed only after complete verified forwarding. Capture/read errors report diagnostic incompleteness. Required benchmark stdout capture/read failure cannot produce a headline from partial data; optional run recording failure remains a warning and does not stop normal forwarding. Missing producer receipt still fails before benchmark publication. Recording publication failure alone remains nonfatal for an otherwise valid benchmark.

    L is the existing effective SQLITE_LIMIT_LENGTH queried without modification on the actual reserved publication connection; re-query on connection replacement. Keep writer admission, schema checks, transaction/retry deadlines and no child-long writer lease. For every completed N <= L, attempt ordinary whole-value INSERT, without guessed row-overhead subtraction. For N > L, continue normal bench score/metrics, report only recording unavailable, and retain the completed private stdout spool. No TEXT/API/schema or accepted-size change.

    The actual run/attempt owner uses exclusive 0600 files in a 0700 owned application-data or confined benchmark directory, with existing descriptor/root-relative path protection. Its synced/closed size/hash metadata records the existing completion receipt, never substitutes for it. The DB transaction owns publication. Only verification of the exact committed row identity, linkage, format, size and recomputed hash permits that owner to remove the redundant stdout spool. Failed/uncertain publication, over-limit completion, partial capture and unknown/orphaned material retain the last private copy. Reconcile uncertain commit by exact identity before retry or cleanup. Interrupted partial bytes never become complete replay. Recovery inspection is explicit and owner-controlled; no automatic promotion, last-copy pruning, new public recovery command or daemon is selected. Committed evidence and existing process/session settlement remain unchanged.

    Keep the measured recording targets: 64 KiB transfer slab, <=8 MiB collector heap overhead over matched control; publication RSS <=128 MiB+16N, replay RSS <=256 MiB+64N, marginal isolated publication storage <=64 MiB+4L. Publication/replay bounds apply to persistable N, hence are proportional to existing L, not constant RAM. Extend qualification to both capture streams with reusable 64 KiB slabs and <=8 MiB combined overhead; aggregate/answer interpretation targets <=128 MiB+16R peak RSS for largest retained record R<=64 MiB and <=8 MiB retained-heap growth across fixed-record 1/8/16 MiB dense streams. Preserve exact arithmetic, including cancellation, with constant-count scalar state rather than event retention. Temporary capture storage is N+E plus fixed owner metadata/filesystem overhead; publication's allowance is additional work measured without double-counting the stdout spool. Thresholds are engineering qualification targets, not proven worst-case bounds or runtime rejection limits. Prior tmpfs RSS samples do not measure total host RAM or device latency.
  reasoning: The earlier gate confused input-sized temporary storage with input-sized working memory and treated unused rich evidence as a benchmark requirement. A shared stdout spool plus aggregate-only interpretation removes those causes while retaining every accepted byte needed for scoring and recovery, even above L. Existing parser record limits bound transient decoding; separate passes preserve their intentionally different observable behaviors. Existing measurements support capture savings and proportional publication/replay budgets, not full qualification. The evidence document assigns lowered-L, dense-step, stderr, arithmetic, reader-error, interruption and commit/cleanup cases to mljcarlewi. No unresolved public-contract question remains for this choice; test failures require a narrow correction first, and only an actual required contract change needs new authority.
  confidence: firm
  feeds_into: Resolves benchmark-recording-resource-coverage; TODO retains its anchor with a decision link and a pending implementation/qualification entry for mljcarlewi. PERF1 planning disposition only, not fixed. Supersedes only jyykravpup's unresolved coverage gate and its proposed bench storage/processing bounds, preserving its provisional history and measured proof. Linux ygcysqxcfr, terminal llshvynohy, completed producer ownership jgvodxuxul/vjwekaemvb and archive confinement remain. No runtime implementation, task status, evaluation, audit, satisfaction or commit.
