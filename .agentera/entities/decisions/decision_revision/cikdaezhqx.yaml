  date: 2026-08-24
  provenance: historical_revision
  base_sha256: 4bab0b84b433abed535a3ddb613699f9142de227acc3f06902a2863a64bdfe5c
  changes:
    choice: Every database-backed surface performs internal readiness before its operation. Missing databases retain surface-specific logical-empty, missing-input, or creation behavior. Current schemas avoid migration; query and inspection operations are read-only after readiness. Every supported older schema is prepared automatically, including for queries and doctor, with no schema-migration-required result or manual prerequisite. This supersedes the stale-schema read-only/manual-migration portions of iklzthoapi and pkncauwnqe earlier statement that doctor always remains read-only; pkncauwnqe per-invocation digest proof remains required before path inspection or database effects. Schemas newer than the binary fail before writes and recover only by installing a forward-capable binary. KTX solely owns startup, supported coordination, SQLite retry, operation, and migration deadlines; adapters wait for and preserve one KTX attribution. Stable exhausted-wait attributions are runtime-startup-timeout, database-unavailable/coordinator-timeout, database-unavailable/sqlite-lock-exhaustion, operation-timeout, and migration-timeout. Release measurement uses host allspark, CPU 2, GOMAXPROCS=1, one warmup and five measured samples for a minimal current database, a 3,205,054,464-byte current fixture, and fresh reflink copies of a 3,205,734,400-byte schema-15 fixture. The fixed release limits are readiness latency 35,322,974 ns, exclusive lock hold 101,037,622 ns, journal growth 50,000 bytes, peak RSS 26,557,440 bytes, and total completion 400,000,000 ns. The user-approved journal and completion limits supersede only their prior numeric values. Any excess blocks release; correctness, recovery, integrity, and newer-schema checks remain independent gates.
    reasoning: Automatic readiness removes user-visible schema administration while preserving operation semantics after readiness. One timeout owner prevents contradictory callback and database failures. The approved empirical rule converts measurements into reproducible limits without inventing targets. tools/schema_readiness_evidence.py and docs/notes/schema-readiness-baseline.json retain exact fixture generation, instrumentation, raw samples, observed worst values, and limits. Forward-only failure and per-invocation digest proof preserve the existing safety boundaries. After the bounded durable schema-15 migration correction, a valid production-shaped run showed that the prior journal and completion limits described the superseded one-transaction migration rather than the required resumable design. The user explicitly approved 50,000 bytes and 400,000,000 ns as fixed overrides. Readiness, lock-hold, and RSS limits, the measurement method, and every nonnumeric contract remain unchanged; historical observations retain their original limits.
