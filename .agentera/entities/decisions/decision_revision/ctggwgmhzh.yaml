  changes:
    choice: "Classify production surfaces as follows. DB-free, with neither fresh creation nor existing upgrade: ResolvePath; global and command help; version; init; config and plugin management; db path; unavailable db prune, which returns not implemented before opening a database; prices; replay-file; compare preflight; corpus generation; bench agent --identity and --capabilities; ordinary bench agent invocation when collector environment is absent; and evidence preflight. DB-free does not mean side-effect-free: their separately documented non-database filesystem, network, or process effects remain. Genuinely read-only, with neither creation nor migration: OpenReadOnly, db report, bench export, summarize, and validate; absent databases are not created. Open-backed fresh-creation and existing-upgrade surfaces: dispatcher get/read/list/stats/decompress and write/compress/hook; run; telemetry database subcommands; bench normal run/replay/report; and collector-enabled bench agent invocation, which resolves the collector path and calls db.Open. Normal compare and rank retain isolated per-attempt owner databases and reject reused attempt directories, so their nested collector paths preserve fresh ownership and are not supported existing-attempt upgrade workflows, even though the collector-enabled agent call itself uses creation- and upgrade-capable db.Open. Doctor currently has both Open capabilities despite read-only wording and must downstream use genuinely read-only access, report that an upgrade is required, and never migrate. Introduce downstream a DB-free ktx.binary-capabilities/v1 response identifying the effective binary by canonical executable path, executable SHA-256, build version, and maximum supported database schema. Generated OpenCode plugins resolve and canonicalize one ktx candidate once, verify that response, and invoke that pinned absolute path thereafter. A database user_version Y greater than binary maximum X is schema-incompatible, exits 5, and returns actual schema Y, maximum X, canonical database path, plus canonical binary path, digest, and build version. Ordinary plugin deduplication uses exactly error class + binary digest + canonical database path + actual Y + maximum X for one plugin instance. After the first matching incompatibility it skips repeated database opens and preserves original tool output; distinct keys are never suppressed. Required benchmark collection always propagates the incompatibility and fails closed. Plugin process restart resets suppression; no in-process binary-change detection is promised. Recovery installs and verifies a binary supporting Y or newer and never lowers user_version. Preserve ordinary safe auto-migration after installation. Mage and CI full-suite verification must unset KTX_DB and allocate one unique disposable HOME and XDG_DATA_HOME, XDG_CONFIG_HOME, XDG_CACHE_HOME, and XDG_STATE_HOME per invocation while keeping Go, Bun, and linter caches separate; development and rehearsal never access the ambient live path."
