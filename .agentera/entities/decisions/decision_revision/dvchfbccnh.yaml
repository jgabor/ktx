  base_sha256: 2143f96c3d86a63f32bb45d4427bc5a76ecc8f0ce4f1373a0bc1dcb7cb4bb337
  changes:
    choice: "Every database-backed surface performs internal readiness before its operation. Missing databases retain surface-specific logical-empty, missing-input, or creation behavior. Current schemas avoid migration; query and inspection operations are read-only after readiness. Every supported older schema is prepared automatically, including for queries and doctor, with no schema-migration-required result or manual prerequisite. This supersedes the stale-schema read-only/manual-migration portions of iklzthoapi and pkncauwnqe earlier statement that doctor always remains read-only; pkncauwnqe per-invocation digest proof remains required before path inspection or database effects. Schemas newer than the binary fail before writes and recover only by installing a forward-capable binary. KTX solely owns startup, supported coordination, SQLite retry, operation, and migration deadlines; adapters wait for and preserve one KTX attribution. Stable exhausted-wait attributions are runtime-startup-timeout, database-unavailable/coordinator-timeout, database-unavailable/sqlite-lock-exhaustion, operation-timeout, and migration-timeout. Release measurement uses host allspark, CPU 2, GOMAXPROCS=1, one warmup and five measured samples for a minimal current database, a 3,205,054,464-byte current fixture, and fresh reflink copies of a 3,205,734,400-byte schema-15 fixture. Retained exact reproduction sets limits to ceil(worst observed across workloads times 1.25): readiness latency 35,322,974 ns, exclusive lock hold 101,037,622 ns, journal growth 10,900 bytes, peak RSS 26,557,440 bytes, and total completion 113,236,942 ns. Any excess blocks release; correctness, recovery, integrity, and newer-schema checks remain independent gates."
    reasoning: Automatic readiness removes user-visible schema administration while preserving operation semantics after readiness. One timeout owner prevents contradictory callback and database failures. The approved empirical rule converts measurements into reproducible limits without inventing targets. tools/schema_readiness_evidence.py and docs/notes/schema-readiness-baseline.json now retain exact fixture generation, instrumentation, raw samples, observed worst values, derivation, and limits; exact rerun changed the prior unretained estimates, so all numeric authorities use the retained result. Forward-only failure and per-invocation digest proof preserve the existing safety boundaries.
