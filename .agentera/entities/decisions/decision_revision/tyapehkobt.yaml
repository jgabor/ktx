  changes:
    choice: Every database-backed surface performs internal readiness before its operation. Missing databases retain surface-specific logical-empty, missing-input, or creation behavior. Current schemas avoid migration; query and inspection operations are read-only after readiness. Every supported older schema is prepared automatically, including for queries and doctor, with no schema-migration-required result or manual prerequisite. This supersedes the stale-schema read-only/manual-migration portions of iklzthoapi and pkncauwnqe earlier statement that doctor always remains read-only; pkncauwnqe per-invocation digest proof remains required before path inspection or database effects. Schemas newer than the binary fail before writes and recover only by installing a forward-capable binary. KTX solely owns startup, supported coordination, SQLite retry, operation, and migration deadlines; adapters wait for and preserve one KTX attribution. Stable exhausted-wait attributions are runtime-startup-timeout, database-unavailable/coordinator-timeout, database-unavailable/sqlite-lock-exhaustion, operation-timeout, and migration-timeout. The tools/schema_readiness_evidence.py release gate uses host allspark, CPU 2, GOMAXPROCS=1, one warmup and five measured samples, and fresh copies of the exact production-scale schema-15 fixture. Every measured migration copy runs a normal KTX readiness query with production-generated hook and telemetry traffic under deterministic overlap. The fixed combined-workload release limits are readiness latency 35,322,974 ns, maximum individual exclusive-lock hold 560,264,885 ns, journal growth 50,000 bytes, aggregate concurrent KTX RSS 59,130,880 bytes, and total completion 893,936,754 ns. Aggregate concurrent KTX RSS, not one-process RSS, owns the memory criterion; per-process RSS remains supporting evidence. Any excess blocks release; correctness, recovery, integrity, exact historical authority, runtime proof, and newer-schema checks remain independent gates.
    reasoning: Automatic readiness, forward-only failure, one timeout owner, and per-invocation runtime digest proof remain unchanged. The corrected production-scale gate established actual query, generated hook, and telemetry overlap for each measured schema-15 copy and retained exact raw evidence in docs/notes/schema-readiness-release.json.failed.json. That valid rehearsal exceeded the earlier isolated-workload lock and completion limits and showed that concurrent memory must be evaluated as aggregate KTX RSS. The user explicitly approved 560,264,885 ns maximum individual lock hold, 59,130,880 aggregate concurrent KTX RSS, and 893,936,754 ns total completion for this combined workload. Readiness remains 35,322,974 ns and journal growth remains 50,000 bytes. The prior corrected failed report remains historical failure evidence and does not become passing authority. No migration, deadline, runtime-proof, readiness, or evidence-integrity behavior changes.
