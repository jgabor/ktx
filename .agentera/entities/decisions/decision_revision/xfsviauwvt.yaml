  changes:
    context: "The prior firm choice correctly rejected an unqualified provider or request hit rate, but its permanent ban on all hit-rate wording also prevented a precisely defined token-weighted metric for KTX cost optimization. The required product decision is narrower: detect whether KTX compression or transformations reduce provider prompt/prefix-cache treatment enough to erase token and cost savings. Runtime-reported cost can remain literal zero under subscription billing, while retained provider API prices support a separate normalized API-equivalent estimate. The supplied prefix-caching reference uses an explicitly defined token metric rather than provider-internal cache events. Existing OpenCode 1.18.5 accounting keeps uncached input, cache read, and cache write disjoint, and current KTX evidence already preserves complete-only bucket states, paired attempts, quality, runtime provenance, and exact pricing snapshots."
    alternatives.chosen: Permit a typed provider-specific prompt-cache token hit rate, keep reported and API-equivalent costs separate, and use quality-adjusted API-equivalent estimated total cost as the portable pipeline gate.
    alternatives.rejected:
      - Keep the blanket prohibition on all hit-rate wording.
      - Overwrite a measured reported-cost zero with catalog pricing.
      - Use prompt-cache token hit rate alone as the pipeline acceptance gate.
      - Treat the token metric as provider request hits or as evidence of eligibility, TTL, eviction, isolation, prefix composition, or provider-internal causality.
    choice: Retire the blanket prohibition on hit-rate wording. Permit `prompt_cache_token_hit_rate` for one pinned provider/runtime/version token contract, defined as sum(cache_read) divided by positive sum(uncached_input + cache_read + cache_write) across every contributing model step when all three buckets are measured and contractually disjoint. This is a token-weighted provider prompt/prefix-cache rate, not a request hit rate. Measured zero remains zero; empty, unknown, malformed, incomplete, or unsupported populations are unavailable. Report the formula, runtime/provider/model provenance, contributing model-step and session counts, observed window scope, and exact comparison unit. Attribute rate movement to KTX only through paired baseline/candidate attempts under the same task, provider, runtime, model, variant, cache protocol, and retained ordering controls; retain the existing minimum-pair, interval, identity, and quality gates for comparative claims. Preserve runtime-reported cost as separate evidence, including literal zero under subscription billing. Never replace reported zero or unavailable cost with pricing data. Publish a separate cache-aware API-equivalent estimated cost from the exact retained price snapshot for uncached input, cache reads, cache writes, output, and reasoning. Use quality-adjusted API-equivalent estimated total cost, not hit rate alone or reported cost, as the portable pipeline acceptance gate. A hit-rate decline may accompany a winning pipeline when total estimated cost falls; a hit-rate increase does not rescue a pipeline whose quality-adjusted estimated cost rises. Continue to forbid claims about provider request hits or misses, request counts, cache eligibility, fills, eviction, TTL, keys or breakpoints, isolation, prefix composition, and provider-internal causality unless a future source explicitly supplies those facts. Subscription amortization remains a separate future estimate requiring explicit fee, billing-period, and usage-denominator inputs.
    reasoning: The useful truth standard is claim fitness, not maximal certainty. For KTX cost decisions, complete runtime-reported token buckets directly support a versioned token-weighted rate without requiring provider request identity or internal cache state. Naming the formula and evidence scope makes the metric reproducible and honest enough for its purpose. Separating reported cost from API-equivalent estimated cost preserves a subscription user’s real marginal charge of zero while retaining a portable resource-cost comparison. Making quality-adjusted estimated total cost the gate prevents denominator effects, cache-write prices, total token volume, or a higher hit rate from producing the wrong pipeline decision. Paired controlled evidence is still required before attributing a difference to KTX.
    confidence: firm
    feeds_into: "`ktx stats summary` terminology and schema; cache-aware benchmark summaries and comparisons; API-equivalent pricing; pipeline acceptance gates; documentation and validation tasks."
