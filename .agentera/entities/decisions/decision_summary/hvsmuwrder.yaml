record:
  summary: "Decision 15 (2026-06-26): D9 payload extension: add two optional nullable fields to the flat JSON tool_call payload —..."
  date: 2026-06-26
  choice: "D9 payload extension: add two optional nullable fields to the flat JSON tool_call payload — exit_code (*int64, diagnostic) and is_error (*bool, canonical gating signal) — following the M2 nullable-pointer convention (nil = absent = no failure signal = treated as success; &false = explicitly successful; &true = failed; &0 = explicitly exited zero; &nonzero = exit-code-based failure). is_error is canonical: the pipeline runner checks is_error only; exit_code is never used for gating. The two fields are independent: a tool that throws (no exit code) can set is_error=&true with exit_code=nil; a bash tool sets exit_code=&N and is_error=&(N!=0) at parse time. Gating semantics: when is_error is true, compressLogic writes an IDENTITY compressed row (output == source.output, pipeline JSON == '[]', stderr warning 'ktx: warning: source tool_call indicates failure, compression skipped') and prints the compressed id (stable surface). This is a PRE-PIPELINE GATE — distinct from D14's three IN-PIPELINE invariants (empty-output guard, stage-error passthrough, unknown-stage skip). The gate checks is_error before runner.Run is called; the invariants govern stage behavior during execution. The two concerns are not conflated: the gate decides WHETHER to attempt compression; the invariants decide what happens WHEN a stage fails. OpenCode mapping (concrete): exit_code from part.state.metadata.exit (int64); is_error derived at parse time (exit_code != 0 when present, nil when absent). Flat-fallback mapping (defensive): exit_code from top-level exit_code/exit/code; is_error from top-level is_error/error; derive is_error from exit_code when is_error absent but exit_code present. Claude Code mapping: deferred (not knowable from codebase; flat-fallback covers it today). Schema migration: idempotent ALTER TABLE ADD COLUMN (exit_code INTEGER, is_error INTEGER) via PRAGMA table_info, same pattern as M2/bench_runs/compressed. SQLite stores is_error as INTEGER 0/1/NULL; the Go layer converts via sql.NullInt64 to *bool. Backward-compatible: existing rows get NULL for both (absent = success)."
  outcome: "{\"acceptance_criteria\":[{\"id\":\"AC1\",\"given\":\"a pre-D15 database (tool_calls without exit_code/is_error columns)\",\"when\":\"the database is opened by a D15 binary\",\"then\":\"ALTER TABLE ADD COLUMN adds exit_code INTEGER and is_error INTEGER to tool_calls idempotently (PRAGMA table_info check, same pattern as M2/bench_runs/compressed migrations); existing rows have NULL for both (absent = success); a re-open of a fully migrated database is a no-op\"},{\"id\":\"AC2\",\"given\":\"the ToolCall struct has ExitCode *int64 and IsError *bool (nullable pointers, no omitempty)\",\"when\":\"PersistToolCall writes a tool_call with is_error=&true and exit_code=&1, then GetToolCall fetches it\",\"then\":\"GetToolCall returns IsError=&true and ExitCode=&1 (present-and-nonzero survives the round-trip); with is_error=&false, exit_code=&0 returns &false and &0 (present-and-zero survives, distinct from absent); with is_error=nil, exit_code=nil returns nil and nil (absent survives); ktx read / ktx get emit is_error as JSON true/false/null and exit_code as JSON number/null (not omitted)\"},{\"id\":\"AC3\",\"given\":\"an OpenCode tool_use event with part.state.metadata.exit = 1\",\"when\":\"ParseEvent processes the event\",\"then\":\"the returned ToolCall has ExitCode=&1 and IsError=&true; with metadata.exit = 0, ExitCode=&0 and IsError=&false; with no metadata.exit field, ExitCode=nil and IsError=nil (absent = success)\"},{\"id\":\"AC4\",\"given\":\"a flat-fallback event with top-level exit_code = 2\",\"when\":\"ParseEvent processes the event\",\"then\":\"ExitCode=&2 and IsError=&true (derived from non-zero exit_code); with top-level is_error=true and no exit_code, IsError=&true and ExitCode=nil (is_error set independently); with neither field, ExitCode=nil and IsError=nil (absent = success)\"},{\"id\":\"AC5\",\"given\":\"a source tool_call with IsError=&true\",\"when\":\"ktx compress <source-id> is invoked with a configured pipeline (e.g. head:5)\",\"then\":\"an passthrough compressed row is written (output == source.output, pipeline == '[]'); a warning is written to stderr; decompress(compressed-id) returns the source's original output verbatim; the compressed id is printed to stdout (stable surface)\"},{\"id\":\"AC6\",\"given\":\"a source tool_call with IsError=nil (absent — backward-compatible existing row) or IsError=&false (explicitly successful)\",\"when\":\"ktx compress <source-id> is invoked with a configured pipeline\",\"then\":\"the pipeline runs normally (stages execute, output may differ from source); no skip warning is emitted; the gate does not fire for nil or &false\"},{\"id\":\"AC7\",\"given\":\"a source tool_call with IsError=nil (gate does not fire) and a configured pipeline with a stage that errors\",\"when\":\"ktx compress <source-id> is invoked\",\"then\":\"the D14 stage-execution-error passthrough invariant fires (stage input passes through unchanged); the D15 source-tool-failure gate does NOT fire (is_error is nil); the two concerns remain distinct (gate is pre-pipeline, invariants are in-pipeline)\"},{\"id\":\"AC8\",\"given\":\"a ktx write payload with is_error=true and exit_code=127\",\"when\":\"the payload is persisted via ktx write\",\"then\":\"GetToolCall returns IsError=&true and ExitCode=&127; without is_error or exit_code, returns nil and nil (backward-compatible)\"},{\"id\":\"AC9\",\"given\":\"the D15 changes (schema migration, ToolCall fields, parser extraction, compress gate)\",\"when\":\"go build ./... and go test ./... are run\",\"then\":\"all existing tests pass (M1–M4 regression preserved); new tests cover AC1–AC8\"}]}"
  feeds_into: tool_calls schema migration (exit_code, is_error columns), ToolCall struct (internal/db/record.go), PersistToolCall + GetToolCall (internal/db/record.go), parser extraction (internal/parser/parser.go — OpenCode metadata.exit, flat-fallback defensive reads), compressLogic source-tool-failure gate (internal/cli/compress.go), parser tests (internal/parser/parser_test.go), compress tests (internal/cli/compress_test.go), db persistence tests (internal/db/persist_test.go), closes D14 source-tool-failure deferral, ARCHITECTURE.md Record-model-and-persistence and Pipeline-and-compression Decided sections
