  summary: "Decision 5 (2026-06-15): Single TOML config file (ktx.toml) using github.com/BurntSushi/toml, at $XDG_CONFIG_HOME/ktx/ktx.toml (user-level only; project-root scope was dropped..."
  date: 2026-06-15
  choice: "Single TOML config file (ktx.toml) using github.com/BurntSushi/toml, at $XDG_CONFIG_HOME/ktx/ktx.toml (user-level only; project-root scope was dropped — ktx is not project-scoped). Shell macro arrays with content-type routing: each content type maps to an array of shell commands forming a pipeline. Content type detected from bytes (JSON, logs, code, prose). The pipeline can include memory-aware stages (shell macros calling go-agent for async distillation; content-type routing into a `memory` pipeline). Inline arrays only — no named macros in config. External scripts are the reuse mechanism. No custom DSL."
  feeds_into: M5 implementation, config file schema, content-type detection, BurntSushi/toml dependency
