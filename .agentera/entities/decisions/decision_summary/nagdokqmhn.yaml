id: nagdokqmhn
artifact: decisions
record:
  summary: "Decision 26 (2026-07-12): KTX exclusively owns persisted Codex tool-call identity under the current-state contract; the sole local database was converted once and the product ships no historical migration."
  date: 2026-07-12
  choice: KTX exclusively owns persisted Codex tool-call identity. For a usable Codex tuple, canonical identity is derived from the ordered tuple (runtime, session, tool_use_id) under derivation version ktx-tool-call-id-v1. Each field must be valid UTF-8. Strip only leading and trailing ASCII whitespace (bytes 0x09 through 0x0d and 0x20); lowercase the runtime field using ASCII A-Z mapping; preserve session and tool_use_id bytes exactly after that trim, including case and internal whitespace. All three normalized fields must be non-empty. Frame the derivation preimage as the UTF-8 domain bytes ktx-tool-call-id-v1 followed by each ordered field encoded as an unsigned 32-bit big-endian byte length and then its bytes. Hash that preimage with SHA-256, interpret the digest as one unsigned big-endian integer, reduce it modulo 26^16, and encode the result as exactly 16 base-26 digits using a=0 through z=25, most-significant digit first with leading a digits retained. The same tuple therefore maps identically across processes, machines, and releases. If any field is missing, invalid UTF-8, or empty after normalization, the tuple is unusable and the accepted event receives a fresh cryptographically random canonical KTX ID; missing identifiers are never replaced by a shared sentinel or hashed into a common identity. The external identifier is not retained as metadata or alias. Because KTX is unreleased and has one user, the sole local database was backed up and converted once. KTX ships no historical identifier migration, compatibility alias, or upgrade contract.
  feeds_into: Codex hook ingress; canonical ID derivation; retry conflict handling; recovery commands; structured output
  satisfaction:
    state: user_confirmed_satisfied
    user_confirmation:
      confirmed_by: Jonathan Gabor
