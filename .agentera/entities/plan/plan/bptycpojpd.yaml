  design: Define current semantic identities and self-contained retained inputs first. Cut every active command to that registry, then establish one experiment root and ID-based lifecycle. Separate active runtime cache contracts from obsolete probe code before deletion. Remove all legacy readers and inactive probes only after current-schema validation is independent. Finish with destructive local cleanup, repository verification, and synchronized documentation.
