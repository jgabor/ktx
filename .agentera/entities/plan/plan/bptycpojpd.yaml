    title: "Plan: Cut Over Benchmark Specs and Experiment Storage"
  what: Replace versioned benchmark filenames and path-oriented commands with semantic IDs, make current experiment archives self-contained under one project-local root, and remove legacy compatibility plus inactive probe surfaces.
  why: Make benchmark execution and experiment discovery understandable from intent rather than filenames, version suffixes, paths, aliases, or multiple generated-data roots.
  constraints: Use one clean cutover with no public compatibility aliases or legacy archive readers. Retain machine format and result schema versions internally, and snapshot exact active input bytes plus SHA-256 in each new archive. Preserve tracked static history unchanged but unsupported. Delete only the inventoried repository-root `.bench-data`, as explicitly authorized. Keep active prompt-cache and runtime telemetry behavior. Run no provider calls and never access the ambient live database. Use proportional pass/fail tests.
  overall_acceptance: GIVEN the cutover is complete WHEN a user runs current benchmark workflows THEN every input and experiment is selected by semantic ID, generated state lives only under `.ktx/experiments`, current archives validate independently of working-tree inputs, inactive probes and public legacy vocabulary are absent, and static tracked history remains unchanged.
  scope:
    included:
      - semantic active spec, task, pipeline, and contract registries
      - self-contained current experiment manifest and snapshots
      - ID-only benchmark execution and lifecycle commands
      - project-local experiment storage and derived listing
      - active cache-runtime dependency extraction
      - inactive probe and legacy-reader removal
      - authorized local archive deletion
      - documentation, skills, tests, and project-state synchronization
    excluded:
      - changing benchmark metrics, scoring, or pipeline algorithms
      - rerunning paid experiments
      - rewriting tracked historical reports or Agentera records
      - supporting legacy paths, aliases, readers, or migrations
