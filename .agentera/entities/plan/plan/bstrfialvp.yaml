      affects_task: 6
      resolve_by: Tasks 1 and 2 define the contract; task 5 evaluates retained evidence offline; task 6 creates a separate costed collection follow-up only if a demonstrable objective remains unmet.
    - question: Can authoritative regeneration preserve promised legacy bytes while reporting derived-projection divergence separately and rejecting only conflicting authoritative duplicates?
      affects_task: 4
      resolve_by: Task 3 proves regeneration and compatibility before task 4 adopts the authoritative projection.
