    title: "Plan: Validate and extend Luna SkillsBench evidence"
  what: Preserve validated SkillsBench campaigns, add four paired Luna repetitions on the existing task, assess five Luna pairs, conditionally evaluate three diverse tasks, and publish durable descriptive evidence.
  why: Convert a successful one-pair Luna integration proof into durable repeated and cross-task evidence while bounding paid attempts and preserving quality, provenance, credential safety, and honest claim scope.
  constraints: Use openai/gpt-5.6-luna with high only, schema 7, zero retries, complete no-model preflight, explicit paid authorization, fresh disposable application roots, KTX_DB unset, and new attempt directories. Limit additional paid work to eight same-task attempts plus six gated diversity attempts. Preserve historical campaigns. Keep OAuth cost unavailable and make no causal or significance claim. Stop on identity, credential, preflight, infrastructure, or validation failure. Publishing this plan does not authorize paid execution.
  overall_acceptance: GIVEN the current Luna canary and bounded evidence ladder WHEN preservation, replication, gating, optional diversity evaluation, and publication finish THEN every successful retained campaign validates from durable storage, every diagnostic or failed campaign retains explicit status and failure reasons, every paid attempt is accounted for, and no unsupported cost, significance, or causal claim is made.
  scope:
    included:
      - Durable preservation and inventory of current successful and diagnostic campaigns
      - Four additional paired Luna repetitions on 3d-scan-calc
      - Descriptive assessment across five Luna pairs
      - A gated three-task Luna diversity slice of six attempts
      - Final evidence documentation, validation, review, and Agentera state synchronization
    excluded:
      - Changes to the compression pipeline before the replication gate
      - Retrying or reusing failed or non-empty attempts
      - Provider billing or dollar-cost claims from OAuth runs
      - Broad SkillsBench execution beyond the approved ladder
    deferred:
      - Larger multi-task or statistical studies
      - API-key and LiteLLM cost experiments
      - Pipeline redesign if the replication gate indicates regression
  design: Establish durable provenance first. Replicate the existing task next and apply a predeclared descriptive gate. Use the gate either to defer further spending or to evaluate a small diversity slice. Publish only from retained, validated evidence and finish by synchronizing plan state with the reported result.
  unknowns:
    - question: Which durable evidence root is ignored, persistent, and suitable for campaign archives?
      affects_task: 1
      resolve_by: Verify repository storage policy and archive persistence before copying any campaign; stop all dependent work if no suitable root is approved.
    - question: Do five Luna pairs preserve quality and compression without a consistent total-token regression?
      affects_task: 4
      resolve_by: Apply task 3's predeclared directional gate before any diversity spending.
    - question: Which three tasks provide deterministic verifiers, meaningful tool output, manageable runtime, and category diversity?
      affects_task: 4
      resolve_by: Produce and preflight a qualifying shortlist before any diversity spending.
