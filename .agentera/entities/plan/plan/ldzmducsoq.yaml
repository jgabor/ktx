  design: Establish the shared selection and compatibility contract before changing consumers. Implement eligible source selection with explicit explanations, propagate it through reports and cost decisions, and verify consistent behavior using retained synthetic evidence. Preserve historical authorities and primary metrics while publishing one canonical guide and concise agent pointers.
  overall_acceptance: GIVEN a cost-evidence cohort WHEN current policy is applied THEN all cost decisions use one appropriate basis with a visible reason, estimates remain independent of billing proof, and unavailable cost preserves valid observations. GIVEN historical evidence and non-cost-primary methods WHEN current policy is used THEN raw values, historical contracts, aggregation populations and primary metrics are not silently rewritten. GIVEN completed delivery WHEN evaluated THEN focused tests, repository checks and rebuilt isolated-binary conformance pass.
