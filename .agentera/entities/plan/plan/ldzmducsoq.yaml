      resolve_by: Map current consumers and schema fixtures in the first task. Establish an additive or versioned output contract before reporting integration; clarify any required breaking change.
    - question: Which observations existing methodologies require for cost coverage and aggregation, and which attribution gaps are merely billing uncertainty?
      affects_task: 1
      resolve_by: Use the bounded consumer inventory and existing contracts before implementing selection. Preserve their inclusion and aggregation rules; unknown billing derivation alone is not rejection. Clarify consequential unresolved populations.
    - question: Can current database-backed reports and retained ranking views expose this policy without broader persistence changes?
      affects_task: 3
      resolve_by: Establish supported current-view boundaries during the first task. Leave estimates unavailable where retained inputs are insufficient; do not add a migration or fabricate evidence to force availability.
