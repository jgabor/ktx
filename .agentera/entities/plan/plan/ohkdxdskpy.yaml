  surprises: |-
    Container diagnosis established that the pinned runtime's OAuth model-name filter removes gpt-6-luna; supported explicit registration restores the same API ID without a runtime or model change. The existing comparison cannot retain or mount this runtime configuration. Pull forward one bounded comparison-input prerequisite to enable qualification, then resume the original feasibility gate. This is infrastructure recovery within the approved evidence plan, not a normalization choice or production rollout. Original failures, qualification criteria and dependent semantic experiments remain intact.
    Before any normalization measurements, pinned-runtime investigation showed that the default-window oracle can exercise the actual read tool through a local synthetic model transport. It also exposed an overstrong protocol requirement to reload upstream source/schema files inside an immutable pinned binary. Clarify the update gate as pinned-source identity plus actual-runtime changed read-hook ingress rejection and stale-fixture/transform rejection. Retain upstream source-file reload as untested, preserve all semantic campaign gates, and make no general runtime-upgrade or provider-schema claim. No treatment, paid model, runtime, scoring threshold or observed measurement is changed by this pre-measurement clarification.
