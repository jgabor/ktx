    title: "Plan: Instruction and tool-schema normalization evidence"
  what: Establish worthwhile deterministic transformations, extend existing comparisons only for supported candidates, test preservation and updates, and measure whole-task savings. Produce bounded evidence supporting adoption, rejection, source-side correction, or deferral without deploying a normalizer.
  why: Resolve the evidence gaps behind instruction and tool-schema normalization, tracked by TODO symvxmfbwz. Smaller inputs and higher cache-hit rates do not establish cheaper correct work. The user prioritizes whole-task cost and accepts substantial slowdown. Cost-first evaluation belongs to this investigation; existing token-first benchmark contracts remain unchanged.
  constraints: Respect runtime-only evidence and privacy boundaries, existing CLI and archive compatibility, exact originals, and isolated evidence ownership. Unsupported observations remain unavailable. No production-default changes, provider-internal claims, private-history acquisition, general unsanitized hashing, vision/objective edits, commits, or pushes. Stop and replan when consequential discoveries change downstream scope. Infeasibility leaves dependent tasks unperformed and the architecture question open; do not claim completion by skipping work. User approval is required for the final architectural choice and any deployment.
  scope:
    included:
      - Review retained studies, current runtime behavior and relevant current documentation. Distinguish supported facts, unexamined existing records and genuinely missing evidence. Use synthetic or explicitly sanitized instruction/schema examples; identify actual overhead or instability before choosing transformations.
      - Candidate records name the exact transformation, input source, expected benefit, semantic risks, applicability, runtime application boundary, serialization responsibility and update dependencies. Identify normalization already performed by the runtime. Keep instruction and schema experiments separate; investigate ordering, descriptions, formatting or duplicate ambiguity only when relevant to selected candidates.
      - Qualify feasibility before dependent implementation. Every paid qualification, probe and measured run must use Dockerfile.benchmark with --model openai/gpt-6-luna --variant high. Record actual model, variant, image, runtime, binary and collector identities. Preserve the pinned runtime unless a demonstrated incompatibility triggers explicit replanning; never silently substitute a model or runtime. Declare finite attempt, spend and time limits before paid qualification. Confirm authentication, collector authority and compatible pricing without exposing credentials.
      - "Freeze the experimental contract before measured runs: expected semantic behavior, update cases, representative task coverage, unchanged original baseline, one selected transformation per arm, unchanged tool-output pipeline, paired ordering, repetitions, exclusions, correctness and cost thresholds, finite attempt/spend/time limits and stop rules. First-use and repeated-use scenarios are runtime observations, not proof of provider-cold state or cache isolation. Keep cache-control observed and preserve actual application provenance."
      - Whole-task cost accounting includes failures, retries and applicable setup/rebuild costs. Keep runtime-reported costs separate from pinned-price API-equivalent estimates; zero reported cost does not establish free work, and missing values never become zero. Recommendations require compatible pricing, adequate cost coverage and predeclared correctness gates. Report time, input/output/reasoning tokens, cache observations, recovery and repeated work as diagnostics. Describe initial costs, break-even where relevant and scoped uncertainty without unsupported causal or significance claims.
      - Extend existing benchmark comparison and archive surfaces only where needed to supply selected original/transformed inputs at their actual runtime boundary. Preserve exact fixture bytes, versions, source identities and application evidence. Validate retained evidence without silently relying on mutable external sources. Missing or altered required evidence invalidates results. Verify changes to source instructions, schemas and transformations take effect without stale reuse. Do not infer the provider-visible assembled prefix.
      - Preservation checks cover explicit instruction constraints and correct tool behavior as well as task completion. Use deliberately broken controls to establish detection. Separate deterministic offline checks from live-only semantic checks; measured attempts must be scored under the frozen cases. Missing correctness or cost coverage permits an inconclusive report, not a savings recommendation.
      - Each implementation cycle runs focused tests, mage check and rebuilt-local-binary verification on Linux. Unset KTX_DB and allocate fresh disposable HOME, XDG_DATA_HOME, XDG_CONFIG_HOME, XDG_CACHE_HOME and XDG_STATE_HOME per verification invocation. Retain existing isolated attempt-owner and credential-handling rules for benchmarks; never access the ambient database. Test proportionality targets one pass and one fail per testable unit, with extra semantic, privacy and evidence-tampering cases justified by risk.
      - Retain invalid, failed and interrupted attempts and incurred costs; follow predeclared retry/exclusion rules rather than selectively replacing poor results. Preserve historical archives unchanged. Validate the new retained evidence before recommendations; an earlier preflight or historical pass does not qualify the new experiment.
      - Publish an evidence report with per-transformation outcomes, coverage and unresolved gaps. Benchmark success alone does not establish a production owner or update path. Present adoption or source-side correction as conditional until the relevant production boundary is evidenced and the user approves. Use typed state writers for approved decisions and task state; reconcile ARCHITECTURE.md and TODO.md only to the extent resolved. Do not mark the existing normalization discussion complete merely because a benchmark finishes. No product deployment is included.
    excluded:
      - A new benchmark framework or external evaluation harness.
      - Production normalization rollout or changes to ordinary runtime defaults.
      - Instruction indexing/retrieval, general trust/redaction redesign or cross-session memory.
      - Broad provider/model sweeps, private-history collection and ambient database access.
    deferred:
      - Product adoption and newly justified implementation follow-ups require a separately approved architectural choice and execution scope.
  design: Review existing evidence and establish observability and model feasibility before selecting changes. Freeze a bounded experiment, extend only missing comparison support, establish preservation and update checks, then run correctness-scored paired measurements. Combine behavior, whole-task cost and coverage into a recommendation with explicit limits. Infeasible experiments stop for plan revision rather than expanding scope or running unrelated comparisons.
  overall_acceptance: GIVEN qualified candidates WHEN retained comparisons are evaluated THEN each has a reproducible, correctness-gated cost conclusion or an explicit inconclusive result with input/update provenance and claim limits. GIVEN infeasibility WHEN a gate fails THEN dependent work stops for plan revision without falsely completing tasks or resolving the architecture question. GIVEN an experimental recommendation WHEN reviewed THEN production adoption remains conditional on evidenced ownership, update behavior and user approval.
