      - The read / command absent / subcommand absent / default / default_fallback / anti_worsening_rejected / 1k-10k opportunity signal
      - Representative head, middle, tail, structured, failure, eligible, and passthrough cases
      - Partial safe applicability under currently supported metadata routing
      - At most one reversible route or transform intervention
      - Paired controlled comparison and project-state synchronization
    excluded:
      - New routing predicates or content-based automatic routing
      - Ambient live database access or unauthorized retained-content inspection
      - Shipped-default changes or post-change rollout
      - Provider-internal cache conclusions or collection-continuity claims
      - Unrelated pipeline, benchmark, or cleanup work
