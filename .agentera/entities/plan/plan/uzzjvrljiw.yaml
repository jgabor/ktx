  constraints: Use only supported metadata routing; preserve required facts, errors, exact counts, passthrough, and recovery; use authorized non-live or disposable evidence; keep missing evidence distinct from no-candidate; change at most one route or transform; leave shipped defaults unchanged.
  overall_acceptance: GIVEN the selected residual subgroup WHEN the successor experiment closes THEN a complete representative matrix supports either one controlled candidate result or an evidence-backed no-candidate result, while incomplete evidence remains blocked and shipped defaults remain unchanged.
  scope:
