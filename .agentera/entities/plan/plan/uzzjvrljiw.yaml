      - Post-change live validation
      - Any shipped-default proposal
  design: "First establish the representative cases and immutable evaluation rules. Evaluate bounded interventions against that complete matrix and select at most one provisional candidate, allowing safe partial applicability with passthrough elsewhere. Apply and compare only the selected candidate, then synchronize one of three distinct outcomes: validated candidate, evidence-backed no-candidate, or blocked for missing authorized evidence."
