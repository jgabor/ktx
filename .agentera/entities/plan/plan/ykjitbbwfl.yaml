      affects_task: 7
      resolve_by: Use task 1 evidence; remove an unshipped surface, or provide bounded deprecation when real consumers exist.
    - question: Are all retained raw campaign artifacts complete enough for corrected offline revalidation?
      affects_task: 6
      resolve_by: Use task 3's inventory; publish corrected validation when complete, otherwise label the archive incomplete or non-regenerable.
    - question: Does upstream provide a canonical SkillsBench release identity and official task digests?
      affects_task: 5
      resolve_by: Verify upstream identity; otherwise lock exact source and task digests and label the campaign as external evidence.
    - question: Which release-validation owner keeps one lock and one workflow without recreating scattered tooling or product coupling?
      affects_task: 5
      resolve_by: Choose the smallest non-shipped owner in task 2 that preserves immutable archives and independent validation.
