record:
  name: Record typed database availability events
  depends_on:
    - mwqgjygkyy
  status: pending
  acceptance:
    - GIVEN database-unavailable and an enabled error sink WHEN the failure is reported THEN one error event records timestamp, runtime surface, executable identity, database path, failure class, operation phase, elapsed wait, and correction using the closed event schema.
    - GIVEN the availability event is serialized WHEN its fields are inspected THEN it excludes payloads, database content, SQL, raw driver wording, credentials, secrets, arbitrary wrapped errors, and undeclared fields, and documentation treats paths and hashes as sensitive retained data rather than anonymous data.
    - GIVEN file logging is disabled, below threshold, contended, unwritable, invalid, or unavailable WHEN the same failure occurs THEN existing stderr diagnostic bytes, stdout, exit status, executable validation, schema handling, and conservative adapter fallback remain unchanged.
    - GIVEN a successful command or another failure class WHEN it completes THEN it emits no database-unavailable event, and the generic logger accepts only deliberate typed event call sites rather than scraping process streams.
    - GIVEN hook and telemetry failures at each bounded availability phase WHEN focused regression tests run THEN enabled, disabled, below-threshold, and sink-failure cases preserve the existing content-exclusion and diagnostic contracts.
  plan: lxyymlqiye
