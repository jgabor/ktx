id: mtmnvuppec
artifact: plan
record:
  name: "Hook: generate ID and timestamp when empty (relax hard requirements)"
  depends_on:
    []
  status: complete
  acceptance:
    - |
      GIVEN a hook payload with an empty id field WHEN ktx hook runs THEN the hook generates a 16-char lowercase alpha ID and persists the row (no error).
    - |
      GIVEN a hook payload with an empty timestamp field WHEN ktx hook runs THEN the hook generates an RFC3339Nano timestamp and persists the row (no error).
    - |
      GIVEN a hook payload with both id and timestamp populated WHEN ktx hook runs THEN the hook uses the caller-supplied values (backward compatible).
    - |
      GIVEN a hook payload with an empty tool field WHEN ktx hook runs THEN the hook returns a usage error (tool remains required — the binary cannot infer it).
    - |
      GIVEN ktx hook --help WHEN read THEN the help text does not list id or timestamp as required fields (they are now optional, generated when empty).
  test_proportionality: 3 testable units (empty-id-generates, empty-timestamp-generates, supplied-values-pass-through); one pass per unit + one fail (empty-tool-rejected) + one documentation check (help text).
  plan: qwgcryrgdq
