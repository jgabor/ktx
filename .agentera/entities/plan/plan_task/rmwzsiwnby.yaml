    - GIVEN current trusted OpenCode runtime sources and retained streams WHEN prefix evidence is characterized THEN stable-prefix and changing-tail hashes or counts, instruction and tool-schema segments, breakpoint placement, compaction or truncation events, and TTL availability are reported separately by runtime version and model path.
