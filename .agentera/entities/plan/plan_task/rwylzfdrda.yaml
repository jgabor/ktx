    - GIVEN preflight finds no accessible eligible pair WHEN plan status is evaluated THEN no paid calls occur, this task remains blocked, and the negative-controls and native-probes TODO items remain open.
    - GIVEN any live probe is requested WHEN preflight runs THEN it emits the provider and model, exact maximum request count and spend, maximum TTL wall time, artifact destination, and redaction policy before network activity; non-interactive opt-in is required and hard limits stop excess work.
    - GIVEN probe evidence is retained WHEN tracked artifacts are reviewed THEN prompts are synthetic, credentials and raw namespaces are absent, sensitive correlation identifiers are omitted or hashed, and any necessary raw response remains only in an ignored local artifact.
    - GIVEN a probe case and its expected opposite WHEN the bounded probe suite is verified THEN each controllable dimension has at least one positive and one negative case within the declared bounds.
