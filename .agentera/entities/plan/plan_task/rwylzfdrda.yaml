  acceptance:
    - GIVEN an accessible eligible provider/runtime pair WHEN controls run THEN retained evidence covers same-prefix/same-key, same-prefix/different-key, changed-prefix/same-key, cold-fill-repeat, and one-request/multi-request behavior.
    - GIVEN provider TTL and concurrency controls are supported WHEN probes run THEN pre/post-TTL and sequential/concurrent outcomes are retained with execution order and intentional delay rather than inferred from orchestration time.
    - GIVEN both direct-provider and OpenCode access for a pair WHEN equivalent requests run THEN native and normalized per-request fields are compared and any retry, rounding, or field-loss difference is explicit.
