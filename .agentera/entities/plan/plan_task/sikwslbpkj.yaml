    - GIVEN foreign readers or writers hold SQLite beyond the supported wait WHEN classified THEN they use the foreign-lock outcome rather than being counted as supported-concurrency success.
    - GIVEN current, stale-compatible, and newer-incompatible schemas WHEN tested THEN each transition has an ordinary and an adverse case with exact post-state verification.
