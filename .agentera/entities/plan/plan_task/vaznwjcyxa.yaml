    - GIVEN a successful command or a different failure class WHEN OpenCode handles the result THEN no database-unavailable attribution is added and existing behavior remains unchanged.
    - GIVEN diagnostic and adapter regression tests run with KTX_DB unset and fresh disposable application roots WHEN verification completes THEN each new failure-only field and content-exclusion boundary is covered and the repository check passes.
