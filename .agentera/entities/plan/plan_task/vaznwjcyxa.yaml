  acceptance:
    - GIVEN an ordinary OpenCode hook or telemetry command fails with database-unavailable WHEN the failure is reported THEN one diagnostic identifies the runtime surface, pinned canonical executable path and SHA-256, canonical database path, failure class, operation phase, elapsed wait, and existing correction guidance.
    - GIVEN a supported coordinator timeout or SQLite lock exhaustion WHEN either failure is classified THEN the diagnostic uses distinct stable classes without raw driver wording.
