    go test ./internal/experiment -run '^TestSemanticIDOfflineExperimentFixture$' -count=1
    rm -rf "$work/source"
    test ! -e "$work/source"
    (cd "$work" && "$repo/build/ktx" bench list > list.json && "$repo/build/ktx" bench show semantic-cutover-offline > show.json && "$repo/build/ktx" bench summarize semantic-cutover-offline > summarize.json && "$repo/build/ktx" bench validate semantic-cutover-offline > validate.json)
    python3 - "$work" <<'PYMETRICS'
    import json, sys
    from pathlib import Path
    work = Path(sys.argv[1]); root = work / '.ktx/experiments/semantic-cutover-offline'
    def measure(path):
        files = [p for p in path.rglob('*') if p.is_file()] if path.is_dir() else [path]
        return {'files': len(files), 'allocated_bytes': sum(p.stat().st_blocks * 512 for p in files)}
    print(json.dumps({'source_exists': (work/'source').exists(), 'total': measure(root), 'top_level': {p.name: measure(p) for p in sorted(root.iterdir())}, 'workspaces': {p.parent.name: measure(p) for p in sorted(root.glob('attempts/*/workspace'))}, 'list': json.loads((work/'list.json').read_text()), 'validate': json.loads((work/'validate.json').read_text())}, sort_keys=True))
    PYMETRICS
    rm -rf "$work" "$app"
