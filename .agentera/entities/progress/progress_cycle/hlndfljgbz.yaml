    Exact runnable sequence from the repository root:
    repo=$PWD
    work=$(mktemp -d /tmp/ktx-cutover-fixture.XXXXXX)
    app=$(mktemp -d /tmp/ktx-cutover-app.XXXXXX)
    mkdir "$app/home" "$app/data" "$app/config" "$app/cache" "$app/state"
    export HOME="$app/home" XDG_DATA_HOME="$app/data" XDG_CONFIG_HOME="$app/config" XDG_CACHE_HOME="$app/cache" XDG_STATE_HOME="$app/state" KTX_OFFLINE_FIXTURE_ROOT="$work"
