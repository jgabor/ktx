  what: Executed and rejected the database-wide reader coexistence candidate, restored production reader ownership, and retained byte-exact blocked-decompression evidence plus a schema-stability regression.
  context:
    intent: Determine whether SQLite active-query locking could replace handle-lifetime supported reader ownership under concurrent agents.
    constraints: Preserve current-schema queries, mixed-version protection, read-only safety, writer coordination, exact evidence authority, and existing journal and retry policy.
