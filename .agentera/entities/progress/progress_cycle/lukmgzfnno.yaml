    intent: Correct the accepted supported-reader liveness defect without changing database topology, benchmark semantics, or hook acceptance authority.
    constraints: Preserve one binary and one SQLite database, genuine read-only access, forward migration, typed schema errors, first-evidence authority, pre-source pass-through, and descriptive timing.
