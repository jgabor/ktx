  verified: The fresh-binary pre-fix smoke ran `ktx read stalledreadsrcaa | sleep 15`; `timeout 11s ktx hook` returned 124 after 11 seconds with empty stdout and stderr, and its database audit recorded 7 accesses with forbidden=0. After the correction, the same built-binary smoke returned database-unavailable with exit 4 in 2003.820 ms against the existing 2-second startup bound, with an empty stdout, canonical database path, non-empty correction, and no database-is-locked, SQLITE_BUSY, or SQLITE_LOCKED wording. The blocked-attempt audit again recorded 7 accesses with forbidden=0. The exact regression observed zero source, artifact, and disposition rows before releasing the reader; after release, retry persisted one source and one disposition, returned the original output, and completed in 7.431 ms. The built-binary retry completed in 17.617 ms; its final audit recorded 9 accesses with forbidden=0. The 50 ms coordinator seam passed for file-lease and process-local queue deadlines and recovery. Full internal database and CLI tests passed with 722 accesses and forbidden=0, including reader/writer, migration, alias, termination, foreign-lock, read-only, and schema coverage. The generated OpenCode adapter database-unavailable pass-through suite passed with forbidden=0. `mage engineeringVerify` passed with component 108 and load 1086 accesses, each forbidden=0. Isolated `mage check` passed race tests, vet, lint with 0 issues, and build with 1012 accesses and forbidden=0.
