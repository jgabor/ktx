  requirements:
    - "The [recovery path decision](.agentera/entities/decisions/decision/hsgbnahzew.yaml) took the first step toward three command pairs: read and write for text, compress and decompress as pipe filters, and get and set for JSON records. Until this is decided, `ktx write` takes a JSON record while `ktx read` returns text."
    - Decide what `ktx write` accepts and records, whether a `ktx set` takes over the JSON sidecar ingress, and what `ktx read` does for session IDs in the final surface.
    - Decide whether compress and decompress read stdin, whether piped compression stores the original, and what the compressed JSON carries so decompress can resolve it.
    - Decide whether a `ktx prime` command is needed beside the bundled skill, and for which runtimes.
    - Decide how existing callers, docs and benchmarks migrate without manual steps, given the vision's promise of a stable command surface.
