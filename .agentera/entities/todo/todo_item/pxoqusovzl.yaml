  title: Publish the ktx Claude Code plugin as ktx@ktx
  requirements:
    - Serve a marketplace named ktx from the root of the jgabor/ktx repository with one plugin, ktx, holding the Bash PostToolUse hook and the stats mod.
    - The hook runs `ktx hook --runtime claude-code` and the mod runs `ktx stats summary`, both resolved through PATH; no path is written into plugin files.
    - At session start the mod reads `ktx --version`; below the plugin's declared minimum release it turns itself off with one line that says to upgrade ktx. Versions without a release number pass.
    - "`ktx init claude` runs `claude plugin marketplace add jgabor/ktx` and `claude plugin install ktx@ktx`, succeeds when both are already present, and prints a note to run /reload-plugins. Without `claude` on PATH it prints the commands. It never edits Claude Code settings files."
    - Remove the local marketplace generator, its marker, and the embedded plugin copies; add no migration code for ktx-local.
    - Update the Claude Code guide, the CLI reference, and help text.
  acceptance:
    - A live session shows that the hooks.json command and the mod's process call both resolve a bare `ktx` through PATH.
    - Tests cover the version check (below minimum, at minimum, development build), `ktx init claude` with and without `claude`, and a re-run when the marketplace and plugin are already installed.
    - "`claude plugin validate --strict` and `claude plugin test` pass on the published plugin."
