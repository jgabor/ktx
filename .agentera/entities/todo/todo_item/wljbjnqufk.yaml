  title: "Native distribution for OpenCode and Codex — Run a structured discussion and record how ktx is installed through each runtime's own plugin system: the channel per runtime, how the plugin finds the ktx executable, what `ktx init opencode` and `ktx init codex` become, how benchmarks keep an exact plugin identity, and whether the opencode-ktx sidebar moves into this repository. → [Question](ARCHITECTURE.md#native-distribution-for-opencode-and-codex)"
  requirements:
    - Decide the distribution channel for OpenCode (npm packages loaded from `opencode.json` and `tui.json`) and for Codex (a repository marketplace for `codex plugin add`), or record why a runtime keeps generated adapters.
    - Decide how each plugin finds ktx, given that the Codex hook pins a canonical path today and the OpenCode plugin pins the ktx it finds on PATH at startup, and how plugin and binary versions stay compatible.
    - Decide what `ktx init opencode` and `ktx init codex` do afterwards, and how benchmarks that require the generated OpenCode plugin to match the binary keep that identity.
    - Decide whether the opencode-ktx TUI sidebar moves into this repository, and how Codex shows ktx statistics without a panel API.
    - Account for Codex reading the repository's Claude Code marketplace files.
