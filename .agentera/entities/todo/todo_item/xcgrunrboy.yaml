    - Read-only smoke verifies no stage/plugin execution or configuration mutation. Existing no-recipe output contracts remain compatible, and runtime/inspection expansion agrees.
    - Run focused config/diagnostics tests, mage check, and rebuilt local-binary verification under disposable HOME/XDG roots with ambient KTX_DB unset; retain evidence.
