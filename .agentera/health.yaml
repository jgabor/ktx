      - severity: warning
        heading: Codex trust classification accepts any non-empty hook event name
        confidence: 98
        location: internal/cli/hook.go:219
        evidence: The Codex branch treats every non-empty hook_event_name as trusted Codex PostToolUse provenance. A retained temporary-database probe sent hook_event_name=NotPostToolUse twice with a complete tuple and persisted one deterministic codex source row, despite ARCHITECTURE.md:162-167 limiting eligibility to recognized trusted native ingress.
        impact: An unrecognized hook event can enter deterministic retry and first-evidence authority semantics. This violates the stated trust boundary and leaves the main negative provenance case untested.
        suggested_action: Require hook_event_name to equal PostToolUse before applying trusted Codex provenance; reject or use fresh untrusted handling for other values, and add a regression test. Run dedicated security tooling beyond this surface-level trust-boundary review.
        verify_command: tmp=$(mktemp -d /tmp/opencode/ktx-audit-trust.XXXXXX); mkdir $tmp/config $tmp/runtime $tmp/data; payload='{"hook_event_name":"NotPostToolUse","session_id":"spoof-session","tool_use_id":"spoof-call","tool_name":"Bash","tool_input":{"command":"echo hi"},"tool_response":{"aggregated_output":"hi\n","exit_code":0}}'; env KTX_DB=$tmp/ktx.db XDG_CONFIG_HOME=$tmp/config XDG_RUNTIME_DIR=$tmp/runtime XDG_DATA_HOME=$tmp/data ./build/ktx hook <<<$payload; env KTX_DB=$tmp/ktx.db XDG_CONFIG_HOME=$tmp/config XDG_RUNTIME_DIR=$tmp/runtime XDG_DATA_HOME=$tmp/data ./build/ktx hook <<<$payload; sqlite3 $tmp/ktx.db 'SELECT id, runtime, count(*) OVER () FROM tool_calls;'
