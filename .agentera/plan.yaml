  title: "Deepen cost deriver, db file layout, and event parser"
what: "Three deepening refactors from the architecture review, in dependency order. (1) Extract D11 cost-derivation logic into a `costDeriver` deep module behind a `PriceSource` seam so both `PersistToolCall` and `InsertBenchRun` delegate to it. (2) Reorganise `internal/db` files from 'cut by table' to 'cut by concern' (open/session/record/bench/prices/inspect/cost). (3) Extract the JSON event -> ToolCall parser from `internal/cli/run.go` into a new `internal/parser/` package, making it directly testable and reusable across the M4 hook path (D1 universal protocol)."
why: "These are the three '-> Deepening' opportunities from the architecture review (TODO.md). All three are well-primed by the regression net from the previous two plans. Each compounds AI-navigability: cost-deriver makes the D11 contract testable as a pure function with an injected `PriceSource`; db reorg puts each concern in a single context window; event-parser becomes the single source of truth for the ktx tool_call shape."
constraints: "D1-D12 firm decisions stand. Go stdlib first, no new deps. The new test files (cost_test.go, parser_test.go) are net additions; existing test files are modified only for relocate-within-package in Task 2 (rename/relocate, no logic changes). `costDeriver` is module-internal (lives under `internal/db/`); `PriceSource` interface is module-internal too. `internal/parser/` is module-internal (under `internal/parser/`); the parser package is importable from any future module-internal package without circular deps on `internal/cli`. db reorg is move-only -- no public API change, no signature change. event-parser extraction is package-level -- no production behaviour change. Total net LOC delta -50 to +200. `go test -race -count=3` must remain clean throughout."
