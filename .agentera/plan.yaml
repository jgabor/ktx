header:
  level: light
  created: "2026-06-30"
  status: complete
  title: "D20 Recording Contract — ktx bench run --replay (pre-M4 consistency check)"
what: "Implement Decision 20 (provisional) — the recording contract for `ktx bench run --replay <session-id>`. A new INSERT-only `recorded_streams` table in ktx.db persists the captured JSONL stream that `ktx bench run` already holds in memory (runBenchRun's agentStdout bytes, bench.go:998-1050), keyed by session_id and bench_run_id (two NOT NULL FKs). `ktx bench run` gains a `--replay <session-id>` flag (on the existing M3 command, NOT a new subcommand) that makes the (agent, model, task) triple optional — the triple is read from the referenced bench_runs row instead. The replay path re-parses the recorded stream through parser.ParseEvent (validates parser regression: re-parsed tool_use count == originally-persisted sessions.tool_call_count — a mismatch means the parser code changed between capture and replay), re-aggregates tokens/cost via the existing extractStreamMetrics helper (validates cost-derivation accuracy + surfaces price-cache drift if ktx prices updated between capture and replay), and emits a JSON consistency headline comparing replay-derived metrics to the originally-recorded bench_runs row — with ZERO agent calls. Schema migration is idempotent CREATE TABLE IF NOT EXISTS in db.Open schemaStatements (same pattern as the `compressed` table in internal/db/open.go), self-healing pre-D20 databases on next open. The capture trigger is `ktx bench run` ONLY — `ktx run` (the wrapper subprocess) stays a D1 transparent proxy and does NOT persist the stream (no unbounded ktx.db growth, no wrapper behavior change). Post-M4 A/B (baseline without compression vs treatment with compression) is OUT OF SCOPE per D20 — pre-M4 comparison is 'replay vs original' (consistency check) only."
why: "Decision 13 (provisional, Tier 1) committed to `ktx bench run --replay <session-id>` as the fast, free, deterministic per-commit CI gate; D16/D17/D18/D19 validated the wrapper capture path against real opencode 1.17.8 and produced a candidate bench_run fixture (`ccsbkoluqgkgtelc`, paired session_id `sdeloqgthcgasfld`); D20 closed the recording-contract deliberation: the authoritative cost evidence (D17) is the captured JSONL stream (step_finish carries tokens/cost/model that tool_call rows lack by design), and that evidence belongs in the database following D14's artifact-to-table precedent (not a sibling repo file, not a sessions.captured_stdout column). With D20 settled, the four TODO.md --replay implementation steps are unblocked. The pre-M4 consistency check (replay vs original) is the value now: it proves parser regression and cost-derivation accuracy on every commit without re-paying API cost, and it surfaces price-cache drift so a cost headline that depended on a stale cache becomes auditable. M4 (compression pipeline) extends the same recorded stream to baseline-vs-treatment A/B without a schema change to recorded_streams; that extension is explicitly out of scope here."
constraints: "D20 design rules (locked, do not relitigate): (1) recorded_streams columns: id (D3 16-char nanoid PK), session_id (NOT NULL FK to sessions.id), bench_run_id (NOT NULL FK to bench_runs.id), stream_text (TEXT — verbatim JSONL stream), content_hash (D9 SHA-256 of stream_text), stream_format (TEXT e.g. 'opencode-jsonl-1'), captured_at (TEXT RFC3339Nano). (2) Migration: idempotent CREATE TABLE IF NOT EXISTS in db.Open schemaStatements — same pattern as the `compressed` table in internal/db/open.go. No ALTER TABLE column add, period — neither to existing tables nor a partial-column-forward-fix loop for recorded_streams itself. The CREATE TABLE IF NOT EXISTS alone handles the fresh-DB and pre-D20 self-heal paths; a partial-recorded_streams schema is so pathological that defense-in-depth is unnecessary (resolved judgment call 1). (3) Capture trigger: `ktx bench run` ONLY. runBenchRun already holds agentStdout bytes in a bytes.Buffer (bench.go:998-1050); add one InsertRecordedStream call after InsertBenchRun completes (the bench_run_id is then known). `ktx run` stays a D1 transparent proxy and does NOT persist the stream. (4) `--replay <session-id>` loads recorded_streams by session_id (session-id is the public arg per D13); bench_run_id is an internal FK, NOT a public --replay arg. Not-found → exit 2 (D4 contract). (5) `--replay` goes on the existing M3 `ktx bench run` command (not a new subcommand). The flag makes the (agent, model, task) triple optional — it reads them from the referenced bench_runs row instead. When --replay is set, positional args are NOT accepted (--replay replaces the positional-args source; supplying both is a usage error). (6) Pre-M4 comparison: (a) stream integrity — content_hash of the persisted stream_text matches the stored hash; (b) parser regression — re-parsed tool_use count via parser.ParseEvent over the stream_text lines matches the originally-persisted sessions.tool_call_count; a mismatch means the parser code changed between capture and replay (the label is 'parser_regression' not 'parser_determinism' per resolved judgment call 2); (c) price-cache drift detection — re-derived cost (via the cost.go costDeriver against the current ktx prices cache) may differ from the persisted bench_runs.cost if ktx prices updated between capture and replay. (7) Post-M4 comparison is OUT OF SCOPE. (8) --replay bypasses methodology-file load+validation — the triple + methodology_version come from the bench_runs row, not disk. A methodology file drift between capture and replay is NOT a replay failure and emits NO signal (resolved judgment call 3)."
overall_acceptance: "GIVEN D20 lands WHEN `ktx bench run opencode <model> <task>` completes against real opencode THEN ktx.db holds BOTH a bench_runs row AND a recorded_streams row, linked via bench_run_id and session_id, with recorded_streams.content_hash == SHA-256(recorded_streams.stream_text). GIVEN a session_id with a recorded_streams row WHEN `ktx bench run --replay <session-id>` is invoked THEN it makes ZERO agent calls (no os/exec against the agent binary), re-parses stream_text through parser.ParseEvent, re-aggregates tokens/cost via extractStreamMetrics, and emits a JSON consistency headline comparing replay-derived metrics to the original bench_runs row. GIVEN --replay <session-id> WHERE no recorded_streams row exists for that session_id WHEN the command concludes THEN it exits 2 (D4 not-found contract) with a not-found error envelope on stderr. GIVEN a pre-D20 ktx.db (no recorded_streams table) WHEN any ktx command opens it THEN the recorded_streams table is created via CREATE TABLE IF NOT EXISTS without altering existing tables or rows (self-heal). GIVEN all D20 changes landed WHEN `go test ./...` runs THEN every existing test stays green (M1-M4 regression preserved) AND every new D20 test passes. GIVEN --replay is NOT set WHEN `ktx bench run opencode <model> <task>` runs THEN the M3 regression is preserved verbatim (existing bench run + report behavior unchanged)."
tasks:
  - number: 1
    name: "Schema migration for recorded_streams table (db layer, D20 step 1 schema)"
    depends_on: []
    status: pending
    acceptance:
      - "GIVEN the recorded_streams CREATE TABLE IF NOT EXISTS statement is added to schemaStatements in internal/db/open.go WHEN a fresh database is opened via OpenMemory() THEN recorded_streams exists with exactly 7 columns (id, session_id, bench_run_id, stream_text, content_hash, stream_format, captured_at) in the named order AND a session_id index (recorded_streams_session_id_idx) AND a bench_run_id index (recorded_streams_bench_run_id_idx) exist via sqlite_master lookup — mirrors TestCompressedMigration_FreshDB"
      - "GIVEN a pre-D20 fixture (raw *sql.DB with sessions + tool_calls-with-M2-and-D15-columns + bench_runs + compressed, no recorded_streams table) plus one seeded row per existing table WHEN migrate() runs against it THEN recorded_streams appears with all 7 columns AND every existing table's seeded row is intact (tool_calls.tool, bench_runs.score, sessions.id, compressed.output all readable) — mirrors TestCompressedMigration_PreM4Database"
      - "GIVEN an already-migrated OpenMemory() database WHEN migrate() runs a second time THEN no error AND the recorded_streams column set is unchanged (re-open is a no-op) — mirrors the compressed re-migrate idempotency subtest"
      - "GIVEN foreign_keys=1 (enforced by Open/OpenMemory DSN) WHEN a recorded_streams INSERT references a non-existent session_id or bench_run_id THEN the FK rejects the insert (non-nil error) — mirrors TestCompressedMigration_ForeignKeyEnforcement"
      - "GIVEN the recordedStreamsColumn type and recordedStreamsColumns var are added to internal/db/open.go (mirroring compressedColumn/compressedColumns, naming the 7 columns by name+SQL type in CREATE TABLE order) THEN doctor and inspect paths report missing columns by referencing the single source of truth — mirrors compressedColumns"
      - "GIVEN D20's 'no ALTER TABLE column add' rule (resolved: read literally — no ALTER TABLE at all, neither to existing tables nor a partial-column-forward-fix loop for recorded_streams) WHEN migrate() runs THEN it adds NO columns to any table — only the CREATE TABLE IF NOT EXISTS for recorded_streams. The CREATE TABLE IF NOT EXISTS alone handles the fresh-DB and pre-D20 self-heal paths. No partial-column-forward-fix ALTER loop is included."
  - number: 2
    name: "RecordedStream persistence + query methods (db layer, D20 step 1 persistence)"
    depends_on: ["1"]
    status: pending
    acceptance:
      - "GIVEN a new file internal/db/recorded_streams.go (mirroring internal/db/compress.go: package doc, RecordedStream struct, typed sentinel errors, BEGIN/Commit/Rollback transactions) WHEN InsertRecordedStream(rs *RecordedStream) is called against a seeded (session + bench_run) OpenMemory() database THEN the row persists with all 7 columns round-tripping verbatim via GetRecordedStreamBySession and GetRecordedStreamByBenchRun — mirrors TestInsertCompressed happy path"
      - "GIVEN the RecordedStream struct (id, session_id, bench_run_id, stream_text, content_hash, stream_format, captured_at with JSON tags matching the column names, no omitempty) WHEN InsertRecordedStream is called with a session_id or bench_run_id referencing a non-existent row THEN it returns ErrSourceNotFound (wrapping ErrNotFound, mirroring compress.go's ErrSourceNotFound) so the CLI maps it to exit 2 — pre-check existence before INSERT for a typed error regardless of driver FK-error string drift"
      - "GIVEN a recorded_streams row persisted with content_hash = ContentHash(stream_text) (D9 recomputed-from-stored-data rule, ktx owns integrity) WHEN the row is re-fetched THEN the stored content_hash equals SHA-256 of the stored stream_text — content_hash round-trip mirrors the compress_test.go hash assertion"
      - "GIVEN GetRecordedStreamBySession(sessionID) and GetRecordedStreamByBenchRun(benchRunID) exist WHEN called against a session_id / bench_run_id with no recorded_streams row THEN both return ErrNotFound (exit 2 surface) — mirrors GetCompressed miss path"
      - "GIVEN empty stream_text is a valid stream (a session that emitted no events still gets captured) WHEN InsertRecordedStream is called with stream_text = '' THEN it succeeds and content_hash = ContentHash('') (SHA-256 of the empty string, a real value) — the absence-vs-empty distinction is preserved; no silent skip on empty stream"
      - "GIVEN a new internal/db/recorded_streams_test.go (mirroring internal/db/compress_test.go: table-driven subtests, OpenMemory fixtures, seedSessionAndBenchRun helper) WHEN go test ./internal/db/ runs THEN all subtests pass: happy-path round-trip, FK rejection on unknown session_id, FK rejection on unknown bench_run_id, GetBySession miss → ErrNotFound, GetByBenchRun miss → ErrNotFound, content_hash round-trip, empty stream_text round-trip"
  - number: 3
    name: "Capture trigger — persist stream in runBenchRun (D20 step 1 capture, M3 path unchanged)"
    depends_on: ["2"]
    status: pending
    acceptance:
      - "GIVEN runBenchRun (internal/cli/bench.go) already holds agentStdoutBytes := agentStdout.Bytes() (bench.go:1049, the snapshot taken before extractStreamMetrics/extractAgentOutput consume the bytes via bufio.Scanner) WHEN a successful InsertBenchRun returns br.ID THEN runBenchRun calls InsertRecordedStream with a RecordedStream whose stream_text = string(agentStdoutBytes), session_id = the sessionID from findWrapperSession, bench_run_id = br.ID, content_hash = dbpkg.ContentHash(string(agentStdoutBytes)), stream_format = 'opencode-jsonl-1', captured_at = time.Now().UTC().Format(time.RFC3339Nano) — exactly one INSERT after the InsertBenchRun call"
      - "GIVEN a successful `ktx bench run` invocation WHEN the command concludes THEN ktx.db holds BOTH a bench_runs row AND a recorded_streams row, linked via the same bench_run_id and session_id, AND recorded_streams.content_hash equals SHA-256 of recorded_streams.stream_text (verified by re-reading the row and recomputing)"
      - "GIVEN the existing runBenchRun stderr summary line (bench.go:1190, D1 wrapper convention) WHEN the command concludes THEN the summary is unchanged from M3 (the headline, methodology, score, cost, tokens are all still present); the capture step adds NO new stderr line in the success path (capture is silent on success; the headline JSON envelope on stdout is unchanged from M3)"
      - "GIVEN the capture is a D20-dependent secondary artifact (the headline is the primary product of runBenchRun) WHEN InsertRecordedStream fails (e.g., FK rejection, disk full, schema error) THEN the failure is a NON-FATAL warning: a one-line `ktx: warning: failed to record stream for --replay: <err>` is written to stderr AND the bench run STILL exits 0 with the headline printed to stdout (the bench_runs row was already persisted; --replay simply will be unavailable for this session) — soft-fail mirrors the D11 cost-derivation soft-fail policy"
      - "GIVEN the capture step is extracted into a small helper (captureStreamForBenchRun(db, sessionID, benchRunID, streamBytes) error) so the capture is unit-testable in isolation WHEN the helper is unit-tested against an in-memory OpenMemory() DB with a seeded session and bench_run THEN it persists the RecordedStream row and the test asserts all 7 columns without spawning any subprocess — the existing runBenchRun end-to-end test (which spawns a fake binary) is NOT required to exercise the capture step"
      - "GIVEN runBenchRun's existing flow is preserved WHEN --replay is NOT set THEN every M3 behavior is byte-identical: agent spawn, methodology validation, findWrapperSession, SummarizeBenchToolCalls, extractStreamMetrics, extractAgentOutput, scoreExactMatch, InsertBenchRun, re-fetch, computeHeadline, emit envelope — the ONLY addition is the one InsertRecordedStream call (which silently no-ops or warns on failure); the M3 regression test suite stays green"
  - number: 4
    name: "--replay flag + arg parsing + dispatch stub (D20 step 2, M3 surface preserved)"
    depends_on: ["2"]
    status: pending
    acceptance:
      - "GIVEN the existing runBenchRun flag set `fs := flag.NewFlagSet('ktx bench run', flag.ContinueOnError)` (bench.go:919) WHEN a `--replay` StringVar is added with empty-string default (no-op when absent) THEN `ktx bench run --replay <session-id>` parses the flag and runBenchRun branches: when --replay is non-empty, dispatch to a runBenchReplay(sessionID, opts, stdout, stderr) function (the implementation lives in Task 5; this task adds a stub that returns a placeholder until Task 5 lands) BEFORE the len(rest) != 3 check"
      - "GIVEN --replay is set AND no positional args are supplied WHEN runBenchRun parses flags THEN the rest slice is empty AND the len(rest) != 3 check is SKIPPED (the flag makes the (agent, model, task) triple optional per D20; the triple is read from the bench_runs row later) — the methodology-file load + methodology-input validation (bench.go:932-952) is ALSO SKIPPED on the --replay path (replay reads methodology_version from the bench_runs row, not from disk; a methodology file drift between capture and replay is NOT a replay failure and emits NO signal — resolved judgment call 3)"
      - "GIVEN --replay is set AND positional args ARE supplied (e.g., `ktx bench run --replay <id> opencode <model> <task>`) WHEN runBenchRun parses flags THEN it returns ExitUsage with error 'ktx bench run --replay does not accept positional args; the (agent, model, task) triple is read from the referenced bench_runs row' — --replay REPLACES the positional-args source, it does not augment it (DRY: one source of truth for the triple)"
      - "GIVEN --replay <session-id> WHERE GetRecordedStreamBySession(sessionID) returns ErrNotFound WHEN runBenchReplay (the stub in this task; the full implementation in Task 5) returns THEN the command exits 2 (ExitNotFound, D4 contract) with a not-found error envelope on stderr naming the missing session-id — the not-found check happens BEFORE any re-parsing, with zero agent calls"
      - "GIVEN the --replay flag is absent WHEN runBenchRun runs THEN the existing M3 path executes unchanged (the --replay branch is dead code; the len(rest) != 3 check fires as before) — the M3 regression is preserved"
      - "GIVEN printBenchHelp (bench.go:1490) is updated WHEN `ktx bench --help` runs THEN the help text lists `--replay <session-id>` as a flag on `bench run` with a one-line description citing D13 Tier 1 (fast, free, deterministic consistency check against a previously-captured stream) AND a one-line example `ktx bench run --replay <session-id>` — the help cross-reference closes the discovery gap (the user gets a bench_run_id from `ktx bench run`; they need the session_id for `--replay`; the help text mentions that the session_id is queryable via `ktx get <bench_run_id>` or `ktx list`)"
  - number: 5
    name: "Replay logic + consistency headline + integration tests (D20 step 3, pre-M4 consistency check)"
    depends_on: ["3", "4"]
    status: pending
    acceptance:
      - "GIVEN runBenchReplay(sessionID, opts, stdout, stderr) replaces the Task 4 stub WHEN it executes THEN it opens the DB (dbpkg.Open via ResolvePath, mirroring runBenchRun bench.go:956-966), pre-flight checks the recorded_streams table exists (new HasRecordedStreamsTable on *dbpkg.DB mirroring HasBenchRunsTable in internal/db/inspect.go:190 — missing table → ExitNotFound with the same 'pre-D20 database; run any ktx command to apply the migration' message shape), calls GetRecordedStreamBySession(sessionID) (ErrNotFound → ExitNotFound exit 2), then GetSession(rs.SessionID) for the original tool_call_count AND QueryBenchRun(rs.BenchRunID) for the original bench_runs row — ZERO os/exec calls, ZERO methodology-file reads"
      - "GIVEN the recorded_streams row is loaded WHEN runBenchReplay runs the stream-integrity check THEN it recomputes ContentHash(rs.StreamText) and compares to rs.ContentHash; a match is integrity=PASS, a mismatch is integrity=FAIL (a persisted-stream corruption signal — defendable only via DB-level tampering since ContentHash is recomputed from stored data per D9) — the integrity field is in the output envelope"
      - "GIVEN the recorded stream_text WHEN runBenchReplay runs the parser-regression check THEN it splits stream_text on newlines, calls parser.ParseEvent on each line, counts the lines where (tc, true) was returned, and compares the count to original session.ToolCallCount (sessions.tool_call_count roll-up) — a match is parser_regression=PASS, a mismatch is parser_regression=FAIL (the label is 'parser_regression' per resolved judgment call 2: since parser.ParseEvent is pure and content_hash guarantees byte-identity, a mismatch can ONLY mean a parser code change between capture and replay, e.g., a regression in parseToolEvent's OpenCode branch at parser.go:184) — both counts are in the output envelope"
      - "GIVEN the recorded stream_text WHEN runBenchReplay runs the cost-derivation check THEN it calls the existing extractStreamMetrics(agentStdoutBytes []byte) (bench.go:1384) — passing []byte(rs.StreamText) — to re-aggregate tokens_in, tokens_out, cost, model, provider from step_finish events; THEN it calls the costDeriver deep module (internal/db/cost.go) directly with the re-aggregated tokens + model + provider against the CURRENT ktx prices cache (LoadPrices, re-derived cost) and compares to original bench_run.Cost — a match is cost_drift=NONE, a mismatch is cost_drift=DETECTED with the delta (replay_cost - original_cost) in the envelope (informational, NOT a failure — D11 cache-miss is a real signal, not an error; a stale cache at capture time OR a cache update between capture and replay surfaces here)"
      - "GIVEN runBenchReplay emits a JSON consistency envelope on stdout (default --format json) WHEN the command concludes THEN the envelope shape is {replay: {session_id, bench_run_id, stream_format, captured_at}, integrity: PASS|FAIL, parser_regression: PASS|FAIL with {replayed_tool_use_count, original_tool_call_count}, cost_drift: NONE|DETECTED with {replay_tokens_in, original_tokens_in, replay_tokens_out, original_tokens_out, replay_cost, original_cost, delta}, original_bench_run: <full BenchRun row>, consistency: PASS|FAIL|DRIFT} where consistency=PASS only when integrity=PASS AND parser_regression=PASS AND cost_drift=NONE; consistency=DRIFT when integrity and parser_regression PASS but cost_drift=DETECTED (informational, NOT an exit-code failure); consistency=FAIL when integrity=FAIL OR parser_regression=FAIL (exit 4 internal, surface the failure) — the replay path exits 0 on PASS or DRIFT, exits 4 on FAIL"
      - "GIVEN --format text is set WHEN runBenchReplay renders THEN it emits a one-line headline `replay: <consistency> (integrity=<PASS|FAIL>, parser=<PASS|FAIL>, cost_drift=<NONE|DETECTED>)` plus a key-value summary of the comparison fields — mirrors runBenchRun's text rendering (bench.go:1160-1174) and the D1 wrapper convention (one-line summary to stderr)"
      - "GIVEN a new TestRunBenchRunReplay_Integration test in internal/cli/bench_test.go WHEN it seeds an in-memory OpenMemory() DB with a session + tool_calls (persisted via PersistToolCall so sessions.tool_call_count rolls up) + a bench_runs row + a recorded_streams row whose stream_text is a known-good JSONL fixture (the existing .agentera/verification/fixtures/opencode-tool-use.jsonl OR a small synthetic stream with one tool_use + one step_finish) THEN it invokes runBenchReplay directly (NOT the runBenchRun wrapper; the wrapper would spawn a subprocess) and asserts: consistency envelope integrity=PASS, parser_regression=PASS (replayed count == seeded tool_call_count), cost_drift depends on the seeded bench_run.Cost vs the re-derived cost, ZERO subprocess calls — the test is the contract; the assertion is the headline"
      - "GIVEN the replay path uses ONLY existing code paths (parser.ParseEvent, extractStreamMetrics, GetRecordedStreamBySession, GetSession, QueryBenchRun, ContentHash, the costDeriver deep module) WHEN a developer reviews the diff THEN there is NO new os/exec import, NO new methodology-file read, NO new agent-binary invocation — the replay path is provably free of agent calls (the D13 Tier 1 contract: fast, free, deterministic)"
