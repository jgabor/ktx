design: |
  Tasks in dependency order: cost-deriver first (creates `cost.go` with new content and the `PriceSource` interface), then db reorg (move-only, places `cost.go` in the new layout alongside other concern files), then event-parser (independent package; no db overlap).

  Task 1 - costDeriver deep module. The two existing derivation helpers (persist.go:419 deriveCost, bench.go:110 deriveBenchCost) share the same lookup -> cold-fetch -> round-to-6-decimals core; only the input shape differs (ToolCall vs BenchRun). The deep module unifies the math, the cache lookup, and the cold-fetch policy behind a `PriceSource` interface:
    - type PriceSource interface { Lookup(provider, model string) (in, out float64, ok bool); Cold() bool; Refresh() error }
    - type CostInputs struct { TokensIn, TokensOut *int64; Model, Provider *string; Cost *float64 }
    - method Derive(in CostInputs, src PriceSource) *float64
  Contract:
    - Caller-supplied Cost wins (non-nil pointer -> return as-is, including &0).
    - All NULL inputs (any of TokensIn/TokensOut/Model/Provider nil) -> return nil (D11 NULL preservation).
    - Otherwise: src.Lookup -> if ok and hit -> formula; if miss and src.Cold() -> src.Refresh() -> retry Lookup -> formula; if still miss -> nil.
    - Formula: (tokensIn * in + tokensOut * out) / 1_000_000, rounded to 6 decimals.
    - Concurrency: costDeriver is not concurrency-safe by itself; the caller (PersistToolCall, InsertBenchRun) holds the only reference to the source. Documented in cost.go's package comment.
  Bench-side contract preservation: the bench caller checks `if b.TokensIn == 0 && b.TokensOut == 0 { return }` BEFORE building CostInputs and calling Derive. The persist caller passes zero-tokens through unchanged; Derive returns 0.0 for that case. This preserves the existing `TestInsertBenchRun_RoundTrip` contract.

  Task 2 - db reorg. Move-only refactor:
    - open.go: Open, OpenMemory, OpenWithoutMigration, DefaultPath, ResolvePath, schemaStatements, m2Columns, benchRunsColumns, migrate, tableColumns, IDPattern
    - session.go: SessionFile, sessionDir, sessionFilePath, readSessionFile, writeSessionFile, procAvailable, ppidStartTime, ResolveSessionID, canReuse, openSession, openNamedSession, OpenNamedSession
    - record.go: ToolCall, Session, SessionM2, ErrNotFound, SessionExists, InsertSession, CloseSession, PersistToolCall (without deriveCost), GetToolCall, GetSession, GetRecord, ListSessions, SessionM2Rollups, NewID, ContentHash
    - bench.go: BenchRun, ErrBenchMethodologyNotFound, deriveBenchCost (now a thin caller of costDeriver.Derive, pre-filters zero-tokens), providerModel, InsertBenchRun (without deriveBenchCost inline), QueryBenchRuns, QueryBenchRun, SummarizeBenchToolCalls
    - prices.go: PricesPath, ModelsDevURL, Prices, NewPrices, Load, Lookup, Cold, Path, Size, WriteToDisk, Refresh, RefreshAndWrite, processPrices, LoadPrices, LookupPrice, resetPricesForTest, all internal types (Price, modelsDevModel, modelsDevProvider), constants (pricesFilePerm, pricesDirPerm, modelsDevTimeout, modelsDevMaxBody)
    - inspect.go: queryer, expectedSchema, m2Schema, benchRunsSchema, CheckSchema, HasM2Columns, HasBenchRunsTable, HasBenchRunsColumns, SampleIDs, selectIDs, sortedKeys
    - cost.go (carried over from Task 1): costDeriver, CostInputs, PriceSource, costRoundDecimals
  Test files move alongside their source files: persist_test.go -> stays as persist_test.go (covers record.go concerns); session_test.go -> session_test.go; prices_test.go -> prices_test.go; bench_test.go -> bench_test.go; inspect_test.go -> inspect_test.go. db_test.go and rollup_test.go stay at the package root.

  Task 3 - internal/parser extraction. The wrapper's pure parser functions move to a new package with one entry point (ParseEvent). The wrapper calls parser.ParseEvent from teeAndParse and discards the parser helpers. No production behaviour change. The new package is the single source of truth for the ktx tool_call shape -- any future hook-path package (M4) imports the same `internal/parser` package, so the shape authority is one place.
