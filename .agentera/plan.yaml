header:
  level: light
  created: "2026-06-29"
  status: active
  title: "Wrapper Capture Validation Gate (D16)"
what: "A shell script at `scripts/validate-bench.sh` that reads the methodology pinned inputs from `.agentera/bench/methodology-v1.yaml` (methodology_version=v1; agent binary=opencode; model provider=neuralwatt; model id=glm-5.2-short-fast-flex; task prompt='What is 2+2?'; task expected_output='4'), runs `ktx run opencode run --format json -m neuralwatt/glm-5.2-short-fast-flex 'What is 2+2?'` capturing both stdout and stderr, then emits five per-layer [PASS]/[FAIL] verdicts per Decision 16 (amended by Decision 17): (L1 session-capture) `ktx list` shows a session whose agent == 'opencode' and whose started_at is within 1 minute of the invocation's wall-clock start; (L2 stream-token-evidence, amended by D17) on the captured JSONL stream that `ktx run` teed to the script's stdout, at least one line with type=step_finish has part.tokens.input > 0 AND part.tokens.output > 0 — does NOT assert tokens reached tool_call rows (those stay NULL-by-design for OpenCode 1.17.8 tool_use events; see internal/parser/parser.go:150-158, .agentera/verification/m2-acceptance.md §3 'Surprises'); (L3 stream-cost-evidence, amended by D17) on that same captured stream, either (a) at least one type=step_finish line carries part.cost as a number (provider-reported cost in the stream), OR (b) D11 derivation is reconstructable from the captured step_finish tokens plus the methodology-pinned model identifier against the `ktx prices` cache, with script-computed derived cost > 0 (cache-miss treated as a real L3 FAIL per D11 environmental-failure policy, no silent bypass); (L4 parser 1-to-1) the count of `type=tool_use` lines in the captured JSONL stream equals the count of tool_calls persisted for the session in ktx.db — i.e., the session's `tool_call_count` field returned by `ktx list` / `ktx get` (no silent parser drops; this layer is the stream↔persistence bridge); (L5 opencode-answer match) the final `type=text` event's content field, after whitespace trim, equals the methodology task.expected_output '4' exactly (score=1.0)."
why: "Decision 16 (firm) committed: validate wrapper capture against real opencode before building the D13 Tier 1 `--replay` codepath or committing to a recording fixture format. The wrapper has never been exercised end-to-end against real opencode — bench_test.go only exercised a synthetic fake binary emitting deterministic JSONL. Without this validation, `--replay` builds on a wrapper-confidence assumption with zero evidence. On PASS, the resulting session id is the candidate replay fixture source per D16 (no portable fixture-file format needed for M5); that session id feeds the next deliberation: the recording contract."
constraints: "Must NOT modify ktx source code under `internal/` or `cmd/` — only creates the script file at `scripts/validate-bench.sh` (directory created if absent; ktx source untouched). ktx.db is accessed ONLY through the public `ktx list` / `ktx get` CLI surface — no direct SQLite access (consistent with the 'Use CLI State Before Raw Artifacts' profile rule, conf:durable). The methodology file at `.agentera/bench/methodology-v1.yaml` is read, not written. The runner is `ktx run opencode run --format json -m <m> <prompt>` — NOT `ktx run opencode <prompt>` (D16 contract; the M3 bench run's broken TUI-default invocation is a separate TODO). Out of scope: `--replay` codepath; portable fixture-file format; CI wiring; the M3 bench run invocation fix; anything that edits Go source. Prerequisites assumed present (the script does not validate them): opencode binary on PATH; neuralwatt API credentials configured for opencode with the `neuralwatt/glm-5.2-short-fast-flex` model reachable; models.dev price cache populated for the pinned model (else layer-3 cost assertion will FAIL with an actionable signal — the script treats a cache-miss as a real per-layer failure, not an environmental error to silently bypass)."
overall_acceptance: "GIVEN the plan completes WHEN `scripts/validate-bench.sh` runs against real opencode via `ktx run opencode run --format json -m neuralwatt/glm-5.2-short-fast-flex 'What is 2+2?'` THEN the script emits five per-layer [PASS]/[FAIL] verdicts and exits 0 on all-PASS (with `validation=PASS` as the final stderr line) or 1 on any-FAIL (with `validation=FAIL [<layer names>]` as the final stderr line). GIVEN the script completes WHEN `git diff` is run against `internal/` and `cmd/` THEN both trees are clean (only `scripts/validate-bench.sh` is a new file), and ktx.db was accessed only through `ktx list` and `ktx get`."
tasks:
  - number: 1
    name: "Implement validate-bench.sh with five per-layer assertions per D16"
    depends_on: []
    status: pending
    acceptance:
      - "GIVEN the methodology file at `.agentera/bench/methodology-v1.yaml` WHEN the script reads it THEN it extracts methodology_version=v1, agent=opencode, model provider=neuralwatt, model id=glm-5.2-short-fast-flex, task prompt='What is 2+2?', task expected_output='4'; and invokes `ktx run opencode run --format json -m neuralwatt/glm-5.2-short-fast-flex 'What is 2+2?'` (provider/id joined as opencode's --model contract requires), which exits 0 within 5 minutes and emits JSONL events on stdout plus a one-line run summary to stderr"
      - "GIVEN the validation script runs to completion WHEN the work concludes THEN no ktx source file under `internal/` or `cmd/` has been modified (git diff is empty for those trees; the only new file is `scripts/validate-bench.sh`), and the script accessed ktx.db only through `ktx list` / `ktx get` (no direct sqlite3 calls, no os.Open of the ktx.db file)"
      - "GIVEN the `ktx run` invocation completes WHEN the script emits its five per-layer [PASS]/[FAIL] verdicts THEN each layer's verdict appears on stderr with a one-line reason, and the layers are (per D16 amended by D17): (L1 session-capture) ktx list shows a session whose agent == 'opencode' and whose started_at is within 1 minute of the invocation's wall-clock start — evidence source: `ktx list --format json` filtered by agent + started_at; (L2 stream-token-evidence) on the captured JSONL stream that `ktx run` teed to the script's captured stdout, at least one line with type=step_finish has part.tokens.input > 0 AND part.tokens.output > 0 — evidence source: captured stdout; this layer does NOT assert tokens reached tool_call rows (those stay NULL-by-design for OpenCode 1.17.8 tool_use events per parser.go:150-158 and m2-acceptance.md §3 'Surprises'); (L3 stream-cost-evidence) on the same captured stream, either (a) at least one type=step_finish line carries part.cost as a number, OR (b) D11 derivation is reconstructable from the captured step_finish tokens plus the methodology-pinned model identifier against `ktx prices` cache, with script-computed derived cost > 0; cache-miss treated as a real L3 FAIL per D11 environmental-failure policy; (L4 parser-captures-tool_use) the count of JSONL lines with type=tool_use in the captured stdout equals the session's tool_call_count field returned by `ktx list` / `ktx get` (parser saw every tool_use event and persisted it; no silent drops; this layer is the stream↔persistence bridge); (L5 opencode-answer match) the final type=text event's content field trimmed via strings.TrimSpace-equivalent equals '4' exactly"
      - "GIVEN all five per-layer verdicts resolve WHEN the script concludes THEN on all-PASS it writes `validation=PASS` as the final stderr line and exits 0; on any-FAIL it writes `validation=FAIL [<comma-separated failing layer names>]` as the final stderr line and exits 1; an environmental failure (opencode binary missing, API error, ktx list misbehaving) is reported as a [FAIL] verdict for the affected layer with a short reason, then the same `validation=FAIL` envelope and exit 1 — no silent success on partial data"
surprises: "D16 L2/L3 contract asserted tokens_in/tokens_out/cost on tool_call rows persisted by the wrapper from real OpenCode 1.17.8 tool_use events. Discovered during realisera discovery (cycle 16, step 4/9) that parser.go:150-158 explicitly documents real OpenCode 1.17.8 emits those fields on step_finish (step-aggregate), not tool_use (per-tool); m2-acceptance.md §3 'Surprises' empirically confirmed tool_call rows stay NULL; m3-vision-gap.md:163 closed on 'methodology v1 uses the sidecar path... it is the only path that supplies M2 fields per-call for OpenCode today' — a recommendation never reconciled with D16 (which validates the wrapper path). Reframed via Decision 17 (provisional confidence): L2/L3 now read from the captured JSONL stream that `ktx run` tees to the script's stdout, not from the persistence layer. D16 itself stays firm; D17 only amends the L2 and L3 layer assertions. Two residual tensions flagged in D17 feeds_into as future deliberations: (a) wrapper-vs-sidecar path for methodology v1, (b) wrapper-side step_finish enrichment (back-fill tool_call rows) as a deferred gap, not blocking D16 or D13 Tier 1 if --replay reconstructs cost from the captured stream."
