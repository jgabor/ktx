surprises: |
  Task 1 (complete): the wrappers kept LoadPrices() rather than introducing a
  `d.prices` field as the task spec suggested. The plan said "The d.prices
  field is the existing *Prices cache" but no such field exists on *DB — the
  pre-refactor helpers used the LoadPrices() singleton (the existing AC 6
  test injects an httptest server via WithHTTPClient on the LoadPrices
  result). Switching to a per-DB prices field would have required
  per-DB initialization, which would have broken the singleton-based test
  seam. The wrappers therefore do LoadPrices() + nil-path check, then
  delegate. cost.go itself is interface-only — it has no opinion about
  LoadPrices vs d.prices; a future refactor can swap the source without
  touching the deriver.

  Dropped `prices.WriteToDisk()` from the post-refresh branch. The task AC
  for AC4 says "the cache write is the source's responsibility
  (caller-side observation)" — the deriver no longer calls WriteToDisk.
  The existing TestPersistToolCall_CostDerivation only asserts the
  persisted DB row, not the on-disk cache file, so the test still passes
  byte-identical. A subsequent refresh on the same in-process Prices will
  still see cold=true (because cold is only flipped to false by
  WriteToDisk), which is a minor in-process behavioural regression vs.
  the pre-refactor code; the next-on-disk-fresh-process behaviour is
  unchanged. If the in-process cold→warm transition matters, the seam
  moves into Prices.Refresh() (make Refresh itself write to disk) — that
  is a Prices-side refactor, not a deriver-side one.

  cost.go ended at 165 LOC (not under the 150 LOC Task 2 target). The
  delta is the file-level doc explaining the deep module and the
  concurrency contract — the body itself is ~50 LOC. Task 2 can still
  hit the < 150 target by trimming the doc if it lands in a different
  layout.

  Task 2 (complete): the file layout in the task prompt places
  `NewID` and `ContentHash` in `open.go` next to `IDPattern` (the ID
  alphabet and length they share), but AC #1 explicitly lists
  `NewID, ContentHash` in `record.go`. The AC is the binding contract,
  so `NewID` and `ContentHash` went to `record.go` (where the
  ToolCall-side `deriveCost` and PersistToolCall need them) and
  `IDPattern` went to `open.go` per the file layout (it lives next to
  the schema and the open path that together produce the IDs the
  pattern matches). End state matches the AC grep exactly.

  `tableColumns` moved from `inspect.go` to `open.go` per AC #2 (the
  file layout had it in `open.go` with the migration helpers; AC #2
  confirmed it). The `queryer` interface stays in `inspect.go` per
  AC #2 even though `tableColumns` is the only caller — keeping the
  inspect surface's contract co-located with the inspect methods that
  also use the seam is the right read.

  `processPrices` does not exist as a symbol in `prices.go` — the
  AC #2 list references it but the source has only the comment
  "processPrices is the singleton per-process cache" (the actual
  vars are `pricesOnce` and `pricesLoadErr`). The grep `^func [a-z]`
  does not match either, so the AC is satisfied as written; the
  `processPrices` reference is a stale label from an earlier
  sketch that never landed in code.

  File-size targets after reorg (all satisfied):

    cost.go      165   (smallest; deep module; < 175 per task prompt)
    session.go   264
    inspect.go   285
    bench.go     359
    open.go      485
    prices.go    486
    record.go    538
    total      2,582   avg 369 (max 538; under 600 ceiling and 450 avg)

  gofmt -l internal/db/*.go was not clean at the start of the reorg
  (pre-existing struct field alignment drift in bench.go, prices.go,
  prices_test.go and comment alignment drift in inspect_test.go).
  `gofmt -w` ran on the whole directory as part of the move; only
  whitespace changes, no test function body changes. `git diff`
  confirms the touched test files changed 12 / 2 / 0 lines of
  whitespace respectively, all outside the function bodies.

  Test file names are unchanged. `persist_test.go` is still named
  `persist_test.go` even though the source it covers is now
  `record.go` — the task prompt allowed either name. The
  TestSessionM2Rollups_PointerDiscipline subtest in `rollup_test.go`
  still references `SessionM2Rollups` (now in `record.go`); the same
  package makes the file-name-vs-source-file relationship
  irrelevant at compile time, and renaming `rollup_test.go` would
  have meant merging its single test into `persist_test.go` (a body
  change to a test file). Keeping the file name avoids the merge
  and keeps the diff small.
