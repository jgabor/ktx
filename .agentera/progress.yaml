  - number: 1
    timestamp: "2026-06-19 13:55"
    type: feat
    phase: build
    what: |
      In-place ALTER TABLE migration on tool_calls adding six M2
      cost-publication columns (tokens_in INTEGER, tokens_out INTEGER,
      cost REAL, latency_ms INTEGER, model TEXT, provider TEXT). The
      same columns are part of CREATE TABLE for fresh DBs; the
      migration is idempotent (column-existence check via PRAGMA
      table_info inside the migration transaction) and forward-fixes
      partial M2 sets. ktx doctor gains an m2_columns check: warning
      status on a pre-M2 DB (top-level degraded, exit 0), ok on a
      migrated or fresh DB.
    inspiration: |
      Plan task 2 in .agentera/plan.yaml — closes the gap where M1
      reserved M2 fields in the Go ToolCall struct (Decision D9) but
      did not add them to the SQL schema. Without this, task 3 (ktx
      write persistence) and tasks 4-5 (inspect surface) cannot land.
    discovered: |
      SQLite ALTER TABLE ADD COLUMN is single-statement and idempotent
      at the SQL level; combining it with a column-existence check via
      PRAGMA table_info inside the same transaction makes forward-fix
      trivial at this scale, no versioned migration framework needed.
      Nullable columns with no DEFAULT preserve the distinction
      between 'field absent' (NULL) and 'field set to zero' (0) —
      round-trips through ktx read / ktx get JSON without coercion.
    verified: |
      Cycle date: 2026-06-19.

      Files touched:
      - internal/store/store.go — added M2 columns to CREATE TABLE;
        added m2Columns constant and ALTER TABLE ADD COLUMN step to
        migrate().
      - internal/store/inspect.go — refactored tableColumns to accept
        a queryer interface (so it works on *sql.Tx); added m2Schema
        constant and (*DB).HasM2Columns() method.
      - internal/cli/doctor.go — added doctorStatusWarning and
        doctorStatusDegraded constants; added m2_columns check;
        updated top-level status logic so warning check → degraded
        top-level status → exit 0; updated help text.

      Acceptance criteria (13/13 verifier checks PASS, harness at
      /tmp/opencode/verify-all-ac/main.py; standalone warning-code-
      path verifier at /tmp/opencode/verify-m2-warning/):
