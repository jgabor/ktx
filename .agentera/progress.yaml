      (BurntSushi/toml considered, deferred to M5 if the config surface grows).
      Pipeline shape is linear; content-type routing dormant. ktx hook
      bidirectional transform deferred to M5 (D14 explicit deferral). Compressed
      ids are addressable only via ktx compress / ktx decompress — ktx
      read/get/list stay scoped to tool_calls/sessions (Option B symmetrical
      access; no third lookup branch in GetRecord).
    discovered: "Two findings: (1) The cli package's D7-violation test (simulating a
      source tool_call row deleted with FKs off, leaving a dangling compressed
      row that exercises the not-found path on ktx decompress) needs raw SQL on
      the *sql.DB handle. db.DB deliberately keeps db unexported. Resolution:
      added a DB() *sql.DB escape hatch with a strict docstring — production
      callers should prefer typed methods. (2) Shell-level sha256 verification
      of persisted byte content is unreliable: both sqlite3 CLI and jq -r add a
      trailing newline to stdout, materially changing the sha256. The D9
      content_hash integrity rule should be verified programmatically (Python
      sqlite3 + hashlib) for acceptance-log evidence."
