    discovered: |
      The models.dev JSON endpoint (`https://models.dev/api.json`) is
      structured as `{provider_id: {models: {model_id: {cost: {input,
      output, ...}}}}}` — the conventional shape. Cost entries vary
      across providers: some omit cache_read/cache_write; some
      providers (e.g. `anyapi`, `snowflake-cortex`) have entries with
      no cost at all, which `Refresh` silently skips rather than
      storing a zero-priced record (a zero-priced entry would corrupt
      the cache by silently pricing free models). The cache
      projection is faithful but lossy: only `input` and `output` are
      retained; cache_read/cache_write/tiers/context_over_200k/etc.
      are discarded because the D11 derivation formula only needs
      the input/output rates. The `claude-sonnet-4-20250514` reference
      from m2-acceptance.md AC2 resolves cleanly through the
      `anthropic` provider (`input: 3.0`, `output: 15.0`) — the live
      endpoint reproduces the m2-acceptance.md Anthropic-list-prices
      placeholder exactly, so the cost reconstruction that proved
      $0.0123 → $0.012207 in the M2 log now fires automatically via
      `deriveCost` at write time when the caller omits `cost`.
      Provider IDs in models.dev sometimes contain hyphens
      (e.g. `amazon-bedrock`) and model IDs sometimes contain
      special characters (`:`, `@`, `/`) — JSON keys accept all of
      these, so no normalization is needed.
