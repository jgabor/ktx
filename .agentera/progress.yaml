  - number: 39
    timestamp: 2026-07-16 06:30
    type: feat
    phase: build
    what: "Implemented evidence-safe eligible retries per Decision 30. Fixed two
      mandatory canon findings from the Task 3 audit: lone-surrogate \\uXXXX
      escapes are now rejected at any depth with exact-byte fallback (pre-scan
      before decode), and RFC 8785 short escapes (\\b \\t \\n \\f \\r) are
      emitted instead of always \\u00XX. Replaced raw-string input comparison in
      db.PersistToolCallOnce with canon.Equal, returning a structured
      conflictReason. Added db.GetCompressedBySource for prior-artifact lookup.
      Created internal/evidence package with two-phase API (PersistSource +
      PersistArtifact + convenience Persist) enforcing: eligible exact retries
      atomically converge on runtime/tool/canonical-input/output-bytes; metadata
      first-wins with no enrichment; first session owns roll-up increment; first
      compressed artifact authoritative (pipeline-change retries return it even
      when the new config would not transform); fresh/NanoID fallback is an
      ordinary distinct insertion with no dedup guarantee. Refactored the Codex
      hook path to correlation.Resolve + evidence.PersistSource/PersistArtifact;
      non-Codex path unchanged."
    inspiration: Decision 30 (trusted-ingress deterministic identity, strict
      canonical JSON equality, atomic retry convergence, first-artifact
      authority) and Task 4 of the approved plan.
    discovered: canon.Equal on the input field required a pre-decode byte scan for
      lone surrogates because encoding/json replaces them with U+FFFD, erasing
      the distinction Decision 30 requires. The two-phase evidence API cleanly
      separates source convergence (insert-or-compare) from artifact authority
      (insert-or-reuse) so the hook never needs to know retry semantics; it
      calls PersistSource then PersistArtifact and forwards the authoritative
      Result.Output. Pipeline-config-change retries are handled inside
      PersistArtifact via GetCompressedBySource, returning the first compressed
      artifact even when no transformation occurs on retry.
    verified: "mage check exit 0: test+vet+lint+build all green, 0 lint issues.
      Focused race tests: go test ./internal/evidence ./internal/canon
      ./internal/db ./internal/cli -count=1 -race => all PASS. Evidence package
      14 tests cover all 4 acceptance criteria: concurrent exact retries (one
      row, -race clean), sequential exact retries (converge), changed
      input/output/tool/runtime conflicts (returns ErrConflict with reason),
      pipeline-change retry returns first artifact, no-transform retry returns
      prior artifact, fresh duplicates distinct, fresh concurrent distinct,
      canonical-equivalent input converges, metadata first-wins, different KTX
      session, no-transform passthrough. Canon regressions: lone-surrogate
      pre-scan (7 subtests) + short escapes (17 subtests) + equivalence test.
      Hook-level AC3: TestHook_Codex_PipelineChangeRetryReturnsFirstArtifact
      (config head:3 then cleared, retry returns first compressed artifact +
      block, one compressed row) and
      TestHook_Codex_CanonicalEquivalentInputConverges (reordered+whitespace
      JSON converges to one source, first input preserved). Existing 15
      TestHook_Codex* tests still PASS."
    next: "Task 5: route OpenCode hook+wrapper through correlation.Resolve with
      trusted provenance (the API contract Source.Eligible is already in place
      and called by the Codex hook). Task 6: current-state check, docs/state
      sync, and Decision 30 satisfaction review."
    context:
      intent: "Plan Task 4: eligible exact retries must persist one source row and one
        compressed artifact, with first-wins metadata and first-artifact
        authority; changed evidence conflicts; fresh IDs remain distinct."
      constraints: Did not finalize Decision 30 satisfaction (review-needed per
        inherited state). Did not wire OpenCode ingress (Task 5), update
        docs/state sync (Task 6), mark plan task status, commit, or push.
        Non-Codex hook path unchanged. No schema migration, no aliases, no
