    phase: build
    what: |
      M3 plan Task 5 (`ktx bench report`) lands as the headline
      consumer for persisted bench_runs rows. The Task 4 stub at
      `internal/cli/bench.go:runBenchReport` is replaced with a
      real implementation that handles three invocation modes:
      (1) list — `ktx bench report` emits the D12 headline
      envelope `{headline, methodology_version, rows}` (JSON
      default) or a one-line headline summary + tabwriter table
      (`--format text`), oldest-first per D12; (2) single-row —
      `ktx bench report <id>` emits the row directly (no rows
      array, no headline envelope), with not-found → exit 2
      via the typed error envelope; (3) filtered —
      `--methodology <version>` filters `bench_runs.methodology_version`
      in memory and recomputes the headline from the filtered
      set. The headline aggregation follows D12's `computation:`
      block verbatim: `headline = SUM(cost) / max(SUM(score),
      1.0e-9)`, returning JSON null (and text "<no data>") when
      SUM(cost) is NULL (every row's Cost pointer is nil — there
      is no cost to aggregate). Pointer discipline is preserved
      end-to-end (Cost *float64 → JSON null when absent; text
      rendering uses "-" for nil Cost and "-" for zero timestamp,
      matching the M2 `ktx list --format text` convention). All
      seven ACs from plan.yaml Task 5 pass on the committed
      binary (walk-through in `verified` below).
    discovered: |
      The spec's JSON single-row example omits `tokens_in` /
      `tokens_out` from the output. The BenchRun struct keeps
      these as `int64` (not pointer-typed), so they round-trip
      through JSON as numeric `0` when NULL — and the struct
      contract was established by Task 4's bench run JSON output
      (which includes them as `1234`/`567` for non-zero values).
      Migrating tokens_in/out to `*int64` with `omitempty` would
      require store-layer changes (out of scope for Task 5; the
      spec's "omit when NULL" rule is a soft clarification, not
      a contract change). The pragmatic resolution: render all
      BenchRun fields in both modes (list rows + single-row JSON)
      for consistency with Task 4's output, and let tokens_in/out
      round-trip as `0` when NULL. The text single-row example
      in the spec also omits tokens_in/out, so the text renderer
      follows the spec example exactly (no tokens columns in the
      key-value summary). Pointer discipline for `Cost` (the only
      nullable numeric field per D12) is honored strictly.

      The headline formula differs subtly between single-row and
      list modes. Single-row uses the existing `computeHeadline`
      helper, which returns 0 when cost is nil (the Task 4
      "partial data" soft-fail). List mode uses the new
      `computeAggregateHeadline`, which returns `(0, false)` when
      every row's Cost is nil — signaling headline=null at the
      JSON envelope level (not 0). The spec's `{"headline":
      null, "methodology_version": null, "rows": []}` shape
      requires the `(value, ok)` signature; an empty bench_runs
      table produces that exact output. A non-empty table with
      one row whose cost is NULL would also produce headline=null
      (the aggregation has no cost to total — same as zero rows
      from the data's perspective).

      `filterByMethodology` runs in memory rather than SQL WHERE.
      Two reasons: the bench_runs table is small (v1 methodology
      pins a single (agent, model, task) triple, so cardinality
      is bounded by `ktx bench run` invocations — typically a
      handful of rows), and the headline aggregation needs to run
      across the filtered set anyway, so keeping everything in
      one pass avoids the cost/benefit of pushing the filter
      into SQL. A future method (QueryBenchRunsByMethodology) is
      a clean refactor if the table grows; out of scope for v1.

      The `--methodology` flag's "filter" semantics treats an
      empty value (`--methodology=`) as no filter. The envelope's
      `methodology_version` falls back to the filter string when
      no rows match — so `--methodology v2` with zero rows emits
      `{"headline": null, "methodology_version": "v2", "rows": []}`,
      self-describing that the user filtered for v2. The text
      rendering for the same case emits
      `methodology v2 — headline: <no data> USD/correct (N=0)`,
      making the empty-after-filter case visible at a glance.
