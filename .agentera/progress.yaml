- number: 12
  timestamp: 2026-06-20 13:05
  type: feat
  phase: build
  what: "M3 plan Task 5 (`ktx bench report`) lands as the headline\nconsumer for persisted\
    \ bench_runs rows. The Task 4 stub at\n`internal/cli/bench.go:runBenchReport`\
    \ is replaced with a\nreal implementation that handles three invocation modes:\n\
    (1) list \u2014 `ktx bench report` emits the D12 headline\nenvelope `{headline,\
    \ methodology_version, rows}` (JSON\ndefault) or a one-line headline summary +\
    \ tabwriter table\n(`--format text`), oldest-first per D12; (2) single-row \u2014\
    \n`ktx bench report <id>` emits the row directly (no rows\narray, no headline\
    \ envelope), with not-found \u2192 exit 2\nvia the typed error envelope; (3) filtered\
    \ \u2014\n`--methodology <version>` filters `bench_runs.methodology_version`\n\
    in memory and recomputes the headline from the filtered\nset. The headline aggregation\
    \ follows D12's `computation:`\nblock verbatim: `headline = SUM(cost) / max(SUM(score),\n\
    1.0e-9)`, returning JSON null (and text \"<no data>\") when\nSUM(cost) is NULL\
    \ (every row's Cost pointer is nil \u2014 there\nis no cost to aggregate). Pointer\
    \ discipline is preserved\nend-to-end (Cost *float64 \u2192 JSON null when absent;\
    \ text\nrendering uses \"-\" for nil Cost and \"-\" for zero timestamp,\nmatching\
    \ the M2 `ktx list --format text` convention). All\nseven ACs from plan.yaml Task\
    \ 5 pass on the committed\nbinary (walk-through in `verified` below).\n"
  discovered: "The spec's JSON single-row example omits `tokens_in` /\n`tokens_out`\
    \ from the output. The BenchRun struct keeps\nthese as `int64` (not pointer-typed),\
    \ so they round-trip\nthrough JSON as numeric `0` when NULL \u2014 and the struct\n\
    contract was established by Task 4's bench run JSON output\n(which includes them\
    \ as `1234`/`567` for non-zero values).\nMigrating tokens_in/out to `*int64` with\
    \ `omitempty` would\nrequire store-layer changes (out of scope for Task 5; the\n\
    spec's \"omit when NULL\" rule is a soft clarification, not\na contract change).\
    \ The pragmatic resolution: render all\nBenchRun fields in both modes (list rows\
    \ + single-row JSON)\nfor consistency with Task 4's output, and let tokens_in/out\n\
    round-trip as `0` when NULL. The text single-row example\nin the spec also omits\
    \ tokens_in/out, so the text renderer\nfollows the spec example exactly (no tokens\
    \ columns in the\nkey-value summary). Pointer discipline for `Cost` (the only\n\
    nullable numeric field per D12) is honored strictly.\n\nThe headline formula differs\
    \ subtly between single-row and\nlist modes. Single-row uses the existing `computeHeadline`\n\
    helper, which returns 0 when cost is nil (the Task 4\n\"partial data\" soft-fail).\
    \ List mode uses the new\n`computeAggregateHeadline`, which returns `(0, false)`\
    \ when\nevery row's Cost is nil \u2014 signaling headline=null at the\nJSON envelope\
    \ level (not 0). The spec's `{\"headline\":\nnull, \"methodology_version\": null,\
    \ \"rows\": []}` shape\nrequires the `(value, ok)` signature; an empty bench_runs\n\
    table produces that exact output. A non-empty table with\none row whose cost is\
    \ NULL would also produce headline=null\n(the aggregation has no cost to total\
    \ \u2014 same as zero rows\nfrom the data's perspective).\n\n`filterByMethodology`\
    \ runs in memory rather than SQL WHERE.\nTwo reasons: the bench_runs table is\
    \ small (v1 methodology\npins a single (agent, model, task) triple, so cardinality\n\
    is bounded by `ktx bench run` invocations \u2014 typically a\nhandful of rows),\
    \ and the headline aggregation needs to run\nacross the filtered set anyway, so\
    \ keeping everything in\none pass avoids the cost/benefit of pushing the filter\n\
    into SQL. A future method (QueryBenchRunsByMethodology) is\na clean refactor if\
    \ the table grows; out of scope for v1.\n\nThe `--methodology` flag's \"filter\"\
    \ semantics treats an\nempty value (`--methodology=`) as no filter. The envelope's\n\
    `methodology_version` falls back to the filter string when\nno rows match \u2014\
    \ so `--methodology v2` with zero rows emits\n`{\"headline\": null, \"methodology_version\"\
    : \"v2\", \"rows\": []}`,\nself-describing that the user filtered for v2. The\
    \ text\nrendering for the same case emits\n`methodology v2 \u2014 headline: <no\
    \ data> USD/correct (N=0)`,\nmaking the empty-after-filter case visible at a glance.\n"
  verified: "Cycle date: 2026-06-20.\n\nFiles touched:\n- internal/cli/bench.go (modified)\
    \ \u2014 imports gain \"errors\"\n  and \"text/tabwriter\"; the Task 4 stub\n\
    \  (`runBenchReport` returning ExitUsage with \"not yet\n  implemented\") is replaced\
    \ with the real implementation.\n  The replacement adds ~250 lines:\n  * `runBenchReport`\
    \ (dispatcher adapter, same shape as\n    the stub) \u2014 parses `--format` via\
    \ extractFormat,\n    parses `--methodology` via stdlib flag, opens the\n    database\
    \ via store.Open, calls runBenchReportImpl,\n    and converts the returned *Error\
    \ to an exit code\n    via exitCodeOf.\n  * `runBenchReportImpl` (spec-signature\
    \ implementation)\n    \u2014 dispatches on len(args) >= 1 for single-row mode\n\
    \    (QueryBenchRun \u2192 notFoundError on ErrNotFound,\n    renderBenchRunSingle);\
