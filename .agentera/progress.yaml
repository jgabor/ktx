    discovered: |
      The bench_runs migration is structurally identical to the M2
      migration (CREATE TABLE IF NOT EXISTS + ALTER TABLE ADD COLUMN
      loop gated on PRAGMA table_info), but the inspect surface needs
      a table-level probe in addition to the column-level probe. M2's
      `HasM2Columns` works because the M1 schema already guarantees
      `tool_calls` exists (via `CheckSchema`'s hard check). For
      bench_runs, a pre-M3 database has no such table — the doctor
      needs to distinguish "table missing entirely — pre-M3"
      (warning: run any ktx command to migrate) from "table present
      but partial — forward-fix on next open" (warning: detail lists
      the missing columns). The two-step probe (HasBenchRunsTable +
      HasBenchRunsColumns) implements the distinction cleanly.

      The "warning" code path on a pre-M3 DB is observable only when
      the database is opened by something other than ktx itself —
      store.Open runs the migration on every call, so a normal
      `ktx doctor` invocation always migrates a pre-M3 DB before the
      checkBenchRuns probe runs. This is the same constraint the M2
      verification log documented (`.agentera/verification/m2-acceptance.md`
      used a side-channel `verify` binary to exercise the warning
      path). The committed code includes checkBenchRuns's warning
      branch for completeness — the function correctly returns
      "warning" when the table is absent — but in practice the user
      sees the "ok" state after their first ktx invocation post-M3
      binary update, because that invocation runs the migration as
      a side effect. The cycle's verified section documents this
      nuance for inspektera.

      The M3 column types are slightly different from M2:
      `timestamp INTEGER` (Unix epoch seconds) instead of M2's
      `timestamp TEXT` (RFC3339Nano). This matches D12's
      reproducibility contract — a third party with the bench_runs
      row + the methodology file can compute the headline without
      consulting any clock-format documentation. The integer type
      is the natural fit for the cost-per-correct formula
      (`cost / max(score, 1e-9)`), which is the only aggregate
      computation the methodology v1 specifies.
