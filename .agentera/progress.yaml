    context:
      intent: |
        Land the M3 bench_runs table migration as code so any
        pre-M3 or fresh database, when opened by the M3 binary,
        has a bench_runs table with the 10 columns per D12's
        reproducibility contract (`.agentera/bench/methodology-v1.yaml`).
        The migration follows the M2 pattern verbatim (CREATE
        TABLE IF NOT EXISTS inside the migration transaction
        + ALTER TABLE ADD COLUMN loop gated on PRAGMA table_info)
        so the schema is idempotent on re-open and forward-fixed
        on partial schemas. The inspect surface gains two
        helpers (table-level + column-level probes) and the
        doctor gains one check that synthesizes the probes
        into a single per-check status with a clear detail
        string for each of the three states (full / partial /
        missing).
      constraints: |
        Go stdlib only; pure-Go SQLite (already pinned in
        go.mod). No new external dependencies. The migration
        must be idempotent (second Open is a no-op) and
        forward-fix on partial schemas (some columns missing).
        Existing tool_calls and sessions rows must be unchanged
        after the migration. The M2 columns on tool_calls
        (tokens_in/tokens_out/cost/latency_ms/model/provider)
        must be untouched by the M3 migration. The new
        bench_runs table is purely additive — no ALTER on
        existing tables' column types. Strict scope: only
        internal/store/store.go, internal/store/inspect.go,
        internal/cli/doctor.go, .agentera/plan.yaml, and
        .agentera/progress.yaml are touched. .agentera/decisions.yaml
        is OFF LIMITS per the DX2 pre-tool gate.
      unknowns: |
        - Whether a future migration will want to add more
          columns to bench_runs (e.g., D11 cost-coverage,
          scoring version). If so, the benchRunsColumns +
          benchRunsSchema + ALTER loop pattern extends cleanly
          with one entry each — the pattern is the
          single-source-of-truth contract.
        - Whether a future ktx bench compare command will need
          a different bench_runs column set (post-M3 scope
          per the plan). The current schema captures the D12
          v1 contract; a compare command may want additional
          columns (e.g., a per-trial row alongside the
          aggregate row). Out of scope for Task 3.
        - Whether SQLite's ALTER TABLE ADD COLUMN with a
          non-PK TEXT `id` works when a partial bench_runs
          has `id` entirely missing (the pathological case
          where CREATE TABLE's PRIMARY KEY didn't apply). The
          realistic forward-fix scenario is "table exists,
          most columns present", where `id` is always the
          PK. SQLite silently accepts `ALTER TABLE ADD
          COLUMN id TEXT` without PK constraint, which is
          degraded but functional — the user can hand-fix
          after a warning. Not a blocker for this cycle.
