    what: |
      M3 plan Task 3 (bench_runs table migration) lands as one schema
      migration, two inspector helpers, and one doctor check. The
      migration follows the M2 pattern (m2Columns / m2Schema /
      tableColumns(tx, ...) / ALTER TABLE ADD COLUMN loop) verbatim;
      the inspector and doctor surface extend the M2 split into
      table-level + column-level probes since bench_runs is a brand-new
      table rather than an additive column set on an existing table.
      The bench_runs schema mirrors D12's reproducibility contract
      (`.agentera/bench/methodology-v1.yaml`): `id TEXT PRIMARY KEY`
      (D3 nanoid), `agent`, `model`, `task`, `score REAL`,
      `tokens_in INTEGER`, `tokens_out INTEGER`, `cost REAL`,
      `methodology_version TEXT` (the D12 contract), `timestamp INTEGER`
      (Unix epoch seconds). All six acceptance criteria from
      plan.yaml Task 3 pass on the committed binary:
      (1) An M2-era DB opened by the new binary gains the bench_runs
      table with all 10 columns. (2) Existing tool_calls and sessions
      rows are unchanged (verified by row-count and content checks
      against an M2-era fixture). (3) A fresh DB has bench_runs from
      the start (verified via CREATE TABLE inside the same
      transaction as the migration). (4) ktx doctor reports
      `bench_runs_table: ok` on migrated DBs and `warning` on
      pre-M3 / partial bench_runs (verified via a side-channel
      verify harness that opens the DB without migrating, mirroring
      the M2 verification log's `/tmp/opencode/verify-m2-warning`
      pattern). (5) Migration is idempotent — the schema_sql SHA
      is unchanged between two consecutive opens. (6) A partial
      bench_runs (only `id` + `agent`) is forward-fixed to the
      full 10-column schema on the next open. `go build` and
      `go vet` exit 0; M1+M2 regression on the M3 binary
      confirms `ktx list`, `ktx read`, `ktx write`, and
      `ktx doctor` all behave identically to the M2 binary.
    discovered: |
      The bench_runs migration is structurally identical to the M2
      migration (CREATE TABLE IF NOT EXISTS + ALTER TABLE ADD COLUMN
      loop gated on PRAGMA table_info), but the inspect surface needs
      a table-level probe in addition to the column-level probe. M2's
      `HasM2Columns` works because the M1 schema already guarantees
      `tool_calls` exists (via `CheckSchema`'s hard check). For
      bench_runs, a pre-M3 database has no such table — the doctor
      needs to distinguish "table missing entirely — pre-M3"
      (warning: run any ktx command to migrate) from "table present
      but partial — forward-fix on next open" (warning: detail lists
      the missing columns). The two-step probe (HasBenchRunsTable +
      HasBenchRunsColumns) implements the distinction cleanly.

      The "warning" code path on a pre-M3 DB is observable only when
      the database is opened by something other than ktx itself —
      store.Open runs the migration on every call, so a normal
      `ktx doctor` invocation always migrates a pre-M3 DB before the
      checkBenchRuns probe runs. This is the same constraint the M2
      verification log documented (`.agentera/verification/m2-acceptance.md`
      used a side-channel `verify` binary to exercise the warning
      path). The committed code includes checkBenchRuns's warning
      branch for completeness — the function correctly returns
      "warning" when the table is absent — but in practice the user
