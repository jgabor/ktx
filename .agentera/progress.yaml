- number: 7
  timestamp: 2026-06-19 17:10
  type: fix
  phase: build
  what: 'PersistToolCall now defers tx.Rollback() immediately after the

    tx, err := d.db.Begin() error check, eliminating the path where

    a panic or an error return that bypasses the explicit

    tx.Rollback() calls could leak an open transaction. The defer

    is a safe, low-overhead no-op when tx.Commit() succeeds (Commit

    clears the deferred rollback); the existing explicit

    tx.Rollback() calls on the two Exec-error paths are preserved

    (Commit has not run on those paths, so the explicit rollback

    is the primary path, and the deferred rollback is the

    belt-and-suspenders for everything else). Single-line fix

    requested by the post-M2 review at

    review_report.md Section 6.1.

    '
  discovered: 'The M2 review surfaced 4 minor issues: 3 doc fixes (decisions

    typo, ARCHITECTURE paragraph count, ROADMAP milestone stamp)

    landed in commit fda7a42; this cycle covers only the code fix

    (transaction safety). The review report remains at

    ~/git/ktx/review_report.md for full context.

    '
