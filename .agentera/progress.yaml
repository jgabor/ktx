      Five-AC scenario walk-through:
      1. AC1 — PASS (see above).
      2. AC2 — PASS (see above).
      3. AC3 — PASS (see above); exact JSON bytes from ktx read
         for the tokens_in=0 case:
         {"id":"ac3zerosabcdefgh",..."tokens_in":0,
          "tokens_out":0,"cost":0,"latency_ms":0,
          "model":"","provider":""}
      4. AC4 — PASS; round-trip (ktx read output piped through
         ktx write with a fresh id) preserves M2 fields on both
         passes — values stay values, nulls stay nulls.
      5. AC5 — PASS; ktx get --format text emits M1 fields only;
