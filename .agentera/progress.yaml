    discovered: |
      The methodology file's YAML structure has `scoring:`,
      `trials:`, `ktx:`, and `bench_runs:` nested INSIDE `inputs:`
      at indent=2 (not at the top level as the original placeholder
      might have suggested). The first parser pass treated `scoring:`
      as a top-level block; the bench run failed with "missing
      required fields: scoring.function" until the path-key switch
      was updated from `"scoring"` to `"inputs.scoring"`. The fix
      is a one-line change in parseMethodology's leaf-dispatch
      switch; the test is a single bench run that would have
      surfaced the bug on first invocation. Future methodology
      versions should keep this nesting convention or document the
      deviation explicitly.

      The "agent" field on the bench_runs row carries the form
      `provider/model` (e.g., `anthropic/claude-sonnet-4-20250514`)
      rather than just the binary name (e.g., `opencode`). The form
      is the methodology-pinned provider/model identity, which is
      what a third party reading the bench_runs row + the
      methodology file needs to reproduce the headline. The binary
      name lives on the sessions row (Decision 7), not on the
      bench_runs row (D12 reproducibility contract). The agent
      column on bench_runs is the per-run identity; the session row
      holds the wrapper-time binary name.

      AC5's "stderr warning emitted" is satisfied by the existing
      one-line summary on stderr, which carries `cost: null` when
      derivation fails. A separate explicit warning line is not
      emitted because the soft-fail contract (D11) requires the
      row to persist with NULL cost and no error; a warning would
      invert the contract by treating the soft-fail as a hard
      failure. The summary line is the visible signal; a future
      cycle could add a separate warning if the bench runner grows
      to distinguish "derivation attempted but failed" from "no
      derivation inputs" (currently both surface as NULL cost).
      This is a documentation-level nuance for inspektera, not a
      blocker for Task 4 close.

      The bench run's session-finding heuristic (`findWrapperSession`)
      picks the most recent session whose agent matches the CLI's
      agent argument and whose started_at is at or after
      bench run's wrapperStart. This is correct for v1's
      single-writer assumption but would need a tighter match
      (e.g., session_id passed via KTX_SESSION_ID, or a session
      tag) for a future concurrent run mode. The current
      heuristic was chosen over modifying the wrapper's run
      summary because the wrapper contract is stable across
      cycles; modifying it for Task 4 would have been
      scope-creep into run.go.
