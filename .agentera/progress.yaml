  discovered: "The models.dev JSON endpoint (`https://models.dev/api.json`) is\nstructured\
    \ as `{provider_id: {models: {model_id: {cost: {input,\noutput, ...}}}}}` \u2014\
    \ the conventional shape. Cost entries vary\nacross providers: some omit cache_read/cache_write;\
    \ some\nproviders (e.g. `anyapi`, `snowflake-cortex`) have entries with\nno cost\
    \ at all, which `Refresh` silently skips rather than\nstoring a zero-priced record\
    \ (a zero-priced entry would corrupt\nthe cache by silently pricing free models).\
    \ The cache\nprojection is faithful but lossy: only `input` and `output` are\n\
    retained; cache_read/cache_write/tiers/context_over_200k/etc.\nare discarded because\
    \ the D11 derivation formula only needs\nthe input/output rates. The `claude-sonnet-4-20250514`\
    \ reference\nfrom m2-acceptance.md AC2 resolves cleanly through the\n`anthropic`\
    \ provider (`input: 3.0`, `output: 15.0`) \u2014 the live\nendpoint reproduces\
    \ the m2-acceptance.md Anthropic-list-prices\nplaceholder exactly, so the cost\
    \ reconstruction that proved\n$0.0123 \u2192 $0.012207 in the M2 log now fires\
    \ automatically via\n`deriveCost` at write time when the caller omits `cost`.\n\
    Provider IDs in models.dev sometimes contain hyphens\n(e.g. `amazon-bedrock`)\
    \ and model IDs sometimes contain\nspecial characters (`:`, `@`, `/`) \u2014 JSON\
    \ keys accept all of\nthese, so no normalization is needed.\n"
