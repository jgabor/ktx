  - number: 17
    timestamp: 2026-07-09 22:50
    type: feat
    phase: build
    what: 'D24 amends D23: recovery footer reformatted to a single instructional
      line. buildRecoveryFooter now emits `[ktx] output compressed: <N> bytes
      (<P>% reduction) - get full output with `ktx read <source_id>`` instead of
      the prior four-line block (header + source_id + original/compressed sizes
      + recover command). Original byte count dropped from footer; reduction
      percent alone conveys loss magnitude at lower token cost. Instructional
      cue ("get full output with") replaces the "recover:" label that the agent
      saw but did not act on. All D23 invariants preserved: footer off by
      default, footer only when transformed, footer-aware anti-worsening gate
      unchanged in mechanism, persisted Compressed.Output stays content-only,
      plugin propagates envelope.output verbatim.'
    discovered: 'The D23 footer was technically correct but structurally inert: the
      agent acknowledged seeing it in its own reasoning transcript yet chose a
      costlier workaround (re-running the original tool call to /tmp) instead of
      invoking `ktx read <source_id>`. The fielded shape read as a labelled
      report block (`--- ktx recovery ---` header, four labelled fields,
      "recover:" as a label not an action). The single-line instructional form
      reprioritises action: brand flag, size signal, separator, then the action
      cue naming the action immediately before the literal command. The plugin
      template (init.go) uses `[ktx]` as a console.error prefix in three places,
      so the AC5 footer-leak test probe was tightened from the bare `[ktx]`
      marker to footer-specific substrings ("output compressed:", "get full
      output with", "buildRecoveryFooter", "recover_footer") to avoid false
      positives. decisions.yaml DX2 gate (max 10 full-detail active decisions)
      blocked the D24 write: 19 active decisions already exceeded cap.
      Compaction pass flipped 10 shipped-and-firm decisions (D1, D3, D4, D5, D6,
      D8, D10, D11, D12, D14) to user_confirmed_satisfied with user_confirmation
      blocks; D23 satisfaction state typo (provisional_satisfied) fixed to
      provisionally_satisfied; unsupported review_needed field dropped. Active
      count now 10 (at cap).'
    verified: "Build: go build -buildvcs=false ./cmd/ktx exit 0. Tests: go test
      -buildvcs=false ./... exit 0 (all packages pass). Footer-composition tests
      green: TestBuildRecoveryFooter_ContainsSourceID,
      TestBuildRecoveryFooter_CompressedSizeAndRatio (renamed from
      _SizesAndRatio; asserts compressed size + reduction percent + original
      byte count does NOT surface),
      TestBuildRecoveryFooter_ContainsRecoveryCommand. Footer-gate behaviour
      unaffected: TestHook_FooterGate_Suppresses / _Keeps / _Disabled /
      _NoTransform_NoFooter / _OrderedContentBeforeFooter (footer marker now
      `\\n[ktx]`) / _PluginTemplate_PropagatesEnvelopeUnchanged (probes
