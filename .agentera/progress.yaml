cycles:
  - number: 19
    timestamp: 2026-07-12 01:10
    type: feat
    phase: build
    what: "Codex hook integration: added ktx init codex, runtime-aware hook I/O for
      Codex PostToolUse payloads. The hook auto-detects Codex from
      hook_event_name, extracts tool_name/tool_input/tool_response/tool_use_id,
      and outputs Codex-format hook responses:
      {decision:block,reason:compressed} when compression transforms, {} when
      passthrough. KTX_SESSION_ID noop guard moved into hook logic (fires before
      any stdin read or DB access). ktx init codex installs/uninstalls/shows a
      PostToolUse entry in ~/.codex/hooks.json with merge semantics (preserves
      existing hooks like SessionStart). Codex uses command-type hooks (stdin
      JSON -> stdout JSON), no TypeScript plugin needed. Trust review required:
      user must run /hooks in Codex to trust the ktx hook."
    verified: "Build: go build -buildvcs=false ./cmd/ktx exit 0. Tests: go test
      -buildvcs=false ./... exit 0 (all packages pass). KTX_SESSION_ID guard:
      TestHook_SessionIDGuard (set→noop, unset→processes). Codex extraction:
      TestHook_Codex_ObjectWithAggregatedOutput, _BareStringOutput,
      _ObjectWithoutRecognisedField, _NoToolName, _WithoutToolUseID_GeneratesID,
      _BackwardCompat_OpenCode, _BackwardCompat_Flat,
      TestExtractCodexFields_Direct. Codex output:
      TestHook_CodexOutput_Transforms, _Passthrough_Empty,
      _AntiWorsening_Suppressed, _OpenCode_KeepsEnvelope, _Footer_Transforms.
      Init codex: 14 subtests in TestRunInitWith_CodexInstall + 3 in
      _CodexRuntimeErrors covering
      install/merge/idempotent/uninstall/show/project/trust-note."
    next: No carry-forward code work. Re-install the plugin via ktx init codex to
      deploy. codex exec --json wrapper path for benchmarking is deferred to a
      future plan. updatedMCPToolOutput transparent compression is deferred
      until Codex ships support.
    context:
      intent: Support Codex similarly to how OpenCode is supported. Codex (v0.144.1)
        has a stable PostToolUse hook system with per-tool-call observation and
        output replacement via decision/reason. This is the only path that gives
        ktx both observation AND transformation in Codex's interactive TUI mode,
        since updatedMCPToolOutput is not yet supported by Codex.
      constraints: "Hook contract unchanged in shape (stdin JSON -> stdout JSON), only
        output format is runtime-keyed (Codex gets decision/reason, OpenCode
        gets ktx envelope). Conservative-on-failure preserved. Compression
        pipeline, recovery footer, and anti-worsening gate unchanged. hooks.json
