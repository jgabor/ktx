  - number: 16
    timestamp: 2026-07-09 16:14
    type: feat
    phase: build
    what: "D23 ships: ktx hook composes an opt-in recovery footer (source_id +
      original/compressed sizes + reduction ratio + `ktx read <source_id>`
      command) appended to the agent-visible compressed output, with a
      footer-aware anti-worsening gate that suppresses the transform when
      compressed+footer would not beat the original size. Off by default
      (recover_footer=false in ktx.toml); stored compressed rows stay
      content-only (decompress returns pure compressed); the footer lives only
      in envelope.Output."
    discovered: "The plugin template (init.go) needed NO change -- it already
      assigns output.output = envelope.output verbatim, so the footer-bearing
      envelope propagates untouched. The two-gate structure is essential: the
      pipeline runner's byte-gate fires first (inside compressPipeline), then
      the footer-aware second gate accounts for footer overhead and suppresses
      wins too small to clear it. The amended D22 invisibility clause is
      conditional: source_id surfaces only when recovery is opted in;
      compressed_id stays dev-facing forever."
    verified: "Build: go build -buildvcs=false ./cmd/ktx exit 0. vet/tests: go test
