    what: |
      ktx get and ktx list now surface M2 cost-publication fields on
      the inspect surface. printGetText emits a conditional M2
      section below the M1 fields when at least one of the six
      pointer-typed M2 fields is non-nil; the section is silent when
      every M2 field is NULL (AC4) and renders only the non-nil
      sub-fields otherwise (preserves the pointer discipline Task 3
      established). printListText adds TOKENS, COST, and MODEL
      columns derived from a per-session rollup computed by
      store.SessionM2Rollups (a single GROUP BY with HAVING filter
      that excludes sessions with no non-NULL M2 data). The text
      columns render "-" as the explicit "no data" marker when a
      session has no M2 data (AC6) or when a sub-rollup is nil
      within a session that has partial M2 data. The JSON list path
      adds a top-level m2 object via a local wrapper type that
      embeds store.Session (so M1 field shape is preserved) and
      appends *SessionM2 with omitempty (so sessions with no M2
      data omit the field — AC7 permits either omission or null,
      omission is the chosen signal).
    inspiration: |
      Plan task 5 in .agentera/plan.yaml. Tasks 2/3/4 made the
      M2 columns persistable from both ingress paths and pointer-
      typed so the absent-vs-zero distinction survives. Task 5
      owns the inspect surface: ktx get and ktx list (text + JSON).
      The plan's design contract required (a) a conditional M2
      block in printGetText, (b) per-session rollup columns in
      printListText, and (c) a top-level m2 object in the JSON
      list output.
    discovered: |
      A single GROUP BY query with a HAVING clause is sufficient
      to filter to sessions with at least one non-NULL M2 field:
      the SUM/MIN aggregates produce NULL when every input is
      NULL, so HAVING aggregates-NOT-NULL is the right "did this
      group see any M2 data?" probe. The strict reading of the
      spec's "sum of tokens_in + tokens_out per call, summed
      across the session" yields SUM(tokens_in + tokens_out)
      which excludes rows with one NULL operand — a row with
      tokens_in=10, tokens_out=NULL contributes NULL to the
      per-call sum and is dropped from the aggregate. This is
      the documented "per-call roll-up of non-NULL values"
      semantic but is the strictest of the plausible readings;
      a future post-M2 resonera can revisit if real-world data
      shows it loses too much.
