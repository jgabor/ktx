      A single GROUP BY query with a HAVING clause is sufficient
      to filter to sessions with at least one non-NULL M2 field:
      the SUM/MIN aggregates produce NULL when every input is
      NULL, so HAVING aggregates-NOT-NULL is the right "did this
      group see any M2 data?" probe. The strict reading of the
      spec's "sum of tokens_in + tokens_out per call, summed
      across the session" yields SUM(tokens_in + tokens_out)
      which excludes rows with one NULL operand — a row with
      tokens_in=10, tokens_out=NULL contributes NULL to the
      per-call sum and is dropped from the aggregate. This is
      the documented "per-call roll-up of non-NULL values"
      semantic but is the strictest of the plausible readings;
      a future post-M2 resonera can revisit if real-world data
      shows it loses too much.
