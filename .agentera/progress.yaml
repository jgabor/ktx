  - number: 14
    timestamp: 2026-06-21 12:00
    type: refactor
    phase: audit
    what: "Plan close: Task 7 lands the four namespace commands (ktx db, ktx prices,
      ktx doctor, ktx init) on the dispatch registry, emptying the legacy
      `commands` slice for the first time since the CLI existed. Every one of
      the 10 subcommands is now reachable through a single `dispatch.Register`
      call site (≤ 10 LOC of glue per verb) instead of duplicated flag-set /
      db-open / error-envelope boilerplate. The `commands` slice at
      `internal/cli/cli.go:65` is empty; `runWith` consults `dispatchRegistry`
      first, then falls through to the (now-empty) `commandIndex`. The help
      surface is preserved by adding `Description string` to `RegisterOptions`
      and exposing `RegisteredVerbs()` so `printHelp` reads from the registry
      instead of the legacy slice. The four Register call sites land at: db (8
      lines, PreParse extracts --path), prices (8 lines, FormatDefault=JSON),
      doctor (9 lines, PassthroughStdout=true), init (8 lines, PreParse keeps
      parseInitArgs). All within the ≤10 LOC budget the plan specified for new
      subcommands registered via the deep module. The legacy `runDB`,
      `runPrices`, `runInit` top-level entry points were dropped (only ever
      called from the now-deleted `commands` slice entries); the test seams
      `runDBWith` / `runPricesWith` / `runInitWith` / `runDoctorWith` remain for
      direct invocation by Task 3 unit tests."
    discovered: "Two findings worth surfacing: (1) The dispatcher's per-verb flag
      set (runRegisteredVerb's internal flag.NewFlagSet) only knows about
      --help/-h and --quiet/-q. Any verb-specific flag MUST be extracted via
      PreParse before the dispatcher's flag set runs -- otherwise the verb's
      flag is rejected with 'flag provided but not defined: -path'. ktx db's
      --path and ktx init's --project/--uninstall/--show all flow through
      PreParse; the verb body reads the stashed values via package-level scratch
      variables (dbScratch / initScratch) whose lifetime is bounded by the
      synchronous runRegisteredVerb invocation. (2) ktx doctor's 'pre-M3 →
      degraded → exit 0' contract cannot be exercised through the dispatch path
      because the dispatcher's doctorCommandFunc calls doctorLogic which calls
      buildDoctorReport which calls dbpkg.Open which ALWAYS applies the
      migration. CREATE TABLE IF NOT EXISTS bench_runs is idempotent -- if the
      table is absent when Open runs, the migration creates it with all 10
      columns, defeating the pre-M3 fixture. The AC3 test works around this by
      constructing a pre-M3 *sql.DB in-memory (M1+M2 only, no bench_runs),
      wrapping it in a *dbpkg.DB via an unsafe-pointer helper (dbpkgDBFromSQL),
      and exercising buildDoctorReportForDB which mirrors the production
      buildDoctorReport's per-check construction against the hand-built fixture.
      The unsafe approach is test-only and documented; the production surface is
      unchanged."
