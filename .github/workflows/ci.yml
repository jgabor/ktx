name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install build tools
        run: |
          go install github.com/magefile/mage@v1.15.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Verify repository
        # Database access classes and the required disposable-root reproduction
        # procedure are canonical in docs/database-safety.md. Root allocation in
        # Mage/CI remains follow-up work; the hosted runner itself is ephemeral.
        run: mage verify
