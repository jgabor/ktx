# ktx.example.toml
#
# Copy to $XDG_CONFIG_HOME/ktx/ktx.toml and edit the stages you want.
#
# When no ktx.toml is found, ktx runs the passthrough pipeline (output ==
# input, no compression). All stages are OFF by default — you opt in by
# listing them here.
#
# Stages run in order; each receives the previous stage's output.
# Conservative-on-failure invariants are enforced by the pipeline
# runner, not by stage authors:
#   1. Empty-output guard — a stage that empties non-empty input is discarded
#   2. Stage-error passthrough — an errored or panicking stage passes input through
#   3. Unknown-stage skip — an unresolved stage name is skipped with a warning
#   4. Anti-worsening gate — if the pipeline result is not smaller than input,
#      the original is returned unchanged (no compressed row created)
#
# Source-tool-failure gate runs BEFORE the pipeline: if the tool_call
# has is_error=true, compression is skipped entirely and a passthrough row
# is written. This is a pre-pipeline gate, distinct from the in-pipeline
# invariants above.

[pipeline.default]

# Pipeline timeout for ktx hook (the agent's critical path). ktx compress
# (off-line) ignores this. Default 2s when omitted — enough for built-in
# stages on large tool output; raise for slow external plugins.
timeout = "2s"

# ── Recovery footer ──────────────────────────────────────────────────
#
# recover_footer surfaces the source_id back into the agent's context
# so the agent can self-recover the original output. Default true (on):
# when the pipeline actually compresses, ktx hook appends a single-line
# recovery footer to the agent-visible output. Set false to suppress.
#
# The footer carries:
#   - source_id (verbatim, as the argument to `ktx read <source_id>`)
#   - compressed byte size
#   - reduction ratio (percent)
#   - recovery command prefixed by an instructional cue
#     ("get full output with `ktx read <source_id>`")
# The original byte count is intentionally omitted; the reduction
# percent alone conveys the loss magnitude at lower token cost.
#
# Safety gates (footer does not worsen output):
#   1. The pipeline must actually transform (anti-worsening gate inside
#      the pipeline runner fires first); passthrough and failure-gate
#      skips never emit a footer.
#   2. A footer-aware second gate checks len(compressed)+len(footer)
#      against the original. When the footer would erase the gain
#      (compressed+footer >= original), the transform is suppressed:
#      the original is returned unchanged, no footer, no compressed
#      row is persisted.
#
# The stored compressed row stays content-only — the footer lives in
# the agent-visible envelope.Output, NOT in the persisted Compressed.
# Output. This keeps `ktx decompress <compressed_id>` byte-identical
# to the bare compressed bytes.
recover_footer = true

# ── Stage safety tiers ───────────────────────────────────────────────
#
# Stages fall into two tiers. Pick stages from tier 1 for a safe default
# that can only remove noise, never content. Add tier 2 stages when you
# accept content loss for more aggressive compression.
#
# Tier 1 — cleanup (noise removal, no content loss):
#
#   strip-ansi          Strip ANSI escape sequences (colors, cursor moves)
#
#   dedup-blank         Collapse 2+ consecutive blank lines to one
#
#   normalize           Convert \r\n and \r to \n; trim trailing whitespace
#                       per line; strip leading/trailing blank lines
#
# Tier 1 stages can only make output smaller or identical. If the input
# has no noise (e.g. clean markdown), the anti-worsening gate passes it
# through unchanged — no risk of quality drop-off. These are the stages
# lowfat, headroom, and rtk all agree are universally safe.
#
# Tier 2 — truncation (content loss, needs per-tool consideration):
#
#   head:N               Keep first N lines (default N=10)
#
#   truncate:N          Keep first N bytes (default N=4096); appends
#                       "[ktx: truncated N of M bytes]" marker when
#                       truncation occurred
#
#   keep-ends:N:M       Keep first N + last M lines with
#                       "[ktx: X lines omitted]" marker in the
#                       middle. Preserves bottom-of-log errors that
#                       head:N alone would lose
#
#   grep:pattern        Keep only lines matching the regex. Invalid
#                       regex → passthrough (input unchanged)
#
#   grep-v:pattern      Reject lines matching the regex (inverse of
#                       grep). Invalid regex → passthrough
#
#   token-budget:N      Truncate to ~N tokens (chars/4 estimate);
#                       snaps back to last newline (no mid-line
#                       cuts); appends "[ktx: truncated ~N tokens
#                       from M]" marker. Input under budget → unchanged
#
#   replace:pat::rep    Regex substitution: replace every match of
#                       pattern `pat` with `rep`. The separator is
#                       `::` (double colon). Empty replacement removes
#                       matches. Invalid regex → passthrough. Same
#                       length or no match → anti-worsening gate fires

# Default: sanitize cleanup (safe — noise removal only, no content loss)
stages = ["strip-ansi", "dedup-blank", "normalize"]

# ── Example pipelines ────────────────────────────────────────────────
#
# Named evaluation pipelines and the multi-fact task suite live under
# tools/bench/; ranking contract and recipes are in docs/pipelines.md.
# Guidance below tracks live ranking (expected cost per full pass), not
# offline per-call compression ratio alone.
#
# # Sanitize only (safe default in this file — noise removal, no content loss)
# # Near-passthrough cost on clean tool output; use when content loss is
# # unacceptable and savings are secondary.
# stages = ["strip-ansi", "dedup-blank", "normalize"]
#
# # Recommended general recipe (keep-ends-mid): best $/correct with full
# # pass on ephemeral mid-fact and crossfile tasks. No token-budget stage.
# stages = ["strip-ansi", "dedup-blank", "normalize", "keep-ends:100:50"]
#
# # Max savings, accept mid/tail fact risk (aggressive-head). Large token
# # cuts; mid-file and tail content may vanish. Prefer when head-biased
# # output is enough, or when tool-aware routing can opt out later.
# stages = ["strip-ansi", "dedup-blank", "normalize", "head:30"]
#
# # Lossy + recovery (footer on by default): narrow keep-ends + token
# # budget. Live ranking saw partial mid-fact loss without recovery;
# # with the footer, agents used `ktx read` and full pass returned.
# stages = ["strip-ansi", "dedup-blank", "normalize", "keep-ends:50:20", "token-budget:2000"]
#
# # Suppress recovery footer (opt out of the default):
# # recover_footer = false
#
# # Build logs: drop debug noise, keep head+tail. Prefer wider keep-ends
# # over a tight token budget when recovery is undesirable.
# stages = ["strip-ansi", "dedup-blank", "normalize", "grep-v:^debug:", "keep-ends:100:50"]
#
# # Replace stage: shorten repeated path prefixes or strip timestamp
# # prefixes from log lines. The :: separates pattern from replacement.
# # replace:pattern::replacement — empty replacement removes the match.
# stages = ["strip-ansi", "normalize", "replace:/home/user/project/::./", "head:50"]

# ── External plugin stages ───────────────────────────────────────────
#
# User-defined stages backed by external scripts. The script receives
# the stage's input on stdin and writes its output to stdout. A non-zero
# exit code triggers the stage-error-passthrough invariant.
#
# [[plugin]]
# name = "my-summary"
# command = "/home/user/scripts/summarize.sh"
# description = "custom summarizer script"
#
# [[plugin]]
# name = "redact-secrets"
# command = "/home/user/scripts/redact.sh"
# description = "strip API keys and tokens from output"
#
# Reference the plugin name in your pipeline stages:
# stages = ["strip-ansi", "redact-secrets", "keep-ends:50:20"]

# ── Route rules ──────────────────────────────────────────────────────
#
# Route rules map tool-call metadata to a named pipeline profile. Each
# [[route]] block selects a target profile when the tool call matches
# all of the non-empty match fields:
#
#   tool            Tool name to match (e.g. "bash"). Empty = any tool.
#   command_prefix  Prefix match on the command string (e.g. "git"
#                   matches "git status"). Empty = any command.
#   subcommand      Exact match on the first non-flag token after the
#                   binary name (e.g. "status" for "git status", or
#                   "log" for "git --no-pager log"). Empty = any.
#                   Flags (tokens starting with "-") are skipped, so
#                   placement before or after the subcommand does not
#                   affect the match. More precise than command_prefix
#                   when you want to key on a verb; see the git
#                   examples below.
#   exit_status     "success", "failure", or "any". Empty = "any".
#   profile         Target [pipeline.<name>] table. Required; must
#                   name an existing profile or config load fails.
#
# The router applies rules at runtime; the loader only parses and
# validates profile references at config-load time.
#
# Matching: rules are evaluated in file order and the first rule whose
# conditions all match wins. Put specific rules before broad ones.
# An empty field is a wildcard — empty tool = any tool, empty
# command_prefix = any command, empty subcommand = any subcommand,
# empty or "any" exit_status = either success or failure.
#
# Fallback: when no rule matches, ktx uses the "default" profile, which
# is always present. When [pipeline.default] is absent from the config,
# its stages are empty, i.e. passthrough (output unchanged). A catch-all
# route as the last rule overrides this fallback so every tool call lands
# in a chosen profile.
#
# Define the target profiles first:
#
# [pipeline.default]
# stages = ["strip-ansi", "dedup-blank", "normalize", "keep-ends:100:50"]
#
# [pipeline.logs]
# stages = ["strip-ansi", "dedup-blank", "normalize", "head:50"]
#
# Then route git commands that succeeded to the logs profile:
#
# [[route]]
# tool = "bash"
# command_prefix = "git"
# exit_status = "success"
# profile = "logs"
#
# Route failed bash commands to a conservative profile:
#
# [[route]]
# tool = "bash"
# exit_status = "failure"
# profile = "default"
#
# Route file-read output (the "read" tool) to a wider keep-ends so the
# top of large files survives — mid-file facts matter for navigation:
#
# [pipeline.freads]
# stages = ["strip-ansi", "dedup-blank", "normalize", "keep-ends:200:50"]
#
# [[route]]
# tool = "read"
# profile = "freads"
#
# A catch-all as the last rule matches every tool call (all fields empty)
# so unmatched calls land in a chosen profile instead of the default:
#
# [[route]]
# profile = "freads"

# ── Recommended profiles: git subcommands ───────────────────────────
#
# git output is well-structured and each subcommand has a different
# shape. Route with `subcommand` for precision: the router extracts
# the first non-flag token after the binary name, so "git --no-pager
# log" still routes as the "log" subcommand. Combine with
# `command_prefix = "git"` to scope the match to git invocations only.
#
# Contrast with `command_prefix = "git status"`, a raw prefix match on
# the whole command string. The prefix form would MISS a call like
# "git --no-pager status" (the third token is "status", not the
# second), and it would also match "git status-extra" verbatim. The
# `subcommand` field is the more accurate signal when you want to key
# on the verb the user ran.
#
# Tier 1 stages (strip-ansi, dedup-blank) get noise out of the way
# without content loss; tier 2 stages (keep-ends, head) below fit the
# typical shape of each subcommand's output.
#
# git-status: output is short and dense; dedup-blank removes blank-line
# padding some pagers add. No truncation needed in practice.
#
# [pipeline.git-status]
# stages = ["strip-ansi", "dedup-blank"]
#
# git-diff: keep-ends preserves the bottom-of-diff summary (stat, file
# list) that head alone would drop on large diffs.
#
# [pipeline.git-diff]
# stages = ["strip-ansi", "keep-ends:50:10"]
#
# git-log: logs grow without bound; head keeps recent commits and the
# rest is recoverable via `ktx read` when the footer is enabled.
#
# [pipeline.git-log]
# stages = ["strip-ansi", "head:20"]
#
# [[route]]
# tool = "bash"
# command_prefix = "git"
# subcommand = "status"
# profile = "git-status"
#
# [[route]]
# tool = "bash"
# command_prefix = "git"
# subcommand = "diff"
# profile = "git-diff"
#
# [[route]]
# tool = "bash"
# command_prefix = "git"
# subcommand = "log"
# profile = "git-log"

# ── Recommended profiles: shell listing commands ────────────────────
#
# `ls` and `find` have no stable subcommand verb the router can key
# on (the first post-binary token is usually a flag like "-la" or a
# path, so the subcommand field is empty or unpredictable). Their
# output, however, has a recognizable shape: head-biased listings the
# agent scans top-down. Route them by `command_prefix` so any flags or
# path arguments still hit the right profile.
#
# ls: directory listings are usually short on their own; normalize
# cleans \r\n and trims per-line whitespace. No truncation.
#
# [pipeline.ls]
# stages = ["strip-ansi", "normalize"]
#
# find: entries are uniform; strip-ansi is a safe default. Add
# head:N or keep-ends:N:M for trees you know get huge.
#
# [pipeline.find]
# stages = ["strip-ansi"]
#
# [[route]]
# tool = "bash"
# command_prefix = "ls"
# profile = "ls"
#
# [[route]]
# tool = "bash"
# command_prefix = "find"
# profile = "find"
