methodology_version: "skillsbench-v1"
campaign_schema: 7
date: "2026-07-31"

scope: |
  Run a retained, paired OpenCode/KTX campaign through BenchFlow and
  SkillsBench. The native ktx bench compare preflight remains the first safety
  gate. This methodology is the second evidence layer and does not replace it.

execution:
  runtime: opencode
  runtime_version: "1.18.5"
  runtime_distribution: mode-0644 checksum-pinned standalone Linux archives acquired from fixed official GitHub release URLs during Docker build
  runtime_bootstrap: root-run, network-disabled staged KTX Go stdlib installer with independent embedded SHA-256 verification and atomic mode-0755 installation at /usr/local/share/ktx-skillsbench/bin/opencode; no image package tools
  provider_scope: "openai/*"
  benchflow_version: "0.6.5"
  benchflow_commit: "737146cc60fbc1b3595198eebbabba4628592d02"
  skillsbench_pin: "source-task-digests"
  sandbox: docker
  concurrency: 1
  order: seeded task shuffle with adjacent same-task, same-repetition pairs
  arms: balanced and counterbalanced AB/BA order
  paid_gate: explicit --execute
  retry_attempts: 0
  auth_modes:
    api-key: required LiteLLM proxy; provider-response or ACP-native usage; LiteLLM price provenance required for cost
    opencode-oauth: direct OpenCode subscription auth; ACP-native usage; price and cost unavailable
  oauth_model: openai/gpt-5.6-luna
  oauth_effective_variant: high
  oauth_secret_retention: exact access and refresh values must not occur in retained campaign regular files
  oauth_attempt_acceptance: immediate credential scan marker plus current-credential full-campaign rescan
  oauth_agent_resolution: descriptor-bound codex-acp manifest proof; actual runtime OpenCode 1.18.5
  preflight: complete no-model gate rerun immediately before paid execution; every task overlay builds its fixed remote-ADD inputs, proves the staged KTX digest, runs the exact generated OpenCode bootstrap as root with container networking disabled, and executes that same installed artifact's --version as uid/gid 65534; acquisition, installation, and cross-user execution evidence remain separate; this proves version execution rather than an ACP handshake; retained JSON is evidence only
  task_layout: task.md plus environment/Dockerfile

evaluation:
  completion_unit: scheduled_attempt
  quality_evaluable: numeric verifier reward, including zero and partial credit
  reward_range: "finite [0,1]"
  retry_policy: never retry or select based on reward
  pairing: scheduled same-task and same-repetition baseline and candidate
  delta_direction: baseline_minus_candidate
  missing_metrics: null
  malformed_metrics: unavailable with an explicit reason
  statistics: deterministic descriptive distributions and paired deltas only
  significance_claims: unsupported
  causal_claims: unsupported

infrastructure:
  symmetric_rules: |
    Both arms use the same task overlay, image inputs, OpenCode plugin, agent
    manifest, model, skill mode, and BenchFlow command shape. Only
    KTX_BENCH_SIDE changes within a pair.
  overlay: |
    Retain source and overlay digests separately. Native tasks stage .ktx under
    environment/.ktx, inside the Dockerfile build context. Supported legacy
    descriptors use that same environment/Dockerfile layout.
  adoption_checks: |
    Each rollout retains an explicit KTX database at artifacts/ktx.db. Import
    copies the descriptor-opened database and stable transaction sidecar into a
    private disposable owner, opens only that copy, and reports session and tool-call counts, original and
    delivered bytes, and compressed-artifact coverage. Missing evidence stays
    unavailable and does not become zero.

claim_scope: |
  Results describe only the retained scheduled attempts and pinned inputs.
  They do not reproduce JetBrains' published result because its exact task
  vectors, agent configuration, provider settings, and retained attempt
  evidence are not public.
