methodology_version: "v6-prompt-cache-token-hit-rate"
date: "2026-08-09"

scope: |
  Compare compression strategies from retained runtime-reported model steps,
  separating cache setup from measured attempts. Report a token-weighted
  prompt-cache token hit rate, controlled paired comparison, and only
  statements authorized from that evidence. Trial phases do not establish
  provider cache state, requests, hits, misses, or isolation. The model variant
  below describes the required run context; the runner receives it from the CLI
  `--variant high`.

inputs:
  agent:
    binary: opencode
    version: "1.18.5"
  model:
    id: "gpt-5.6-luna"
    provider: "openai"
    variant: "high"
  task:
    identifier: "crossfile-nav"
    prompt: "Use the task file supplied to ktx bench compare."
    expected_output: "See tools/bench/tasks/crossfile-nav.toml."
  scoring:
    function: multi_fact_fractional

trials:
  phases:
    cold_observation: 1
    warmup_default: 1
    measured_warm_default: 5
  accounting: |
    cold_observation and warmup attempts are retained but never count toward
    target valid completions, quality aggregates, paired headline deltas, or
    sample classification. measured_warm attempts are the headline sample.
    A measured sample smaller than five is exploratory.
  order: |
    Measured cycles alternate baseline/candidate then candidate/baseline.
    Setup order is deterministic from experiment-id parity. The warmup phase
    starts in the reverse order from cold observation; additional warmups
    alternate order.

cache_control:
  modes:
    - auto
    - isolated
    - observed
  contract: |
    isolated requires a confirmed adapter that supplies one stable namespace
    per experiment side across all phases. Namespaces never cross sides.
    auto selects isolated only when that capability is confirmed; otherwise it
    selects observed. An explicit unsupported isolated request fails before an
    agent attempt. observed phase names describe trial roles and do not assert
    provider cache state, requests, hits, or misses.
  retained_metadata: |
    Retain mode, adapter source, namespace SHA-256 (never the raw namespace),
    phase, execution order, intentional idle gap milliseconds (zero when the
    harness imposes no delay), model, provider, variant,
    and runtime version. A raw namespace may exist only in ephemeral generated
    runtime configuration or command state.
  opencode_runtime: |
    OpenCode config accepts arbitrary per-model options. In 1.18.5, request
    preparation merges model options after runtime defaults, so
    model.options.promptCacheKey can override the session-derived default.
    provider.options.setCacheKey only sets promptCacheKey to the OpenCode session
    id. This source-level configurability does not establish runtime-managed arm
    separation or provider-internal isolation. No built-in OpenCode adapter is
    currently confirmed: auto selects observed, and explicit isolated requests
    fail before an agent attempt. Historical isolated metadata remains
    validation input only and cannot enable a new run.

computation: |
  The prompt_cache_token_hit_rate is token_weighted:
  sum(cache_read) / sum(uncached_input + cache_read + cache_write) across every
  accepted model step in one attempt. All three input buckets must be measured
  and disjoint under cache-reuse-v2; measured zero remains zero and incomplete
  evidence is unavailable. Phase distributions use evaluated attempts from that
  phase. Headline and paired distributions use measured_warm only. Paired
   comparison is candidate minus baseline and reports rate means, a
   percentage-point delta, pair count, two-sided 95% interval, same-pair quality,
   and blockers. Higher or lower wording is authorized only under the retained
   protocol and never establishes provider-internal behavior. The portable
   pipeline guard separately accepts only a quality-preserving candidate with a
   strictly lower six-decimal-rounded API-equivalent estimated cost per correct;
   reported runtime cost remains separate, including literal zero.

claim_scope:
  cache_metric_contract: cache-reuse-v2
  evidence_kind: runtime_reported_model_steps
  direct_metric: prompt_cache_token_hit_rate
  comparison: prompt_cache_token_hit_rate_comparison
  comparison_unit: measured_cycle_pair
  statement_authorization: prompt_cache_token_hit_rate_statement_authorization
  provider_native_claims: unsupported
  significance_claims: unsupported
  causal_claims: unsupported

output:
  summary_schema: 5
  headline_phase: measured_warm
  validation: |
    Regenerate byte-identically from manifest.json, attempts.jsonl, retained
    streams, and the retained pricing snapshot. Schemas 1 through 4 and
    cache-reuse-v1 remain historical boundaries. A new OpenCode 1.18.5 summary
    uses schema 5 and cache-reuse-v2 only for this explicitly selected
    methodology. Validation also requires the exact setup topology per side,
    measured_warm-only target counts, and cache metadata on every role. Observed
    mode forbids any retained namespace hash. Historical isolated manifest and
    attempt namespace hashes must be exactly 64 lowercase hexadecimal characters,
    stable within each side, distinct across sides, and consistent with each
    other.

out_of_scope:
  - provider-native request, hit, miss, fill, eviction, eligibility, prefix, isolation, or TTL claims
  - significance or causal claims
  - raw cache namespaces in retained evidence
  - SQLite orchestration metadata
