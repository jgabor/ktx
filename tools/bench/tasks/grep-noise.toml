id = "grep-noise"
skill = "find"
workspace_mode = "corpus"
token_band = [40000, 80000]
minimum_tool_calls = 1
corpus_files = ["search_hits.txt"]
quality_risks = ["mid_loss", "over_filter"]
prompt = """
Search tools/bench/corpus/search_hits.txt for the planted FACT_GREP_NEEDLE line.
You may use grep or read. Reply with only that single FACT_* line, no other prose.
"""

[scoring]
kind = "multi_fact_fractional"
facts = [
  "FACT_GREP_NEEDLE=grep-needle-6a19d8ef",
]
